<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a12">
<title>命理师核对台 · 命理宝鉴</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="核对台">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{ --bg:#0a0a12; --card:#13141f; --border:rgba(255,255,255,.08); --text:#e0e0e8; --muted:#808096;
  --gold:#f0b90b; --purple:#7c5ce7; --green:#00d4aa; --red:#ff5e7a; --orange:#ff9b5c; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 14px calc(env(safe-area-inset-bottom,0px) + 20px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
h1{font-size:17px;color:var(--gold)}
.links a{font-size:11px;color:var(--muted);text-decoration:none;margin-left:10px;border:1px solid var(--border);border-radius:8px;padding:3px 8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:13px;color:var(--purple);margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center}
input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;min-width:0}
button{border:none;border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;background:var(--purple);color:#fff;white-space:nowrap}
button.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
button.ok{background:var(--green);color:#062}
button.no{background:transparent;border:1px solid var(--red);color:var(--red)}
button:disabled{opacity:.45}
.hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6}
.sla{font-size:11px;border-radius:6px;padding:1px 7px}
.sla.green{color:var(--green);border:1px solid rgba(0,212,170,.4)}
.sla.yellow{color:var(--orange);border:1px solid rgba(255,155,92,.4)}
.sla.red{color:var(--red);border:1px solid rgba(255,94,122,.5)}
.ann{border-top:1px dashed var(--border);padding:10px 0}
.ann .meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.ann .content{font-size:13px;margin:6px 0;white-space:pre-wrap;word-break:break-word;line-height:1.7}
.ann .ops{display:flex;gap:8px}
.ann .ops button{flex:1}
.empty{color:var(--muted);font-size:12px;text-align:center;padding:16px 0}
.tag{font-size:10px;border:1px solid var(--border);border-radius:6px;padding:0 5px;color:var(--muted)}
.tag.ai{color:var(--purple);border-color:rgba(124,92,231,.4)}
.badge-approved{color:var(--green)} .badge-rejected{color:var(--red)}
.stat{display:flex;gap:10px;font-size:11px;color:var(--muted);margin-bottom:8px}
.stat b{color:var(--text)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);background:#22263a;border:1px solid var(--border);border-radius:10px;padding:9px 16px;font-size:13px;display:none;z-index:99;max-width:88%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🔮 命理师核对台</h1>
    <div class="links">
      <a href="mobile-capture.html">采集端</a>
      <a href="unified-consultation.html">桌面问诊台</a>
      <a href="index.html">首页</a>
    </div>
  </header>

  <!-- G10 验证码鉴权：核对操作前须验证手机号 -->
  <div class="card" id="authCard">
    <h2>🔐 命理师身份验证（G10 短信码）</h2>
    <div class="row">
      <input id="phone" type="tel" maxlength="11" placeholder="手机号（当值命理师）">
      <button class="ghost" id="btnSend" onclick="sendCode()">发验证码</button>
    </div>
    <div class="row" style="margin-top:8px">
      <input id="code" type="number" maxlength="6" placeholder="6 位验证码（mock 见服务端 outbox）">
      <button id="btnVerify" onclick="verifyCode()">验证并进入</button>
    </div>
    <div class="hint">5 分钟内有效 · 错 5 次锁 10 分钟 · 未验证只能浏览队列，不能核对</div>
  </div>

  <div class="card">
    <h2>⏳ 批注队列 · 48h SLA 倒计时</h2>
    <div class="stat">待核 <b id="qBacklog">—</b> · 已超 48h <b id="qOverdue" style="color:var(--red)">—</b> · 已核 <b id="qApproved">—</b> · 已驳 <b id="qRejected">—</b>
      <span style="flex:1"></span><button class="ghost" style="padding:2px 10px;font-size:11px" onclick="loadAll()">刷新</button></div>
    <div id="queue"></div>
  </div>

  <div class="card">
    <h2>📚 批注历史（最近 50 条）</h2>
    <div id="history"></div>
  </div>

  <div class="hint" style="text-align:center">批注签发前逐条核对 · AI 草案未经核对不对外展示 · 命理内容为传统易学参考，不构成医学诊断</div>
</div>
<div id="toast"></div>
<script>
const EXTRA = 'http://127.0.0.1:8974';
const $ = id => document.getElementById(id);
let authed = false, myPhone = '';

function toast(m){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._tm); t._tm=setTimeout(()=>t.style.display='none',2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function api(path, opts){
  const r = await fetch(EXTRA + path, { signal: AbortSignal.timeout(8000), ...opts });
  return r.json();
}

/* ── G10 鉴权 ── */
async function sendCode(){
  const p = $('phone').value.trim();
  if(!/^1\d{10}$/.test(p)){ toast('请输入 11 位手机号'); return; }
  $('btnSend').disabled = true;
  const r = await api('/api/sms/send-code', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone:p, scene:'master-login' }) });
  $('btnSend').disabled = false;
  toast(r.ok ? '验证码已下发（mock：见服务端 outbox 记录）' : (r.error || '发送失败'));
}
async function verifyCode(){
  const p = $('phone').value.trim(), c = $('code').value.trim();
  const r = await api('/api/sms/verify-code', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ phone:p, code:c, scene:'master-login' }) });
  if(r.ok){
    authed = true; myPhone = p;
    $('authCard').querySelector('h2').innerHTML = '✅ 已验证：命理师 ' + p.replace(/^(\d{3})\d{4}(\d{4})$/,'$1****$2');
    $('authCard').querySelectorAll('.row,.hint').forEach(e => e.style.display = 'none');
    toast('验证通过，可执行核对');
    loadAll();
  } else toast(r.error || '验证失败');
}

/* ── 队列（SLA 倒计时）── */
function slaBadge(a, slaHours){
  const remain = slaHours - a.age_hours;
  if (a.overdue) return `<span class="sla red">已超 ${(a.age_hours - slaHours).toFixed(1)}h</span>`;
  const cls = remain < 8 ? 'yellow' : 'green';
  return `<span class="sla ${cls}">剩 ${remain.toFixed(1)}h</span>`;
}
async function loadQueue(){
  try {
    const q = await api('/api/annotation-queue');
    $('qBacklog').textContent = q.backlog; $('qOverdue').textContent = q.overdue;
    $('qApproved').textContent = q.stats.approved; $('qRejected').textContent = q.stats.rejected;
    if(!q.queue.length){ $('queue').innerHTML = '<div class="empty">队列清空，无待核批注 ✅</div>'; return; }
    $('queue').innerHTML = q.queue.map(a => `
      <div class="ann">
        <div class="meta">
          <span>#${esc(a.emr_id)} <span class="tag ${a.type==='ai'?'ai':''}">${a.type==='ai'?'🤖 AI 草案':'✍️ 人工'}</span> ${esc(a.author||'')}</span>
          ${slaBadge(a, q.sla_hours)}
        </div>
        <div class="content">${esc(a.content)}</div>
        <div class="meta"><span>入队 ${esc((a.created_at||'').slice(0,16).replace('T',' '))} · 已等 ${a.age_hours}h</span></div>
        <div class="ops">
          <button class="ok" onclick="review('${a.id}','approve')" ${authed?'':'disabled'}>✅ 核对通过</button>
          <button class="no" onclick="review('${a.id}','reject')" ${authed?'':'disabled'}>❌ 驳回</button>
        </div>
      </div>`).join('');
  } catch(e){ $('queue').innerHTML = '<div class="empty">批注服务不可达：' + esc(e.message) + '</div>'; }
}

async function review(aid, action){
  if(!authed){ toast('请先完成身份验证'); return; }
  const reviewer = '命理师·' + myPhone.replace(/^(\d{3})\d{4}(\d{4})$/,'$1****$2');
  let body = { reviewer };
  if(action === 'reject'){
    const reason = prompt('驳回原因（必填）：');
    if(!reason) return;
    body.reason = reason;
  }
  const r = await api(`/api/annotations/${aid}/${action}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) });
  if(r.ok){ toast(action === 'approve' ? '已核对签发（水印解除）' + (r.sms ? '，' + r.sms : '') : '已驳回'); loadAll(); }
  else toast(r.error || '操作失败');
}

/* ── 历史 ── */
async function loadHistory(){
  try {
    const h = await api('/api/annotation-history');
    if(!h.history.length){ $('history').innerHTML = '<div class="empty">暂无历史批注</div>'; return; }
    $('history').innerHTML = h.history.map(a => `
      <div class="ann">
        <div class="meta">
          <span>#${esc(a.emr_id)} <span class="tag ${a.type==='ai'?'ai':''}">${a.type==='ai'?'🤖 AI':'✍️ 人工'}</span></span>
          <span class="${a.status==='approved'?'badge-approved':'badge-rejected'}">${a.status==='approved'?'✅ 已核对':'❌ 已驳回'}</span>
        </div>
        <div class="content">${esc((a.content||'').slice(0,200))}</div>
        <div class="meta"><span>核对：${esc(a.reviewer||'—')} · ${esc((a.reviewed_at||'').slice(0,16).replace('T',' '))}${a.reject_reason ? ' · 原因：' + esc(a.reject_reason) : ''}</span></div>
      </div>`).join('');
  } catch(e){ $('history').innerHTML = '<div class="empty">历史加载失败</div>'; }
}

function loadAll(){ loadQueue(); loadHistory(); }
loadAll();
setInterval(() => { if(document.visibilityState === 'visible') loadAll(); }, 60000);
</script>
<script src="/pwa/pwa-inject.js"></script>
</body>
</html>
