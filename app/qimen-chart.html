:root{
  --bg:#0a0e17;--card:#141928;--border:#2a3450;--gold:#c9a84c;--jade:#4ec9b0;
  --paper:#e8dcc8;--paper3:#8b7e6a;--red:#ef4444;--green:#10b981;--blue:#63b3ed;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:12px;min-height:100vh}
.qm-header{text-align:center;margin-bottom:16px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.qm-title{font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.qm-meta{font-size:12px;color:var(--paper3);line-height:1.8}
.qm-meta span{margin-right:8px}
.qm-badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:3px;margin-left:4px}
.qm-badge.yang{background:rgba(78,201,176,.15);color:var(--jade)}
.qm-badge.yin{background:rgba(201,168,76,.15);color:var(--gold)}
.qm-badge.fuyin{background:rgba(239,68,68,.15);color:var(--red)}
.qm-badge.fanyin{background:rgba(99,179,237,.15);color:var(--blue)}

.qm-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:700px;margin:0 auto 16px;position:relative}
.qm-gong{cursor:pointer;transition:box-shadow .2s,transform .15s}
.qm-gong:hover{box-shadow:0 0 0 1px var(--gold,#c9a84c),0 4px 14px rgba(201,168,76,.25);transform:translateY(-1px)}
.qm-palace-pop{position:absolute;z-index:60;width:min(320px,86vw);background:var(--card,#141928);border:1px solid var(--gold,#c9a84c);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.55);padding:12px 14px;font-size:12px;line-height:1.7;color:var(--paper,#e8dcc8);text-align:left;cursor:default}
.qm-palace-pop .pp-title{color:var(--gold,#c9a84c);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.qm-palace-pop .pp-close{background:none;border:none;color:var(--paper3,#8b7e6a);font-size:16px;cursor:pointer;padding:0 2px}
.qm-palace-pop .pp-summary{font-size:12px;padding:6px 8px;border-radius:6px;margin-bottom:8px}
.qm-palace-pop .pp-summary.good{background:rgba(78,201,176,.12);color:#4ec9b0}
.qm-palace-pop .pp-summary.bad{background:rgba(239,68,68,.12);color:#ef4444}
.qm-palace-pop .pp-summary.neutral{background:rgba(255,255,255,.05);color:var(--paper3,#8b7e6a)}
.qm-palace-pop .pp-line{margin-bottom:6px;padding-left:8px;border-left:2px solid var(--border,#2a3450)}
.qm-palace-pop .pp-line.good{border-color:#4ec9b0}
.qm-palace-pop .pp-line.bad{border-color:#ef4444}
.qm-palace-pop .pp-label{color:var(--gold,#c9a84c);font-size:11px;font-weight:600;margin-right:4px}
.qm-palace-pop .pp-hint{margin-top:8px;font-size:10px;color:var(--paper3,#8b7e6a)}
.qm-gong{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;min-height:120px;position:relative}
.qm-gong.center{background:rgba(201,168,76,.05);border-color:var(--gold);border-style:dashed}
.qm-gong.kong{opacity:.5}
.qm-gong.ma{box-shadow:0 0 0 1px var(--jade)}
.qm-gong-name{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:2px}
.qm-gong-dir{font-size:9px;color:var(--paper3);margin-bottom:6px}
.qm-row{display:flex;gap:4px;margin-bottom:3px;align-items:center}
.qm-label{font-size:9px;color:var(--paper3);width:20px;flex-shrink:0}
.qm-val{font-size:11px}
.qm-val.star{color:var(--gold)}
.qm-val.door{color:var(--jade)}
.qm-val.god{color:var(--blue)}
.qm-val.dipan{color:var(--paper)}
.qm-val.tianpan{color:var(--green);font-weight:600}
.qm-val.kong{color:var(--red);font-size:9px}
.qm-val.ma{color:var(--jade);font-size:9px}

.qm-geju{max-width:700px;margin:0 auto}
.qm-geju-title{font-size:13px;color:var(--gold);margin-bottom:8px;font-weight:600}
.qm-geju-list{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.qm-geju-item{padding:8px;border-radius:4px;font-size:11px;line-height:1.5}
.qm-geju-item.ji{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)}
.qm-geju-item.xiong{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2)}
.qm-geju-name{font-weight:600;margin-bottom:2px}
.qm-geji-name.ji{color:var(--green)}
.qm-geju-name.xiong{color:var(--red)}
.qm-geju-desc{color:var(--paper3);font-size:10px}

.qm-form{max-width:500px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qm-form input,.qm-form select{padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--paper);font-size:13px}
.qm-form button{grid-column:1/-1;padding:10px;background:var(--gold);color:var(--bg);border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.qm-form button:hover{opacity:.9}

@media(max-width:768px){
  .qm-grid{grid-template-columns:repeat(3,1fr);gap:3px}
  .qm-gong{min-height:90px;padding:6px}
  .qm-gong-name{font-size:10px}
  .qm-val{font-size:10px}
  .qm-label{font-size:8px;width:16px}
  .qm-geju-list{grid-template-columns:1fr}
}
@media(max-width:360px){
  .qm-gong{min-height:75px;padding:4px}
  .qm-gong-name{font-size:9px}
  .qm-val{font-size:9px}
  .qm-label{font-size:7px;width:14px}
  .qm-row{gap:2px;margin-bottom:2px}
}

<button onclick="generateFullReport('qimen')" style="margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,#ffb44d,#ff7e5f);color:#0f1820;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px">📜 出具奇门遁甲报告</button>
<script>
async function generateFullReport(mod){
  try{
    const inputs = {};
    document.querySelectorAll('input,select').forEach(el=>{
      const m = el.id && el.id.match(/^[a-z]+-(.+)$/);
      if(m) if(el.type==='number' && el.value) inputs[m[1]] = +el.value;
        else inputs[m[1]] = el.value;
    });
    if(inputs.lunar===undefined) inputs.lunar = (window.zwCalMode==='lunar') || (window.lrCalMode==='lunar');
    if(inputs.leapMonth===undefined) inputs.leapMonth = false;
    
    const csrfRes = await fetch(API_BASE+'/api/csrf-token',{signal:AbortSignal.timeout(15000),headers:{'X-Skip-Interceptor':'1'}}).then(r=>r.json()).catch(()=>({csrfToken:''}));
    const csrf = csrfRes.csrfToken || csrfRes.token || '';
    
    const r = await fetch(API_BASE+'/api/paipan/'+mod+'/report', { signal: AbortSignal.timeout(15000),
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,'X-Skip-Interceptor':'1'},
      body: JSON.stringify({
        ...inputs,
        // 字段映射：前端字段名 → 后端期望字段名
        query: inputs.question || inputs.query || '',
        divinationTime: inputs.divinationTime || new Date().toISOString().slice(0,16).replace('T',' '),
        scenario: inputs.scenario || '个人自用',
        gender: inputs.sex || inputs.gender || 'male',
        questions: [inputs.question||''].filter(Boolean),
        options: { name: inputs.name||'缘主' }
      }), signal: AbortSignal.timeout(15000) }).then(r=>r.json());
    
    if(!r.ok){
      const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
      fn('报告生成失败：'+((r.message&&r.message!=='未知错误'?r.message:'')||r.error||'请检查输入')+(Array.isArray(r.missing)&&r.missing.length?('（缺少：'+r.missing.join('、')+'）'):(r.data&&Array.isArray(r.data.missing)&&r.data.missing.length?('（缺少：'+r.data.missing.join('、')+'）'):'')));
      return;
    }
    
    // 保存报告到 sessionStorage，跳到报告展示页
    sessionStorage.setItem('lastReport', JSON.stringify(r));
    window.location.href = 'report-interpret.html?module='+mod+'&name='+encodeURIComponent(inputs.name||'缘主');
  }catch(e){
    const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
    fn('生成失败：'+esc(e.message));
    console.error(e);
  }
}
</script>

<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
async function doPaipan(){
  const y=document.getElementById('qm-year').value;
  const m=document.getElementById('qm-month').value;
  const d=document.getElementById('qm-day').value;
  const h=document.getElementById('qm-hour').value;
  if(!y||!m||!d||h===''){showToast('请填写完整的年月日时');return;}
  const name = document.getElementById('qm-name').value || '';
  const sex = document.getElementById('qm-sex').value;
  const question = document.getElementById('qm-question').value || '';
  const lngEl = document.getElementById('qm-lng');
  const lng = lngEl ? (+lngEl.value || 121.47) : 121.47;
  const tyEl = document.getElementById('qm-target-year');
  const targetYear = tyEl ? (+tyEl.value || new Date().getFullYear()) : new Date().getFullYear();
  const now = new Date();
  const currentAge = now.getFullYear() - +y;
  const _lang = (typeof I18N !== 'undefined' && I18N.locale && !I18N.locale.startsWith('zh')) ? 'en' : 'zh';
  const body = {year:+y,month:+m,day:+d,hour:+h,name,sex,lng,targetYear,currentAge,lang:_lang };
  if(question) body.question = question;
  window._qmBody = body; // R-PALACE-TAP: 点宫解读复用同一排盘参数
  let r, rSvg;
  try {
    [r, rSvg] = await Promise.all([
      fetch(API_BASE+'/api/paipan/qimen',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(body),signal:AbortSignal.timeout(20000)}),
      proFetch(API_BASE+'/api/paipan/qimen/svg',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(body),signal:AbortSignal.timeout(20000)})
    ]);
  } catch(e) {
    showToast('排盘请求失败：' + (e && esc(e.message) || '网络异常') + '，请重试','err');
    return;
  }
  const data=await r.json();
  if(!data.ok){showToast('排盘失败: '+data.error);return;}
  const svg = await rSvg.text();
  renderChart(data.chart);
  if(window.PaipanNav) PaipanNav.notifyChart(data.chart);
  if(window.PaipanBaihua) PaipanBaihua.notify('qimen', body);
  renderSvg(svg);
  renderFlow(data.flow, targetYear, currentAge);
  if(data.interpretation) renderInterpretation(data.interpretation);
}

function renderChart(c){
  // meta
  const meta=document.getElementById('qm-meta');
  const yinYang=c.isYang?'<span class="qm-badge yang">阳遁</span>':'<span class="qm-badge yin">阴遁</span>';
  const fuYin=c.isFuYin?'<span class="qm-badge fuyin">星伏吟</span>':'';
  const fanYin=c.isFanYin?'<span class="qm-badge fanyin">星反吟</span>':'';
  const mFu=c.menFuYin?'<span class="qm-badge fuyin">门伏吟</span>':'';
  const mFan=c.menFanYin?'<span class="qm-badge fanyin">门反吟</span>':'';
  meta.innerHTML=`${c.ju}${c.juYuan?'·'+c.juYuan:''} ${yinYang}${fuYin}${fanYin}${mFu}${mFan}<br>`+
    `<span>节气:${c.jieqi||''}</span><span>日柱:${c.dayGanZhi}</span><span>时柱:${c.hourGanZhi}</span><span>旬首:${c.xunShou}</span><span>遁:${c.dun}</span><br>`+
    `<span>值符:${c.zhiFuStar}落${c.zhiFuPalace}宫</span><span>值使:${c.zhiShiDoor}落${c.zhiShiPalace||''}宫</span><span>空亡:${c.kongWang.join('、')}</span>`+
    (c.maStar?`<span>马星:${c.maStar}宫</span>`:'');

  // grid: 九宫按后天八卦排列
  // 4 9 2
  // 3 5 7
  // 8 1 6
  const layout=[4,9,2,3,5,7,8,1,6];
  const grid=document.getElementById('qm-grid');
  grid.innerHTML='';
  for(const p of layout){
    const palace=c.palaces.find(x=>x.palace===p);
    if(!palace) continue;
    const div=document.createElement('div');
    const cls=['qm-gong'];
    if(p===5) cls.push('center');
    if(palace.isKongWang) cls.push('kong');
    if(palace.isMa) cls.push('ma');
    div.className=cls.join(' ');
    
    let html=`<div class="qm-gong-name">${palace.name}宫</div>`;
    html+=`<div class="qm-gong-dir">${palace.direction}</div>`;
    if(p!==5){
      html+=`<div class="qm-row"><span class="qm-label">地</span><span class="qm-val dipan">${palace.dipan||'-'}</span></div>`;
      html+=`<div class="qm-row"><span class="qm-label">天</span><span class="qm-val tianpan">${palace.tianpan||'-'}</span></div>`;
      html+=`<div class="qm-row"><span class="qm-label">星</span><span class="qm-val star">${palace.star||'-'}${palace.diStar&&palace.diStar!==palace.star?`<span style="font-size:8px;color:var(--paper3)">(本${palace.diStar})</span>`:''}</span></div>`;
      html+=`<div class="qm-row"><span class="qm-label">门</span><span class="qm-val door">${palace.door||'-'}</span></div>`;
      html+=`<div class="qm-row"><span class="qm-label">神</span><span class="qm-val god">${palace.god||'-'}</span></div>`;
      if(palace.isKongWang) html+=`<div class="qm-val kong">空亡</div>`;
      if(palace.isMa) html+=`<div class="qm-val ma">🐎马星</div>`;
    } else {
      html+=`<div style="font-size:10px;color:var(--paper3);text-align:center;padding-top:20px">中宫</div>`;
      html+=`<div style="font-size:10px;color:var(--gold);text-align:center;margin-top:4px">${palace.dipan||''}</div>`;
    }
    div.innerHTML=html;
    div.dataset.palace=p;
    div.title='点击查看该宫白话解读';
    div.addEventListener('click',function(ev){ev.stopPropagation();showPalacePop(p,div)});
    grid.appendChild(div);
  }

  // 格局
  if(c.geju && c.geju.length>0){
    const gj=document.getElementById('qm-geju');
    gj.style.display='block';
    const gjTitle=gj.querySelector('.qm-geju-title')||document.createElement('div');
    gjTitle.className='qm-geju-title';
    gjTitle.textContent='格局判断';
    let gjList=gj.querySelector('.qm-geju-list');
    if(!gjList){gjList=document.createElement('div');gjList.className='qm-geju-list';gj.appendChild(gjList);}
    gjList.innerHTML='';
    gj.insertBefore(gjTitle,gjList);
    for(const g of c.geju){
      const item=document.createElement('div');
      item.className='qm-geju-item '+(g.type==='吉'?'ji':'xiong');
      item.innerHTML=`<div class="qm-geju-name ${g.type==='吉'?'ji':'xiong'}">${g.name} <span style="font-size:9px">[${g.type}]</span></div><div class="qm-geju-desc">${g.desc||''}</div>`;
      gjList.appendChild(item);
    }
  }
}

/* ── R-PALACE-TAP: 点宫白话解读浮动弹层 ── */
function escPal(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
let _ppEl=null,_ppPalace=null;
function hidePalacePop(){if(_ppEl){_ppEl.remove();_ppEl=null;_ppPalace=null}}
document.addEventListener('click',function(){hidePalacePop()});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape')hidePalacePop()});
async function showPalacePop(p,cell){
  if(_ppPalace===p){hidePalacePop();return}
  hidePalacePop();_ppPalace=p;
  const grid=document.getElementById('qm-grid');
  const pop=document.createElement('div');pop.className='qm-palace-pop';_ppEl=pop;
  pop.innerHTML='<div class="pp-title"><span>🔮 解读中…</span></div>';
  pop.addEventListener('click',function(ev){ev.stopPropagation()});
  grid.appendChild(pop);
  // 定位：默认浮动在被点宫正上方（顶部行放不下则翻到下方）
  const gw=grid.clientWidth;
  const pw=Math.min(320,gw*0.86);
  let left=cell.offsetLeft+cell.offsetWidth/2-pw/2;
  left=Math.max(0,Math.min(left,gw-pw));
  pop.style.left=left+'px';
  function anchor(){
    if(cell.offsetTop-8-pop.offsetHeight>=0){
      pop.style.top='';pop.style.bottom=(grid.clientHeight-cell.offsetTop+8)+'px';
    }else{
      pop.style.bottom='';pop.style.top=(cell.offsetTop+cell.offsetHeight+8)+'px';
    }
  }
  anchor();
  const LV={good:'吉',bad:'凶',neutral:'平'};
  try{
    if(!window._qmBody)throw new Error('请先排盘');
    const body=Object.assign({},window._qmBody,{palace:p});
    const r=await fetch(API_BASE+'/api/paipan/qimen/baihua',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(body)});
    const res=await r.json();
    const d=res&&res.data?res.data:res;
    const pd=d&&d.palaceDetail;
    if(!pd||!pd.ok)throw new Error((pd&&pd.error)||'解读生成失败');
    pop.innerHTML='<div class="pp-title"><span>🔮 '+escPal(pd.title)+' <span style="font-size:10px;border:1px solid currentColor;border-radius:8px;padding:0 6px;color:'+(pd.level==='good'?'#4ec9b0':pd.level==='bad'?'#ef4444':'#8b7e6a')+'">'+(LV[pd.level]||'')+'</span></span><button class="pp-close" title="关闭">✕</button></div>'
      +'<div class="pp-summary '+pd.level+'">'+escPal(pd.summary)+'</div>'
      +pd.lines.map(function(l){return '<div class="pp-line '+l.level+'"><span class="pp-label">'+escPal(l.label)+'</span>'+escPal(l.text)+'</div>'}).join('')
      +'<div class="pp-hint">点击其他宫位切换 · 点空白处或按 ESC 关闭</div>';
    pop.querySelector('.pp-close').addEventListener('click',hidePalacePop);
    anchor();
  }catch(e){
    pop.innerHTML='<div class="pp-title"><span>⚠️ '+escPal(e.message||'解读失败')+'</span><button class="pp-close">✕</button></div>';
    pop.querySelector('.pp-close').addEventListener('click',hidePalacePop);
    anchor();
  }
}

function renderSvg(svg){
  const old = document.getElementById('qm-svg-host');
  if(old) old.remove();
  const host = document.createElement('div');
  host.id = 'qm-svg-host';
  host.style.cssText = 'max-width:800px;margin:16px auto;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;padding:8px;text-align:center';
  host.innerHTML = '<div style="font-size:12px;color:var(--gold,#c9a84c);margin-bottom:6px">📜 高清盘图（R474 SVG · 可右键保存 / 微信长按分享）</div>' + svg;
  const grid = document.getElementById('qm-grid');
  if(grid) grid.parentNode.insertBefore(host, grid);
}

function renderFlow(flow, targetYear, currentAge){
  const old = document.getElementById('qm-flow-host');
  if(old) old.remove();
  if(!flow) return;
  const ln = flow.liuNian || {};
  const xx = flow.xiaoXian || {};
  const dx = flow.currentDaXian || {};
  const host = document.createElement('div');
  host.id = 'qm-flow-host';
  host.style.cssText = 'max-width:800px;margin:12px auto;padding:12px;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;font-size:12px;color:var(--paper,#e8dcc8)';
  host.innerHTML = `
    <div style="color:var(--gold,#c9a84c);font-weight:600;margin-bottom:8px">🌊 ${targetYear} 流年 · 现年 ${currentAge} 岁</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11px">
      <div style="background:rgba(201,168,76,.08);padding:8px;border-radius:6px">
        <div style="color:var(--gold,#c9a84c)">流年</div>
        <div>${ln.ganZhi||''}（${ln.shengXiao||''}）</div>
        <div style="color:var(--paper3);margin-top:2px">${ln.naYin||''}</div>
      </div>
      <div style="background:rgba(78,201,176,.08);padding:8px;border-radius:6px">
        <div style="color:var(--jade,#4ec9b0)">小限</div>
        <div>${xx.palaceName||''}宫</div>
        <div style="color:var(--paper3);margin-top:2px">${xx.direction||''}</div>
      </div>
      <div style="background:rgba(99,179,237,.08);padding:8px;border-radius:6px">
        <div style="color:var(--blue,#63b3ed)">大限</div>
        <div>${dx.startAge||''} - ${dx.endAge||''} 岁</div>
        <div style="color:var(--paper3);margin-top:2px">${dx.ganZhi||''} · ${dx.palaceName||''}</div>
      </div>
    </div>`;
  const grid = document.getElementById('qm-grid');
  if(grid) grid.parentNode.insertBefore(host, grid);
  else document.body.appendChild(host);
}

function renderInterpretation(i){
  if(!i) return;
  const el=document.getElementById('paipan-interpretation')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-interpretation';
    d.style.cssText='margin:16px 0;padding:16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:12px';
    document.querySelector('.zw-grid,.qm-grid,.ly-grid,.lr-grid,.mh-grid,.fs-grid,main,body').appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📜 断盘解读</div>';
  if(i.summary) h+='<div style="font-size:13px;line-height:1.7;opacity:.9;margin-bottom:8px">'+i.summary+'</div>';
  if(i.advice) h+='<div style="font-size:13px;line-height:1.7;opacity:.75">'+i.advice+'</div>';
  if(i.guaJi) h+='<div style="font-size:12px;opacity:.6;margin-top:6px">卦象：'+i.guaJi+'</div>';
  el.innerHTML=h;
  el.style.display='block';
}
