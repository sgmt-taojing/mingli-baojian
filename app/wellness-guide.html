:root{--gold:#c9a84c;--bg:#0e1726;--card:#1a2332;--border:#2d3748;--text:#c9d1d9;--muted:#718096;--green:#48bb78;--red:#f56565;--blue:#4299e1;--purple:#9f7aea;--orange:#ed8936}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:800px;margin:0 auto}
h1{color:var(--gold);font-size:18px;margin-bottom:6px;text-align:center}
.subtitle{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px}
.nav-back{display:inline-block;color:var(--gold);text-decoration:none;font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;color:var(--gold);margin-bottom:10px;border-left:3px solid var(--gold);padding-left:8px}
.form-group{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:50px}
.row{display:flex;gap:10px}.row>div{flex:1}
.checkbox-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.checkbox-item{display:flex;align-items:center;gap:4px;padding:6px;background:var(--bg);border:1px solid var(--border);border-radius:6px;font-size:12px;cursor:pointer}
.checkbox-item input{width:auto}
.hint{font-size:11px;color:var(--muted);margin-top:4px;font-style:italic}
.btn{display:block;width:100%;padding:12px;background:var(--gold);color:var(--bg);border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.step-dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .2s}
.step-dot.active{background:var(--gold)}.step-dot.done{background:var(--green)}
.step-bar{display:flex;justify-content:center;gap:6px;margin-bottom:14px}
.tag{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;margin-right:4px}
.tag-food{background:rgba(72,187,120,.15);color:var(--green)}
.tag-acu{background:rgba(159,122,234,.15);color:var(--purple)}
.tag-life{background:rgba(66,153,225,.15);color:var(--blue)}
.tag-warn{background:rgba(245,101,101,.15);color:var(--red)}
.organ-card{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.month-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:8px 0}
.month-box{padding:6px 4px;border-radius:4px;border:1px solid var(--border);font-size:10px;text-align:center}
.month-box.danger{background:rgba(245,101,101,.12);border-color:var(--red)}
.month-box.warn{background:rgba(237,137,54,.12);border-color:var(--orange)}
.month-box.safe{background:rgba(72,187,120,.1);border-color:var(--green)}
@media(max-width:480px){.checkbox-grid{grid-template-columns:repeat(2,1fr)}.row{flex-direction:column}.month-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:360px){.checkbox-grid{grid-template-columns:1fr}.month-grid{grid-template-columns:repeat(2,1fr)}}
</style>

'<div class="checkbox-item"><input type="checkbox" value="失眠"><span>失眠</span></div>'+
'<div class="checkbox-item"><input type="checkbox" value="胃不适"><span>胃不适</span></div>'+
'<div class="checkbox-item"><input type="checkbox" value="疲劳"><span>疲劳</span></div>'+

function next(){if(step<totalSteps){step++;render();window.scrollTo(0,0)}}

function generateReport(){
var a=document.getElementById('app');
var bd=v('birth_date');var bh=v('birth_hour')||12;
var parts=bd?bd.split('-'):[1990,10,28];
var y=parseInt(parts[0]),mo=parseInt(parts[1]),dy=parseInt(parts[2]);
var tg=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
var em={'甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水'};
var yI=((y-4)%10+10)%10;var yE=em[tg[yI]];
var cyE=em[tg[((2026-4)%10+10)%10]];// 丙火

var organMap={'金':['肺','大肠','皮肤','呼吸道'],'木':['肝','胆','眼睛','神经'],'水':['肾','膀胱','泌尿','骨骼'],'火':['心','小肠','血液','口腔'],'土':['脾','胃','肌肉','血糖']};

var foodMap={'金':'百合20g银耳15g炖汤(润肺)|白萝卜生姜水(化痰)|山药薏仁粥(健脾)','木':'菊花10g枸杞15g决明子10g泡茶(清肝)|芹菜凉拌(降压)|柑橘(维C)','水':'黑豆30g核桃15g煮粥(补肾)|海带凉拌(补碘)|黑芝麻(乌发)','火':'莲子心3g泡茶(清心)|绿豆汤(解暑)|百合红枣水(安神)','土':'山药小米南瓜粥(养胃)|薏仁茯苓水(祛湿)|陈皮生姜茶(理气)'};
var acuMap={'金':'太渊穴(手腕)每日3min|列缺穴艾灸5min|迎香穴(鼻翼)搓热','木':'太冲穴(足背)每日5min泻肝火|期门穴拍打疏肝|阳陵泉按揉','水':'太溪穴(内踝)艾灸10min|肾俞穴(腰部)搓热|涌泉穴(足底)100下','火':'神门穴(腕)按揉3min安神|内关穴缓解心悸|心俞穴艾灸','土':'足三里(膝下)每日5min健脾|中脘穴(脐上)揉50下|脾俞穴艾灸'};
var lifeMap={'金':'外出戴口罩|秋季加湿器|忌烟酒辛辣|晨起深呼吸|每年秋季查肺功能','木':'23点前入睡(肝胆排毒)|春季户外舒展|忌怒|少饮酒|每年春季查肝功能','水':'冬季护腰膝|忌冷饮|每天温水1500ml|避免久坐|冬季查肾B超','火':'夏季避暑|少辛辣油炸|有氧运动不过度出汗|控情绪|夏季查心电图','土':'定时定量七分饱|少油腻甜食|饭后散步|忌生冷|每年查血糖胃肠镜'};
var herbMap={'金':'玉屏风散(防感冒)|百合固金汤(润肺)|沙参麦冬汤','木':'逍遥散(疏肝)|柴胡疏肝散(理气)|菊花决明子茶','水':'六味地黄丸(补肾阴)|金匮肾气丸(补肾阳)|杜仲枸杞茶','火':'天王补心丹(养心)|酸枣仁汤(安神)|莲子心茶','土':'参苓白术散(健脾)|补中益气汤(补气)|山药小米粥'};

// 家族遗传风险
var genetic=chk('family_genetic');
var geneticRisk=[];
if(genetic.indexOf('高血压')>=0)geneticRisk.push('高血压(心脑血管风险)');

h+='<div style="font-size:13px;line-height:1.8">';
h+='<b>康养人：</b>'+v('name')+' | '+v('sex')+' | '+v('age')+'岁 | '+v('hw')+'<br>';
h+='<b>日主五行：</b>'+yE+' → 对应脏腑：'+organMap[yE].join('/')+'<br>';
h+='<b>体质倾向：</b>'+v('temp_pref')+' | 出汗:'+v('sweat')+' | 食欲:'+v('appetite')+' | 睡眠:'+v('sleep')+' | 大便:'+v('bowel')+'<br>';
h+='<b>情绪精力：</b>'+v('mood')+' | '+v('energy')+'<br>';
h+='<b>运动习惯：</b>'+v('exercise')+' | '+v('occupation')+'<br>';
if(geneticRisk.length)h+='<b style="color:var(--red)">家族遗传风险：</b>'+geneticRisk.join(' / ')+'<br>';
if(v('bp'))h+='<b>西医指标：</b>血压'+v('bp')+' | 心率'+v('hr')+' | 血糖'+v('glucose')+' | 血脂'+v('lipid')+'<br>';
if(v('imaging'))h+='<b>影像：</b>'+v('imaging')+'<br>';
if(v('medications'))h+='<b>用药：</b>'+v('medications')+'<br>';
h+='</div></div>';

// 月度风险日历
h+='<div class="card"><div class="card-title">📅 2026年月度健康风险日历</div><div class="month-grid">';
monthWx.forEach(function(mw){var r=mRisk(mw.wx,yE);var cls=r==='danger'?'danger':r==='warn'?'warn':'safe';
h+='<div class="month-box '+cls+'"><div><b>'+mw.m+'</b></div><div>'+mw.wx+'月</div><div style="font-size:9px">'+(r==='danger'?'高风险':r==='warn'?'中风险':'低风险')+'</div></div>'});
h+='</div><div style="font-size:11px;color:var(--muted);margin-top:4px">🔴高风险=克我 🟡中风险=泄气/同气 🟢低风险=生我</div></div>';

// 高风险月份预警
h+='<div class="card"><div class="card-title">⚠️ 高风险月份精确预警</div>';
monthWx.forEach(function(mw,i){var r=mRisk(mw.wx,yE);
if(r==='danger'||r==='warn'){
var jieqiDay=[6,4,6,5,6,7,7,8,8,8,7,7][i]||6;
h+='<div class="organ-card"><div style="font-size:13px;font-weight:600;color:'+(r==='danger'?'var(--red)':'var(--orange)')+'">'+mw.m+'('+mw.wx+'旺) — '+(r==='danger'?'高风险':'中风险')+'</div>';
h+='<div style="font-size:11px;margin-top:4px">⚠️ 重点日期：'+mw.m+(jieqiDay-2)+'日-'+(jieqiDay+2)+'日(节气切换期气场波动)</div>';
h+='<div style="font-size:11px;margin-top:2px">影响器官：'+organMap[yE].join('/')+'</div>';
h+='<div style="font-size:11px;margin-top:4px"><span class="tag tag-food">食</span>'+foodMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><span class="tag tag-acu">穴</span>'+acuMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><span class="tag tag-life">居</span>'+lifeMap[yE]+'</div></div>';
}});
h+='</div>';

// 器官级预防
h+='<div class="card"><div class="card-title">🫀 器官级精确预防方案（日主'+yE+'）</div>';
organMap[yE].forEach(function(o){
h+='<div class="organ-card"><div style="font-size:13px;font-weight:600;color:var(--gold)">'+o+' <span class="tag tag-warn">重点关注</span></div>';
h+='<div style="font-size:11px;margin-top:4px"><b>易患：</b>'+riskMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><span class="tag tag-food">食疗</span>'+foodMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><span class="tag tag-acu">穴位</span>'+acuMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><span class="tag tag-life">起居</span>'+lifeMap[yE]+'</div>';
h+='<div style="font-size:11px;margin-top:2px"><b>中药：</b>'+herbMap[yE]+'</div></div>';
});
h+='</div>';

// 家族遗传+西医数据综合预警
if(geneticRisk.length>0){
h+='<div class="card" style="border-color:var(--red)"><div class="card-title" style="color:var(--red)">🧬 家族遗传风险预警</div>';
geneticRisk.forEach(function(g){
h+='<div class="organ-card"><div style="font-size:13px;font-weight:600;color:var(--red)">'+g+'</div>';
if(g.indexOf('高血压')>=0||g.indexOf('心血管')>=0){
h+='<div style="font-size:11px">预防：低盐低脂饮食|每日监测血压|有氧运动30min|控情绪|每年查心电图+颈动脉B超</div>';
if(yE==='火')h+='<div style="font-size:11px;color:var(--red)">⚠️ 日主火+家族心脑血管→风险加倍，重点防护</div>';
}
if(g.indexOf('糖尿病')>=0){
h+='<div style="font-size:11px">预防：低糖饮食|控体重|每3月查空腹血糖+糖化|餐后散步|山药苦瓜辅助</div>';
if(yE==='土')h+='<div style="font-size:11px;color:var(--red)">⚠️ 日主土+家族糖尿病→风险加倍，重点防护</div>';
}
if(g.indexOf('肿瘤')>=0){
h+='<div style="font-size:11px">预防：每年肿瘤标志物筛查|低加工食品|戒烟限酒|充足睡眠|定期影像检查</div>';
}
if(g.indexOf('肝病')>=0){
h+='<div style="font-size:11px">预防：戒酒|忌霉变食物|接种乙肝疫苗|每年肝功能+AFP+B超|少熬夜</div>';
if(yE==='木')h+='<div style="font-size:11px;color:var(--red)">⚠️ 日主木+家族肝病→风险加倍</div>';
}
h+='</div>';
});
h+='</div>';
}

// 年度体检方案
h+='<div class="card"><div class="card-title">📋 年度体检方案</div>';
h+='<div style="font-size:12px;line-height:1.8">';
h+='<b>五行专项(日主'+yE+')：</b>'+({金:'肺功能+胸片+过敏原',木:'肝功能+腹部B超+眼底',水:'尿常规+肾B超+骨密度',火:'心电图+心脏彩超+动态血压',土:'血糖+胃肠镜+幽门螺杆菌'}[yE])+'<br>';
h+='<b>常规项目：</b>血常规/肝肾功/血脂/血糖/尿常规/心电图/胸片<br>';
if(geneticRisk.length>0)h+='<b>遗传专项：</b>'+geneticRisk.map(function(g){return g.split('(')[0]}).join('/')+'相关筛查<br>';
if(v('age')>=40)h+='<b>年龄专项：</b>颈动脉B超/骨密度/肿瘤标志物<br>';
h+='</div></div>';

// 免责
h+='<div class="card" style="border-color:var(--red)"><div style="font-size:11px;color:var(--muted);line-height:1.6">⚠️ 本报告基于传统命理五行理论+中医体质+家族遗传+西医数据综合分析，仅供参考。预测不能替代医学诊断。如有不适请及时就医，定期体检是最佳预防手段。</div></div>';

// 保存到 API
var payload={
    user_id:4,
    name:v('name'),sex:v('sex'),age:parseInt(v('age'))||null,
    height:v('hw'),residence:v('residence'),
    occupation:v('occupation'),exercise:v('exercise'),
    birth_date:v('birth_date'),birth_hour:parseInt(v('birth_hour'))||null,
    birthplace:v('birthplace'),preterm:v('preterm'),
    father_health:v('father_health'),mother_health:v('mother_health'),
    grandpa_p_health:v('grandpa_p_health'),grandpa_m_health:v('grandpa_m_health'),
    sibling_health:v('sibling_health'),family_genetic:chk('family_genetic'),
    bp:v('bp'),hr:v('hr'),glucose:v('glucose'),lipid:v('lipid'),
    liver:v('liver'),kidney:v('kidney'),cbc:v('cbc'),
    imaging:v('imaging'),other_exam:v('other_exam'),medications:v('medications'),
    temp_pref:v('temp_pref'),sweat:v('sweat'),appetite:v('appetite'),
    sleep:v('sleep'),bowel:v('bowel'),mood:v('mood'),energy:v('energy'),
    symptoms:chk('symptoms'),
    last_report:h.substring(0,5000),last_report_date:new Date().toISOString()
};
var csrfReq=API+'/api/csrf';
fetch(csrfReq,{credentials:'include'}).then(function(r){return r.json()}).then(function(cs){
    var csrfToken=cs.csrf_token||cs.data&&cs.data.csrf_token||'';
    return fetch(API+'/api/wellness/profile',{method:'POST',headers:{'Content-Type':'application/json','x-csrf-token':csrfToken},body:JSON.stringify(payload),credentials:'include'})
}).then(function(r){return r.json()}).then(function(d){
    var saveInfo='<div class="card"><div class="card-title">💾 档案已保存</div>';
    saveInfo+='<div style="font-size:12px">风险等级：<b>'+(d.data&&d.data.risk_level||'normal')+'</b> | 操作：'+(d.data&&d.data.action||'created')+'</div>';
    saveInfo+='<div class="hint">您的康养人档案已保存到身份中心</div></div>';
    a.innerHTML=saveInfo+h;
    window.scrollTo(0,0);
}).catch(function(e){
    console.warn('保存失败:',e);
    a.innerHTML=h;
    window.scrollTo(0,0);
});
}

render();
</script>
  <script src="js/mobile-nav.js" defer></script>
</body>
</html>
