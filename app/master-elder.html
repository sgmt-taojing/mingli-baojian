<div class="flow-steps-wrap" style="padding:12px 24px 0">
<div class="flow-steps"><div class="flow-step active"><span class="flow-step-num">1</span><span>选长辈</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">2</span><span>看档案</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">3</span><span>健康指导</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">4</span><span>记录跟踪</span></div></div>
<div class="flow-hint">家属查看长辈健康档案，提供养生指导并跟踪记录。</div>
</div>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">

<div class="top">
  <h1>☯ 周易大师端</h1>
  <div class="sub">老 师 您 好 · 八 字 排 盘 · 疾 病 预 测</div>
</div>

<div class="main">

  <!-- 步骤指示 -->
  <div class="steps" id="steps">
    <div class="step active" data-step="1">1</div>
    <div class="step" data-step="2">2</div>
    <div class="step" data-step="3">3</div>
    <div class="step" data-step="4">4</div>
  </div>

  <!-- 步骤 1：输入生辰 -->
  <section id="panel-1" class="panel">
    <div class="card">
      <h2>第一步 · 填写生辰</h2>
      <p style="text-align:center;font-size:20px;color:var(--paper3);margin-bottom:24px">
        请填写患者的出生时间，越准确越好
      </p>

      <label class="label-big" for="birth-year">① 出生年份</label>
      <input aria-label="birth-year" type="number" id="birth-year" class="input-big" placeholder="例如 1958" min="1900" max="2025">

      <label class="label-big" for="birth-month">② 出生月份</label>
      <select aria-label="birth-month" id="birth-month" class="input-big">
        <option value="">请选择月份</option>
        <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
        <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
        <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
        <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
      </select>

      <label class="label-big" for="birth-day">③ 出生日期</label>
      <input aria-label="birth-day" type="number" id="birth-day" class="input-big" placeholder="例如 15" min="1" max="31">

      <label class="label-big" for="birth-hour">④ 出生时辰<span class="help-tip" title="中国古代把一天分为12个时辰，每个时辰2小时">?</span></label>
      <select aria-label="birth-hour" id="birth-hour" class="input-big">
        <option value="">请选择时辰</option>
        <option value="0">子时 (23:00-01:00)</option>
        <option value="2">丑时 (01:00-03:00)</option>
        <option value="4">寅时 (03:00-05:00)</option>
        <option value="6">卯时 (05:00-07:00)</option>
        <option value="8">辰时 (07:00-09:00)</option>
        <option value="10">巳时 (09:00-11:00)</option>
        <option value="12">午时 (11:00-13:00)</option>
        <option value="14">未时 (13:00-15:00)</option>
        <option value="16">申时 (15:00-17:00)</option>
        <option value="18">酉时 (17:00-19:00)</option>
        <option value="20">戌时 (19:00-21:00)</option>
        <option value="22">亥时 (21:00-23:00)</option>
      </select>

      <label class="label-big" for="patient-name">⑤ 性别</label>
      <div class="opt-grid">
        <button class="opt" onclick="selectGender('male',this)">👨 男</button>
        <button class="opt" onclick="selectGender('female',this)">👩 女</button>
      </div>

      <label class="label-big" for="patient-name">⑥ 患者姓名 <span style="font-size:18px;color:var(--paper3)">(选填)</span></label>
      <input aria-label="patient-name" type="text" id="patient-name" class="input-big" placeholder="例如 王老先生">

      <button class="btn-big btn-primary" onclick="goStep2()">
        下一步 · 排 八 字
      </button>
    </div>
  </section>

  <!-- 步骤 2：八字排盘结果 -->
  <section id="panel-2" class="panel hidden">
    <div class="card">
      <h2>第二步 · 八字排盘</h2>
      <p style="text-align:center;font-size:20px;color:var(--paper3);margin-bottom:24px">
        系统已为您排出八字四柱
      </p>
      <div id="bazi-display" class="report">
        <!-- JS 填充 -->
      </div>
      <button class="btn-big btn-primary" onclick="goStep3()">
        下一步 · 预 测 疾 病
      </button>
    </div>
  </section>

  <!-- 步骤 3：疾病预测 -->
  <section id="panel-3" class="panel hidden">
    <div class="card">
      <h2>第三步 · 疾病预测</h2>
      <p style="text-align:center;font-size:20px;color:var(--paper3);margin-bottom:24px">
        根据八字五行旺衰分析
      </p>
      <div id="disease-display" class="report">
        <!-- JS 填充 -->
      </div>
      <button class="btn-big btn-primary" onclick="goStep4()">
        下一步 · 中 药 推 荐
      </button>
    </div>
  </section>

  <!-- 步骤 4：五行中药 + 完成 -->
  <section id="panel-4" class="panel hidden">
    <div class="card">
      <h2>第四步 · 五行中药</h2>
      <p style="text-align:center;font-size:20px;color:var(--paper3);margin-bottom:24px">
        按五行"缺什么补什么"推荐
      </p>
      <div id="tcm-display" class="report">
        <!-- JS 填充 -->
      </div>
      <div class="row-flex" style="justify-content:center">
        <button class="btn-big btn-secondary" style="flex:1" onclick="window.print()">🖨️ 打印报告</button>
        <button class="btn-big btn-primary" style="flex:1" onclick="restart()">🔄 重新分析</button>
      </div>
    </div>
  </section>

</div>

<!-- 浮动操作 -->
<div class="float-bar">
  <button class="btn-big btn-secondary" onclick="goHome()">🏠 回到首页</button>
  <button class="btn-big btn-danger" onclick="restart()">🔄 重新开始</button>
</div>

<!-- toast -->
<div id="toast" class="toast"></div>




<div id="elderDashMaster"></div>
