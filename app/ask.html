<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="问事 · 问答式采集，AI 自动排盘，白话解读 · 命理宝鉴">
<title>问事 · 命理宝鉴</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--bg:#0a0a12;--card:#15151f;--border:rgba(201,168,76,.25);--gold:#c9a84c;--gold2:#e8cc7a;--paper:#e8e0d0;--muted:#8b7e6a;--green:#4ec9b0;--red:#ef4444}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--paper);font-family:'PingFang SC',system-ui,sans-serif;min-height:100vh;line-height:1.7}
.wrap{max-width:520px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:19px;color:var(--gold2);text-align:center;margin:8px 0 2px}
.sub{text-align:center;font-size:12px;color:var(--muted);margin-bottom:16px}
/* 工具卡片 */
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s}
.tool:active{transform:scale(.96)}
.tool.sel{border-color:var(--gold);background:rgba(201,168,76,.12);box-shadow:0 0 0 1px var(--gold)}
.tool .ico{font-size:24px;display:block;margin-bottom:4px}
.tool .nm{font-size:13px;font-weight:600;color:var(--paper)}
.tool .nm-img{height:19px;width:auto;display:block;margin:2px auto 1px}
.tool .ds{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.4}
/* 聊天气泡 */
.chat{display:flex;flex-direction:column;gap:10px;margin:14px 0}
.bubble{max-width:88%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.8}
.bubble.bot{background:var(--card);border:1px solid var(--border);border-bottom-left-radius:4px;align-self:flex-start}
.bubble.me{background:rgba(201,168,76,.16);border:1px solid var(--border);border-bottom-right-radius:4px;align-self:flex-end}
/* 输入区 */
.inputbar{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
textarea{flex:1;background:var(--card);border:1px solid var(--border);border-radius:10px;color:var(--paper);padding:10px 12px;font-size:14px;font-family:inherit;resize:none;min-height:44px;max-height:120px}
textarea:focus{outline:none;border-color:var(--gold)}
.ibtn{width:44px;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card);font-size:18px;cursor:pointer;flex:none}
.ibtn.on{background:rgba(239,68,68,.2);border-color:var(--red)}
.ibtn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{padding:8px 14px;border:1px solid var(--border);border-radius:20px;background:var(--card);font-size:13px;color:var(--paper);cursor:pointer}
.chip.sel{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold2)}
input[type=text],input[type=number],select{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--paper);padding:9px 10px;font-size:14px}
.btn{display:block;width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1408;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px;letter-spacing:2px}
.btn:disabled{opacity:.5}
.btn2{display:block;width:100%;padding:10px;background:none;border:1px solid var(--border);color:var(--muted);border-radius:10px;font-size:13px;cursor:pointer;margin-top:8px}
/* 结果区 */
.res-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px}
.res-overview{border-color:var(--gold);background:rgba(201,168,76,.07);font-size:14.5px}
.res-overview .cap{font-size:12px;color:var(--gold);font-weight:600;margin-bottom:6px}
.dim-grid{display:grid;grid-template-columns:1fr;gap:8px}
.dim{border:1px solid var(--border);border-left:3px solid var(--muted);border-radius:8px;padding:9px 12px}
.dim.good{border-left-color:var(--green)}.dim.bad{border-left-color:var(--red)}
.dim .t{font-size:12.5px;font-weight:600;margin-bottom:3px}
.dim.good .t{color:var(--green)}.dim.bad .t{color:var(--red)}.dim.neutral .t{color:var(--gold)}
.dim .p{font-size:12.5px;line-height:1.8}
.tl{position:relative;padding-left:16px;border-left:2px solid var(--border);margin-left:6px}
.tl-item{position:relative;margin-bottom:10px;font-size:12.5px}
.tl-item::before{content:'';position:absolute;left:-20px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.tl-item.good::before{background:var(--green)}.tl-item.bad::before{background:var(--red)}
.vfy{display:flex;gap:6px;margin-top:4px}
.vfy button{padding:3px 12px;font-size:11px;border-radius:12px;border:1px solid var(--border);background:none;color:var(--muted);cursor:pointer}
.vfy button.done{background:rgba(78,201,176,.15);color:var(--green);border-color:var(--green)}
.tips{font-size:11.5px;color:var(--muted);line-height:1.9}
.disclaimer{text-align:center;font-size:10.5px;color:#5a5347;margin-top:20px;line-height:1.8}
.hidden{display:none!important}
.shake{animation:sk .4s}
@keyframes sk{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔮 问事</h1>
  <div class="sub">问答三步：选工具 → 说事情 → 得解读 · 全程白话 · 专业排盘后台自动完成</div>

  <!-- 第一步：选工具 -->
  <div id="step1">
    <div class="tools" id="toolGrid"></div>
  </div>

  <!-- 第二步：问答采集 -->
  <div id="step2" class="hidden">
    <div class="chat" id="chat"></div>
    <div id="askInput" class="hidden">
      <div class="inputbar">
        <textarea id="questionText" placeholder="请说您想问的事，越具体越好…" rows="2"></textarea>
        <button class="ibtn" id="micBtn" title="语音输入">🎙️</button>
        <button class="ibtn" id="photoBtn" title="拍照辅助（面相等，可选）">📷</button>
        <input type="file" id="photoFile" accept="image/*" capture="user" class="hidden">
      </div>
      <button class="btn" id="questionNext">下一步</button>
    </div>
    <div id="askBirth" class="hidden">
      <div class="row">
        <input type="number" id="bYear" placeholder="出生年 如1990" style="width:110px">
        <input type="number" id="bMonth" placeholder="月" style="width:70px">
        <input type="number" id="bDay" placeholder="日" style="width:70px">
      </div>
      <div class="row" id="calendarRow">
        <button class="chip sel" data-cal="solar">阳历</button>
        <button class="chip" data-cal="lunar">农历</button>
      </div>
      <div class="row">
        <select id="bHour" style="flex:1">
          <option value="">出生时辰（不清楚可不选）</option>
          <option value="0">子时 23-1点</option><option value="2">丑时 1-3点</option><option value="4">寅时 3-5点</option>
          <option value="6">卯时 5-7点</option><option value="8">辰时 7-9点</option><option value="10">巳时 9-11点</option>
          <option value="12">午时 11-13点</option><option value="14">未时 13-15点</option><option value="16">申时 15-17点</option>
          <option value="18">酉时 17-19点</option><option value="20">戌时 19-21点</option><option value="22">亥时 21-23点</option>
        </select>
      </div>
      <div class="row" id="sexRow">
        <button class="chip sel" data-sex="male">男</button>
        <button class="chip" data-sex="female">女</button>
      </div>
      <div class="row hidden" id="facingRow">
        <button class="chip" data-face="子">坐北朝南</button><button class="chip" data-face="午">坐南朝北</button>
        <button class="chip" data-face="卯">坐东朝西</button><button class="chip" data-face="酉">坐西朝东</button>
        <button class="chip" data-face="艮">坐东北朝西南</button><button class="chip" data-face="坤">坐西南朝东北</button>
        <button class="chip" data-face="巽">坐东南朝西北</button><button class="chip" data-face="乾">坐西北朝东南</button>
      </div>
      <div class="row hidden" id="partnerRow">
        <input type="number" id="pYear" placeholder="对方出生年 如1992" style="width:160px">
      </div>
      <div class="row hidden" id="textRow">
        <input type="text" id="textInput" placeholder="" style="flex:1">
      </div>
      <button class="btn" id="birthNext">开始解读</button>
      <button class="btn2" id="skipBirth">跳过出生信息（以当下时间起盘）</button>
    </div>
  </div>

  <!-- 第三步：解读结果 -->
  <div id="step3" class="hidden">
    <div id="resultArea"></div>
    <button class="btn2" onclick="location.reload()">↺ 再问一件事</button>
    <div style="text-align:center;margin-top:14px">
      <a href="wechat-h5.html" style="color:var(--gold);font-size:12.5px">需要命理师人工详批？点这里预约 →</a>
    </div>
    <div class="disclaimer">解读结果由 AI 基于传统命理模型生成，仅供学习参考，不构成重大决策依据。<br>命理宝鉴 · 传承有序 科技向善</div>
  </div>
</div>

<script>
'use strict';
const API = (location.hostname==='127.0.0.1'||location.hostname==='localhost') ? 'http://127.0.0.1:8920' : '';
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

/* ─── 工具目录（按人类需求顺序：问事→看自己→运势→婚恋→起名改名→号码→风水→规划→日历幸运）─── */
const TOOLS = [
  // 问事起卦：当下有事，一事一问
  { id:'liuyao',  ico:'🪙', nm:'六爻问卦', ds:'一事一问 当下起卦', need:'question' },
  { id:'meihua',  ico:'🌸', nm:'梅花易数', ds:'随问起卦 快速直断', need:'question' },
  { id:'qimen',   ico:'🧭', nm:'奇门遁甲', ds:'办事出行 抉择运筹', need:'question' },
  { id:'liuren',  ico:'📿', nm:'大六壬',   ds:'人事细节 来意揣度', need:'question' },
  // 命理排盘：看一生格局
  { id:'bazi',    ico:'📜', nm:'八字命理', ds:'一生格局 性格天赋', need:'birth' },
  { id:'ziwei',   ico:'🌌', nm:'紫微斗数', ds:'十二宫全观 人生地图', need:'birth' },
  { id:'lifeindex',ico:'📊', nm:'命格指数', ds:'真命盘十二维 优势短板', need:'birth' },
  // 运势走势：今年到十年
  { id:'liunian', ico:'📅', nm:'流年运势', ds:'今年运气 逐月走势', need:'birthYear' },
  { id:'lifeflow', ico:'🌊', nm:'流年报告', ds:'本月大运 明年预览', need:'birth' },
  { id:'lifetimeline', ico:'📈', nm:'十年走势', ds:'黄金五年 转折提醒', need:'birth' },
  // 婚恋家庭：缘分配对
  { id:'hehun',   ico:'💑', nm:'合婚配对', ds:'两人缘分 婚配参考', need:'partner' },
  // 起名改名：人生大事（宝宝/改名/公司/测评）
  { id:'qiming',  ico:'👶', nm:'宝宝起名', ds:'古籍取名 五行补益', need:'namebirth', ph:'输入姓氏 如 王', prompt:'宝宝（或改名者）的姓氏是？' },
  { id:'gaiming', ico:'✏️', nm:'改名测评', ds:'现名评分 新名备选', need:'rename', ph:'输入现用姓名 如 张伟', prompt:'请告诉我您的现用姓名（连名带姓 2-4 字）：' },
  { id:'gongsi',  ico:'🏢', nm:'公司取名', ds:'行业五行 字号吉凶', need:'company', ph:'如：科技公司，想带个「创」字', prompt:'说说行业和期望（如：科技公司，想带个「创」字）；测现有公司名就直接发名称：' },
  { id:'xingming',ico:'✍️', nm:'姓名评分', ds:'五格三才 名字能量', need:'textopt', ph:'输入姓名 如 张伟', prompt:'请告诉我您要测的名字（2-4个字）。出生年月日选填——填了我按您的命局五行看名字补益，不填按五格三才通法评测：' },
  // 号码吉凶：日常所用
  { id:'mobile',  ico:'📱', nm:'手机号吉凶', ds:'数理+命局喜用 选号建议', need:'textopt', ph:'输入手机号（11位）', prompt:'请把手机号发给我（只用于数理分析）。出生年月日选填——填了我按您的命局喜用测契合、精挑尾号，不填按数理通法评测：' },
  { id:'chepai',  ico:'🚗', nm:'车牌号吉凶', ds:'选号参考 数字形态', need:'text', ph:'输入车牌 如 粤A6688', prompt:'请把车牌号发给我（汉字字母都行，如 粤A6688）：' },
  // 风水堪舆：住宅办公
  { id:'fengshui',ico:'🏠', nm:'风水堪舆', ds:'住宅办公 方位吉凶', need:'facing' },
  // 人生规划：阶段与路径
  { id:'lifeplan',ico:'🧭', nm:'人生规划', ds:'命局阶段定位 五年路径', need:'birth' },
  // 日历幸运：每日必看
  { id:'huangli', ico:'📖', nm:'黄历择日', ds:'今日宜忌 选好日子', need:'none' },
  { id:'lucky',   ico:'🍀', nm:'幸运数色', ds:'幸运数字 颜色方位', need:'birthYear' },
];
const FACING_MAP = { '子':['子','午'],'午':['午','子'],'卯':['卯','酉'],'酉':['酉','卯'],'艮':['丑','未'],'坤':['未','丑'],'巽':['辰','戌'],'乾':['戌','辰'] };

const state = { tool:null, question:'', photoNote:'', cal:'solar', sex:'male', facing:null };
const $ = id => document.getElementById(id);

/* ─── 第一步：工具网格 ─── */
$('toolGrid').innerHTML = TOOLS.map((t,i) =>
  `<div class="tool" data-id="${t.id}"><span class="ico">${t.ico}</span><img class="nm-img" src="assets/titles/ask-${t.id}.png" alt="${t.nm}"><div class="ds">${t.ds}</div></div>`
).join('');
document.querySelectorAll('.tool').forEach(el => el.onclick = () => selectTool(el.dataset.id, el));

// R-DEEPLINK: ?tool=xxx 直达（首页/民俗中心等入口跳转自选工具）
(function(){
  const q = new URLSearchParams(location.search).get('tool');
  if (!q) return;
  const el = document.querySelector('.tool[data-id="' + q + '"]');
  if (el) setTimeout(() => el.click(), 120);
})();

function selectTool(id, el) {
  state.tool = TOOLS.find(t => t.id === id);
  document.querySelectorAll('.tool').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  $('step2').classList.remove('hidden');
  const noQuestion = ['text','namebirth','rename','company','none'].includes(state.tool.need);
  bot(`好，用「${state.tool.nm}」为您看。${noQuestion ? '' : '先说说您想问什么事？'}`);
  if (noQuestion) { askBirthIfNeeded(); }
  else { $('askInput').classList.remove('hidden'); $('questionText').focus(); }
  $('step2').scrollIntoView({ behavior:'smooth' });
}

/* ─── 聊天流 ─── */
function bot(text){ $('chat').insertAdjacentHTML('beforeend', `<div class="bubble bot">${esc(text)}</div>`); scrollChat(); }
function me(text){ $('chat').insertAdjacentHTML('beforeend', `<div class="bubble me">${esc(text)}</div>`); scrollChat(); }
function scrollChat(){ const c=$('chat'); c.lastElementChild && c.lastElementChild.scrollIntoView({behavior:'smooth',block:'end'}); }

$('questionNext').onclick = () => {
  const q = $('questionText').value.trim();
  if (!q) { $('questionText').classList.add('shake'); setTimeout(()=>$('questionText').classList.remove('shake'),400); return; }
  state.question = q + (state.photoNote ? '（' + state.photoNote + '）' : '');
  me(q + (state.photoNote ? '\n📷 ' + state.photoNote : ''));
  $('askInput').classList.add('hidden');
  askBirthIfNeeded();
};

function askBirthIfNeeded() {
  const need = state.tool.need;
  // 行复位：切换工具时先恢复默认（出生行/时辰行可见， facing/partner/text 隐藏），避免上次选择残留
  const rows = document.querySelectorAll('#askBirth .row');
  rows[0].classList.remove('hidden'); rows[2].classList.remove('hidden');
  $('facingRow').classList.add('hidden'); $('partnerRow').classList.add('hidden'); $('textRow').classList.add('hidden');
  $('skipBirth').style.display = '';
  if (need === 'birth' || need === 'birthYear') {
    bot(need === 'birth' ? '请告诉我您的出生信息（年月日必填，时辰不清楚可不选）：' : ((state.tool.id === 'lifeplan' || state.tool.id === 'lifeindex') ? '请告诉我您的出生年份，并点选性别：' : '请告诉我您的出生年份（看流年只需出生年，月日可不填更快速）：'));
    $('sexRow').classList.toggle('hidden', need !== 'birth' && state.tool.id !== 'lifeplan' && state.tool.id !== 'lifeindex');
    $('skipBirth').style.display = (state.tool.id === 'lifeplan' || state.tool.id === 'lifeindex') ? 'none' : '';
    $('calendarRow').classList.toggle('hidden', state.tool.id !== 'ziwei');
    $('askBirth').classList.remove('hidden');
  } else if (need === 'partner') {
    bot('合婚需要两人的出生年份。先填您的，再填对方的：');
    $('sexRow').classList.add('hidden'); $('calendarRow').classList.add('hidden');
    $('partnerRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
  } else if (need === 'facing') {
    bot('您家（或办公室）的朝向是哪个？站在屋里朝大门外看：');
    $('sexRow').classList.add('hidden'); $('calendarRow').classList.add('hidden');
    document.querySelector('#askBirth .row').classList.add('hidden'); // 出生年月日行
    $('facingRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
  } else if (need === 'text') {
    bot(state.tool.prompt || '请输入：');
    $('sexRow').classList.add('hidden'); $('calendarRow').classList.add('hidden');
    document.querySelector('#askBirth .row').classList.add('hidden'); // 出生年月日行
    document.querySelectorAll('#askBirth .row')[2].classList.add('hidden'); // 时辰行
    $('skipBirth').style.display = 'none';
    $('textInput').placeholder = state.tool.ph || '';
    $('textRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
    $('textInput').focus();
  } else if (need === 'textopt') {
    // 文本必填 + 生辰选填（手机号/姓名评分：填生辰按命局精准配，不填按通法评测）
    bot(state.tool.prompt || '请输入：');
    $('sexRow').classList.add('hidden'); $('calendarRow').classList.add('hidden');
    $('skipBirth').style.display = 'none';
    $('textInput').placeholder = state.tool.ph || '';
    $('textRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
    $('textInput').focus();
  } else if (need === 'namebirth') {
    bot((state.tool.prompt || '姓氏是？') + '再填出生信息（起名要结合生辰五行）：');
    $('calendarRow').classList.add('hidden');
    $('sexRow').classList.remove('hidden'); // 起名需性别
    $('skipBirth').style.display = 'none';
    $('textInput').placeholder = state.tool.ph || '输入姓氏';
    $('textRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
  } else if (need === 'rename' || need === 'company') {
    // 改名/公司取名：主输入为文本；出生信息可选（填了更准：改名按本人命局补益，公司按创始人喜用）
    bot(state.tool.prompt + '出生年月日选填——填了我按命局五行精准配，不填按姓名学通法评测。');
    $('calendarRow').classList.add('hidden');
    $('sexRow').classList.toggle('hidden', need !== 'rename'); // 公司取名无需性别
    $('skipBirth').style.display = 'none';
    $('textInput').placeholder = state.tool.ph || '';
    $('textRow').classList.remove('hidden');
    $('askBirth').classList.remove('hidden');
    $('textInput').focus();
  } else {
    submitAsk(); // none：直接起盘
  }
}

/* chip 选择 */
document.querySelectorAll('#calendarRow .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#calendarRow .chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); state.cal = c.dataset.cal; });
document.querySelectorAll('#sexRow .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#sexRow .chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); state.sex = c.dataset.sex; });
document.querySelectorAll('#facingRow .chip').forEach(c => c.onclick = () => { document.querySelectorAll('#facingRow .chip').forEach(x=>x.classList.remove('sel')); c.classList.add('sel'); state.facing = c.dataset.face; });

$('birthNext').onclick = () => { collectBirth(false); };
$('skipBirth').onclick = () => { collectBirth(true); };

function collectBirth(skip) {
  if (skip) { state.birth = null; me('先不提供出生信息，以当下时间起盘。'); submitAsk(); return; }
  const y = +$('bYear').value, m = +$('bMonth').value, d = +$('bDay').value;
  const need = state.tool.need;
  if (need === 'partner') {
    const py = +$('pYear').value;
    if (!y || !py) { bot('两位出生年份都要填哦（如 1990 / 1992）。'); return; }
    state.birth = { year:y, partnerYear:py };
    me(`我 ${y} 年生，对方 ${py} 年生`);
  } else if (need === 'facing') {
    if (!state.facing) { bot('请点选一个朝向。'); return; }
    state.birth = { facing: state.facing };
    me('朝向：' + document.querySelector('#facingRow .chip.sel').textContent);
  } else if (need === 'text') {
    const v = $('textInput').value.trim();
    if (!v) { bot(state.tool.prompt || '请先输入内容。'); return; }
    if (state.tool.id === 'mobile' && v.replace(/\D/g, '').length < 7) { bot('手机号至少 7 位数字哦。'); return; }
    if (state.tool.id === 'chepai' && v.replace(/\D/g, '').length < 3) { bot('车牌数字部分至少 3 位（如 粤A6688）。'); return; }
    if (state.tool.id === 'xingming' && (v.length < 2 || v.length > 4)) { bot('姓名一般 2-4 个字（连名带姓一起填）。'); return; }
    state.birth = { text: v };
    me(v);
  } else if (need === 'textopt') {
    const v = $('textInput').value.trim();
    if (!v) { bot(state.tool.prompt || '请先输入内容。'); return; }
    if (state.tool.id === 'mobile' && v.replace(/\D/g, '').length < 7) { bot('手机号至少 7 位数字哦。'); return; }
    if (state.tool.id === 'xingming' && (v.length < 2 || v.length > 4)) { bot('姓名一般 2-4 个字（连名带姓一起填）。'); return; }
    const opt = (y && m && d) ? { year:y, month:m, day:d, hour: $('bHour').value === '' ? 0 : +$('bHour').value } : {};
    state.birth = { text: v, sex: state.sex, ...opt };
    me(v + (opt.year ? ` · ${y}年${m}月${d}日生` : ''));
  } else if (need === 'namebirth') {
    const v = $('textInput').value.trim();
    if (!v || v.length > 2) { bot('姓氏填 1-2 个字（如 王 / 欧阳）。'); return; }
    if (!y || !m || !d) { bot('起名要结合生辰，年月日都要填哦。'); return; }
    state.birth = { surname: v, year:y, month:m, day:d, hour: $('bHour').value === '' ? 0 : +$('bHour').value, sex: state.sex };
    me(`姓 ${v} · ${y}年${m}月${d}日生 · ${state.sex === 'male' ? '男' : '女'}`);
  } else if (need === 'rename' || need === 'company') {
    const v = $('textInput').value.trim();
    if (need === 'rename') {
      if (!v || v.length < 2 || v.length > 4) { bot('现用姓名要 2-4 个字（连名带姓一起填）。'); return; }
      const opt = (y && m && d) ? { year:y, month:m, day:d, hour: $('bHour').value === '' ? 0 : +$('bHour').value } : {};
      state.birth = { text: v, sex: state.sex, ...opt };
      me(v + (opt.year ? ` · ${y}年${m}月${d}日生 · ${state.sex === 'male' ? '男' : '女'}` : ''));
    } else {
      if (!v || v.length < 2) { bot('至少说说行业，如「科技公司」；测现有公司名就直接发名称（2 个字以上）。'); return; }
      // 心愿字提取：「带个X」「带「X」」
      const wish = v.match(/带[个一]?[「“]?([一-龥])[」”]?/);
      // 纯名称（不含行业词、不以机构后缀结尾）→ 视为现有公司名测评
      const hasIndustryWord = /(科技|餐饮|金融|教育|文化|物流|地产|建筑|贸易|传媒|咨询|医药|农业|服装|酒店|旅游|能源|机械|汽车|珠宝|设计|广告|影视|娱乐|互联网|软件|信息|通信|智能|数据|新能源|投资|银行|保险|制造|出版|培训|文创|家具|园林|花卉|种植|健康|养生|美容|运输|航运|水产|饮品|酒业|物业|工程|装修|矿业|仓储|食品|化工|策划|品牌|公关|公司|店|厂|中心|工作室)/.test(v);
      const isNameOnly = /^[一-龥A-Za-z0-9]{2,10}$/.test(v) && !hasIndustryWord;
      const opt = (y && m && d) ? { year:y, month:m, day:d, hour: $('bHour').value === '' ? 0 : +$('bHour').value } : {};
      if (isNameOnly) {
        state.birth = { existingName: v, industry:'', ...opt };
        me(`测现有公司名「${v}」`);
      } else {
        state.birth = { industry: v, wishChar: wish ? wish[1] : '', ...opt };
        me(v + (opt.year ? ` · 创始人 ${y}年${m}月${d}日生` : ''));
      }
    }
  } else if (need === 'birthYear') {
    if (!y) { bot('至少填一下出生年份（如 1990）。'); return; }
    state.birth = { year:y, month:m||null, day:d||null };
    me(`${y} 年${m ? m + ' 月' : ''}${d ? d + ' 日' : ''}生`);
  } else {
    if (!y || !m || !d) { bot('出生年月日都要填哦，时辰可以不选。'); return; }
    state.birth = { year:y, month:m, day:d, hour: $('bHour').value === '' ? 12 : +$('bHour').value, cal: state.cal, sex: state.sex };
    me(`${y}年${m}月${d}日${$('bHour').value === '' ? '' : ' ' + $('bHour').selectedOptions[0].textContent.split(' ')[0]}（${state.cal === 'lunar' ? '农历' : '阳历'}）· ${state.sex === 'male' ? '男' : '女'}`);
  }
  $('askBirth').classList.add('hidden');
  submitAsk();
}

/* ─── 语音输入 ─── */
(function initVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = $('micBtn');
  if (!SR) { btn.disabled = true; btn.title = '当前浏览器不支持语音输入，请打字'; return; }
  const rec = new SR();
  rec.lang = 'zh-CN'; rec.interimResults = true; rec.continuous = false;
  let listening = false;
  btn.onclick = () => {
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; btn.classList.add('on'); btn.textContent = '🔴'; } catch (e) {}
  };
  rec.onresult = ev => {
    let txt = '';
    for (const r of ev.results) txt += r[0].transcript;
    $('questionText').value = txt;
  };
  rec.onend = () => { listening = false; btn.classList.remove('on'); btn.textContent = '🎙️'; };
  rec.onerror = () => { listening = false; btn.classList.remove('on'); btn.textContent = '🎙️'; };
})();

/* ─── 拍照辅助 ─── */
$('photoBtn').onclick = () => $('photoFile').click();
$('photoFile').onchange = async ev => {
  const f = ev.target.files[0];
  if (!f) return;
  $('photoBtn').textContent = '⏳';
  try {
    const fd = new FormData();
    fd.append('image', f, 'photo.jpg');
    fd.append('mode', 'face');
    const r = await fetch(API + '/api/v1/camera/upload-multipart', { method:'POST', body: fd, signal: AbortSignal.timeout(20000) });
    const j = await r.json();
    const note = j && j.ok ? '已收到照片，面相特征已纳入参考' : '照片分析暂不可用，不影响问事';
    state.photoNote = note;
    $('photoBtn').textContent = '✅';
    bot(note);
  } catch (e) { $('photoBtn').textContent = '📷'; bot('照片上传失败，不影响问事，可以继续。'); }
};

/* ─── 提交运算 ─── */
async function submitAsk() {
  $('step2').classList.add('hidden');
  $('step3').classList.remove('hidden');
  $('resultArea').innerHTML = '<div class="res-card" style="text-align:center;color:var(--muted)">🔮 正在排盘运算，请稍候…</div>';
  window.scrollTo(0, 0);
  try {
    const data = await fetchToolResult();
    renderResult(data);
  } catch (e) {
    $('resultArea').innerHTML = `<div class="res-card" style="color:var(--red)">解读生成失败：${esc(e.message || '网络异常')}<br><span style="color:var(--muted);font-size:12px">请检查网络后重试，或稍后再问。</span></div>`;
  }
}

async function fetchToolResult() {
  const t = state.tool.id;
  const now = new Date();
  if (t === 'huangli') {
    const r = await fetch(`${API}/api/minsu/huangli?year=${now.getFullYear()}&month=${now.getMonth()+1}&day=${now.getDate()}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '查询失败');
    return { kind:'minsu', baihua: j.baihua, toolName:'今日黄历' };
  }
  if (t === 'liunian') {
    const r = await fetch(`${API}/api/minsu/liunian?year=${now.getFullYear()}&birthYear=${state.birth.year}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '查询失败');
    return { kind:'minsu', baihua: j.baihua, toolName:'流年运势' };
  }
  if (t === 'hehun') {
    const r = await fetch(`${API}/api/minsu/hehun?maleYear=${state.sex === 'male' ? state.birth.year : state.birth.partnerYear}&femaleYear=${state.sex === 'male' ? state.birth.partnerYear : state.birth.year}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '查询失败');
    return { kind:'minsu', baihua: j.baihua, toolName:'合婚配对' };
  }
  // 民俗速查：车牌（GET + 服务端白话）
  if (t === 'chepai') {
    const r = await fetch(`${API}/api/minsu/plate?number=${encodeURIComponent(state.birth.text)}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '分析失败');
    if (!j.baihua || !j.baihua.ok) throw new Error('白话解读生成失败');
    return { kind:'minsu', baihua: j.baihua, toolName: state.tool.nm };
  }
  // 手机号：有生辰走命局契合端点（喜用尾号精挑），无生辰走数理速查（R-MOBILEFIT）
  if (t === 'mobile') {
    const bb = state.birth;
    if (bb.year) {
      const r = await fetch(`${API}/api/minsu/mobile/advise`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
        body: JSON.stringify({ number: bb.text, year: bb.year, month: bb.month, day: bb.day, hour: bb.hour, gender: bb.sex === 'female' ? 'F' : 'M' }),
        signal: AbortSignal.timeout(20000)
      });
      const j = await r.json();
      const d = j && j.data;
      if (!d || !d.base) throw new Error((j && (j.message || j.error)) || '号码分析失败');
      const b0 = d.base, p = d.personal;
      const cards = [];
      if (p) {
        cards.push({ title:`您的命局 · ${p.dayMaster} · ${p.strength}`,
          plain:`日主五行属${p.dayElement}，${p.strength}（同党 ${p.tong} / 异党 ${p.yi}）。${p.wuxingLack.length ? '五行缺「' + p.wuxingLack.join('、') + '」，' : ''}喜用五行：${p.xiYong.join('、')}——号码、颜色、方位都优先往这上面靠。`, level:'neutral' });
        const fitMap = {
          fit:  ['✅ 尾数正合喜用', 'good',    `尾号 ${b0.tailNumber} 属${p.tailWuxing}，正在您的喜用五行里——这号码跟您合拍，放心用。`],
          clash:['⚠️ 尾数踩了忌神', 'bad',    `尾号 ${b0.tailNumber} 属${p.tailWuxing}，落在忌神方向（${p.jiShen.join('、')}）——用着容易别扭，换号或办副卡时优先避开。`],
          plain:['○ 尾数中性',      'neutral', `尾号 ${b0.tailNumber} 属${p.tailWuxing}，不帮不碍——无功无过，数理吉就行。`]
        };
        const fm = fitMap[p.fitLevel];
        cards.push({ title: fm[0], plain: fm[2], level: fm[1] });
        if (p.bestTails && p.bestTails.length) cards.push({ title:'🎯 为您精挑的尾号',
          plain:`最后一位换成 ${p.bestTails.map(o => o.d + '（' + o.wx + '）').join(' / ')}：既合您的喜用五行，81数理又是吉数（${p.bestTails.map(o => o.tr).join(' / ')}），换号或办副卡照这个挑。${p.goodTails && p.goodTails.length ? '次选（数理吉、五行中性）：' + p.goodTails.map(o => o.d).join(' / ') + '。' : ''}`, level:'good' });
      }
      cards.push({ title:`数理总评 · ${b0.score}分`,
        plain:`全号总和 ${b0.totalSum}，81数理 ${b0.luck81 && b0.luck81.number ? b0.luck81.number + '（' + b0.luck81.luck + '）' : '—'}。${b0.suggestion || ''}`, level: b0.score >= 70 ? 'good' : b0.score >= 50 ? 'neutral' : 'bad' });
      const b = {
        overview: p ? `号码 ${b0.number}，按您的八字（${p.dayMaster} · ${p.strength}）配号：${p.fitLevel === 'fit' ? '尾数正合喜用，是好号码。' : p.fitLevel === 'clash' ? '数理可用但尾数不合命局，建议按精挑尾号调整。' : '尾数中性，重点看数理吉凶与喜用方向。'}` : `号码 ${b0.number} 数理评分 ${b0.score} 分。`,
        cards,
        tips: (b0.improve || []).filter(s => !(p && s.includes('若知八字喜用'))).concat(['号码是辅助：顺耳好记 + 数理吉 + 合喜用就是上选，不必执念"全吉"。'])
      };
      return { kind:'paipan', baihua: b, toolName:'手机号 · 命局契合' };
    }
    const r = await fetch(`${API}/api/minsu/mobile?number=${encodeURIComponent(bb.text)}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '分析失败');
    if (!j.baihua || !j.baihua.ok) throw new Error('白话解读生成失败');
    return { kind:'minsu', baihua: j.baihua, toolName: state.tool.nm };
  }
  // 姓名评分：有生辰走命局补益分析（POST analyze），无生辰走五格三才速查
  if (t === 'xingming') {
    const bb = state.birth;
    if (bb.year) {
      const r = await fetch(`${API}/api/minsu/xingming/analyze`, {
        method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
        body: JSON.stringify({ fullName: bb.text, gender: bb.sex === 'female' ? 'F' : 'M', year: bb.year, month: bb.month, day: bb.day, hour: bb.hour }),
        signal: AbortSignal.timeout(20000)
      });
      const j = await r.json();
      const d = j && j.data;
      if (!d || !d.fullName) throw new Error((j && (j.message || j.error)) || '姓名分析失败');
      const cards = [
        { title:`「${d.fullName}」 · ${d.score}分（${d.rating}）`, plain:(d.analysis || '').split('\n').slice(1).join('；'), level: d.score >= 80 ? 'good' : d.score >= 65 ? 'neutral' : 'bad' }
      ];
      if (d.sancai && d.sancai.advice) cards.push({ title:'名字与命局的配合', plain:`${d.sancai.advice}${d.nameWuxing && d.nameWuxing.length ? '（名字五行属' + d.nameWuxing.join('、') + '）' : ''}`, level: d.sancai.isBeneficial ? 'good' : 'neutral' });
      if (d.classicSource) cards.push({ title:'古籍出处', plain:String(d.classicSource), level:'good' });
      if (d.isHighFreq) cards.push({ title:'⚠️ 重名提示', plain:'这个名字重名率偏高，社交场合辨识度低——介意的话可以看看「改名测评」里的同音备选。', level:'neutral' });
      const tips = (d.supplements && d.supplements.length ? d.supplements : []).concat(['名字是长期暗示：评分偏低别焦虑，可到「改名测评」看针对性的新名方案。']);
      const b = { overview:`「${d.fullName}」结合您的生辰命局评测：综合 ${d.score} 分（${d.rating}）。${d.sancai && d.sancai.relation ? '名字与日主关系：' + d.sancai.relation + '。' : ''}`, cards, tips };
      return { kind:'paipan', baihua: b, toolName:`姓名评分 · ${d.fullName}` };
    }
    const r = await fetch(`${API}/api/minsu/xingming?name=${encodeURIComponent(bb.text)}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '分析失败');
    if (!j.baihua || !j.baihua.ok) throw new Error('白话解读生成失败');
    return { kind:'minsu', baihua: j.baihua, toolName: state.tool.nm };
  }
  if (t === 'lucky') {
    const r = await fetch(`${API}/api/minsu/lucky?birthYear=${state.birth.year}`, { signal: AbortSignal.timeout(12000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '分析失败');
    return { kind:'minsu', baihua: j.baihua, toolName:'幸运数色' };
  }
  // 宝宝起名：古籍词库 + 五行补益 + 防重名（CSRF 白名单内）
  if (t === 'qiming') {
    const bb = state.birth;
    const r = await fetch(`${API}/api/minsu/xingming/suggest`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ surname: bb.surname, gender: bb.sex === 'male' ? 'M' : 'F', year: bb.year, month: bb.month, day: bb.day, hour: bb.hour }),
      signal: AbortSignal.timeout(25000)
    });
    const j = await r.json();
    const res0 = j && j.data && j.data.result;
    if (!res0 || !res0.recommendations) throw new Error((j && (j.message || j.error)) || '起名生成失败');
    const recs = res0.recommendations.slice(0, 8);
    const b = {
      overview: `姓「${res0.surname}」${res0.gender}宝宝：命局五行属${res0.dayElement || '—'}${(res0.wuxing_lack && res0.wuxing_lack.length) ? '，喜用补「' + res0.wuxing_lack.join('、') + '」' : ''}。从古籍词库 ${res0.totalCandidates} 个候选中精选 ${recs.length} 个，按五行契合与寓意排序。`,
      cards: recs.map(n => ({
        title: `${n.name} · ${n.score}分`,
        plain: `${n.meaning || ''}——出自${n.source || ''}${n.sourceText ? '（' + n.sourceText + '）' : ''}。五行属${n.wuxing || '—'}${n.sancai && n.sancai.advice ? '，' + n.sancai.advice.replace(/^[✦○]\s*/, '') : ''}${n.familyNote ? '。避讳提示：' + n.familyNote : ''}`,
        level: n.score >= 75 ? 'good' : 'neutral'
      })),
      tips: ['名字是长辈的心意与祝福，古籍出处让名字有文化底蕴', '最终定名前建议全家念几遍：顺口、好写、无谐音歧义最重要', '如需结合完整八字精算，可请命理师用专业排盘复核']
    };
    return { kind:'paipan', baihua: b, toolName: `宝宝起名 · ${res0.surname}姓` };
  }
  // 改名测评：现名评分+短板 → 同姓备选（R-RENAME）
  if (t === 'gaiming') {
    const bb = state.birth;
    const r = await fetch(`${API}/api/minsu/xingming/rename`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ fullName: bb.text, gender: bb.sex === 'male' ? 'M' : 'F', year: bb.year, month: bb.month, day: bb.day, hour: bb.hour }),
      signal: AbortSignal.timeout(25000)
    });
    const j = await r.json();
    const d = j && j.data;
    if (!d || !d.current) throw new Error((j && (j.message || j.error)) || '改名测评失败');
    const cur = d.current;
    const cards = [
      { title: `现名「${cur.fullName}」 · ${cur.score}分（${cur.rating}）`,
        plain: (cur.analysis || '').split('\n').slice(1).join('；'), level: cur.score >= 80 ? 'good' : cur.score >= 65 ? 'neutral' : 'bad' },
      { title: '🔍 改名必要性诊断', plain: (d.gaps || []).join('；') || '现名无明显短板', level: (d.gaps || []).some(g => g.includes('偏低') || g.includes('未补')) ? 'bad' : 'neutral' }
    ].concat((d.suggestions || []).map(n => ({
      title: `备选 · ${n.name} · ${n.score}分`,
      plain: `${n.meaning || ''}——出自${n.source || ''}。五行属${n.wuxing || '—'}${n.sancai && n.sancai.advice ? '，' + n.sancai.advice.replace(/^[✦○]\s*/, '') : ''}`,
      level: n.score >= 75 ? 'good' : 'neutral'
    })));
    const b = {
      overview: `现名「${cur.fullName}」测评 ${cur.score} 分。${(d.wuxing_lack && d.wuxing_lack.length) ? '命局喜用「' + d.wuxing_lack.join('、') + '」，' : ''}从古籍词库精选 ${d.suggestions.length} 个同姓新名（已避开现名用字），按命盘契合度排序。`,
      cards,
      tips: ['改名收益看三点：补到喜用、避开高频重名、有古籍出处', '证件改名前先让家人朋友喊几天新名，顺口顺耳再定', '不改名也可用「字/号/网名」补益，效果同理更省事', '重大变更前建议命理师结合完整八字精算复核']
    };
    return { kind:'paipan', baihua: b, toolName: `改名测评 · ${cur.fullName}` };
  }
  // 公司取名/改名：行业五行 + 创始喜用 + 现名测评（R-COMPANY）
  if (t === 'gongsi') {
    const bb = state.birth;
    const r = await fetch(`${API}/api/minsu/gongsi`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ industry: bb.industry || '', existingName: bb.existingName || '', wishChar: bb.wishChar || '', year: bb.year, month: bb.month, day: bb.day, hour: bb.hour, gender: bb.sex === 'female' ? 'F' : 'M' }),
      signal: AbortSignal.timeout(25000)
    });
    const j = await r.json();
    const d = j && j.data;
    if (!d || !d.ok) throw new Error((j && (j.message || j.error)) || '公司取名失败');
    const cards = [];
    if (d.existing) {
      cards.push({ title: `现名「${d.existing.name}」 · ${d.existing.score}分`, plain: d.existing.comment.join('；'), level: d.existing.score >= 70 ? 'good' : d.existing.score >= 50 ? 'neutral' : 'bad' });
    }
    (d.recommendations || []).slice(0, 8).forEach(n => cards.push({
      title: `${n.name} · ${n.score}分`,
      plain: `${n.meaning}。五行属${n.wuxing}${n.reasons && n.reasons.length ? '——' + n.reasons.join('，') : ''}`,
      level: n.score >= 80 ? 'good' : 'neutral'
    }));
    const b = {
      overview: d.industryWuxing
        ? `「${d.industry}」五行属${d.industryWuxing}（${d.industryNote}）。${d.preferWuxing.length ? '喜用五行：' + d.preferWuxing.join('→') + '，' : ''}精选字号 ${Math.min(8, d.recommendations.length)} 个按契合度排序。`
        : `按通用商业五行评测（行业未精确识别，描述再具体些会更准）。精选字号 ${Math.min(8, d.recommendations.length)} 个。`,
      cards,
      tips: d.tips || []
    };
    return { kind:'paipan', baihua: b, toolName: d.existing ? `公司改名 · ${d.existing.name}` : `公司取名 · ${d.industry || '通用'}` };
  }
  // 命格指数：真命盘十二维评分（R-REALSCORE，生辰必采）
  if (t === 'lifeindex') {
    const bb = state.birth || {};
    const r = await fetch(`${API}/api/ai/lifeindex-report`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ year: bb.year, month: bb.month, day: bb.day, hour: bb.hour != null ? bb.hour : 12, gender: state.sex, concerns: state.question ? [state.question.slice(0,30)] : [] }),
      signal: AbortSignal.timeout(20000)
    });
    const j = await r.json();
    const rep = (j && j.data && (j.data.report || j.data)) || null;
    if (!rep || !rep.dimensions) throw new Error('指数生成失败');
    const b = {
      overview: rep.summary,
      cards: (rep.dimensions || []).map(d => ({
        title: `${d.icon || ''} ${d.name} · ${d.score}分（${d.status}）`,
        plain: d.advice || d.desc || '',
        level: d.score >= 80 ? 'good' : d.score < 60 ? 'bad' : 'neutral'
      })),
      tips: rep.suggestions || []
    };
    return { kind:'paipan', baihua: b, toolName: `命格指数 · 综合 ${rep.total} 分` };
  }
  // 流年报告：本月大运 + 四维 + 明年预览（CSRF 白名单内，日主五行服务端自动推导）
  if (t === 'lifeflow') {
    const bb = state.birth || {};
    const r = await fetch(`${API}/api/ai/lifeflow-report`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ year: bb.year, month: bb.month, day: bb.day, hour: bb.hour != null ? bb.hour : 12, sex: state.sex }),
      signal: AbortSignal.timeout(20000)
    });
    const j = await r.json();
    const d = j && j.data;
    if (!d || !d.currentMonth) throw new Error('流年生成失败');
    const DIM_NM = { career:'事业', wealth:'财运', love:'感情', health:'健康' };
    const lv = s => s >= 65 ? 'good' : s < 45 ? 'bad' : 'neutral';
    const b = {
      overview: `本月「${d.currentMonth.name}」(${d.currentMonth.jieqi})：${d.currentMonth.score}分·${d.currentMonth.status}——${d.currentMonth.advice}。三维叠加总评 ${d.tripleScore} 分（${d.overall}）。`,
      cards: Object.entries(d.dims || {}).map(([k, v]) => ({ title: `${DIM_NM[k] || k} · ${v}分`, plain: '', level: lv(v) }))
        .concat(d.nextYearPreview ? [{ title: `明年预览 · ${d.nextYearPreview.ganzhi}年`, plain: `${d.nextYearPreview.score}分·${d.nextYearPreview.status}——${d.nextYearPreview.advice}`, level: lv(d.nextYearPreview.score) }] : []),
      tips: (d.advices || []).concat(d.luckyMap ? [`喜用参考：${d.luckyMap}`] : [])
    };
    return { kind:'paipan', baihua: b, toolName: '流年报告' };
  }
  // 十年走势：年维度滚动评分 + 黄金/谨慎五年 + 转折点（CSRF 白名单已补）
  if (t === 'lifetimeline') {
    const bb = state.birth || {};
    const r = await fetch(`${API}/api/ai/lifeflow-timeline`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ year: bb.year, month: bb.month, day: bb.day, hour: bb.hour != null ? bb.hour : 12, sex: state.sex, years: 10 }),
      signal: AbortSignal.timeout(25000)
    });
    const j = await r.json();
    const d = j && j.data;
    if (!d || !d.yearBreakdown) throw new Error('走势生成失败');
    const tone = s => s >= 65 ? 'good' : s < 40 ? 'bad' : 'neutral';
    const pivotTxt = (d.bigPivot || []).map(p => p.text || p).filter(Boolean);
    const b = {
      overview: `${d.userEle ? d.userEle + '命 · ' : ''}${d.startYear} 至 ${d.endYear} 十年滚动走势。黄金年份：${(d.top5Years || []).slice(0,3).map(y => `${y.year}年(${y.avgScore}分)`).join('、')}；需谨慎：${(d.cautiousYears || []).slice(0,3).map(y => `${y.year}年(${y.avgScore}分)`).join('、')}。`,
      cards: (d.yearBreakdown || []).map(y => ({
        title: `${y.year}年 ${y.ganzhi} · ${y.avgScore}分（${y.overall}）`,
        plain: `大运${y.dayun || '—'} · 峰值${y.peakMonth}月(${y.peakScore}分) · 低谷${y.troughMonth}月(${y.troughScore}分)`,
        level: tone(y.avgScore)
      })),
      tips: pivotTxt
    };
    return { kind:'paipan', baihua: b, toolName: '十年走势' };
  }
  // 人生规划：真命盘定位 + 五年路径（R-REALSCORE，生辰必采）
  if (t === 'lifeplan') {
    const bb = state.birth || {};
    const age = Math.max(1, now.getFullYear() - (bb.year || (now.getFullYear() - 30)));
    const r = await fetch(`${API}/api/ai/lifeplan-report`, {
      method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
      body: JSON.stringify({ year: bb.year, month: bb.month, day: bb.day, hour: bb.hour != null ? bb.hour : 12, gender: state.sex, concerns: state.question ? [state.question.slice(0,30)] : [] }),
      signal: AbortSignal.timeout(20000)
    });
    const j = await r.json();
    const rep = j && j.data && j.data.report;
    if (!rep) throw new Error((j && (j.message || j.error)) || '规划生成失败');
    const b = {
      overview: rep.summary,
      cards: (rep.domains || []).map(d => ({
        title: `${d.icon || ''} ${d.name} · ${d.score}分（${d.status}）`,
        plain: d.advice || '',
        level: d.score >= 80 ? 'good' : d.score < 60 ? 'bad' : 'neutral'
      })),
      forecast: (rep.next5Years || []).map(f => ({ period: `${age}岁起第${f.year - age}年`, plain: f.text, tone: 'neutral' })),
      tips: (rep.actions || []).concat(rep.disclaimer ? [] : [])
    };
    return { kind:'paipan', baihua: b, toolName: `人生规划 · ${rep.stage}阶段` };
  }
  // 七盘走 baihua 端点
  const body = { question: state.question };
  if (state.birth && state.birth.month) {
    body.year = state.birth.year; body.month = state.birth.month; body.day = state.birth.day;
    body.hour = state.birth.hour != null ? state.birth.hour : 12;
    body.gender = state.birth.sex; body.sex = state.birth.sex;
    if (t === 'ziwei') body.lunar = state.birth.cal === 'lunar';
  } else {
    body.year = now.getFullYear(); body.month = now.getMonth()+1; body.day = now.getDate(); body.hour = now.getHours();
  }
  if (t === 'fengshui') {
    const [sit, face] = FACING_MAP[state.birth.facing] || ['子','午'];
    body.sittingMountain = sit; body.facingMountain = face;
    delete body.year; delete body.month; delete body.day; delete body.hour;
    body.year = now.getFullYear();
  }
  const r = await fetch(`${API}/api/paipan/${t}/baihua`, {
    method:'POST', headers:{ 'Content-Type':'application/json', 'X-Skip-Interceptor':'1' },
    body: JSON.stringify(body), signal: AbortSignal.timeout(20000)
  });
  const j = await r.json();
  const d = j && j.data ? j.data : j;
  if (!d || !d.ok) throw new Error((j && (j.message || j.error)) || '排盘失败');
  return { kind:'paipan', baihua: d, toolName: state.tool.nm };
}

/* ─── 结果渲染（全维度白话）─── */
function renderResult(res) {
  const b = res.baihua || {};
  const LV = { good:'good', bad:'bad', neutral:'neutral' };
  let h = '';
  h += `<div class="res-card res-overview"><div class="cap">💬 ${esc(res.toolName)} · 白话总览${state.question ? '（问：' + esc(state.question.slice(0,30)) + '）' : ''}</div>${esc(b.overview || '解读已生成，见下方分维度详情。')}</div>`;
  if (b.cards && b.cards.length) {
    h += '<div class="dim-grid">';
    for (const c of b.cards) h += `<div class="dim ${LV[c.level]||'neutral'}"><div class="t">${esc(c.title)}</div><div class="p">${esc(c.plain)}</div></div>`;
    h += '</div>';
  }
  if (b.forecast && b.forecast.length) {
    h += '<div class="res-card"><div class="cap" style="color:var(--gold);font-size:12.5px;font-weight:600;margin-bottom:8px">🔮 往后看（预测）</div><div class="tl">';
    for (const f of b.forecast) h += `<div class="tl-item ${LV[f.tone]||'neutral'}"><b>${esc(f.period)}</b>　${esc(f.plain)}</div>`;
    h += '</div></div>';
  }
  if (b.backtest && b.backtest.length) {
    h += '<div class="res-card"><div class="cap" style="color:var(--gold);font-size:12.5px;font-weight:600;margin-bottom:8px">🔍 往前验（已发生的事，帮AI校准）</div>';
    b.backtest.forEach((bt, i) => {
      h += `<div style="font-size:12.5px;margin-bottom:8px"><b>${esc(bt.period)}</b>　${esc(bt.plain)}<div class="vfy"><button data-i="${i}" data-v="1">✓ 符合</button><button data-i="${i}" data-v="0">✗ 不符合</button></div></div>`;
    });
    h += '</div>';
  }
  if (b.tips && b.tips.length) h += `<div class="res-card tips">${b.tips.map(t => '💡 ' + esc(t)).join('<br>')}</div>`;
  $('resultArea').innerHTML = h;
  // 验证反馈存 localStorage
  document.querySelectorAll('.vfy button').forEach(btn => btn.onclick = () => {
    const store = JSON.parse(localStorage.getItem('mlbj_baihua_verify') || '[]');
    store.push({ tool: state.tool.id, period: b.backtest[+btn.dataset.i].period, fit: btn.dataset.v === '1', at: Date.now() });
    localStorage.setItem('mlbj_baihua_verify', JSON.stringify(store.slice(-100)));
    btn.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('done'));
    btn.classList.add('done');
  });
}
</script>
