<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的年度推送 · 命理保健</title>
<link rel="stylesheet" href="css/style.css">

  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/yuanzhu-inbox-inline.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<div class="topbar">
  <div class="brand">📮 我的年度推送</div>
  <div class="nav" id="navBar">
    <a href="divination-hub.html">排盘</a>
    <a href="yuanzhu-inbox.html" class="active">收件箱</a>
    <a href="index.html">首页</a>
  </div>
  <div class="user-tag" id="userTag">未登录</div>
</div>

<div class="container">
  <div class="header-row">
    <h2>年度运势推送</h2>
    <span class="hint">按年度自动归档 · 已读自动标记</span>
  </div>

  <div class="stats-bar">
    <div class="stat"><div class="num" id="statTotal">-</div><div class="label">总推送</div></div>
    <div class="stat"><div class="num" id="statYears">-</div><div class="label">覆盖年度</div></div>
    <div class="stat"><div class="num" id="statUnread">-</div><div class="label">未读</div></div>
  </div>

  <div class="filter-row">
    <span class="pill active" data-filter="all">全部</span>
    <span class="pill" data-filter="unread">未读</span>
    <span class="pill" data-filter="year">本年度</span>
  </div>

  <div id="content">
    <div class="loading">加载中...</div>
  </div>
</div>

<script src="js/ui-toast.js" defer></script>

  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/yuanzhu-inbox-inline.js" defer></script>
</body>
</html>
