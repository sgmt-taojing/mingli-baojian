<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="robots" content="noindex"><link rel="icon" type="image/svg+xml" href="favicon.svg"><title>清理缓存 | 命理宝鉴</title><link rel="stylesheet" href="css/theme-systems.css">
</head>
<body style="background:#0e0e12;color:#c9a84c;font-family:serif;padding:40px;text-align:center" class="theme-ai">
<h2>🔄 正在清理缓存...</h2>
<p id="status">请稍候</p>
<script>
// 清理所有缓存
if('caches' in window) {
  caches.keys().then(function(names){ names.forEach(function(n){ caches.delete(n); }); });
}
// 清理 localStorage 中可能的缓存标记
var keys = Object.keys(localStorage);
keys.forEach(function(k){ if(k.includes('cache')||k.includes('version')) localStorage.removeItem(k); });
// 清理 sessionStorage
sessionStorage.clear();

document.getElementById('status').innerHTML = '✅ 缓存已清理！3秒后跳转首页...';
setTimeout(function(){ location.href = 'divination-hub.html'; }, 3000);
</script>
</body></html>
