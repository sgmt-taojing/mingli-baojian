<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>命理馆长 · 命理宝鉴</title>
<style>
  :root {
    --bg: #0a0a12; --bg2: #15151f; --gold: #c9a84c; --gold2: #e8cc7a;
    --teal: #4ec9b0; --text: #e8e0d0; --dim: #8b7e6a; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", serif;
    display: flex; flex-direction: column; max-width: 720px; margin: 0 auto; height: 100dvh;
  }
  /* ── 顶栏 ── */
  header {
    padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid #c9a84c33; background: linear-gradient(180deg, #15151f, #0a0a12);
    flex-shrink: 0;
  }
  .seal {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    background: linear-gradient(135deg, #c9a84c, #8a6d2b); display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: #1a1408; font-weight: 700; box-shadow: 0 2px 10px #c9a84c44;
  }
  header h1 { font-size: 17px; color: var(--gold2); letter-spacing: 2px; }
  header .sub { font-size: 11px; color: var(--dim); margin-top: 2px; }
  header .status { margin-left: auto; font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--teal); box-shadow: 0 0 6px var(--teal); }
  /* ── 消息区 ── */
  #chat { flex: 1; overflow-y: auto; padding: 16px 14px 8px; scroll-behavior: smooth; }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; animation: rise .25s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 4px; }
  .msg.user { align-items: flex-end; }
  .bubble {
    max-width: 88%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.75;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.bot .bubble { background: var(--bg2); border: 1px solid #c9a84c22; border-top-left-radius: 4px; }
  .msg.user .bubble { background: linear-gradient(135deg, #3a2f14, #2a2210); border: 1px solid #c9a84c44; border-top-right-radius: 4px; color: var(--gold2); }
  .bubble .rpt-link {
    display: inline-block; margin-top: 8px; padding: 6px 12px; border-radius: 8px; font-size: 12.5px;
    background: #c9a84c1a; border: 1px solid #c9a84c55; color: var(--gold2); cursor: pointer;
  }
  .bubble .rpt-detail { margin-top: 8px; font-size: 13px; color: #cfc6b4; border-top: 1px dashed #c9a84c33; padding-top: 8px; display: none; }
  .bubble .rpt-detail.show { display: block; }
  .bubble .src { font-size: 11.5px; color: var(--dim); margin-top: 6px; }
  .speak { background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; padding: 2px 6px; }
  .speak:hover { color: var(--teal); }
  /* ── 打字指示 ── */
  .typing .bubble { display: inline-flex; gap: 5px; padding: 14px 16px; }
  .typing .bubble i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: blink 1.2s infinite; }
  .typing .bubble i:nth-child(2) { animation-delay: .2s; } .typing .bubble i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }
  /* ── 快捷词 ── */
  #chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 14px; flex-shrink: 0; scrollbar-width: none; }
  #chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; padding: 7px 13px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
    background: var(--bg2); border: 1px solid #c9a84c33; color: var(--gold2);
  }
  .chip:active { background: #c9a84c33; }
  /* ── 输入栏 ── */
  #inputbar {
    display: flex; gap: 8px; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid #c9a84c22; background: var(--bg2); flex-shrink: 0;
  }
  #ta {
    flex: 1; resize: none; border: 1px solid #c9a84c33; background: var(--bg); color: var(--text);
    border-radius: 12px; padding: 10px 12px; font-size: 14.5px; line-height: 1.5; max-height: 110px; outline: none;
    font-family: inherit;
  }
  #ta:focus { border-color: var(--gold); }
  .ibtn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid #c9a84c44; background: var(--bg);
    color: var(--gold2); font-size: 18px; cursor: pointer; flex-shrink: 0; align-self: flex-end;
  }
  .ibtn.send { background: linear-gradient(135deg, #c9a84c, #8a6d2b); color: #1a1408; font-weight: 700; border: none; }
  .ibtn.rec { border-color: var(--teal); color: var(--teal); }
  /* ── 年龄声明门 ── */
  #gate {
    position: fixed; inset: 0; background: #0a0a12f2; z-index: 50; display: flex;
    align-items: center; justify-content: center; padding: 24px;
  }
  #gate .card {
    background: var(--bg2); border: 1px solid #c9a84c44; border-radius: 16px; padding: 28px 24px;
    max-width: 400px; width: 100%; text-align: center;
  }
  #gate h2 { color: var(--gold2); font-size: 19px; letter-spacing: 3px; margin-bottom: 6px; }
  #gate .rule { font-size: 13px; color: var(--dim); line-height: 1.9; margin: 14px 0 20px; text-align: left; }
  #gate .go {
    width: 100%; padding: 13px; border-radius: 12px; border: none; font-size: 15.5px; font-weight: 700;
    background: linear-gradient(135deg, #c9a84c, #8a6d2b); color: #1a1408; cursor: pointer;
  }
  #gate .no { margin-top: 12px; background: none; border: none; color: var(--dim); font-size: 13px; cursor: pointer; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #1a1408ee; border: 1px solid #c9a84c66; color: var(--gold2); padding: 9px 16px;
    border-radius: 999px; font-size: 13px; display: none; z-index: 60;
  }
  @media (min-width: 721px) { body { border-left: 1px solid #c9a84c22; border-right: 1px solid #c9a84c22; } }
</style>
</head>
<body>

<div id="gate">
  <div class="card">
    <h2>命理馆长</h2>
    <div style="font-size:12px;color:var(--teal);letter-spacing:1px">中华术数智慧超级智能体</div>
    <div class="rule">
      馆长通读入库典籍，可为您排盘（八字/紫微/六爻/六壬/奇门/梅花）、看风水、评姓名、择吉日、查黄历、解答古籍学问。<br><br>
      · 内容仅供传统文化研究参考，不宿命、不恐吓<br>
      · 诊疗诉求请走问诊台，馆长不作诊疗答复<br>
      · 信众服务须年满 18 周岁
    </div>
    <button class="go" id="gateGo">我已年满 18 周岁，请教馆长</button>
    <button class="no" id="gateNo">未满 18 周岁</button>
  </div>
</div>

<header>
  <div class="seal">馆</div>
  <div>
    <h1>命理馆长</h1>
    <div class="sub">读尽典籍 · 有问必答 · 白话直给</div>
  </div>
  <div class="status"><span class="dot" id="netDot"></span><span id="netTxt">连接中</span></div>
</header>

<div id="chat"></div>

<div id="chips">
  <div class="chip">帮我排个八字</div>
  <div class="chip">紫微斗数排盘</div>
  <div class="chip">六爻占一卦</div>
  <div class="chip">姓名评测</div>
  <div class="chip">挑个黄道吉日</div>
  <div class="chip">今日黄历</div>
  <div class="chip">犯太岁怎么化解</div>
  <div class="chip">教我命理入门</div>
</div>

<div id="inputbar">
  <button class="ibtn" id="micBtn" title="语音输入">🎙</button>
  <textarea id="ta" rows="1" placeholder="问馆长：生辰、问事、择日、古籍……"></textarea>
  <button class="ibtn send" id="sendBtn">➤</button>
</div>

<div id="toast"></div>

<script>
const API = 'http://127.0.0.1:8980';
const chat = document.getElementById('chat');
const ta = document.getElementById('ta');
let sessionId = null;

function toast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.style.display = 'block';
  clearTimeout(el._t); el._t = setTimeout(() => el.style.display = 'none', 2600);
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(role, text, extra) {
  const m = document.createElement('div');
  m.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  let html = `<div class="who">${role === 'user' ? '我' : '馆长'}</div><div class="bubble">${esc(text)}`;
  if (extra && extra.report_id)
    html += `<span class="rpt-link" data-rid="${extra.report_id}">📜 查看完整报告（专业段+出处）</span><div class="rpt-detail" id="d_${extra.report_id}"></div>`;
  html += `<div style="text-align:right">${role !== 'user' ? '<button class="speak" title="朗读">🔊</button>' : ''}</div></div>`;
  m.innerHTML = html;
  chat.appendChild(m);
  chat.scrollTop = chat.scrollHeight;
  const sp = m.querySelector('.speak');
  if (sp) sp.onclick = () => {
    const u = new SpeechSynthesisUtterance(text.slice(0, 300)); u.lang = 'zh-CN'; u.rate = 1.05;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  };
  const link = m.querySelector('.rpt-link');
  if (link) link.onclick = () => loadReport(link.dataset.rid, link);
  return m;
}

async function loadReport(rid, linkEl) {
  const box = document.getElementById('d_' + rid);
  if (box.classList.contains('show')) { box.classList.remove('show'); return; }
  linkEl.textContent = '⏳ 展开中…';
  try {
    const r = await (await fetch(`${API}/api/curator/report/${rid}`)).json();
    if (!r.ok) throw new Error(r.error || '取报告失败');
    const rp = r.report;
    let html = '';
    if (rp.professional) html += `<div style="margin-bottom:6px">${esc(rp.professional).slice(0, 1500)}</div>`;
    if (rp.sources && rp.sources.length)
      html += `<div class="src">出处：${rp.sources.map(s => esc(s.book || '')).filter(Boolean).join('、')}</div>`;
    html += `<div class="src">${esc(rp.disclaimer || '')}</div>`;
    box.innerHTML = html; box.classList.add('show');
    linkEl.textContent = '📜 收起报告';
  } catch (e) { linkEl.textContent = '📜 查看完整报告'; toast(e.message); }
}

function addTyping() {
  const m = document.createElement('div');
  m.className = 'msg bot typing';
  m.innerHTML = '<div class="who">馆长</div><div class="bubble"><i></i><i></i><i></i></div>';
  chat.appendChild(m); chat.scrollTop = chat.scrollHeight;
  return m;
}

async function send(text) {
  text = (text || '').trim();
  if (!text || !sessionId) return;
  addMsg('user', text);
  ta.value = ''; ta.style.height = 'auto';
  const tp = addTyping();
  try {
    const r = await (await fetch(`${API}/api/curator/message`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, text })
    })).json();
    tp.remove();
    addMsg('bot', r.reply || r.error || '（馆长未作答）', { report_id: r.report_id });
  } catch (e) {
    tp.remove();
    addMsg('bot', '网络异常，馆长暂时应答不了。请稍后再试。');
  }
}

document.getElementById('sendBtn').onclick = () => send(ta.value);
ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(ta.value); } });
ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 110) + 'px'; });
document.querySelectorAll('.chip').forEach(c => c.onclick = () => send(c.textContent));

// 语音输入：浏览器本地语音识别（可用即用，不可用隐藏）
(function () {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('micBtn');
  if (!SR) { btn.style.display = 'none'; return; }
  const rec = new SR(); rec.lang = 'zh-CN'; rec.interimResults = false;
  let on = false;
  btn.onclick = () => {
    if (on) { rec.stop(); return; }
    try { rec.start(); on = true; btn.classList.add('rec'); btn.textContent = '⏺'; } catch (e) { toast('语音识别启动失败'); }
  };
  rec.onresult = e => { ta.value += e.results[0][0].transcript; };
  rec.onend = () => { on = false; btn.classList.remove('rec'); btn.textContent = '🎙'; };
  rec.onerror = () => { on = false; btn.classList.remove('rec'); btn.textContent = '🎙'; toast('语音识别不可用，请手动输入'); };
})();

// 年龄声明门 → 开会话
document.getElementById('gateNo').onclick = () => toast('信众服务须年满 18 周岁，欢迎成年后再来');
document.getElementById('gateGo').onclick = async () => {
  const btn = document.getElementById('gateGo');
  btn.textContent = '迎请馆长中…'; btn.disabled = true;
  try {
    const r = await (await fetch(`${API}/api/curator/session`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ identity: 'xinzong', age_declared: 18 })
    })).json();
    if (!r.ok) throw new Error(r.error || '开会话失败');
    sessionId = r.session_id;
    document.getElementById('gate').style.display = 'none';
    document.getElementById('netDot').classList.add('on');
    document.getElementById('netTxt').textContent = '在线';
    addMsg('bot', '缘主好，我是命理馆长。\n\n排盘看命、占卦问事、择吉选日、姓名评测、古籍学问——您开口就是。下方快捷词可直接点。');
  } catch (e) {
    btn.textContent = '重试'; btn.disabled = false;
    toast('连接馆长失败：' + e.message);
  }
};
</script>
<script src="js/icon-swap.js?v=20261020a" defer data-ml-icon-swap="1"></script>
</body>
</html>
