<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>道藏本宫星断语 · 命理宝鉴</title>
<style>
:root{--bg:#0b0f1a;--card:#141928;--border:#2a3450;--paper:#e8dcc8;--paper3:#8b93a7;--gold:#c9a84c;--jade:#4ec9b0;--red:#e07a7a;--teal:#7dd3c0}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:"Songti SC","STSong",serif;min-height:100vh}
.wrap{max-width:1000px;margin:0 auto;padding:20px 14px 60px}
h1{color:var(--gold);font-size:22px;text-align:center;letter-spacing:4px}
.sub{color:var(--paper3);font-size:12px;text-align:center;margin:6px 0 16px;line-height:1.7}
.sysbar{background:rgba(224,122,122,.08);border:1px solid rgba(224,122,122,.3);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--paper3);margin-bottom:16px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px;margin-bottom:18px}
.pcell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 6px;text-align:center;cursor:pointer;transition:border-color .15s}
.pcell:hover{border-color:var(--gold)}
.pcell.on{border-color:var(--gold);background:rgba(201,168,76,.1)}
.pcell .nm{color:var(--paper);font-size:14px;font-weight:600}
.pcell .ct{color:var(--paper3);font-size:10px;margin-top:3px}
.pcell.red .nm{color:var(--red)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-bottom:14px;min-height:80px}
.panel h3{color:var(--gold);font-size:16px;margin-bottom:8px}
.panel h3 .badge{font-size:10px;border:1px solid var(--red);color:var(--red);border-radius:8px;padding:1px 8px;margin-left:8px;font-weight:400}
.narr{font-size:13px;line-height:1.9;color:var(--paper);margin-bottom:8px}
.song{background:rgba(0,0,0,.25);border-left:3px solid var(--gold);border-radius:0 6px 6px 0;padding:8px 12px;margin:8px 0;font-size:13px;line-height:1.9;color:var(--gold)}
.stars{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.schip{border:1px solid var(--border);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--paper3);cursor:pointer;background:transparent;font-family:inherit}
.schip:hover{border-color:var(--teal);color:var(--teal)}
.schip.on{border-color:var(--teal);color:var(--teal);background:rgba(125,211,192,.08)}
.schip b{color:var(--paper);font-weight:600}
.vtable{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px}
.vtable td{border-top:1px solid var(--border);padding:7px 8px;line-height:1.7;vertical-align:top}
.vtable td:first-child{color:var(--teal);white-space:nowrap;font-weight:600;width:80px}
.verse{background:rgba(0,0,0,.25);border-radius:6px;padding:8px 12px;margin:6px 0;font-size:13px;line-height:1.9;color:var(--paper)}
.verse::before{content:'「';color:var(--gold)}.verse::after{content:'」';color:var(--gold)}
.mred{color:var(--red);font-size:11px;margin-top:8px}
.foot{color:var(--paper3);font-size:11px;text-align:center;margin-top:24px;line-height:1.8}
.starchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <h1>道藏本 · 宫星断语速查</h1>
  <div class="sub">《正统道藏本紫微斗数》卷一 · 十八飞星体系 · 十二宫制（独有相貌宫）· 命理师研究端</div>
  <div class="sysbar" id="sysbar">体系加载中…</div>
  <div class="grid" id="pgrid"></div>
  <div class="panel" id="pdetail"><h3>点选宫位查看断语</h3><div class="narr" style="color:var(--paper3)">十二宫制含道藏本独有「相貌宫」——命相同参的宫位化孤本。</div></div>
  <h3 style="color:var(--teal);font-size:14px;margin:18px 0 8px">十八飞星 · 逐星总断</h3>
  <div class="starchips" id="schips"></div>
  <div class="panel" id="sdetail" style="display:none"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let DATA=null, curPalace='';
async function api(q){return fetch(API_BASE+'/api/daozang/duan'+q,{headers:{'X-Skip-Interceptor':'1'}}).then(r=>r.json());}
async function boot(){
  const d=await api('');
  if(!d.ok){document.getElementById('sysbar').textContent='加载失败：'+d.error;return;}
  DATA=d;
  document.getElementById('sysbar').innerHTML='⚠ 体系警示：'+esc(d.system)+'<br>纪律：'+esc(d.discipline);
  document.getElementById('foot').innerHTML=esc(d.source)+'<br>结构化：十二宫×151 条宫星断语 + 17 星逐星总断 + 16 星洞微断（KB-ZW-056/057/058 活化）';
  document.getElementById('pgrid').innerHTML=d.palaces.map(p=>
    '<div class="pcell'+(p.redline_medical?' red':'')+'" data-p="'+esc(p.name)+'" onclick="showPalace(\''+esc(p.name)+'\')">'+
    '<div class="nm">'+esc(p.name)+'</div><div class="ct">'+p.starCount+' 条星断'+(p.redline_medical?' · 涉医':'')+'</div></div>').join('');
  document.getElementById('schips').innerHTML=d.stars.map(s=>
    '<button class="schip" onclick="showStar(\''+esc(s.star)+'\')"><b>'+esc(s.star)+'</b> '+(s.wuxing||'')+(s.yinyang||'')+'</button>').join('');
}
async function showPalace(name){
  curPalace=name;
  document.querySelectorAll('.pcell').forEach(c=>c.classList.toggle('on',c.dataset.p===name));
  const d=await api('?palace='+encodeURIComponent(name));
  if(!d.ok)return;
  const p=d.palace;
  const starsRows=Object.entries(p.stars).map(([s,v])=>'<tr><td>'+esc(s)+'</td><td>'+esc(v)+'</td></tr>').join('');
  document.getElementById('pdetail').innerHTML=
    '<h3>'+esc(p.order)+' · '+esc(p.name)+(p.redline_medical?'<span class="badge">涉健康 · 挂医师</span>':'')+'</h3>'+
    '<div class="narr">'+esc(p.narrative)+'</div>'+
    p.songs.map(s=>'<div class="song">'+esc(s)+'</div>').join('')+
    (starsRows?'<table class="vtable">'+starsRows+'</table>':'<div style="color:var(--paper3);font-size:12px">此宫断语为散文体，见上总纲。</div>')+
    (d.medical_notice?'<div class="mred">⚕ '+esc(d.medical_notice)+'</div>':'');
}
async function showStar(name){
  const d=await api('?star='+encodeURIComponent(name));
  if(!d.ok)return;
  const s=d.star;
  document.querySelectorAll('.schip').forEach(c=>c.classList.toggle('on',c.innerText.trim().startsWith(name)));
  const panel=document.getElementById('sdetail');panel.style.display='block';
  const dw = s.dongwei;
  const dwHtml = dw ? '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:8px">'+
    '<div style="color:var(--gold);font-size:12px;margin-bottom:4px">洞微十八星断（卷二/卷三）</div>'+
    (dw.alias?'<div style="font-size:12px;color:var(--paper3);margin-bottom:4px">异名：'+esc(dw.alias)+'</div>':'')+
    (dw.miao_wang_le?'<div style="font-size:12px;color:var(--paper3);margin-bottom:4px">'+esc(dw.miao_wang_le)+'</div>':'')+
    (dw.shenming?'<div style="font-size:12px;color:var(--paper);margin-bottom:4px">'+esc(dw.shenming)+'</div>':'')+
    (dw.verses||[]).map(v=>'<div class="verse">'+esc(v)+'</div>').join('')+'</div>' : '';
  panel.innerHTML='<h3 style="color:var(--teal)">'+esc(s.star)+(s.alias?' <span style="font-size:11px;color:var(--paper3)">即'+esc(s.alias)+'</span>':'')+
    '<span style="font-size:11px;color:var(--paper3);margin-left:10px">'+(s.wuxing?'属'+esc(s.wuxing)+' ':'')+(s.yinyang?esc(s.yinyang)+'象 ':'')+(s.miao?'庙（'+esc(s.miao)+'）':'')+'</span></h3>'+
    (s.verses||[]).map(v=>'<div class="verse">'+esc(v)+'</div>').join('')+
    dwHtml+
    ((s.inPalaces&&s.inPalaces.length)?'<table class="vtable">'+s.inPalaces.map(x=>'<tr><td>'+esc(x.palace)+'</td><td>'+esc(x.verdict)+'</td></tr>').join('')+'</table>':'');
  panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
boot();
</script>
</body>
</html>
