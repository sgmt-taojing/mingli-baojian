<div class="toast-container" id="toastContainer"></div>

<div class="login-container">
  <!-- 顶部 -->
  <div class="login-header">
    <div class="login-icon">
      <svg viewBox="0 0 24 24">
        <path d="M12 2 L14.5 9 L22 9.5 L16 14.5 L18 22 L12 17.5 L6 22 L8 14.5 L2 9.5 L9.5 9 Z"/>
      </svg>
    </div>
    <div class="login-title">易道智鉴</div>
    <div class="login-subtitle">命理宝鉴 · 会员登录</div>
  </div>

  <!-- 表单 -->
  <form id="loginForm" onsubmit="return false;">
    <!-- 手机号 -->
    <div class="form-group">
      <label class="form-label" for="phoneInput">
        <svg viewBox="0 0 24 24">
          <rect x="7" y="2" width="10" height="20" rx="2"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
        <span>手机号</span>
      </label>
      <div class="input-wrapper">
        <input type="tel" id="phoneInput" class="form-input" placeholder="请输入手机号" maxlength="11" autocomplete="tel"/>
      </div>
    </div>

    <!-- 验证码 -->
    <div class="form-group">
      <label class="form-label" for="codeInput">
        <svg viewBox="0 0 24 24">
          <path d="M4 8 L4 6 Q4 4 6 4 L18 4 Q20 4 20 6 L20 8"/>
          <rect x="4" y="8" width="16" height="12" rx="2"/>
          <line x1="12" y1="12" x2="12" y2="16"/>
        </svg>
        <span>验证码</span>
      </label>
      <div class="code-wrapper">
        <input type="text" id="codeInput" class="form-input" placeholder="请输入验证码" maxlength="6" autocomplete="one-time-code"/>
        <button type="button" class="code-btn" id="codeBtn" onclick="sendCode()">
          <svg viewBox="0 0 24 24">
            <path d="M22 2 L11 13"/>
            <path d="M22 2 L15 22 L11 13 L2 9 Z"/>
          </svg>
          <span id="codeBtnText">发送验证码</span>
        </button>
      </div>
    </div>

    <!-- 登录按钮 -->
    <button type="submit" class="login-btn" id="loginBtn" onclick="doLogin()">
      <span id="loginBtnText">登 录</span>
    </button>
  </form>

  <!-- 分割线 -->
  <div class="divider">
    <div class="divider-line"></div>
    <span class="divider-text">其他方式</span>
    <div class="divider-line"></div>
  </div>

  <!-- 快速登录（模拟） -->
  <div class="quick-login">
    <button class="quick-login-btn" onclick="quickLogin('guest')">访客体验</button>
    <button class="quick-login-btn" onclick="quickLogin('free')">普通用户</button>
    <button class="quick-login-btn" onclick="quickLogin('vip')">VIP会员</button>
  </div>

  <!-- 底部 -->
  <div class="login-footer">
    登录即同意<ml-tap role="button" tabindex="0" onclick="showDisclaimer()">《用户协议》</ml-tap><br/>
    <span style="opacity:.85">易道智鉴 &copy; 2026 · 仅供文化交流</span>
  </div>
</div>
