<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080808">
<title>移动采集 · 命理宝鉴</title>
<link rel="stylesheet" href="css/a11y-fix.css">
<style>
:root{
  --ink:#080808; --ink2:#0f0f0f; --ink3:#1a1a1a;
  --gold:#c9a84c; --gold2:#e0c068;
  --paper:#f0e8d8; --paper2:#c8b89c; --paper3:#a09080;
  --danger:#c8503e; --ok:#3e9e6b;
  --radius:10px;
  --safe-top:env(safe-area-inset-top,0);
  --safe-bottom:env(safe-area-inset-bottom,0);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Noto Serif SC','Source Han Serif SC',serif;background:var(--ink);color:var(--paper);overflow-x:hidden}
.wrap{max-width:780px;margin:0 auto;padding:calc(12px + var(--safe-top)) 14px calc(96px + var(--safe-bottom))}
header{padding:12px 0 16px;border-bottom:1px solid rgba(201,168,76,.18);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
h1{font-family:'Ma Shan Zheng',serif;font-size:22px;color:var(--gold);letter-spacing:4px}
.subtitle{font-size:11px;color:var(--paper3);margin-top:4px;letter-spacing:1px}
.header-meta{font-size:10px;color:var(--paper3);text-align:right;line-height:1.4}
.header-meta b{color:var(--gold);font-weight:600}

.stage{
  background:#000;border-radius:var(--radius);
  border:1px solid rgba(201,168,76,.25);
  position:relative;aspect-ratio:3/4;overflow:hidden;
}
.stage video,.stage canvas,.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage .placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;color:var(--paper3);
  background:radial-gradient(ellipse at center,#1a1a1a,#000);padding:20px;text-align:center;
}
.stage .placeholder .icon{font-size:42px;margin-bottom:10px;opacity:.5}
.stage .placeholder .hint{font-size:12px;letter-spacing:2px;line-height:1.6}
.stage .live-tag{
  position:absolute;top:10px;left:10px;background:rgba(200,80,62,.92);
  color:#fff;font-size:10px;letter-spacing:2px;padding:4px 10px;border-radius:4px;
  display:none;align-items:center;gap:6px;z-index:10;
}
.stage .live-tag.on{display:flex}
.stage .live-tag::before{content:'';width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.stage .device-tag{
  position:absolute;top:10px;right:10px;background:rgba(0,0,0,.72);
  color:var(--gold);font-size:10px;padding:4px 8px;border-radius:4px;z-index:10;letter-spacing:1px;
}
.stage .grid-overlay{
  position:absolute;inset:0;pointer-events:none;z-index:5;
  background-image:
    linear-gradient(rgba(201,168,76,.18) 1px,transparent 1px),
    linear-gradient(90deg,rgba(201,168,76,.18) 1px,transparent 1px);
  background-size:33.33% 33.33%;
}

.toolbar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;
}
.btn{
  padding:12px 8px;background:var(--gold);color:var(--ink);border:none;border-radius:6px;
  cursor:pointer;font-size:12px;font-weight:600;letter-spacing:1px;font-family:inherit;
  transition:transform .1s, background .2s;
}
.btn:active{transform:scale(.97)}
.btn:disabled{background:#444;color:#888;cursor:not-allowed}
.btn-ghost{background:var(--ink3);color:var(--paper);border:1px solid rgba(201,168,76,.4)}
.btn-ghost:active{background:rgba(201,168,76,.18)}
.btn-danger{background:var(--danger);color:#fff}

.shutter{
  display:flex;justify-content:center;margin-top:18px;
}
.shutter button{
  width:74px;height:74px;border-radius:50%;border:4px solid var(--gold);
  background:rgba(201,168,76,.12);cursor:pointer;display:flex;
  align-items:center;justify-content:center;color:var(--gold);font-size:12px;
  letter-spacing:2px;font-family:inherit;
}
.shutter button:active{background:rgba(201,168,76,.35)}
.shutter button:disabled{opacity:.4;cursor:not-allowed}

.options{
  margin-top:18px;background:var(--ink3);border:1px solid rgba(201,168,76,.18);
  border-radius:var(--radius);padding:14px;
}
.options h3{font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:10px}
.opt-row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.opt-row label{font-size:11px;color:var(--paper2);letter-spacing:1px;min-width:64px}
select,input[type=text]{
  flex:1;min-width:0;padding:8px 10px;background:var(--ink);color:var(--paper);
  border:1px solid rgba(201,168,76,.3);border-radius:5px;font-family:inherit;font-size:12px;
}

.status-line{
  font-size:11px;color:var(--paper3);padding:10px 12px;background:var(--ink2);
  border-radius:6px;margin-top:12px;min-height:34px;display:flex;
  align-items:center;letter-spacing:1px;line-height:1.5;
}
.status-line.ok{color:var(--ok);background:rgba(62,158,107,.08)}
.status-line.err{color:var(--danger);background:rgba(200,80,62,.08)}
.status-line.warn{color:var(--gold2);background:rgba(201,168,76,.08)}

.analysis-panel{margin-top:14px;background:var(--ink3);border:1px solid rgba(201,168,76,.18);border-radius:var(--radius);padding:14px}
.analysis-panel h2{font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
.analysis-content{font-size:12px;line-height:1.7;color:var(--paper);white-space:pre-wrap;word-break:break-word;max-height:300px;overflow-y:auto}
.analysis-empty{color:var(--paper3);font-size:12px;padding:20px;text-align:center}

.gallery{margin-top:14px}
.gallery h2{font-size:13px;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.thumb{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;border:1px solid rgba(201,168,76,.15);background:#000}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .meta{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.92));padding:6px 4px 2px;font-size:8px;color:var(--gold);display:flex;justify-content:space-between}
.thumb.pending{opacity:.5}

.webrtc-panel{margin-top:14px;background:var(--ink3);border:1px solid rgba(201,168,76,.18);border-radius:var(--radius);padding:14px;display:none}
.webrtc-panel.on{display:block}
.webrtc-panel h3{font-size:12px;color:var(--gold);letter-spacing:2px;margin-bottom:8px}
.webrtc-panel p{font-size:11px;color:var(--paper2);line-height:1.6}

.queue-info{font-size:10px;color:var(--paper3);margin-top:8px;text-align:right}

@media (min-width:600px){
  .wrap{padding:calc(20px + var(--safe-top)) 18px calc(40px + var(--safe-bottom))}
  h1{font-size:26px}
  .toolbar{grid-template-columns:repeat(5,1fr)}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>移动采集</h1>
      <div class="subtitle">手机/手持 · 面相 · 草药 · 旅途中</div>
      <div style="margin-top:6px"><a href="divination-hub.html" style="font-size:11px;color:var(--gold);text-decoration:none;letter-spacing:1px">← 返回主平台</a></div>
    </div>
    <div class="header-meta">
      <div><b id="netState">—</b> · <span id="deviceState">—</span></div>
      <div id="geoState">—</div>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="placeholder" id="placeholder">
      <div class="icon">📷</div>
      <div class="hint">点击下方「启动摄像头」开始<br>推荐授权 <b>后置摄像头</b></div>
    </div>
    <video id="video" playsinline muted autoplay style="display:none"></video>
    <canvas id="canvas" style="display:none"></canvas>
    <div class="live-tag" id="liveTag">LIVE</div>
    <div class="device-tag" id="deviceTag">—</div>
    <div class="grid-overlay" id="gridOverlay" style="display:none"></div>
  </div>

  <div class="toolbar">
    <button class="btn btn-ghost" id="btnStart">启动</button>
    <button class="btn btn-ghost" id="btnFlip" disabled>翻转</button>
    <button class="btn btn-ghost" id="btnTorch" disabled>闪光</button>
    <button class="btn btn-ghost" id="btnGrid">网格</button>
    <button class="btn btn-ghost" id="btnWebrtc" disabled>推流</button>
  </div>

  <div class="shutter">
    <button id="btnSnap" disabled>拍 摄</button>
  </div>

  <div class="options">
    <h3>采集参数</h3>
    <div class="opt-row">
      <label>场景</label>
      <select id="selModule">
        <option value="face">面相/远程问诊</option>
        <option value="tcm">草药辨识</option>
        <option value="bazi">实物记录</option>
        <option value="live">直播跟拍</option>
      </select>
    </div>
    <div class="opt-row">
      <label>画质</label>
      <select id="selQuality">
        <option value="hd">720p · 省流</option>
        <option value="fhd" selected>1080p · 均衡</option>
        <option value="uhd">4K · 高清（设备允许时）</option>
      </select>
    </div>
    <div class="opt-row">
      <label>用户</label>
      <input type="text" id="userId" placeholder="可选 · 用户ID / 命主编号">
    </div>
    <div class="opt-row">
      <label>备注</label>
      <input type="text" id="note" placeholder="可选 · 采集备注（地点 / 心情 / 症状）">
    </div>
  </div>

  <div class="status-line" id="status">未启动</div>
  <div class="queue-info" id="queueInfo"></div>

  <div class="analysis-panel" id="analysisPanel">
    <h2>AI 分析</h2>
    <div class="analysis-empty" id="analysisEmpty">拍摄后此处显示 AI 判读结果</div>
    <div class="analysis-content" id="analysisContent" style="display:none"></div>
  </div>

  <div class="webrtc-panel" id="webrtcPanel">
    <h3>WebRTC 推流</h3>
    <p>已与后端建立 <code>RTCPeerConnection</code>（仅视频 · sendonly）。<br>
       推流端点：<code id="webrtcEndpoint">/api/webrtc/offer</code>（待后端实现）</p>
  </div>

  <div class="gallery">
    <h2>本次采集（<span id="galleryCount">0</span>）</h2>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<script>
/* ==============================================================
 *  移动采集 · mobile-first 原型（handheld-camera audit）
 *  关键：
 *   - getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
 *   - iOS Safari: playsinline + autoplay + muted
 *   - 离线 IndexedDB 队列 → 网络恢复批量重试
 *   - WebRTC 推流入口（peerConnection.sendonly）
 * ============================================================= */
(function(){
'use strict';

const $ = id => document.getElementById(id);
const ua = navigator.userAgent || '';
const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isAndroid = /Android/.test(ua);
const deviceLabel = isIOS ? 'iOS' : isAndroid ? 'Android' : 'Desktop';

let stream = null;
let pc = null;
let facing = 'environment';
let videoTrack = null;
let torchSupported = false;
let torchOn = false;
let gridOn = false;
let webrtcOn = false;
let queue = [];
let gallery = [];

// ---------- 状态行 ----------
function setStatus(msg, kind){
  const el = $('status');
  el.textContent = msg;
  el.className = 'status-line' + (kind ? ' ' + kind : '');
}
function setQueueInfo(){
  $('queueInfo').textContent = queue.length
    ? `离线队列：${queue.length} 张待上传（双击重试）`
    : '';
}
function detectNet(){
  const c = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if(c && c.effectiveType){
    $('netState').textContent = c.effectiveType.toUpperCase();
  } else {
    $('netState').textContent = 'ONLINE';
  }
}
detectNet();
navigator.connection && navigator.connection.addEventListener && navigator.connection.addEventListener('change', detectNet);

// ---------- 设备检测 ----------
function listDevices(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return Promise.resolve([]);
  return navigator.mediaDevices.enumerateDevices();
}

function inferFacingFromLabel(label){
  if(!label) return null;
  const l = label.toLowerCase();
  if(l.includes('back') || l.includes('rear') || l.includes('environment') || l.includes('后')) return 'environment';
  if(l.includes('front') || l.includes('user') || l.includes('前置') || l.includes('face')) return 'user';
  return null;
}

async function pickBestDeviceId(facingPref){
  const devices = await listDevices();
  const cams = devices.filter(d => d.kind === 'videoinput');
  if(!cams.length) return null;
  // 优先匹配 label
  for(const c of cams){
    if(inferFacingFromLabel(c.label) === facingPref) return c.deviceId;
  }
  // iOS Safari 不返回 label → 取最后一个（通常是后置）
  return cams.length > 1 ? cams[cams.length - 1].deviceId : cams[0].deviceId;
}

// ---------- 启动摄像头 ----------
async function startCamera(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    setStatus('当前浏览器不支持 mediaDevices（请用 Safari / Chrome 打开）', 'err');
    return;
  }
  setStatus('请求摄像头权限…');
  try {
    const q = $('selQuality').value;
    const idealWidth = q === 'uhd' ? 3840 : q === 'fhd' ? 1920 : 1280;
    const idealHeight = q === 'uhd' ? 2160 : q === 'fhd' ? 1080 : 720;

    const constraints = {
      audio: false,
      video: {
        // iOS Safari 必须 ideal，exact 会抛 OverconstrainedError
        facingMode: { ideal: facing },
        width:  { ideal: idealWidth,  min: 640 },
        height: { ideal: idealHeight, min: 480 },
        frameRate: { ideal: 30, max: 60 }
      }
    };

    // 先尝试 facingMode，再尝试 deviceId（更稳）
    try {
      stream = await navigator.mediaDevices.getUserMedia(constraints);
    } catch(e){
      const deviceId = await pickBestDeviceId(facing);
      stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: deviceId ? { deviceId: { exact: deviceId }, width: constraints.video.width, height: constraints.video.height }
                         : { facingMode: { ideal: facing }, width: constraints.video.width, height: constraints.video.height }
      });
    }

    videoTrack = stream.getVideoTracks()[0];
    if(videoTrack){
      const settings = videoTrack.getSettings ? videoTrack.getSettings() : {};
      const actualFacing = settings.facingMode || facing;
      $('deviceTag').textContent =
        `${deviceLabel} · ${settings.width||'?'}×${settings.height||'?'} · ${actualFacing === 'environment' ? '后置' : '前置'}`;
      // 检测 torch 支持
      torchSupported = !!(videoTrack.getCapabilities && videoTrack.getCapabilities().torch);
    }

    const v = $('video');
    v.srcObject = stream;
    v.setAttribute('playsinline','');
    v.muted = true;
    await v.play().catch(()=>{});

    $('video').style.display = 'block';
    $('placeholder').style.display = 'none';
    $('liveTag').classList.add('on');
    $('btnSnap').disabled = false;
    $('btnFlip').disabled = false;
    $('btnTorch').disabled = !torchSupported;
    $('btnWebrtc').disabled = false;
    setStatus('摄像头已就绪', 'ok');
  } catch(err){
    handleMediaError(err);
  }
}

function handleMediaError(err){
  const map = {
    NotAllowedError: '用户拒绝了摄像头权限。请到「设置 → Safari → 摄像头」中开启。',
    NotFoundError: '未检测到摄像头（手机 / 手持未连接？）',
    NotReadableError: '摄像头被其他应用占用，请关闭后重试。',
    OverconstrainedError: '请求的画质 / 方向不被支持，已自动降级。',
    SecurityError: 'HTTPS 上下文受限（请用 https:// 打开）'
  };
  setStatus((map[err.name] || ('摄像头错误: ' + err.message)), 'err');
}

function stopCamera(){
  if(stream){
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if(pc){
    try { pc.close(); } catch(e){}
    pc = null;
  }
  $('video').style.display = 'none';
  $('placeholder').style.display = 'flex';
  $('liveTag').classList.remove('on');
  $('btnSnap').disabled = true;
  $('btnFlip').disabled = true;
  $('btnTorch').disabled = true;
  $('btnWebrtc').disabled = true;
  setStatus('摄像头已关闭', '');
}

// ---------- 翻转 ----------
async function flipCamera(){
  if(!stream) return;
  stopCamera();
  facing = facing === 'environment' ? 'user' : 'environment';
  await startCamera();
}

// ---------- 闪光灯（手电筒） ----------
async function toggleTorch(){
  if(!videoTrack || !torchSupported) return;
  try {
    torchOn = !torchOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
    $('btnTorch').textContent = torchOn ? '关灯' : '闪光';
  } catch(e){
    setStatus('闪光灯不可用：' + e.message, 'warn');
  }
}

// ---------- 网格 ----------
function toggleGrid(){
  gridOn = !gridOn;
  $('gridOverlay').style.display = gridOn ? 'block' : 'none';
  $('btnGrid').textContent = gridOn ? '无网' : '网格';
}

// ---------- 拍照 + 上传 ----------
function snap(){
  if(!stream) return;
  const v = $('video');
  const c = $('canvas');
  const w = v.videoWidth || 1080;
  const h = v.videoHeight || 1920;
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  // 镜像（自拍）修正
  if(facing === 'user'){
    ctx.translate(w, 0);
    ctx.scale(-1, 1);
  }
  ctx.drawImage(v, 0, 0, w, h);

  // 转 blob
  c.toBlob(async (blob) => {
    if(!blob){
      setStatus('拍照失败：toBlob 返回空', 'err');
      return;
    }
    const item = {
      id: 'img-' + Date.now() + '-' + Math.random().toString(36).slice(2,8),
      ts: Date.now(),
      blob,
      url: URL.createObjectURL(blob),
      module: $('selModule').value,
      userId: $('userId').value.trim(),
      note: $('note').value.trim(),
      device: deviceLabel,
      quality: $('selQuality').value,
      facing,
      w, h,
      status: 'pending'
    };
    gallery.unshift(item);
    renderGallery();
    setStatus('拍照成功，准备上传…', 'ok');
    await uploadItem(item);
  }, 'image/jpeg', 0.9);
}

async function uploadItem(item){
  item.status = 'uploading';
  renderGallery();
  try {
    const fd = new FormData();
    fd.append('image', item.blob, item.id + '.jpg');
    fd.append('module', item.module);
    fd.append('userId', item.userId);
    fd.append('note', item.note);
    fd.append('device', item.device);
    fd.append('quality', item.quality);
    fd.append('facing', item.facing);
    fd.append('w', String(item.w));
    fd.append('h', String(item.h));
    fd.append('source', 'mobile-capture');

    const ctrl = new AbortController();
    const timeout = setTimeout(() => ctrl.abort(), 25000);
    const r = await fetch('/api/face/analyze', { method: 'POST', body: fd, signal: ctrl.signal });
    clearTimeout(timeout);
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    item.status = 'done';
    item.result = j;
    renderGallery();
    showAnalysis(j);
    setStatus('上传成功，AI 已分析', 'ok');
  } catch(err){
    item.status = 'queued';
    queue.push(item);
    setQueueInfo();
    setStatus('上传失败，已加入离线队列：' + (err.message || err.name || ''), 'warn');
    renderGallery();
  }
}

async function flushQueue(){
  if(!queue.length) return;
  if(!navigator.onLine) return;
  setStatus('离线队列重试中… ' + queue.length, 'warn');
  const copy = queue.slice();
  queue = [];
  for(const item of copy){
    try { await uploadItem(item); }
    catch(_){ queue.push(item); }
  }
  setQueueInfo();
}

function renderGallery(){
  const grid = $('galleryGrid');
  grid.innerHTML = '';
  gallery.slice(0, 24).forEach(item => {
    const div = document.createElement('div');
    div.className = 'thumb' + (item.status !== 'done' ? ' pending' : '');
    div.innerHTML = `
      <img src="${item.url}" alt="${item.id}">
      <div class="meta">
        <span>${item.module}</span>
        <span>${item.status === 'done' ? '✓' : item.status === 'uploading' ? '↑' : '⌛'}</span>
      </div>`;
    div.addEventListener('click', () => showAnalysis(item.result || { pending: true, id: item.id }));
    grid.appendChild(div);
  });
  $('galleryCount').textContent = gallery.length;
}

function showAnalysis(j){
  const empty = $('analysisEmpty');
  const content = $('analysisContent');
  if(!j){
    empty.style.display = 'block';
    content.style.display = 'none';
    return;
  }
  empty.style.display = 'none';
  content.style.display = 'block';
  content.textContent = typeof j === 'string' ? j : JSON.stringify(j, null, 2);
}

// ---------- WebRTC 推流 ----------
async function startWebrtc(){
  if(!stream){ setStatus('请先启动摄像头', 'warn'); return; }
  if(pc){ setStatus('推流已在进行中', 'warn'); return; }
  try {
    pc = new RTCPeerConnection({
      iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
    });
    pc.addTransceiver('video', { direction: 'sendonly' });
    const sender = pc.getSenders()[0];
    if(sender && videoTrack){
      try { await sender.replaceTrack(videoTrack); } catch(_){}
    }
    pc.oniceconnectionstatechange = () => {
      const s = pc.iceConnectionState;
      $('webrtcEndpoint').textContent = '/api/webrtc/offer · ICE=' + s;
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    // 与后端协商（后端 /api/webrtc/offer 待实现）
    try {
      const r = await fetch('/api/webrtc/offer', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ sdp: offer.sdp, type: offer.type, module: $('selModule').value })
      });
      if(r.ok){
        const answer = await r.json();
        if(answer && answer.sdp){
          await pc.setRemoteDescription(answer);
          setStatus('WebRTC 已与后端建立', 'ok');
        } else {
          setStatus('WebRTC offer 已创建（待后端 /api/webrtc/offer 接入）', 'warn');
        }
      } else {
        setStatus('WebRTC offer 已创建（后端 ' + r.status + '，降级本地）', 'warn');
      }
    } catch(e){
      setStatus('WebRTC offer 已创建（fetch 失败：' + e.message + '）', 'warn');
    }

    webrtcOn = true;
    $('webrtcPanel').classList.add('on');
    $('btnWebrtc').textContent = '关闭推流';
  } catch(err){
    setStatus('WebRTC 启动失败：' + err.message, 'err');
  }
}

function stopWebrtc(){
  if(pc){ try { pc.close(); } catch(_){} pc = null; }
  webrtcOn = false;
  $('webrtcPanel').classList.remove('on');
  $('btnWebrtc').textContent = '推流';
}

// IndexedDB 简易持久化（离线队列跨刷新恢复）
const IDB_NAME = 'mlj-mobile-capture';
const IDB_STORE = 'queue';
function openIdb(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE, { keyPath: 'id' });
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function persistItem(item){
  try {
    const db = await openIdb();
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put({ id: item.id, ts: item.ts, module: item.module, userId: item.userId, note: item.note, device: item.device });
    await new Promise(res => tx.oncomplete = res);
    db.close();
  } catch(_){ /* 离线时 IndexedDB 也可能不可用，忽略 */ }
}
