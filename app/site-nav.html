:root{--bg:#0c0e12;--surface:#161a22;--surface2:#1e2330;--text:#e2e8f0;--muted:#64748b;--gold:#c9a84c;--gold2:#e8cc7a;--accent:#38bdf8;--border:#2a3040;--radius:8px}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.6}
.topbar{position:sticky;top:0;z-index:100;background:rgba(12,14,18,0.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:18px;font-weight:700;color:var(--gold);letter-spacing:2px;white-space:nowrap}
.sub{font-size:11px;color:var(--muted)}
.search{flex:1;min-width:180px;max-width:340px;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:8px 14px;border-radius:20px;font-size:13px;outline:none}
.search:focus{border-color:var(--accent)}
.role-tabs{display:flex;gap:5px;flex-wrap:wrap}
.role-tab{padding:5px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:12px;transition:all .2s;white-space:nowrap}
.role-tab:hover{border-color:var(--gold);color:var(--gold2)}
.role-tab.active{background:rgba(201,168,76,0.12);border-color:var(--gold);color:var(--gold)}
.main{max-width:1200px;margin:0 auto;padding:20px 24px}
.role-intro{font-size:12px;color:var(--muted);margin-bottom:16px;padding:10px 14px;background:var(--surface);border-radius:var(--radius);border-left:3px solid var(--gold)}
.section{margin-bottom:22px}
.section-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--gold);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.section-title .count{margin-left:auto;font-size:10px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:8px}
.item{display:flex;flex-direction:column;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;transition:all .2s}
.item:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-1px)}
.item-name{font-size:12px;color:var(--text);font-weight:500;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item-url{font-size:10px;color:var(--muted);font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item:hover .item-name{color:var(--accent)}
.empty{text-align:center;padding:40px;color:var(--muted);font-size:13px}
.badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:8px;background:rgba(56,189,248,0.12);color:var(--accent);margin-left:6px;vertical-align:middle}
</style>

const ROLE_LIST = Object.keys(ROLES);
let activeRole = localStorage.getItem("nav-role") || ROLE_LIST[0];

function renderRecent(){
  const h = JSON.parse(localStorage.getItem("nav-history")||"[]");
  const el = document.getElementById("recent");
  if(!h.length){el.style.display="none";return;}
  el.style.display="block";
  el.innerHTML = `<div class="role-intro" style="padding:8px 14px;margin-bottom:12px"><b>最近访问</b> · ${h.length} 个页面 <span style="margin-left:auto;cursor:pointer;color:var(--muted)" onclick="localStorage.removeItem('nav-history');renderRecent();render()">[清空]</span></div><div class="grid" style="margin-bottom:14px">` +
    h.map(p => `<a class="item" href="${p.u}"><div class="item-name">${p.n}</div><div class="item-url">${p.u}</div></a>`).join("") +
    `</div>`;
}

function render(){
  const q = document.getElementById("search").value.toLowerCase().trim();
  document.getElementById("roleTabs").innerHTML = ROLE_LIST.map(r =>
    `<button class="role-tab${r===activeRole?" active":""}" data-r="${r}">${r}</button>`
  ).join("");
  document.querySelectorAll(".role-tab").forEach(btn=>{
    btn.onclick=()=>{activeRole=btn.dataset.r;localStorage.setItem("nav-role",activeRole);render();};
  });

  const role = ROLES[activeRole];
  let flat=[]; role.sections.forEach(s=>flat=flat.concat(s.pages));

  let html = `<div class="role-intro"><b>${activeRole}</b> · ${role.intro} · 共 ${flat.length} 页</div>`;
  let shown=0;
  role.sections.forEach(sec=>{
    let items = sec.pages;
    if(q) items = items.filter(p=>p.n.toLowerCase().includes(q)||p.u.toLowerCase().includes(q));
    if(!items.length) return;
    shown+=items.length;
    html += `<div class="section"><div class="section-title">${sec.title}<span class="count">${items.length} 页</span></div><div class="grid">` +
      items.map(p=>`<a class="item" href="${p.u}" title="${p.u}"><div class="item-name">${p.n}</div><div class="item-url">${p.u}</div></a>`).join("") +
      `</div></div>`;
  });
  document.getElementById("content").innerHTML = html || `<div class="empty">没有匹配的页面</div>`;
}
// === 最近访问 ===
function recordVisit(p){
  let h = JSON.parse(localStorage.getItem("nav-history") || "[]");
  h = h.filter(x => x.u !== p.u);
  h.unshift({n:p.n, u:p.u, t:Date.now()});
  h = h.slice(0,8);
  localStorage.setItem("nav-history", JSON.stringify(h));
}
const _origRender = render;
render = function(){
  renderRecent();
  _origRender();
  // 绑定 item 点击 → 记录
  document.querySelectorAll(".item").forEach(a => {
    a.addEventListener("click", () => {
      recordVisit({n:a.querySelector(".item-name").textContent, u:a.getAttribute("href")});
    });
  });
};
render();

// === ⌘K / Ctrl+K 全局搜索框聚焦 ===
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key === "k") {
    e.preventDefault();
    document.getElementById("search").focus();
    document.getElementById("search").select();
  }
  if (e.key === "Escape" && document.activeElement.id === "search") {
    document.getElementById("search").value = "";
    render();
  }
});
