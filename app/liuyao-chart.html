<style>
:root{
  --bg:#0a0e17;--card:#141928;--border:#2a3450;--gold:#c9a84c;--jade:#4ec9b0;
  --paper:#e8dcc8;--paper2:#b8a88a;--paper3:#8b7e6a;
  --red:#ef4444;--green:#10b981;--blue:#63b3ed;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:12px;min-height:100vh}

.ly-header{text-align:center;margin-bottom:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.ly-title{font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.ly-meta{font-size:12px;color:var(--paper3);line-height:1.8}
.ly-meta span{margin-right:8px}

.ly-form{max-width:500px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ly-form input{padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--paper);font-size:12px}
.ly-form button{grid-column:1/-1;padding:10px;background:var(--gold);color:var(--bg);border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}

/* R-LY-COINS-UI 铜钱手动录入 */
.ly-coins-toggle{max-width:500px;margin:0 auto 8px;text-align:center}
.ly-coins-toggle button{padding:8px 20px;background:transparent;border:1px solid var(--gold);border-radius:18px;color:var(--gold);font-size:13px;cursor:pointer;letter-spacing:1px}
.ly-coins{max-width:500px;margin:0 auto 16px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px}
.ly-coins h4{color:var(--gold);font-size:13px;margin-bottom:4px;text-align:center}
.ly-coins-hint{font-size:11px;color:var(--paper3);text-align:center;margin-bottom:10px;line-height:1.6}
.ly-coin-row{display:grid;grid-template-columns:52px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.ly-coin-pos{color:var(--gold);font-size:12px;font-weight:600;text-align:right}
.ly-coin-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.ly-coin-opt{padding:6px 2px;border:1px solid var(--border);border-radius:6px;background:rgba(255,255,255,.03);color:var(--paper2);font-size:11px;text-align:center;cursor:pointer;line-height:1.4}
.ly-coin-opt:hover{border-color:var(--gold)}
.ly-coin-opt.on{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold)}
.ly-coin-opt .sym{font-size:13px;display:block;font-family:monospace}
.ly-coin-opt.bian.on{border-color:var(--red);background:rgba(239,68,68,.12);color:var(--red)}
.ly-coins-sum{text-align:center;font-size:12px;color:var(--jade);margin-top:8px;min-height:16px}
@media(max-width:480px){.ly-coin-opt{font-size:10px;padding:5px 1px}}

.ly-chart{max-width:600px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:16px}
.ly-gua-name{text-align:center;font-size:16px;color:var(--gold);margin-bottom:12px;font-weight:600}
.ly-gua-symbols{text-align:center;font-size:28px;margin-bottom:12px;letter-spacing:4px}
.ly-yao{display:grid;grid-template-columns:60px 1fr 60px 80px 60px 40px;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--border);font-size:11px}
.ly-yao:last-child{border-bottom:none}
.ly-yao-pos{color:var(--gold);font-weight:600;text-align:center}
.ly-yao-line{text-align:center;font-size:18px;font-family:monospace;letter-spacing:2px}
.ly-yao-gz{color:var(--paper2)}
.ly-yao-wx{color:var(--paper3);font-size:10px}
.ly-yao-lq{color:var(--jade);font-size:10px}
.ly-yao-sy{color:var(--gold);font-size:10px;text-align:center}
.ly-yao-bian{color:var(--red);font-size:9px}

.ly-info{max-width:600px;margin:12px auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ly-info-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;line-height:1.8}
.ly-info-card h4{color:var(--gold);font-size:12px;margin-bottom:6px}

@media(max-width:768px){
  .ly-yao{grid-template-columns:50px 1fr 50px 70px 50px 30px;font-size:10px;gap:4px}
  .ly-yao-line{font-size:16px}
  .ly-info{grid-template-columns:1fr}
}
@media(max-width:360px){
  .ly-yao{grid-template-columns:40px 1fr 40px 60px 40px;gap:2px;font-size:9px}
  .ly-yao-bian{display:none}
  .ly-yao-line{font-size:14px}
}

<button onclick="generateFullReport('liuyao')" style="margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,#ffb44d,#ff7e5f);color:#0f1820;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px">📜 出具六爻预测报告</button>
<script>
async function generateFullReport(mod){
  try{
    const inputs = {};
    document.querySelectorAll('input,select').forEach(el=>{
      const m = el.id && el.id.match(/^[a-z]+-(.+)$/);
      if(m) if(el.type==='number' && el.value) inputs[m[1]] = +el.value;
        else inputs[m[1]] = el.value;
    });
    if(inputs.lunar===undefined) inputs.lunar = (window.zwCalMode==='lunar') || (window.lrCalMode==='lunar');
    if(inputs.leapMonth===undefined) inputs.leapMonth = false;
    
    const csrfRes = await fetch(API_BASE+'/api/csrf-token',{signal:AbortSignal.timeout(15000),headers:{'X-Skip-Interceptor':'1'}}).then(r=>r.json()).catch(()=>({csrfToken:''}));
    const csrf = csrfRes.csrfToken || csrfRes.token || '';
    
    const r = await fetch(API_BASE+'/api/paipan/'+mod+'/report', { signal: AbortSignal.timeout(15000),
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,'X-Skip-Interceptor':'1'},
      body: JSON.stringify({
        ...inputs,
        // 字段映射：前端字段名 → 后端期望字段名
        query: inputs.question || inputs.query || '',
        divinationTime: inputs.divinationTime || new Date().toISOString().slice(0,16).replace('T',' '),
        gender: inputs.sex || inputs.gender || 'male',
        questions: [inputs.question||''].filter(Boolean),
        options: { name: inputs.name||'缘主' }
      }), signal: AbortSignal.timeout(15000) }).then(r=>r.json());
    
    if(!r.ok){
      const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
      fn('报告生成失败：'+((r.message&&r.message!=='未知错误'?r.message:'')||r.error||'请检查输入')+(Array.isArray(r.missing)&&r.missing.length?('（缺少：'+r.missing.join('、')+'）'):(r.data&&Array.isArray(r.data.missing)&&r.data.missing.length?('（缺少：'+r.data.missing.join('、')+'）'):'')));
      return;
    }
    
    // 保存报告到 sessionStorage，跳到报告展示页
    sessionStorage.setItem('lastReport', JSON.stringify(r));
    window.location.href = 'report-interpret.html?module='+mod+'&name='+encodeURIComponent(inputs.name||'缘主');
  }catch(e){
    const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
    fn('生成失败：'+esc(e.message));
    console.error(e);
  }
}
</script>

<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
// R-LY-COINS-UI：铜钱手动录入（契约：coins=6次抛掷数组，每次3枚 1=字/正面 0=背/反面，初爻在前）
const LY_COIN_TYPES=[
  {k:'shaoyang', label:'一字二背', sub:'少阳', sym:'⚊', coins:[1,0,0], bian:false},
  {k:'shaoyin',  label:'二字一背', sub:'少阴', sym:'⚋', coins:[1,1,0], bian:false},
  {k:'laoyang',  label:'三背',     sub:'老阳·变', sym:'⚊◯', coins:[0,0,0], bian:true},
  {k:'laoyin',   label:'三字',     sub:'老阴·变', sym:'⚋✕', coins:[1,1,1], bian:true}
];
const LY_YAO_NAMES=['初爻','二爻','三爻','四爻','五爻','上爻'];
let lyCoinSel=[null,null,null,null,null,null]; // 每爻选中的 LY_COIN_TYPES 下标
function toggleLyCoins(){
  const p=document.getElementById('ly-coins');
  const show=p.style.display==='none';
  p.style.display=show?'block':'none';
  document.getElementById('ly-coins-btn').textContent=show?'🪙 收起铜钱录入（当前：铜钱起卦）':'🪙 铜钱起卦 · 手动录入';
  if(show && !p._built){
    p._built=true;
    const rows=document.getElementById('ly-coin-rows');
    let h='';
    for(let i=0;i<6;i++){
      h+='<div class="ly-coin-row"><div class="ly-coin-pos">'+LY_YAO_NAMES[i]+'</div><div class="ly-coin-opts">';
      for(let t=0;t<4;t++){
        const tp=LY_COIN_TYPES[t];
        h+='<div class="ly-coin-opt'+(tp.bian?' bian':'')+'" data-yao="'+i+'" data-t="'+t+'" onclick="selLyCoin('+i+','+t+')"><span class="sym">'+tp.sym+'</span>'+tp.label+'<br>'+tp.sub+'</div>';
      }
      h+='</div></div>';
    }
    rows.innerHTML=h;
    // 铜钱起卦以占课当日干支定旬空——自动填入今天（用户可再改）
    const n=new Date();
    document.getElementById('ly-year').value=n.getFullYear();
    document.getElementById('ly-month').value=n.getMonth()+1;
    document.getElementById('ly-day').value=n.getDate();
  }
  updLyCoinsSum();
}
function selLyCoin(yao,t){
  lyCoinSel[yao]=t;
  document.querySelectorAll('.ly-coin-opt[data-yao="'+yao+'"]').forEach(function(el){
    el.classList.toggle('on', +el.dataset.t===t);
  });
  updLyCoinsSum();
}
function updLyCoinsSum(){
  const el=document.getElementById('ly-coins-sum');
  const n=lyCoinSel.filter(function(v){return v!==null;}).length;
  if(n<6){el.textContent='已录入 '+n+'/6 爻';return;}
  el.textContent='✓ 六爻齐全——点「排盘」以铜钱卦出盘';
}
function lyCoinsMode(){ const p=document.getElementById('ly-coins'); return p && p.style.display!=='none'; }
async function doPaipan(){
  const y=document.getElementById('ly-year').value;
  const m=document.getElementById('ly-month').value;
  const d=document.getElementById('ly-day').value;
  const h=document.getElementById('ly-hour').value;
  if(!y||!m||!d||h===''){showToast('请填写完整的年月日时');return;}
  const dg=document.getElementById('ly-daygz').value || undefined;
  const name = document.getElementById('ly-name').value || '';
  const sex = document.getElementById('ly-sex').value;
  const question = document.getElementById('ly-question').value || '';
  const lngEl = document.getElementById('ly-lng');
  const lng = lngEl ? (+lngEl.value || 121.47) : 121.47;
  const tyEl = document.getElementById('ly-target-year');
  const targetYear = tyEl ? (+tyEl.value || new Date().getFullYear()) : new Date().getFullYear();
  const now = new Date();
  const currentAge = now.getFullYear() - +y;
  const _lang = (typeof I18N !== 'undefined' && I18N.locale && !I18N.locale.startsWith('zh')) ? 'en' : 'zh';
  const body={year:+y,month:+m,day:+d,hour:+h,name,sex,lng,targetYear,currentAge,lang:_lang };
  if(dg) body.dayGanZhi=dg;
  if(question) body.question=question;
  if(lyCoinsMode()){
    if(lyCoinSel.some(function(v){return v===null;})){showToast('铜钱起卦：请把六爻都点选完（已录 '+lyCoinSel.filter(function(v){return v!==null;}).length+'/6）');return;}
    body.coins=lyCoinSel.map(function(t){return LY_COIN_TYPES[t].coins;});
  }
  let r, rSvg;
  try {
    [r, rSvg] = await Promise.all([
      fetch(API_BASE+'/api/paipan/liuyao',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(body),signal:AbortSignal.timeout(20000)}),
      proFetch(API_BASE+'/api/paipan/liuyao/svg',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(body),signal:AbortSignal.timeout(20000)})
    ]);
  } catch(e) {
    showToast('排盘请求失败：' + (e && esc(e.message) || '网络异常') + '，请重试','err');
    return;
  }
  const data=await r.json();
  if(!data.ok){showToast('排盘失败: '+data.error);return;}
  const svg = await rSvg.text();
  renderChart(data.chart);
  if(body.coins){const me=document.getElementById('ly-meta');me.innerHTML='<span style="color:var(--jade,#4ec9b0)">🪙 铜钱起卦（手动录入）</span><br>'+me.innerHTML;}
  if(window.PaipanNav) PaipanNav.notifyChart(data.chart);
  if(window.PaipanBaihua) PaipanBaihua.notify('liuyao', body);
  renderSvg(svg);
  renderFlow(data.flow, targetYear, currentAge);
  if(data.interpretation) renderInterpretation(data.interpretation);
  if(data.canon) renderCanonCard(data.canon);   // R-CANON-EXT：六爻经典依据层
  if(data.guaCiReference) renderGuaCiCard(data.guaCiReference);   // R-YJ-GUACI：周易卦爻辞引证
  if(data.yilinReference) renderYilinCard(data.yilinReference);   // R-JY-YILIN：焦氏易林繇辞引证
}

function renderChart(c){
  const xk = c.xunKong && c.xunKong.kong ? ` | 旬空:${c.xunKong.kong.split('').join('、')}` : '';
  document.getElementById('ly-meta').innerHTML=`${c.gongName||''}(${c.gongWuxing||''}) · ${c.guaType||''} | 日干支:${c.dayGanZhi} | 日五行:${c.dayWuxing}${xk}<br>`+
    `<span>世爻:第${c.shiYao+1}爻</span><span>应爻:第${c.yingYao+1}爻</span>`;

  const chart=document.getElementById('ly-chart');
  chart.style.display='block';

  let html=`<div class="ly-gua-name">${c.guaName}`;
  if(c.bianGua) html+=` → ${c.bianGua.name}`;
  html+='</div>';

  // 卦符号
  let symbols='';
  for(let i=c.yaos.length-1;i>=0;i--){
    symbols+=c.yaos[i].yin?'⚋':'⚊';
    if(c.yaos[i].bian) symbols+=' ';
  }
  html+=`<div class="ly-gua-symbols">${symbols}</div>`;

  // 六爻
  for(let i=c.yaos.length-1;i>=0;i--){
    const y=c.yaos[i];
    const line=y.yin?'— —':'———';
    const bian=y.bian?'<span class="ly-yao-bian">○变</span>':'';
    const sy=y.shiying?`<span class="ly-yao-sy">${y.shiying}</span>`:'';
    const kong=y.kong?'<span style="color:var(--red);font-size:9px;border:1px solid var(--red);border-radius:3px;padding:0 2px;margin-left:2px">空</span>':'';
    // 伏神: 本爻下伏神（隐藏六亲）
    const fs=(c.fushen||[]).find(f=>f.position===y.position);
    const fsHtml=fs?`<div style="font-size:9px;color:var(--paper3)">伏${fs.liuqin}${fs.ganZhi}${fs.wuxing}</div>`:'';
    html+=`<div class="ly-yao" data-pos="${y.position}"${y.kong?' style="opacity:.55;cursor:pointer"':' style="cursor:pointer"'}>`;
    html+=`<div class="ly-yao-pos">${y.positionName}</div>`;
    html+=`<div class="ly-yao-line">${line}</div>`;
    html+=`<div class="ly-yao-gz">${y.ganZhi}${kong}</div>`;
    html+=`<div class="ly-yao-wx">${y.wuxing}·${y.liuqin}${fsHtml}</div>`;
    html+=`<div class="ly-yao-lq">${y.liushen}</div>`;
    html+=`<div>${sy}${bian}</div>`;
    html+=`</div>`;
  }
  chart.innerHTML=html;

  // R-TAP-X: 点爻白话解读（初/二/三/四/五/上 逐爻可点；事件委托只绑一次）
  if (window.PaipanTap && !chart._tapBound) {
    chart._tapBound = true;
    chart.style.position = 'relative';
    PaipanTap.bind(chart, '.ly-yao', {
      module: 'liuyao',
      keyOf: function (el) { return 'yao' + el.dataset.pos; },
      paramOf: function (el) { return { yao: +el.dataset.pos }; }
    });
  }

  // 信息卡片
  const info=document.getElementById('ly-info');
  info.style.display='grid';
  let infoHtml='';
  infoHtml+=`<div class="ly-info-card"><h4>本卦</h4>`;
  infoHtml+=`卦名：${c.guaName}<br>`;
  infoHtml+=`卦宫：${c.gongName||''}（${c.gongWuxing||''}）· ${c.guaType||''}<br>`;
  infoHtml+=`上卦：${c.upper.name}${c.upper.symbol}（${c.upper.nature}）<br>`;
  infoHtml+=`下卦：${c.lower.name}${c.lower.symbol}（${c.lower.nature}）<br>`;
  if(c.xunKong) infoHtml+=`旬空：${c.xunKong.xun||''}旬 ${c.xunKong.kong.split('').join('、')}空<br>`;
  infoHtml+=`</div>`;
  if(c.fushen && c.fushen.length){
    infoHtml+=`<div class="ly-info-card"><h4>伏神（本宫借六亲）</h4>`;
    for(const f of c.fushen) infoHtml+=`${f.liuqin} ${f.ganZhi}${f.wuxing} 伏于第${f.position}爻${f.hideUnder}下<br>`;
    infoHtml+=`</div>`;
  }
  if(c.bianGua){
    infoHtml+=`<div class="ly-info-card"><h4>变卦</h4>`;
    infoHtml+=`卦名：${c.bianGua.name}<br>`;
    infoHtml+=`</div>`;
  }
  info.innerHTML=infoHtml;
}

function renderSvg(svg){
  const old = document.getElementById('ly-svg-host');
  if(old) old.remove();
  const host = document.createElement('div');
  host.id = 'ly-svg-host';
  host.style.cssText = 'max-width:800px;margin:16px auto;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;padding:8px;text-align:center';
  host.innerHTML = '<div style="font-size:12px;color:var(--gold,#c9a84c);margin-bottom:6px">📜 高清盘图（R474 SVG · 可右键保存 / 微信长按分享）</div>' + svg;
  const chart = document.getElementById('ly-chart');
  if(chart) chart.parentNode.insertBefore(host, chart);
}

function renderFlow(flow, targetYear, currentAge){
  const old = document.getElementById('ly-flow-host');
  if(old) old.remove();
  if(!flow) return;
  const ln = flow.liuNian || {};
  const xx = flow.xiaoXian || {};
  const dx = flow.currentDaXian || {};
  const host = document.createElement('div');
  host.id = 'ly-flow-host';
  host.style.cssText = 'max-width:800px;margin:12px auto;padding:12px;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;font-size:12px;color:var(--paper,#e8dcc8)';
  host.innerHTML = `
    <div style="color:var(--gold,#c9a84c);font-weight:600;margin-bottom:8px">🌊 ${targetYear} 流年 · 现年 ${currentAge} 岁</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11px">
      <div style="background:rgba(201,168,76,.08);padding:8px;border-radius:6px">
        <div style="color:var(--gold,#c9a84c)">流年</div>
        <div>${ln.ganZhi||''}（${ln.shengXiao||''}）</div>
        <div style="color:var(--paper3);margin-top:2px">${ln.naYin||''}</div>
      </div>
      <div style="background:rgba(78,201,176,.08);padding:8px;border-radius:6px">
        <div style="color:var(--jade,#4ec9b0)">小限</div>
        <div>${xx.palaceName||''}宫</div>
        <div style="color:var(--paper3);margin-top:2px">${xx.direction||''}</div>
      </div>
      <div style="background:rgba(99,179,237,.08);padding:8px;border-radius:6px">
        <div style="color:var(--blue,#63b3ed)">大限</div>
        <div>${dx.startAge||''} - ${dx.endAge||''} 岁</div>
        <div style="color:var(--paper3);margin-top:2px">${dx.ganZhi||''} · ${dx.palaceName||''}</div>
      </div>
    </div>`;
  const info = document.getElementById('ly-info');
  if(info) info.parentNode.insertBefore(host, info);
  else document.body.appendChild(host);
}

function renderInterpretation(i){
  if(!i) return;
  const el=document.getElementById('paipan-interpretation')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-interpretation';
    d.style.cssText='margin:16px 0;padding:16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:12px';
    document.querySelector('.zw-grid,.qm-grid,.ly-grid,.lr-grid,.mh-grid,.fs-grid,main,body').appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📜 断盘解读</div>';
  if(i.summary) h+='<div style="font-size:13px;line-height:1.7;opacity:.9;margin-bottom:8px">'+i.summary+'</div>';
  if(i.advice) h+='<div style="font-size:13px;line-height:1.7;opacity:.75">'+i.advice+'</div>';
  if(i.guaJi) h+='<div style="font-size:12px;opacity:.6;margin-top:6px">卦象：'+i.guaJi+'</div>';
  el.innerHTML=h;
  el.style.display='block';
}

// R-CANON-EXT：六爻经典依据卡（京氏易传/增删卜易原典摘录 + 白话导读，置于断盘解读之下）
function renderCanonCard(cn){
  if(!cn || !cn.items || !cn.items.length) return;
  const escC=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  const el=document.getElementById('paipan-canon')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-canon';
    d.style.cssText='margin:0 0 16px;padding:16px;background:rgba(255,255,255,.02);border:1px solid rgba(201,168,76,.2);border-left:3px solid var(--gold,#c9a84c);border-radius:12px';
    const ref=document.getElementById('paipan-interpretation');
    (ref&&ref.parentNode?ref.parentNode:(document.querySelector('.ly-grid')||document.body)).appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📚 经典依据</div>';
  if(cn.note) h+='<div style="font-size:12px;line-height:1.8;color:var(--jade,#4ec9b0);margin-bottom:8px">'+escC(cn.note)+'</div>';
  for(const it of cn.items){
    h+='<div style="margin-top:8px"><div style="font-size:12px;color:var(--gold,#c9a84c)">《'+escC(it.book||'')+'》<span style="opacity:.55;font-size:11px">　'+escC(it.title||'')+'</span></div>';
    h+='<div style="font-size:12px;line-height:1.9;opacity:.85">'+escC(it.excerpt||'')+'</div></div>';
  }
  h+='<div style="margin-top:8px;font-size:11px;opacity:.5">原文照录自公有领域典籍，未作改写。</div>';
  el.innerHTML=h;
  el.style.display='block';
}
// R-YJ-GUACI：周易卦爻辞引证卡（本卦/变卦卦辞彖象 + 动爻爻辞）
function renderGuaCiCard(g){
  if(!g || !g.benGua) return;
  const escG=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  const el=document.getElementById('paipan-guaci')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-guaci';
    d.style.cssText='margin:0 0 16px;padding:16px;background:rgba(255,255,255,.02);border:1px solid rgba(78,201,176,.2);border-left:3px solid var(--jade,#4ec9b0);border-radius:12px';
    const ref=document.getElementById('paipan-canon')||document.getElementById('paipan-interpretation');
    (ref&&ref.parentNode?ref.parentNode:(document.querySelector('.ly-grid')||document.body)).appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--jade,#4ec9b0);margin-bottom:8px">📜 周易卦爻辞 · '+escG(g.benGua.name)+'</div>';
  h+='<div style="font-size:12px;line-height:1.9;color:var(--jade,#4ec9b0)">卦辞：'+escG(g.benGua.guaCi)+'</div>';
  if(g.benGua.xiang) h+='<div style="font-size:12px;line-height:1.9;opacity:.85">象曰：'+escG(g.benGua.xiang)+'</div>';
  if(g.movingYaos&&g.movingYaos.length){
    h+='<div style="margin-top:8px;font-size:12px;color:var(--gold,#c9a84c)">动爻爻辞（断卦核心）：</div>';
    for(const y of g.movingYaos) h+='<div style="font-size:12px;line-height:1.9;opacity:.85">　'+escG(y.label)+'：'+escG(y.ci)+'</div>';
  }
  if(g.bianGua) h+='<div style="margin-top:8px;font-size:12px;line-height:1.9;opacity:.75">之卦 '+escG(g.bianGua.name)+'：'+escG(g.bianGua.guaCi)+'</div>';
  h+='<div style="margin-top:8px;font-size:11px;opacity:.5">原文照录《周易》'+escG(g.source?('·'+g.source):'')+'，未作改写。</div>';
  el.innerHTML=h;
  el.style.display='block';
}
// R-JY-YILIN：焦氏易林繇辞引证卡（本卦之X卦 → 繇辞）
function renderYilinCard(y){
  if(!y || !y.verse) return;
  const escY=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  const el=document.getElementById('paipan-yilin')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-yilin';
    d.style.cssText='margin:0 0 16px;padding:16px;background:rgba(255,255,255,.02);border:1px solid rgba(201,168,76,.2);border-left:3px solid var(--gold,#c9a84c);border-radius:12px';
    const ref=document.getElementById('paipan-guaci')||document.getElementById('paipan-canon')||document.getElementById('paipan-interpretation');
    (ref&&ref.parentNode?ref.parentNode:(document.querySelector('.ly-grid')||document.body)).appendChild(d);
    return d;
  })();
  // 繇辞按四字句读加标点顿断
  const verseFmt=escY(y.verse).replace(/(.{4})/g,'$1　').trim();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📿 焦氏易林 · '+escY(y.benGua)+' 之 '+escY(y.bianGua)+'</div>';
  h+='<div style="font-size:13px;line-height:2.1;color:var(--gold,#c9a84c)">'+verseFmt+'</div>';
  if(y.note) h+='<div style="margin-top:8px;font-size:12px;line-height:1.9;opacity:.75">注：'+escY(y.note)+'</div>';
  if(y.ambiguous) h+='<div style="margin-top:6px;font-size:11px;opacity:.55">此条繇注连写，元刊本未标分界，全文照录。</div>';
  h+='<div style="margin-top:8px;font-size:11px;opacity:.5">原文照录'+escY(y.source)+'，未作改写。焦延寿以繇辞系于六十四卦之变，共四千零九十六首。</div>';
  // R-JY-BAIHUA：AI 白话串讲（点击触发；只译意象不断吉凶，吉凶归盘面）
  h+='<div style="margin-top:10px"><button type="button" id="yilin-baihua-btn" style="padding:5px 14px;font-size:12px;border:1px solid var(--gold,#c9a84c);border-radius:16px;background:transparent;color:var(--gold,#c9a84c);cursor:pointer">💬 白话串讲</button>'
    +'<span id="yilin-baihua-tip" style="margin-left:8px;font-size:11px;opacity:.5">AI 只翻译繇辞画面，吉凶以盘面为准</span></div>'
    +'<div id="yilin-baihua-body" style="display:none;margin-top:8px;padding:10px 12px;background:rgba(201,168,76,.06);border-radius:8px;font-size:12.5px;line-height:1.9"></div>';
  el.innerHTML=h;
  el.style.display='block';
  const btn=document.getElementById('yilin-baihua-btn');
  // R-JY-PEEK（2026-09-29）：预热缓存命中即自动展开，信众零点击读到译文；未命中保留手动按钮
  (function(){
    const body0=document.getElementById('yilin-baihua-body');
    const tip0=document.getElementById('yilin-baihua-tip');
    fetch(API_BASE+'/api/paipan/liuyao/yilin-baihua?peek=1&ben='+encodeURIComponent(y.benGua)+'&bian='+encodeURIComponent(y.bianGua),{headers:{'X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(10000)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.cached&&d.baihua){
          body0.textContent=d.baihua; body0.style.display='block';
          tip0.textContent='AI 串讲·仅供参考（已预热）';
          if(btn) btn.style.display='none';
        }
      })
      .catch(function(){ /* 探针失败静默，不影响手动按钮 */ });
  })();
  if(btn) btn.onclick=function(){
    const body=document.getElementById('yilin-baihua-body');
    const tip=document.getElementById('yilin-baihua-tip');
    btn.disabled=true; btn.style.opacity=.5; tip.textContent='正在串讲…';
    fetch(API_BASE+'/api/paipan/liuyao/yilin-baihua?ben='+encodeURIComponent(y.benGua)+'&bian='+encodeURIComponent(y.bianGua),{headers:{'X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(75000)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok&&d.baihua){
          body.textContent=d.baihua; body.style.display='block';
          tip.textContent='AI 串讲·仅供参考（'+(d.cached?'已缓存':'新生成')+'）';
          btn.style.display='none';
        }else{ tip.textContent=(d&&d.error)||'串讲失败，请稍后再试'; btn.disabled=false; btn.style.opacity=1; }
      })
      .catch(function(){ tip.textContent='网络异常，请稍后再试'; btn.disabled=false; btn.style.opacity=1; });
  };
}
