<h1>🏪 商家入驻申请</h1>
<p class="sub">道观寺庙/大师工作室入驻 · 平台代售引流 · 付款即分成</p>

<div id="applyForm">
<div class="card">
<h3>📝 基本信息</h3>
<label for="mName">商家名称（如：五台山显通寺法物流通处）</label>
<input aria-label="mName" type="text" id="mName" placeholder="商家/寺庙名称">
<div class="row">
<div>
<label for="mSchool">派别</label>
<select aria-label="mSchool" id="mSchool">
<option value="佛教">佛教</option>
<option value="道教">道教</option>
<option value="儒家">儒家</option>
<option value="民间">民间法教</option>
</select>
</div>
<div>
<label for="mType">类型</label>
<select aria-label="mType" id="mType">
<option value="寺庙">寺庙</option>
<option value="道观">道观</option>
<option value="书院">书院</option>
<option value="工作室">大师工作室</option>
<option value="个人">个人大师</option>
</select>
</div>
</div>
<div class="row">
<div>
<label for="mBoss">负责人姓名</label>
<input aria-label="mBoss" type="text" id="mBoss" placeholder="负责人/住持">
</div>
<div>
<label for="mPhone">联系电话</label>
<input aria-label="mPhone" type="tel" id="mPhone" placeholder="手机号">
</div>
</div>
<label for="mMaster">法人/住持法名</label>
<input aria-label="mMaster" type="text" id="mMaster" placeholder="如：释XX法师 / 张XX道长">
</div>

<div class="card">
<h3>📜 资质认证</h3>
<label for="mLicense">制作许可证编号</label>
<input aria-label="mLicense" type="text" id="mLicense" placeholder="宗教用品制作许可证编号">
<label for="mCert">协会认证</label>
<select aria-label="mCert" id="mCert">
<option value="佛教协会监制">佛教协会监制</option>
<option value="道教协会监制">道教协会监制</option>
<option value="宗教局备案">宗教局备案</option>
<option value="非遗传承">非物质文化遗产传承</option>
<option value="其他">其他认证</option>
</select>
<label for="mCats">供应商品类别（可多选，用、分隔）</label>
<input aria-label="mCats" type="text" id="mCats" placeholder="法器、吉祥物、经典、茶饮、养生品">
<label for="mProcess">商品制作过程描述</label>
<textarea id="mProcess" placeholder="如：本寺法器由寺内僧人手工制作，经开光仪式加持..." aria-label="如：本寺法器由寺内僧人手工制作，经开光仪式加持..."></textarea>
</div>

<div class="card">
<h3>📊 合作模式</h3>
<label for="mSplit">分成比例（商家所得百分比）</label>
<select aria-label="mSplit" id="mSplit">
<option value="0.8">80%（平台20%）</option>
<option value="0.7">70%（平台30%）</option>
<option value="0.6">60%（平台40%）</option>
<option value="0.9">90%（平台10%）</option>
</select>
<div class="tip">平台只代售引流，不囤货。付款即按比例分成。</div>
</div>

<div class="card">
<h3>📋 入驻协议</h3>
<label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer" for="mAgree">
<input aria-label="mAgree" type="checkbox" id="mAgree" style="width:auto;margin:0;flex-shrink:0;margin-top:4px">
<span style="font-size:12px;color:var(--paper3);line-height:1.8">本人承诺所提交信息真实有效，商品为正规制作，来源可查。同意平台代售引流模式，付款即按约定比例分成。如有虚假，愿承担一切责任。</span>
</label>
</div>

<button class="btn" onclick="submitApply()">提交入驻申请</button>
</div>

<div id="successMsg" class="success">
<h2>✅ 申请已提交</h2>
<p>平台将在3个工作日内审核，审核通过后即可上架商品。</p>
<p style="margin-top:16px"><a href="merchant-dashboard.html" style="color:var(--gold)">前往商家后台 →</a></p>
</div>

<script src="js/ui-toast.js" defer></script>
<script src="js/toast-helper.js"></script>
