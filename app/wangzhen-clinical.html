<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>望诊临床工作台 · 命理宝鉴</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/divination-hub.css">
  <style>
    :root{
      --wz-bg:#0a0e17; --wz-paper:#e8e0d0; --wz-paper2:#c9bfa8; --wz-paper3:#a09888;
      --wz-gold:#c9a84c; --wz-jade:#10b981; --wz-red:#ef4444; --wz-cyan:#63b3ed;
      --wz-border:rgba(201,168,76,.18); --wz-card-bg:rgba(255,255,255,.03);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:var(--wz-bg);color:var(--wz-paper);padding:10px;line-height:1.6;min-height:100vh}

    /* 顶栏 */
    .wz-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--wz-border);margin-bottom:12px;flex-wrap:wrap;gap:8px}
    .wz-topbar h1{font-size:18px;color:var(--wz-gold);letter-spacing:2px}
    .wz-topbar .nav-back{font-size:12px;color:var(--wz-paper3);text-decoration:none;padding:4px 10px;border:1px solid var(--wz-border);border-radius:6px}
    .wz-topbar .nav-back:hover{color:var(--wz-paper)}
    .wz-capabilities{font-size:11px;color:var(--wz-jade)}

    /* 布局 */
    .wz-layout{display:grid;grid-template-columns:260px 1fr 280px;gap:12px;max-width:1400px;margin:0 auto}
    @media(max-width:1024px){.wz-layout{grid-template-columns:1fr;gap:10px}}

    /* 卡片 */
    .wz-card{background:var(--wz-card-bg);border:1px solid var(--wz-border);border-radius:10px;padding:14px;margin-bottom:10px}
    .wz-card-title{font-size:13px;color:var(--wz-gold);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--wz-border);display:flex;align-items:center;justify-content:space-between}
    .wz-card-title .badge{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(16,185,129,.15);color:var(--wz-jade)}

    /* 左栏 - 患者管理 */
    .wz-patient-card{padding:8px 10px;border:1px solid var(--wz-border);border-radius:6px;cursor:pointer;margin-bottom:6px;transition:.2s}
    .wz-patient-card:hover{border-color:var(--wz-gold);background:rgba(201,168,76,.06)}
    .wz-patient-name{font-size:13px;color:var(--wz-paper);margin-bottom:2px}
    .wz-patient-tag{font-size:10px;padding:1px 6px;border-radius:3px;background:rgba(201,168,76,.1);color:var(--wz-paper3);margin-right:4px}
    .wz-empty{font-size:12px;color:var(--wz-paper3);text-align:center;padding:12px}
    .pd-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px solid rgba(201,168,76,.06)}
    .pd-row span{color:var(--wz-paper3)}
    .pd-row b{color:var(--wz-paper);font-weight:600}

    /* 八字输入 */
    .wz-bazi-input{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
    .wz-bazi-input select,.wz-bazi-input input{padding:6px 8px;background:rgba(255,255,255,.05);border:1px solid var(--wz-border);border-radius:6px;color:var(--wz-paper);font-size:12px}
    .wz-bazi-input select option{background:#1a1a2e;color:var(--wz-paper)}
    .wz-btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
    .btn{padding:7px 14px;border:none;border-radius:6px;cursor:pointer;font-size:12px;transition:.2s;white-space:nowrap}
    .btn-primary{background:var(--wz-gold);color:#0a0e17;font-weight:600}
    .btn-primary:hover{background:#d4b85e}
    .btn-secondary{background:rgba(99,179,237,.15);color:var(--wz-cyan);border:1px solid rgba(99,179,237,.3)}
    .btn-ghost{background:transparent;border:1px solid var(--wz-border);color:var(--wz-paper3)}
    .btn-ghost:hover{border-color:var(--wz-paper2);color:var(--wz-paper)}
    .btn-danger{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.3)}

    /* 中栏 - 望诊核心 */
    .wz-camera-section{position:relative;margin-bottom:10px}
    .wz-camera-video{width:100%;max-width:480px;aspect-ratio:4/3;background:#000;border-radius:8px;object-fit:cover;margin:0 auto;display:block}
    .wz-camera-canvas{display:none}
    .wz-photo-preview{width:100%;max-width:480px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
    .wz-analysis-status{font-size:12px;padding:6px 10px;border-radius:6px;margin-top:6px}
    .wz-status.analyzing{background:rgba(245,158,11,.1);color:#fbbf24}
    .wz-status.done{background:rgba(16,185,129,.1);color:var(--wz-jade)}
    .wz-status.error{background:rgba(239,68,68,.1);color:#f87171}
    .wz-ai-output{font-size:12px;line-height:1.7;color:var(--wz-paper2);max-height:200px;overflow-y:auto;padding:8px;background:rgba(0,0,0,.2);border-radius:6px;margin-top:6px}
    .wz-info{font-size:12px;color:var(--wz-paper3);padding:8px}
    .wz-warning{font-size:12px;color:#fbbf24;padding:8px}

    /* 语音 */
    .wz-voice-section{margin-bottom:10px}
    .wz-voice-text{width:100%;min-height:60px;max-height:120px;padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--wz-border);border-radius:6px;color:var(--wz-paper);font-size:12px;resize:vertical}
    .wz-btn-voice.recording{background:rgba(239,68,68,.2);color:#f87171;animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

    /* Tab */
    .wz-tabs{display:flex;gap:2px;margin-bottom:10px;border-bottom:1px solid var(--wz-border);flex-wrap:wrap}
    .wz-tab{padding:8px 14px;cursor:pointer;font-size:12px;color:var(--wz-paper3);border-bottom:2px solid transparent;transition:.2s;white-space:nowrap}
    .wz-tab:hover{color:var(--wz-paper)}
    .wz-tab.active{color:var(--wz-gold);border-bottom-color:var(--wz-gold)}

    /* 望诊分区 */
    .wangzhen-zone-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:10px}
    .wangzhen-zone-card{padding:8px 10px;border:1px solid var(--wz-border);border-radius:6px;cursor:pointer;transition:.2s;background:var(--wz-card-bg)}
    .wangzhen-zone-card:hover{border-color:var(--wz-gold)}
    .wangzhen-zone-card.active{border-color:var(--wz-gold);background:rgba(201,168,76,.12)}
    .wangzhen-zone-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border:2px solid;border-radius:50%;font-weight:700;font-size:12px;margin-bottom:4px}
    .wangzhen-zone-name{font-size:11px;color:var(--wz-paper)}
    .wangzhen-zone-organ{font-size:10px;color:var(--wz-paper3)}
    .wangzhen-feature-list{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
    .wangzhen-feature-chip{display:inline-flex;align-items:center;gap:3px;padding:5px 8px;border:1px solid var(--wz-border);border-radius:16px;cursor:pointer;font-size:11px;user-select:none}
    .wangzhen-feature-chip input{display:none}
    .wangzhen-feature-chip:has(input:checked){border-color:var(--wz-gold);background:rgba(201,168,76,.15);color:var(--wz-gold)}
    .wangzhen-result-item{padding:8px;margin-bottom:6px;border-radius:6px;background:var(--wz-card-bg);font-size:12px;border-left:3px solid var(--wz-gold)}
    .result-item-header{display:flex;justify-content:space-between;margin-bottom:3px}
    .result-zone{font-weight:600;color:var(--wz-gold)}
    .result-severity{font-size:11px}
    .result-organ{color:var(--wz-cyan);font-size:11px}
    .result-pathology{color:var(--wz-paper);font-size:11px}
    .result-advice{color:var(--wz-jade);font-size:11px}
    .wangzhen-disclaimer{margin-top:8px;padding:8px;border-radius:6px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15);font-size:10px;color:#fca5a5}

    /* 右栏 - 病例 & 报告 */
    .wz-case-item{padding:8px;border:1px solid var(--wz-border);border-radius:6px;margin-bottom:6px;cursor:pointer}
    .wz-case-item:hover{border-color:var(--wz-gold)}
    .wz-case-date{font-size:10px;color:var(--wz-paper3)}
    .wz-case-text{font-size:11px;color:var(--wz-paper2);margin-top:2px}

    /* 命相同参 */
    .wz-mingxiang-section{margin-top:10px}
    #wz-mingxiang-result{display:none;margin-top:8px;padding:10px;background:rgba(99,179,237,.05);border:1px solid rgba(99,179,237,.15);border-radius:6px}

    .muted{color:var(--wz-paper3);font-size:12px;text-align:center;padding:8px}
    .wz-history-list{display:flex;flex-direction:column;gap:4px}
    .wz-history-item{display:flex;gap:6px;align-items:center;padding:5px 8px;border:1px solid var(--wz-border);border-radius:4px;font-size:10px;background:var(--wz-card-bg)}
    .wz-history-time{color:var(--wz-paper3);min-width:70px}
    .wz-history-zone{color:var(--wz-gold);font-weight:600}
    .wz-history-severity{font-size:9px;padding:1px 4px;border-radius:3px;background:rgba(245,158,11,.15);color:#fbbf24}
    .wz-history-organs{color:var(--wz-cyan)}

    @media(max-width:768px){
      .wz-layout{grid-template-columns:1fr}
      .wangzhen-zone-grid{grid-template-columns:repeat(2,1fr)}
      .wz-topbar{flex-direction:column;text-align:center}
    }
  </style>
</head>
<body>

<!-- 顶栏 -->
<header class="wz-topbar">
  <div>
    <h1>🔍 望诊临床工作台</h1>
    <div style="font-size:11px;color:var(--wz-paper3);margin-top:2px">摄像头采集 → AI面部分析 → 望诊诊断 → 命相同参 → 病例归档</div>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <span id="wz-capabilities" class="wz-capabilities">⏳ 检测中...</span>
    <a href="wangzhen-center.html" class="nav-back">📖 望诊中心</a>
    <a href="tcm-clinic.html" class="nav-back">🏥 中医诊所</a>
    <a href="divination-hub.html" class="nav-back">🏠 主页</a>
  </div>
</header>

<div class="wz-layout">

  <!-- ===== 左栏：患者 + 排盘 ===== -->
  <aside>
    <!-- 患者列表 -->
    <div class="wz-card">
      <div class="wz-card-title">👥 缘主管理 <span class="badge" id="wz-patient-count">0</span></div>
      <div id="wz-patient-list"></div>
      <div class="wz-btn-row">
        <button class="btn btn-ghost" onclick="window.wangzhenClinical.selectPatient(0,'新患者')">+ 新患者</button>
      </div>
      <div id="wz-patient-detail" style="margin-top:8px"></div>
      <div style="font-size:11px;color:var(--wz-paper3);margin-top:4px">当前: <b id="wz-current-patient" style="color:var(--wz-gold)">未选择</b></div>
    </div>

    <!-- 八字排盘 -->
    <div class="wz-card">
      <div class="wz-card-title">📜 八字排盘</div>
      <div class="wz-bazi-input">
        <select id="wz-bazi-year" aria-label="年"><option value="">年</option></select>
        <select id="wz-bazi-month" aria-label="月"><option value="">月</option></select>
        <select id="wz-bazi-day" aria-label="日"><option value="">日</option></select>
        <select id="wz-bazi-hour" aria-label="时"><option value="">时</option></select>
      </div>
      <div class="wz-btn-row">
        <button class="btn btn-secondary" onclick="window.wangzhenClinical.fetchBazi()">🔮 排盘</button>
      </div>
      <div id="wz-paipan-result" style="margin-top:8px"><span class="muted">排盘结果将显示在此</span></div>
    </div>
  </aside>

  <!-- ===== 中栏：采集 + 诊断 ===== -->
  <main>
    <!-- 摄像头采集 -->
    <div class="wz-card">
      <div class="wz-card-title">📷 面部采集 <span class="badge" id="wz-camera-status">未启动</span></div>
      <div class="wz-camera-section">
        <video id="wz-camera-video" class="wz-camera-video" autoplay playsinline></video>
        <canvas id="wz-camera-canvas" class="wz-camera-canvas"></canvas>
        <img id="wz-photo-preview" class="wz-photo-preview" alt="采集照片">
      </div>
      <div class="wz-btn-row">
        <button class="btn btn-primary" id="wz-btn-camera" onclick="window.wangzhenClinical.startCamera()">📷 启动摄像头</button>
        <button class="btn btn-secondary" id="wz-btn-capture" onclick="window.wangzhenClinical.capturePhoto()" style="display:none">📸 拍照分析</button>
        <button class="btn btn-ghost" onclick="window.wangzhenClinical.stopCamera()">关闭</button>
      </div>
      <div id="wz-analysis-status" class="wz-analysis-status"></div>
      <div id="wz-ai-result"></div>
    </div>

    <!-- 语音输入 -->
    <div class="wz-card">
      <div class="wz-card-title">🎤 语音医嘱</div>
      <textarea id="wz-voice-text" class="wz-voice-text" placeholder="点击语音输入，或直接打字记录医嘱..."></textarea>
      <div class="wz-btn-row">
        <button class="btn btn-secondary" id="wz-btn-voice" onclick="window.wangzhenClinical.toggleVoiceInput()">🎤 语音输入</button>
        <button class="btn btn-ghost" onclick="window.wangzhenClinical.speakText(document.getElementById('wz-voice-text').value)">🔊 播报</button>
      </div>
    </div>

    <!-- 望诊诊断 -->
    <div class="wz-card">
      <div class="wz-card-title">🔍 望诊诊断 <span class="badge" id="wz-kb-badge">KB 加载中</span></div>

      <!-- Tab -->
      <div class="wz-tabs">
        <div class="wz-tab active" onclick="window.wangzhenCenter.switchTab('zones')">🗺️ 分区诊断</div>
        <div class="wz-tab" onclick="window.wangzhenCenter.switchTab('colors')">🎨 五色</div>
        <div class="wz-tab" onclick="window.wangzhenCenter.switchTab('organs')">👁️ 五官</div>
        <div class="wz-tab" onclick="window.wangzhenCenter.switchTab('ai')">🤖 AI流程</div>
        <div class="wz-tab" onclick="window.wangzhenCenter.switchTab('therapy')">💊 理疗</div>
      </div>

      <!-- 分区诊断面板 (复用 wangzhen-center) -->
      <div data-tab="zones" style="display:block">
        <div id="wangzhen-zone-map"></div>
        <div id="wangzhen-feature-panel"></div>
        <div id="wangzhen-result-panel"></div>
      </div>
      <div data-tab="colors" style="display:none"><div id="wangzhen-five-colors"></div></div>
      <div data-tab="organs" style="display:none"><div id="wangzhen-organs"></div></div>
      <div data-tab="ai" style="display:none"><div id="wangzhen-ai-steps"></div></div>
      <div data-tab="therapy" style="display:none"><div id="wangzhen-therapy"></div></div>
    </div>

    <!-- 命相同参 -->
    <div class="wz-card wz-mingxiang-section">
      <div class="wz-card-title">🧬 命相同参（面相×八字交叉）</div>
      <div style="font-size:11px;color:var(--wz-paper3);margin-bottom:8px">路总理念：面相看活态，八字看格局，交叉验证最准</div>
      <button class="btn btn-primary" onclick="window.wangzhenClinical.runMingxiang()">🧬 开始交叉分析</button>
      <div id="wz-mingxiang-result"></div>
    </div>
  </main>

  <!-- ===== 右栏：操作 + 病例 ===== -->
  <aside>
    <!-- 操作按钮 -->
    <div class="wz-card">
      <div class="wz-card-title">📋 操作</div>
      <div class="wz-btn-row" style="flex-direction:column">
        <button class="btn btn-primary" onclick="window.wangzhenClinical.saveDiagnosis()">💾 保存诊断到病例</button>
        <button class="btn btn-secondary" onclick="window.wangzhenClinical.generateReport()">🖨️ 生成报告</button>
        <button class="btn btn-ghost" onclick="window.wangzhenClinical.speakText('诊断完成，请查看报告')">🔊 语音播报</button>
      </div>
    </div>

    <!-- 诊断历史 -->
    <div class="wz-card">
      <div class="wz-card-title">📋 望诊历史</div>
      <div id="wangzhen-history"></div>
    </div>

    <!-- 历史病例 -->
    <div class="wz-card">
      <div class="wz-card-title">📂 历史病例</div>
      <div id="wz-saved-cases"><div class="wz-empty">选择患者后显示历史病例</div></div>
    </div>

    <!-- 快捷入口 -->
    <div class="wz-card">
      <div class="wz-card-title">🔗 快捷入口</div>
      <div class="wz-btn-row" style="flex-direction:column">
        <a href="tcm-clinic.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">🏥 中医诊疗</a>
        <a href="tcm-symptom.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">🩺 症状分析</a>
        <a href="ai-assistant.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">🤖 AI助手</a>
        <a href="vision-demo.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">🥽 智镜版</a>
        <a href="camera-capture.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">📷 摄像头采集</a>
        <a href="glass-console.html" class="btn btn-ghost" style="text-decoration:none;text-align:center">👓 眼镜控制台</a>
      </div>
    </div>
  </aside>

</div>

<!-- Modal (五官模块详情) -->
<div id="wangzhen-organ-modal" class="wangzhen-modal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000;align-items:center;justify-content:center;padding:20px" onclick="if(event.target===this)wangzhenCenter.closeOrganModal()">
  <div style="background:#111827;border:1px solid var(--wz-border);border-radius:12px;max-width:600px;max-height:80vh;overflow-y:auto;padding:20px;width:100%">
    <span style="float:right;cursor:pointer;font-size:20px;color:var(--wz-paper3)" onclick="wangzhenCenter.closeOrganModal()">✕</span>
    <div id="wangzhen-organ-modal-body"></div>
  </div>
</div>

<!-- JS -->
<script src="js/wangzhen-kb-loader.js" defer></script>
<script src="js/wangzhen-center.js" defer></script>
<script src="js/wangzhen-clinical.js" defer></script>

<!-- 初始化八字下拉 -->
<script>
(function(){
  var years = [];
  for(var y = 1940; y <= 2025; y++) years.push(y);
  var ySel = document.getElementById('wz-bazi-year');
  var mSel = document.getElementById('wz-bazi-month');
  var dSel = document.getElementById('wz-bazi-day');
  var hSel = document.getElementById('wz-bazi-hour');
  if(ySel) years.forEach(function(y){ var o=document.createElement('option'); o.value=y; o.textContent=y+'年'; ySel.appendChild(o); });
  if(mSel) for(var m=1;m<=12;m++){ var o=document.createElement('option'); o.value=m; o.textContent=m+'月'; mSel.appendChild(o); }
  if(dSel) for(var d=1;d<=31;d++){ var o=document.createElement('option'); o.value=d; o.textContent=d+'日'; dSel.appendChild(o); }
  var hours = [['子','23-01',0],['丑','01-03',1],['寅','03-05',3],['卯','05-07',5],['辰','07-09',7],['巳','09-11',9],['午','11-13',11],['未','13-15',13],['申','15-17',15],['酉','17-19',17],['戌','19-21',19],['亥','21-23',21]];
  if(hSel) hours.forEach(function(h){ var o=document.createElement('option'); o.value=h[2]; o.textContent=h[1]+'时 ('+h[0]+')'; hSel.appendChild(o); });
})();
</script>

</body>
</html>
