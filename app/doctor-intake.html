<style>
:root{--gold:#c9a84c;--bg:#0e1726;--card:#1a2332;--border:#2d3748;--text:#c9d1d9;--muted:#718096;--green:#48bb78;--red:#f56565;--blue:#4299e1;--purple:#9f7aea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:520px;margin:0 auto;min-height:100vh}
h1{color:var(--gold);font-size:17px;margin-bottom:4px;text-align:center}
.sub{text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;border-left:3px solid var(--gold);padding-left:8px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
textarea,select,input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:60px}
.btn{display:block;width:100%;padding:12px;background:var(--gold);color:#0e1726;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.chip-wrap{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{padding:6px 12px;background:var(--bg);border:1px solid var(--border);border-radius:16px;font-size:12px;cursor:pointer;color:var(--text);user-select:none;transition:all .15s}
.chip:hover{border-color:var(--gold)}
.chip.on{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.chip.on::after{content:' ✓';font-size:10px}
.sys-group{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-bottom:8px}
.sys-title{font-size:12px;font-weight:600;color:var(--blue);margin-bottom:6px;display:flex;justify-content:space-between}
.sys-title .count{color:var(--muted);font-size:10px;font-weight:400}
.step-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--gold);color:#0e1726;border-radius:50%;font-size:11px;font-weight:700;margin-right:6px}
.result-box{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;line-height:1.8;margin:8px 0;max-height:300px;overflow-y:auto;white-space:pre-wrap}
.kb-line{border-left:3px solid var(--blue);padding:6px 8px;margin:6px 0;background:rgba(66,153,225,.06);border-radius:0 6px 6px 0}
.kb-line .t{color:var(--blue);font-weight:600}
.progress{height:4px;background:var(--border);border-radius:2px;margin:8px 0;overflow:hidden}
.progress div{height:100%;background:var(--gold);width:0;transition:width .4s;border-radius:2px}
.master-note{background:linear-gradient(135deg,rgba(159,122,234,.1),rgba(66,153,225,.1));border:1px solid rgba(159,122,234,.3);border-radius:8px;padding:10px;font-size:12px;line-height:1.7;margin:8px 0}
.flow-steps-wrap{margin-bottom:8px}
@media(max-width:360px){body{padding:8px 6px}h1{font-size:15px}.card{padding:10px 8px}.card-title{font-size:12px}textarea,input{font-size:12px;padding:6px}.btn{padding:10px;font-size:13px}.chip{padding:5px 10px;font-size:11px}}

<script>
var API=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
var token=localStorage.getItem('admin_token')||localStorage.getItem('token')||'';
var selected={};
var draftText='';
var kbLines=[];
var genBtn=null;

function authHeaders(){var h={'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;return h}
function showToast(msg){var t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2332;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.4)';document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

// 八大系统症状库（结构化）
var SYS_SYMPTOMS={
  '心系':['心悸','胸闷','气短','失眠多梦','健忘','心烦','心痛','心慌','盗汗'],
  '肝系':['头痛头晕','目赤','口苦','胁痛','易怒','情绪抑郁','肢体麻木','抽筋','月经不调'],
  '脾系':['食欲不振','腹胀','便溏','胃痛','反酸','嗳气','恶心呕吐','乏力','消瘦','大便不成形'],
  '肺系':['咳嗽','咳痰','气喘','鼻塞流涕','咽干','咽痛','声音嘶哑','容易感冒','自汗'],
  '肾系':['腰膝酸软','畏寒怕冷','夜尿频多','耳鸣','脱发','阳痿早泄','水肿','五更泄泻','骨质疏松'],
  '气血津液':['面色苍白','面色萎黄','口唇紫暗','皮肤瘀斑','口干','口渴','潮热','手足冰凉','疲劳','出虚汗'],
  '头面五官':['耳鸣耳聋','视物模糊','眼干涩','鼻衄','牙龈出血','口臭','舌痛','咽喉异物感'],
  '二便排泄':['便秘','腹泻','尿频','尿痛','尿黄','便血','里急后重','小便不利']
};
// 症状→系统 反向字典（URL 预填用）
var SYS_SYMPTOMS_DICT={};
Object.keys(SYS_SYMPTOMS).forEach(function(sys){
  SYS_SYMPTOMS[sys].forEach(function(s){SYS_SYMPTOMS_DICT[s]=sys});
});

// 舌象（对齐 docx V1.1 标签池）
var TONGUE_GROUPS={
  '形态':['正常','胖大','瘦薄','齿痕','裂纹','歪斜'],
  '色泽':['淡白','淡红','红','绛红','青紫','瘀斑'],
  '舌苔':['薄白苔','白厚苔','黄苔','黄厚腻','无苔','剥苔'],
  '湿度':['润','干燥','水滑','腻']
};

// 脉象
var PULSE_GROUPS={
  '脉位':['浮','沉','伏'],
  '脉率':['迟','数','疾','缓'],
  '脉形':['细','弦','滑','涩','洪','紧','濡','弱','结','代','促'],
  '脉势':['有力','无力','虚','实']
};

function renderSysGroups(){
  var el=document.getElementById('sys-groups');
  var html='';
  var total=0,sel=0;
  Object.keys(SYS_SYMPTOMS).forEach(function(sys){
    var items=SYS_SYMPTOMS[sys];
    total+=items.length;
    html+='<div class="sys-group"><div class="sys-title">'+sys+' <span class="count" id="cnt-'+sys+'">0/'+items.length+'</span></div><div class="chip-wrap">';
    items.forEach(function(s){
      var on=(selected[s]?' on':'');
      html+='<span class="chip'+on+'" onclick="toggleSym(\''+s+'\',this)">'+s+'</span>';
    });
    html+='</div></div>';
  });
  el.innerHTML=html;
}

function toggleSym(s,el){
  if(selected[s]){delete selected[s];el.classList.remove('on')}
  else{selected[s]=1;el.classList.add('on')}
  updateProgress();
  // 有选择后显示舌脉
  var n=Object.keys(selected).length;
  if(n>0)document.getElementById('card-tongue').style.display='block';
}

// === 语音采集：医生说 → ASR 转写 → 自动勾选症状标签 ===
var voiceRecog=null;
var voiceListening=false;
var voiceWaveTimer=null;
var voiceWaveFrame=0;
function voiceCollect(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('当前浏览器不支持语音识别，请用 Chrome/Edge');return}
  if(voiceListening){voiceRecog.stop();voiceListening=false;clearVoiceWave();return}
  voiceRecog=new SR();
  voiceRecog.lang='zh-CN';
  voiceRecog.continuous=true;
  voiceRecog.interimResults=true;
  voiceRecog.onstart=function(){
    voiceListening=true;voiceWaveFrame=0;
    var el=document.getElementById('voice-status');
    el.style.display='block';
    el.innerHTML='<div id="vw-bar1" style="font-size:18px;letter-spacing:2px;line-height:1.2">▁▂▁▃▁▄▁▅▁▆▁▇</div><div style="font-size:12px;color:var(--blue);margin:4px 0">🎙️ 请说话，描述症状…</div><div id="vw-bar2" style="font-size:14px;letter-spacing:2px;color:var(--muted)">▇▆▅▄▃▂▁▂▃▄▅▆</div>';
    if(voiceWaveTimer)clearInterval(voiceWaveTimer);
    voiceWaveTimer=setInterval(function(){
      voiceWaveFrame++;
      var bars=['▁','▂','▃','▄','▅','▆','▇','█'];
      var w='',w2='';
      for(var i=0;i<12;i++){
        var h=Math.floor(Math.abs(Math.sin((voiceWaveFrame+3*i)*0.7))*7);
        w+=bars[Math.min(h,7)];
        var h2=Math.floor(Math.abs(Math.cos((voiceWaveFrame+5*i)*0.6))*6);
        w2+=bars[Math.min(h2,7)];
      }
      var b1=document.getElementById('vw-bar1');if(b1)b1.textContent=w;
      var b2=document.getElementById('vw-bar2');if(b2)b2.textContent=w2;
    },500);
    if(navigator.vibrate)navigator.vibrate(200);
  };
  voiceRecog.onresult=function(e){
    var text='';
    for(var i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)text+=e.results[i][0].transcript}
    if(!text)return;
    var matched=0;
    Object.keys(SYS_SYMPTOMS_DICT).forEach(function(s){if(text.indexOf(s)>=0&&!selected[s]){selected[s]=1;matched++;document.querySelectorAll('.chip').forEach(function(el){if(el.textContent.replace(/ ✓$/,'')===s)el.classList.add('on')})}});
    ['舌淡白','舌红','舌胖大','齿痕','黄苔','薄白苔','裂纹','剥苔'].forEach(function(t){if(text.indexOf(t.replace('舌',''))>=0&&!selected[t]){selected[t]=1;matched++;document.querySelectorAll('.chip').forEach(function(el){if(el.textContent.replace(/ ✓$/,'')===t.replace('舌',''))el.classList.add('on')})}});
    ['脉细','脉弦','脉滑','脉数','脉沉','脉浮'].forEach(function(p){if(text.indexOf(p.replace('脉',''))>=0&&!selected[p]){selected[p]=1;matched++;document.querySelectorAll('.chip').forEach(function(el){if(el.textContent.replace(/ ✓$/,'')===p.replace('脉',''))el.classList.add('on')})}});
    var otherEl=document.getElementById('other-symptom');
    var unMatched=text.replace(/[。，,.！!？?\s]/g,' ').trim();
    Object.keys(SYS_SYMPTOMS_DICT).forEach(function(s){unMatched=unMatched.split(s).join('')});
    ['舌淡白','舌红','舌胖大','齿痕','黄苔','薄白苔','裂纹','剥苔','细','弦','滑','数','沉','浮'].forEach(function(t){unMatched=unMatched.split(t).join('')});
    unMatched=unMatched.replace(/[，,、]+/g,' ').trim();
    if(unMatched&&otherEl.value.indexOf(unMatched)<0){otherEl.value=otherEl.value?(otherEl.value+'、'+unMatched):unMatched}
    updateProgress();
    if(Object.keys(selected).length>0)document.getElementById('card-tongue').style.display='block';
    if(matched>0){showToast('已识别 '+matched+' 个症状标签');if(navigator.vibrate)navigator.vibrate([50,30,50])}
  };
  voiceRecog.onerror=function(e){voiceListening=false;clearVoiceWave();document.getElementById('voice-status').style.display='none';showToast('语音识别错误：'+(e.error||'未知'))};
  voiceRecog.onend=function(){voiceListening=false;clearVoiceWave();document.getElementById('voice-status').style.display='none'};
  voiceRecog.start();
}
function clearVoiceWave(){if(voiceWaveTimer){clearInterval(voiceWaveTimer);voiceWaveTimer=null}}

function updateProgress(){
  var n=Object.keys(selected).length;
  document.getElementById('symptom-progress').style.width=Math.min(100,n*6)+'%';
}

function renderTongue(){
  var el=document.getElementById('tongue-groups');
  var html='<div class="sys-title">舌象</div>';
  Object.keys(TONGUE_GROUPS).forEach(function(g){
    html+='<div class="sys-group"><div class="sys-title">'+g+'</div><div class="chip-wrap">';
    TONGUE_GROUPS[g].forEach(function(s){
      var key='舌'+s;
      var on=(selected[key]?' on':'');
      html+='<span class="chip'+on+'" onclick="toggleSym(\''+key+'\',this)">'+s+'</span>';
    });
    html+='</div></div>';
  });
  var html2='<div class="sys-title" style="margin-top:6px">脉象</div>';
  Object.keys(PULSE_GROUPS).forEach(function(g){
    html2+='<div class="sys-group"><div class="sys-title">'+g+'</div><div class="chip-wrap">';
    PULSE_GROUPS[g].forEach(function(s){
      var key='脉'+s;
      var on=(selected[key]?' on':'');
      html2+='<span class="chip'+on+'" onclick="toggleSym(\''+key+'\',this)">'+s+'</span>';
    });
    html2+='</div></div>';
  });
  el.innerHTML=html+'<div id="pulse-groups">'+html2+'</div>';
}

// 本地 KB 快速匹配（TCM 辨证 + 处方建议）
var LOCAL_DX_KB={
  '失眠多梦':{dz:'心脾两虚/心肾不交',rx:'归脾汤/酸枣仁汤',key:'心脾两虚'},

  '胸闷气短':{dz:'心气不足/痰浊内阻',rx:'瓜蒌薤白半夏汤/补中益气汤',key:'心气不足'},
  '口干口苦':{dz:'肝胆湿热/胃火',rx:'龙胆泻肝汤/黄连清胃',key:'肝胆湿热'},
  '头痛头晕':{dz:'肝阳上亢/气血亏虚',rx:'天麻钩藤饮/归脾汤',key:'肝阳上亢'},
  '食欲不振':{dz:'脾胃虚弱',rx:'四君子汤/保和丸',key:'脾胃气虚'},
  '腹胀':{dz:'脾虚气滞',rx:'香砂六君子汤',key:'脾虚气滞'},
  '便秘':{dz:'肠燥津亏/气虚',rx:'麻子仁丸/补中益气汤',key:'肠燥津亏'},
  '腰膝酸软':{dz:'肾虚',rx:'六味地黄丸/金匮肾气丸',key:'肾虚'},
  '畏寒怕冷':{dz:'肾阳不足',rx:'金匮肾气丸/附子理中丸',key:'肾阳虚'},
  '咳嗽':{dz:'外感风寒/肺热',rx:'止嗽散/桑菊饮',key:'肺失宣降'},
  '痰多':{dz:'痰湿内蕴',rx:'二陈汤/三子养亲汤',key:'痰湿'},
  '疲劳乏力':{dz:'气虚',rx:'补中益气汤/四君子汤',key:'气虚'},
  '月经不调':{dz:'肝郁/血虚',rx:'逍遥散/四物汤',key:'肝郁血虚'},

  '耳鸣':{dz:'肾精不足/肝火',rx:'耳聋左慈丸/龙胆泻肝汤',key:'肾精不足'},

function generateDraft(){
  var syms=Object.keys(selected);
  var other=document.getElementById('other-symptom').value.trim();
  if(!syms.length&&!other){showToast('请至少选择一个症状');return}
  
  genBtn=document.getElementById('gen-btn');
  genBtn.disabled=true;
  document.getElementById('loading').style.display='block';
  document.getElementById('result-area').style.display='none';
  
  // 结构化请求体（医生点选 + 人机交互 → 后台 FTS5 KB 识别）
  var tongue=[];
  var pulse=[];
  var syms2=[];
  syms.forEach(function(s){
    if(s.indexOf('舌')===0)tongue.push(s);
    else if(s.indexOf('脉')===0)pulse.push(s);
    else syms2.push(s);
  });
  var otherList=other?other.split(/[，,、\s]+/):[];
  var allSymptoms=syms2.concat(otherList).slice(0,10);
  var body={symptoms:allSymptoms,tongue:tongue.slice(0,6),pulse:pulse.slice(0,6)};
  if(selected['脉细']||selected['舌淡白'])body.constitution='气血虚';
  else if(selected['畏寒怕冷']||selected['手足冰凉'])body.constitution='阳虚质';
  else if(selected['潮热盗汗']||selected['舌红'])body.constitution='阴虚质';
  else if(selected['痰多']||selected['齿痕'])body.constitution='痰湿质';
  
  // 优先真实后端（FTS5 KB 引擎），失败降级本地 26 条
  fetch(API+'/api/clinic/ai-draft',{method:'POST',headers:authHeaders(),body:JSON.stringify(body),signal: AbortSignal.timeout(15000)}).catch(function(e){ console.warn("[R514] doctor-intake fetch error:", esc(e.message)); })  .then(function(r){return r.json()})
  .then(function(d){
    if(d&&d.ok&&d.draft){
      draftText=d.draft;
      renderDraftResult(d);
    }else{
      localDraft(allSymptoms,tongue,pulse,body.constitution||'');
    }
  })
  .catch(function(){localDraft(allSymptoms,tongue,pulse,body.constitution||'')});
}

function renderDraftResult(d){
  document.getElementById('loading').style.display='none';
  document.getElementById('ai-result').textContent=d.draft;
  
  var kbHtml='<div class="card-title">📚 知识库支撑（FTS5 引擎 · '+d.engine+'）</div>';
  (d.kbHits||[]).forEach(function(k){
    kbHtml+='<div class="kb-line"><span class="t">'+k.title+'</span><span style="opacity:.6"> ['+k.module+' · trust '+k.trust+']</span><br><span style="font-size:11px;opacity:.75">'+(k.snippet||'').slice(0,80)+'</span></div>';
  });
  document.getElementById('kb-area').innerHTML=kbHtml;
  
  // 命理批注位
  var by=document.getElementById('pt-year').value;
  if(by){
    var bm=document.getElementById('pt-month').value||6;
    var bd=document.getElementById('pt-day').value||15;
    var bh=document.getElementById('pt-hour').value||10;
    document.getElementById('master-note').innerHTML='🀄 <b>周易命理批注请求</b>：出生 '+by+'年'+bm+'月'+bd+'日'+bh+'时 · 已生成八字排盘，命理师可从五行偏颇/流年运势维度补充健康建议（如五行缺木者注意肝胆疏泄，缺金者注意肺肠养护）。';
  }else{
    document.getElementById('master-note').innerHTML='🀄 <b>周易命理批注</b>：补充患者出生时间后，可自动生成八字排盘并从命理维度提供健康预防建议。';
  }
  
  document.getElementById('result-area').style.display='block';
  document.getElementById('result-area').scrollIntoView({behavior:'smooth'});
  genBtn.disabled=false;
}

function localDraft(allSymptoms,tongue,pulse,constitution){
  // 本地降级：26 条症状映射
  var hits=[];
  allSymptoms.forEach(function(s){
    var hit=LOCAL_DX_KB[s];
    if(hit)hits.push({symptom:s,kb:hit});
  });
  var dzCount={};
  hits.forEach(function(h){var k=h.kb.key;dzCount[k]=(dzCount[k]||0)+1});
  var topDz=Object.keys(dzCount).sort(function(a,b){return dzCount[b]-dzCount[a]});
  var mainDz=topDz.slice(0,3).join(' + ')||'综合辨证（需医生结合四诊确认）';
  var rxSet=[];
  hits.forEach(function(h){if(rxSet.indexOf(h.kb.rx)<0)rxSet.push(h.kb.rx)});
  var mainRx=rxSet.slice(0,3).join(' 加减 ')||'（AI 未匹配到处方模板，请医生开方）';
  var symStr=allSymptoms.join('、');
  draftText='【AI 辨证初稿】\n\n主诉症状：'+symStr+'\n'+
    (tongue.length?'舌象：'+tongue.join('、')+'\n':'')+
    (pulse.length?'脉象：'+pulse.join('、')+'\n':'')+
    '\n【辨证】'+mainDz+'\n【治则】随证治之\n【处方】'+mainRx+'\n\n【医嘱】注意休息，清淡饮食，忌辛辣油腻，情志调畅。\n\n⚠️ 本初稿由 AI 基于症状匹配生成，仅供医生参考，须经医生审核确认后方可执行。';
  
  kbLines=hits.slice(0,5).map(function(h){
    return {symptom:h.symptom,dz:h.kb.dz,rx:h.kb.rx};
  });
  
  document.getElementById('loading').style.display='none';
  document.getElementById('ai-result').textContent=draftText;
  
  var kbHtml='<div class="card-title">📚 知识库支撑（本地映射）</div>';
  kbLines.forEach(function(k){
    kbHtml+='<div class="kb-line"><span class="t">'+k.symptom+'</span> → '+k.dz+' · '+k.rx+'</div>';
  });
  document.getElementById('kb-area').innerHTML=kbHtml;
  
  var by=document.getElementById('pt-year').value;
  document.getElementById('master-note').innerHTML=by
    ?'🀄 <b>周易命理批注请求</b>：出生 '+by+'年，已生成八字排盘，命理师可从五行偏颇维度补充健康建议。'
    :'🀄 <b>周易命理批注</b>：补充患者出生时间后，可自动生成八字排盘并从命理维度提供健康预防建议。';
  
  document.getElementById('result-area').style.display='block';
  document.getElementById('result-area').scrollIntoView({behavior:'smooth'});
  genBtn.disabled=false;
}

function editDraft(){
  var box=document.getElementById('ai-result');
  var ta=document.createElement('textarea');
  ta.id='draft-edit';
  ta.style.minHeight='180px';
  ta.value=draftText;
  box.innerHTML='';
  box.appendChild(ta);
  document.getElementById('kb-area').innerHTML='';
  var save=document.createElement('button');
  save.className='btn btn-ghost';
  save.style.marginTop='6px';
  save.textContent='保存修改';
  save.onclick=function(){
    draftText=document.getElementById('draft-edit').value;
    document.getElementById('ai-result').textContent=draftText;
    showToast('已保存修改');
  };
  box.appendChild(save);
}

function submitAsCase(){
  if(!draftText){showToast('请先生成初稿');return}
  // 提交为 medical_case（走患者案例通道）
  var syms=Object.keys(selected).join('、');
  var other=document.getElementById('other-symptom').value.trim();
  var all=syms+(other?('、'+other):'');
  var constitution='';
  if(selected['脉细']||selected['舌淡白'])constitution='气血虚';
  else if(selected['畏寒怕冷']||selected['手足冰凉'])constitution='阳虚质';
  else if(selected['潮热盗汗']||selected['舌红'])constitution='阴虚质';
  else if(selected['痰多']||selected['齿痕'])constitution='痰湿质';
  else constitution='未定';
  
  var body={symptoms:all,constitution:constitution};
  var by=document.getElementById('pt-year').value;
  if(by){body.birthYear=Number(by);body.birthMonth=Number(document.getElementById('pt-month').value||6);body.birthDay=Number(document.getElementById('pt-day').value||15);body.birthHour=Number(document.getElementById('pt-hour').value||10)}
  
  fetch(API+'/api/clinic/submit-symptom',{method:'POST',headers:authHeaders(),body:JSON.stringify(body),signal: AbortSignal.timeout(15000)}).catch(function(e){ console.warn("[R514] doctor-intake fetch error:", esc(e.message)); }).catch(function(e){ console.warn("[R514] doctor-intake fetch error:", esc(e.message)); })
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok||d.caseId){
      window._lastCaseId=d.caseId;showToast('✅ 已提交为案例 #'+(d.caseId||'')+'，AI 正在生成完整初稿');
    }else{
      showToast('提交失败：'+(d.error||'请先登录'));
    }
  }).catch(function(e){showToast('网络错误')});
}

function submitWithPush(){
  if(!draftText){showToast('请先生成初稿');return}
  // 本地记录审核（商用需后端落库，此处先提示完成）
  showToast('✅ 已采纳 AI 初稿为处方（演示模式）');
  // 尝试提交为案例
  submitAsCase();
}

// 🀄 一键送大师批注（携带患者信息跳转 master-intake）
function sendToMaster(){
  var qs=[];
  var name=document.getElementById('pt-name').value;
  var sex=document.getElementById('pt-sex').value;
  var year=document.getElementById('pt-year').value;
  var month=document.getElementById('pt-month').value;
  var day=document.getElementById('pt-day').value;
  var hour=document.getElementById('pt-hour').value;
  var syms=Object.keys(selected).filter(function(s){return s.indexOf('舌')<0&&s.indexOf('脉')<0}).join('、');
  var other=document.getElementById('other-symptom').value.trim();
  if(name)qs.push('name='+encodeURIComponent(name));
  if(sex)qs.push('sex='+encodeURIComponent(sex));
  if(year)qs.push('year='+encodeURIComponent(year));
  if(month)qs.push('month='+encodeURIComponent(month));
  if(day)qs.push('day='+encodeURIComponent(day));
  if(hour)qs.push('hour='+encodeURIComponent(hour));
  if(syms||other)qs.push('symptoms='+encodeURIComponent(syms+(other?'、'+other:'')));
  if(window._lastCaseId)qs.push('caseId='+window._lastCaseId);
  location.href='master-intake.html'+(qs.length?'?'+qs.join('&'):'');
}

// === URL 参数一键带入（医生从队列点「⚡ 快速采集」进入）===
(function(){
  var qs=new URLSearchParams(location.search);
  var name=qs.get('name')||'';
  var sex=qs.get('sex')||'';
  var year=qs.get('year')||'';
  var birthDate=qs.get('birthDate')||'';
  var birthHour=qs.get('birthHour')||'';
  var symptoms=qs.get('symptoms')||'';
  var constitution=qs.get('constitution')||'';
  if(name)document.getElementById('pt-name').value=name;
  if(sex)document.getElementById('pt-sex').value=sex;
  if(year)document.getElementById('pt-year').value=year;
  // 出生日期拆分（Y-M-D）自动填入
  if(birthDate){
    var bd=birthDate.split('-');
    if(bd.length>=3){
      if(!year)document.getElementById('pt-year').value=bd[0];
      document.getElementById('pt-month').value=parseInt(bd[1])||'';
      document.getElementById('pt-day').value=parseInt(bd[2])||'';
    }
  }
  if(birthHour!==''&&birthHour!==null)document.getElementById('pt-hour').value=birthHour;
  if(constitution&&selected){} // constitution 映射体质标签
  if(symptoms){
    // 自动匹配并勾选症状标签
    var parts=symptoms.split(/[，,、\s]+/).filter(Boolean);
    parts.forEach(function(s){
      if(selected[s]===undefined){selected[s]=1;
        document.querySelectorAll('.chip').forEach(function(el){
          if(el.textContent.replace(/ ✓$/,'')===s){el.classList.add('on')}
        });
      }
    });
    updateProgress();
    document.getElementById('card-tongue').style.display='block';
    document.getElementById('other-symptom').value=parts.filter(function(s){return !SYS_SYMPTOMS_DICT[s]}).join('、');
  }
  // 预填后自动生成初稿
  if(symptoms)setTimeout(function(){generateDraft()},300);
})();
