<!-- KB 抽屉 -->
<div id="kbPanel" style="display:none;position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--ink,#1a1a1a);border-left:1px solid rgba(201,168,76,0.3);z-index:9999;overflow-y:auto;padding:16px;box-shadow:-4px 0 24px rgba(0,0,0,0.4)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="color:var(--gold,#c9a84c);margin:0;font-size:16px">📚 知识库</h3>
    <button onclick="closeKBPanel()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">✕</button>
  </div>
  <div id="kbList" style="margin-bottom:12px;font-size:13px;color:var(--paper2,#ccc)"></div>
  <div id="kbContent" style="background:rgba(201,168,76,0.05);border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:var(--paper,#eee);max-height:60vh;overflow-y:auto"></div>
</div>

<!-- 历史抽屉 -->
<div id="historyPanel" style="display:none;position:fixed;top:0;right:0;bottom:0;width:380px;max-width:90vw;background:var(--ink,#1a1a1a);border-left:1px solid rgba(201,168,76,0.3);z-index:9999;overflow-y:auto;padding:16px;box-shadow:-4px 0 24px rgba(0,0,0,0.4)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <h3 style="color:var(--gold,#c9a84c);margin:0;font-size:16px">📜 排盘历史</h3>
    <button onclick="closeHistoryPanel()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">✕</button>
  </div>
  <div id="historyList" style="font-size:13px;color:var(--paper2,#ccc)"></div>
</div>

<!-- 反馈抽屉 -->
<div id="feedbackPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:380px;max-width:90vw;background:var(--ink,#1a1a1a);border:1px solid rgba(201,168,76,0.3);border-radius:12px;z-index:9999;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,0.5)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h3 style="color:var(--gold,#c9a84c);margin:0;font-size:16px">💬 反馈与建议</h3>
    <button onclick="closeFeedback()" style="background:none;border:none;color:#fff;font-size:20px;cursor:pointer">✕</button>
  </div>
  <textarea id="feedbackText" placeholder="说说你对AI助手的建议或遇到的问题..." style="width:100%;min-height:100px;padding:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(201,168,76,0.2);border-radius:6px;color:#fff;font-size:13px;resize:vertical"></textarea>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button onclick="submitFeedback(\'praise\')" style="flex:1;padding:10px;background:rgba(76,175,80,0.2);border:1px solid rgba(76,175,80,0.4);border-radius:6px;color:#fff;cursor:pointer">👍 点赞</button>
    <button onclick="submitFeedback(\'suggest\')" style="flex:1;padding:10px;background:rgba(201,168,76,0.2);border:1px solid rgba(201,168,76,0.4);border-radius:6px;color:#fff;cursor:pointer">💡 建议</button>
    <button onclick="submitFeedback(\'bug\')" style="flex:1;padding:10px;background:rgba(244,67,54,0.2);border:1px solid rgba(244,67,54,0.4);border-radius:6px;color:#fff;cursor:pointer">🐛 问题</button>
  </div>
</div>

<div class="input">
<button class="mic" id="mic" onclick="voice()">🎤</button>
<button class="tts-btn" id="tts-btn" onclick="toggleTTS()" title="朗读/停止">🔊</button>
<input  type="text" id="box" placeholder="输入问题..." onkeypress="if(event.key==='Enter')send()" aria-label="输入问题...">
<button class="send" onclick="send()">➤</button>
</div>
</div>
