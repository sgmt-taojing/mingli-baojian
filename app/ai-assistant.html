<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){console.warn('[SW] reg fail', e);});
  });
  // 离线/上线状态徽章
  function _r89LBadge(){
    var b = document.getElementById('netBadge');
    if(!b) return;
    if(!navigator.onLine){
      b.textContent='⚠️ 离线';
      b.style.background='#ef4444';
      b.style.display='inline-block';
    } else {
      b.textContent='🟢 在线';
      b.style.background='#10b981';
      setTimeout(function(){ if(navigator.onLine) b.style.display='none'; }, 2000);
    }
  }
  window.addEventListener('online', _r89LBadge);
  window.addEventListener('offline', _r89LBadge);
  document.addEventListener('DOMContentLoaded', _r89LBadge);
}
</script>

<!-- R86 TODO 任务总线 -->
<button class="todo-fab" id="todoFabBtn" onclick="openTodoDrawer()" aria-label="行动清单">📋<span class="badge" id="todoBadge" hidden>0</span></button>
<div class="todo-drawer" id="todoDrawer">
  <div class="td-head"><p class="td-title">📝 我的行动清单</p><button class="td-close" onclick="closeTodoDrawer()">✕</button></div>
  <div id="todoContainer"><span style="color:var(--paper3);font-size:12px">报告生成后自动提取...</span></div>
</div>
<script>
(function(){
  if (typeof TodoBus === 'undefined') return;
  var fab = document.getElementById('todoFabBtn');
  var drawer = document.getElementById('todoDrawer');
  var container = document.getElementById('todoContainer');

  function refreshBadge(){
    var s = TodoBus.stats();
    var b = document.getElementById('todoBadge');
    if (s.pending > 0){ b.textContent = s.pending; b.hidden = false; }
    else { b.hidden = true; }
  }

  function openTodoDrawer(){
    if (!drawer) return;
    drawer.classList.add('open');
    TodoBus.render(container, { showClear: true });
    refreshBadge();
  }
  function closeTodoDrawer(){
    if (!drawer) return;
    drawer.classList.remove('open');
  }
  // expose
  window.openTodoDrawer = openTodoDrawer;
  window.closeTodoDrawer = closeTodoDrawer;

  // FAB pulse after every AI report (hook showReport end)
  var _origRender = null;
  document.addEventListener('todo:added', refreshBadge);
  document.addEventListener('todo:done', refreshBadge);
  document.addEventListener('todo:removed', refreshBadge);
  document.addEventListener('todo:clear', refreshBadge);

  // If drawer open, refresh on events
  document.addEventListener('todo:added', function(){
    if (drawer && drawer.classList.contains('open')) TodoBus.render(container, { showClear: true });
  });
  document.addEventListener('todo:done', function(){
    if (drawer && drawer.classList.contains('open')) TodoBus.render(container, { showClear: true });
  });

  // Initial badge
  refreshBadge();

  // Close drawer on outside click
  document.addEventListener('click', function(e){
    if (!drawer) return;
    if (drawer.classList.contains('open') && !drawer.contains(e.target) && e.target !== fab){
      closeTodoDrawer();
    }
  });
})();
</script>
