<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康事业双核仪表盘 | 命理宝鉴</title>
  <link rel="stylesheet" href="css/pro-panel.css">
  
  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/health-career-dashboard-inline.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
  <div class="hcd-wrap">
    <div class="hcd-header">
      <h1>🩺💼 健康事业双核仪表盘</h1>
      <p>排盘分析报告 · 双核驱动 · 12 领域全覆盖 · 古籍权威依据</p>
    </div>

    <div class="hcd-input">
      <label for="hcdMonth">出生年<input type="number" id="hcdYear" value="1990" min="1900" max="2100" aria-label="hcdYear"></label>
      <label for="hcdDay">出生月<input type="number" id="hcdMonth" value="6" min="1" max="12" aria-label="hcdMonth"></label>
      <label for="hcdHour">出生日<input type="number" id="hcdDay" value="15" min="1" max="31" aria-label="hcdDay"></label>
      <label for="hcdGender">出生时<input type="number" id="hcdHour" value="14" min="0" max="23" aria-label="hcdHour"></label>
      <label for="hcdGender">性别<select id="hcdGender" aria-label="hcdGender"><option value="male">男</option><option value="female">女</option></select></label>
      <button onclick="hcdCalculate()">🔮 计算</button>
      <button onclick="hcdPrint()">🖨 打印</button>
    </div>

    <div id="hcdResult"></div>

    <div style="text-align:center;margin-top:40px;padding:24px;opacity:.35;font-size:11px;letter-spacing:2px">
      🏛 命理宝鉴 · 健康事业双核引擎 v1.0 · 综合 25 部古籍<br>
      《滴天髓》《子平真诠》《穷通宝鉴》《三命通会》《紫微斗数全集》《太乙金华宗旨》《黄帝内经》《千金要方》《了凡四训》《阴骘文》《玉历宝钞》《协纪辨方书》《天星择日》《黄帝宅经》《八宅明镜》《玄空飞星》《阳宅三要》《葬书》《撼龙经》《梅花易数》《奇门遁甲》《太上感应篇》《三世因果经》《地藏经》《药师经》
    </div>
  </div>

  
  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/health-career-dashboard-inline.js" defer></script>
</body>
</html>
