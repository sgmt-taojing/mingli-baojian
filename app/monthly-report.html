<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>逐月运势细化报告 · 命理宝鉴</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/critical.css">
<style>
:root{--ink:#1a1a2e;--ink2:#22223a;--paper:#f5f0e6;--gold:#c9a84c;--gold-dim:rgba(201,168,76,.2);--red:#dc4444;--green:#10b981;--yellow:#e8a838;--blue:#3b82f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--ink);color:var(--paper);line-height:1.7;min-height:100vh;padding-bottom:60px}
.container{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.4rem;color:var(--gold);margin:16px 0 8px;text-align:center}
h2{font-size:1.1rem;color:var(--gold);margin:14px 0 8px;border-bottom:1px solid var(--gold-dim);padding-bottom:4px}
.subtitle{text-align:center;font-size:.8rem;color:rgba(245,240,230,.5);margin-bottom:16px}
.form-card{background:var(--ink2);border-radius:10px;padding:16px;margin-bottom:16px}
.form-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.form-row label{font-size:.8rem;opacity:.7;width:60px;padding-top:10px}
.form-row input,.form-row select{flex:1;min-width:120px;padding:8px 10px;background:var(--ink);border:1px solid var(--gold-dim);border-radius:6px;color:var(--paper);font-size:14px}
.btn{display:block;width:100%;padding:12px;background:linear-gradient(135deg,var(--gold),#b8963a);color:var(--ink);border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:wait}
.result-card{background:var(--ink2);border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid var(--gold-dim)}
.month-header{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.month-badge{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;font-weight:700;font-size:14px}
.badge-旺{background:rgba(16,185,129,.2);color:var(--green);border:1px solid var(--green)}
.badge-相{background:rgba(59,130,246,.2);color:var(--blue);border:1px solid var(--blue)}
.badge-休{background:rgba(232,168,56,.2);color:var(--yellow);border:1px solid var(--yellow)}
.badge-囚{background:rgba(220,68,68,.2);color:var(--red);border:1px solid var(--red)}
.badge-死{background:rgba(220,68,68,.3);color:var(--red);border:1px solid var(--red)}
.badge-平{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid var(--gold)}
.dim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0}
.dim-cell{background:var(--ink);border-radius:6px;padding:8px;text-align:center}
.dim-name{font-size:.75rem;opacity:.6}
.dim-score{font-size:1.1rem;font-weight:700;margin:2px 0}
.dim-stars{font-size:.7rem;opacity:.5}
.dim-action{font-size:.65rem;opacity:.5;margin-top:2px}
.score-90{color:var(--green)}.score-75{color:var(--blue)}.score-55{color:var(--yellow)}.score-40{color:var(--red)}.score-30{color:var(--red)}
.year-table-wrap{overflow-x:auto;margin:10px 0}
.year-table{width:100%;border-collapse:collapse;font-size:.75rem;min-width:500px}
.year-table th,.year-table td{padding:5px 7px;text-align:center;border-bottom:1px solid var(--gold-dim)}
.year-table th{color:var(--gold);font-weight:600}
.year-table tr.current-month{background:rgba(201,168,76,.08)}
.st-cell{font-weight:600}
.st-旺{color:var(--green)}.st-相{color:var(--blue)}.st-休{color:var(--yellow)}.st-囚{color:var(--red)}.st-死{color:var(--red)}
.kb-ref{background:rgba(201,168,76,.05);border-left:3px solid var(--gold);padding:8px 12px;margin:8px 0;font-size:.8rem;border-radius:0 6px 6px 0;opacity:.85}
.tips{font-size:.8rem;opacity:.7;margin-top:6px}
.advice-row{display:flex;gap:8px;margin-top:6px;font-size:.78rem}
.advice-row .label{opacity:.5;white-space:nowrap}
.advice-row .val{opacity:.8}
.loading-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,26,46,.85);display:flex;align-items:center;justify-content:center;z-index:100;font-size:1rem;color:var(--gold)}
.spin{display:inline-block;width:24px;height:24px;border:2px solid var(--gold-dim);border-top-color:var(--gold);border-radius:50%;animation:sp .8s linear infinite;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:768px){.container{padding:10px}.form-row label{width:50px}.year-table{font-size:.65rem}}
</style>
</head>
<body>
<div class="container">
  <h1>📅 逐月运势细化报告</h1>
  <p class="subtitle">本年逐月 + 当月/次月详细 · 趋吉避凶 · 知命改运</p>

  <div class="form-card">
    <div class="form-row">
      <label>年</label>
      <input type="number" id="inpYear" value="1990" min="1900" max="2100">
      <label>月</label>
      <input type="number" id="inpMonth" value="1" min="1" max="12">
      <label>日</label>
      <input type="number" id="inpDay" value="1" min="1" max="31">
    </div>
    <div class="form-row">
      <label>时辰</label>
      <select id="inpHour">
        <option value="0">子时 23-1</option><option value="1">丑时 1-3</option>
        <option value="2">寅时 3-5</option><option value="3">卯时 5-7</option>
        <option value="4">辰时 7-9</option><option value="5">巳时 9-11</option>
        <option value="6" selected>午时 11-13</option><option value="7">未时 13-15</option>
        <option value="8">申时 15-17</option><option value="9">酉时 17-19</option>
        <option value="10">戌时 19-21</option><option value="11">亥时 21-23</option>
      </select>
      <label>性别</label>
      <select id="inpSex">
        <option value="male">男</option><option value="female">女</option>
      </select>
    </div>
    <div class="form-row">
      <label>日主</label>
      <select id="inpDayEle">
        <option value="">自动推断</option>
        <option value="木">木</option><option value="火">火</option>
        <option value="土">土</option><option value="金">金</option><option value="水">水</option>
      </select>
      <label>目标年</label>
      <input type="number" id="inpTargetYear" value="2026" min="2024" max="2100">
    </div>
    <button class="btn" id="genBtn" onclick="generate()">🔮 生成逐月报告</button>
  </div>

  <div id="resultArea" style="display:none"></div>
</div>

<div class="loading-overlay" id="loadingOverlay" style="display:none">
  <span class="spin"></span> 正在生成逐月运势报告...
</div>

<script src="js/report-engine.js" defer></script>
<script src="js/report-render-adapters.js" defer></script>
<script>
(function(){
  'use strict';
  var API = (location.hostname==='127.0.0.1'||location.hostname==='localhost') ? 'http://127.0.0.1:8920' : '';

  function esc(s){return String(s||'').replace(/[<>"&]/g,function(c){return{'<':'&lt;','>':'&gt;','"':'&quot;','&':'&amp;'}[c]});}

  var DIM_NAMES = {career:'事业',wealth:'财运',love:'感情',health:'健康',study:'学业',luck:'综合'};

  function statusClass(st){return 'badge-'+esc(st);}
  function scoreCls(v){
    if(v>=80)return 'score-90';
    if(v>=65)return 'score-75';
    if(v>=50)return 'score-55';
    return 'score-30';
  }

  function renderMonthCard(md, isCurrent){
    var rel2cn = {'比和':'当令旺','生':'生扶','泄':'泄气','克':'逆克','被克':'受克'};
    var rel2cls = {'比和':'badge-旺','生':'badge-相','泄':'badge-休','克':'badge-死','被克':'badge-囚'};
    var star2score = {1:30,2:45,3:55,4:75,5:90};
    var h = '<div class="result-card">';
    h += '<div class="month-header">';
    h += '<span class="month-badge '+(rel2cls[md.relation]||'badge-平')+'">'+md.month+'月</span>';
    h += '<span style="font-weight:600;font-size:1rem">'+esc(md.ganZhi||'')+' ('+esc(md.name||'')+')</span>';
    h += '<span style="margin-left:auto;font-size:.75rem;opacity:.5">'+esc(md.element)+'旺 · '+esc(rel2cn[md.relation]||md.relation)+'</span>';
    h += '</div>';
    h += '<div style="font-size:.8rem;opacity:.7">'+esc(md.advice||'')+'</div>';
    // 维度网格（scores 是 1-5 星制）
    h += '<div class="dim-grid">';
    Object.entries(md.scores||{}).forEach(function(dk){
      var star=dk[1]; var v=star2score[star]||55;
      var stars='★'.repeat(star)+'☆'.repeat(5-star);
      var dn=DIM_NAMES[dk[0]]||dk[0];
      var action='';
      if(star>=4)action='✅ 大吉';
      else if(star===3)action='🟢 平稳';
      else action='🔴 保守';
      h+='<div class="dim-cell"><div class="dim-name">'+esc(dn)+'</div><div class="dim-score '+scoreCls(v)+'">'+star+'★</div><div class="dim-stars">'+stars+'</div><div class="dim-action">'+action+'</div></div>';
    });
    h += '</div>';
    // 趋吉避凶
    var luckyDir = {'木':'东方/绿色/3·8','火':'南方/红色/2·7','土':'中央/黄色/5·0','金':'西方/白色/4·9','水':'北方/蓝黑/1·6'}[md.element]||'';
    var avoidTip = (md.relation==='被克'||md.relation==='克')?'本月宜静不宜动，可拜太岁/祈福化解':'顺势而为，借势推进';
    h+='<div class="advice-row"><span class="label">趋吉：</span><span class="val">'+esc(luckyDir)+'</span></div>';
    h+='<div class="advice-row"><span class="label">避凶：</span><span class="val">'+avoidTip+'</span></div>';
    h += '</div>';
    return h;
  }

  function renderYearTable(yearOverview, currentMonthNum){
    var rel2cls = {'比和':'st-旺','生':'st-相','泄':'st-休','克':'st-死','被克':'st-囚'};
    var rel2cn = {'比和':'当令','生':'生扶','泄':'泄气','克':'逆克','被克':'受克'};
    var h = '<div class="result-card"><h2>📊 全年总览</h2>';
    h += '<div class="year-table-wrap"><table class="year-table"><thead><tr>';
    h += '<th>月</th><th>月令</th><th>干支</th><th>五行</th><th>关系</th><th>事业</th><th>财运</th><th>感情</th><th>健康</th>';
    h += '</tr></thead><tbody>';
    yearOverview.forEach(function(y){
      var cls = (y.month===currentMonthNum)?' class="current-month"':'';
      h+='<tr'+cls+'>';
      h+='<td>'+y.month+'月</td>';
      h+='<td>'+esc(y.name)+'</td>';
      h+='<td style="font-weight:600">'+esc(y.ganZhi||'')+'</td>';
      h+='<td>'+esc(y.element)+'</td>';
      h+='<td class="st-cell '+(rel2cls[y.relation]||'')+'">'+esc(rel2cn[y.relation]||y.relation)+'</td>';
      ['career','wealth','love','health'].forEach(function(d){
        var s=y.scores?y.scores[d]:'-';
        var stars = (typeof s==='number')?('★'.repeat(s)+'☆'.repeat(5-s)):'-';
        h+='<td style="font-size:.7rem">'+stars+'</td>';
      });
      h+='</tr>';
    });
    h += '</tbody></table></div>';
    h += '<div style="font-size:.7rem;opacity:.4;margin-top:6px">';
    h += '<span class="st-旺">当令</span>=顺势 · <span class="st-相">生扶</span>=贵人 · <span class="st-休">泄气</span>=耗散 · <span class="st-囚">受克</span>=守宜 · <span class="st-死">逆克</span>=忌冲';
    h += '</div></div>';
    return h;
  }

  window.generate = async function(){
    var btn=document.getElementById('genBtn');
    var overlay=document.getElementById('loadingOverlay');
    btn.disabled=true; btn.textContent='⏳ 生成中...';
    overlay.style.display='flex';

    var data = {
      year: parseInt(document.getElementById('inpYear').value)||1990,
      month: parseInt(document.getElementById('inpMonth').value)||1,
      day: parseInt(document.getElementById('inpDay').value)||1,
      hour: parseInt(document.getElementById('inpHour').value)||0,
      sex: document.getElementById('inpSex').value,
      dayEle: document.getElementById('inpDayEle').value,
      targetYear: parseInt(document.getElementById('inpTargetYear').value)||2026
    };

    try {
      // 获取 CSRF token
      var csrfResp = await fetch(API+'/api/csrf-token').then(function(r){return r.json()});
      var headers = {'Content-Type':'application/json','x-csrf-token':csrfResp.csrfToken};
      if(API) headers['Origin']='http://127.0.0.1:8914';

      var resp = await fetch(API+'/api/ai/monthly-report', {
        method:'POST', headers:headers, body:JSON.stringify(data)
      });
      var result = await resp.json();

      if(!result.ok && result.data && result.data.report){
        // 兼容旧格式
        result = {ok:true, data:result};
      }
      if(!result.ok){
        throw new Error(result.message||'API error');
      }

      var data = result.data;
      // R91 新版：data.currentMonth / data.nextMonth / data.yearOverview
      // R89 旧版：data.report.currentMonth.data / data.report.nextMonth.data
      var report = data.report || {};
      var curData = (report.currentMonth && report.currentMonth.data) || data.currentMonth || {};
      var nxtData = (report.nextMonth && report.nextMonth.data) || data.nextMonth || {};
      var yearOv = data.yearOverview || report.yearOverview || [];
      var userEle = data.userEle || report.userEle || '';
      var kbHits = data.kbHits || report.kbHits || 0;
      var generatedAt = report.generatedAt || new Date().toISOString();

      var nowMonth = new Date().getMonth()+1;
      var area = document.getElementById('resultArea');

      var html = '';
      // 当前月详细
      html += '<h2>🔥 本月详细 ('+esc(curData.name || (curData.month+'月'))+' · '+esc(curData.ganZhi||'')+')</h2>';
      html += renderMonthCard(curData, true);
      // 附加 R90 化解建议（如果有 KB 命中）
      if(report.currentMonth && report.currentMonth.text){
        html += '<div class="result-card"><h3>💎 化解方案与月令详解</h3><pre style="white-space:pre-wrap;font-family:inherit;font-size:.82rem;line-height:1.7">'+esc(report.currentMonth.text)+'</pre></div>';
      }
      // 下月详细
      html += '<h2>⏭️ 下月前瞻 ('+esc(nxtData.name || (nxtData.month+'月'))+' · '+esc(nxtData.ganZhi||'')+')</h2>';
      html += renderMonthCard(nxtData, false);
      if(report.nextMonth && report.nextMonth.text){
        html += '<div class="result-card"><h3>💎 下月化解与详解</h3><pre style="white-space:pre-wrap;font-family:inherit;font-size:.82rem;line-height:1.7">'+esc(report.nextMonth.text)+'</pre></div>';
      }
      // 全年总览表
      html += renderYearTable(yearOv, nowMonth);
      // KB 命中统计
      html += '<div class="result-card" style="text-align:center;font-size:.8rem;opacity:.5">';
      html += '🎯 KB命中 '+kbHits+' 条 · ';
      html += '日主五行：'+esc(userEle)+' · ';
      html += '生成时间：'+new Date(generatedAt).toLocaleString('zh-CN');
      html += '</div>';

      area.innerHTML = html;
      area.style.display = 'block';
      area.scrollIntoView({behavior:'smooth'});
    } catch(e) {
      var errArea = document.getElementById('resultArea');
      errArea.innerHTML = '<div class="result-card" style="border-color:var(--red);color:var(--red)">❌ '+esc(e.message)+'</div>';
      errArea.style.display='block';
    } finally {
      btn.disabled=false; btn.textContent='🔮 生成逐月报告';
      overlay.style.display='none';
    }
  };
})();
</script>
<script src="js/mobile-nav.js" defer></script>
</body>
</html>
