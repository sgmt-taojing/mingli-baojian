<h1>KB 骨架治理</h1>
<div class="sub">自动扫描 <code>title [骨架提示]</code> + <code>content &lt; 20 char</code> 的真骨架条目 · 支持在线补内容</div>
<div id="loading">加载中…</div>
<div id="app" style="display:none">
  <div class="summary-bar" id="stats"></div>
  <div id="modules"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const API='http://127.0.0.1:8920';
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
async function load(){
  try{
    const r=await fetch(API+'/api/kb/skeleton-scan');
    const d=await r.json();
    const data=d.data||d;
    if(!data.summary){document.getElementById('loading').textContent='无数据';return}
    const s=data.summary;
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='';
    // stats
    document.getElementById('stats').innerHTML=`
      <div class="stat warn"><div class="v">${s.total}</div><div class="l">真骨架条目</div></div>
      <div class="stat"><div class="v">${s.modules}</div><div class="l">受影响模块</div></div>
      <div class="stat ok"><div class="v">${s.coverage}%</div><div class="l">有源覆盖率</div></div>
      <div class="stat ok"><div class="v">${s.withSrc}/${s.total}</div><div class="l">有 src_id</div></div>
    `;
    // modules
    const mc=document.getElementById('modules');
    mc.innerHTML=(data.modules||[]).map(m=>`
      <details class="module-card" id="mod-${m.module}">
        <summary>
          <span>${m.module}</span>
          <span class="badge">${m.count}</span>
          <span class="src-badge">src ${m.withSrc}/${m.count}</span>
        </summary>
        <div class="items">
          ${m.items.map(it=>`
            <div class="item">
              <span class="eid">${it.entry_id}</span>
              <span class="ttl">${it.title}</span>
              ${!it.has_content?'<span class="empty-item">无内容</span>':''}
              <span class="ts">trust ${it.trust_score}</span>
              <span class="hk">hit ${it.hit_count}</span>
              <button onclick="toggleRefill('${it.entry_id}')" style="background:var(--warn);color:#000;border:none;padding:2px 10px;border-radius:4px;cursor:pointer;font-size:.75rem">补内容</button>
            </div>
            <div class="refill-area" id="refill-${it.entry_id}">
              <textarea id="ta-${it.entry_id}" placeholder="输入补充内容（≥ 60 字）…" aria-label="输入补充内容（≥ 60 字）…"></textarea>
              <button onclick="submitRefill('${it.entry_id}')">提交</button>
            </div>
          `).join('')}
        </div>
      </details>
    `).join('');
  }catch(e){document.getElementById('loading').textContent='查阅失败: '+e.message}
}
function toggleRefill(eid){const el=document.getElementById('refill-'+eid);el.classList.toggle('show')}
async function submitRefill(eid){
  const ta=document.getElementById('ta-'+eid);
  const content=ta.value.trim();
  if(content.length<60){toast('内容需 ≥ 60 字（当前 '+content.length+'）');return}
  try{
    const r=await fetch(API+'/api/kb/refill-skeleton',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entry_id:eid,content})});
    const d=await r.json();
    if(d.code===0||d.ok){toast('✅ '+eid+' 已补充 ('+content.length+' 字)');setTimeout(()=>load(),800)}
    else toast('❌ '+(d.message||d.error||'失败'))
  }catch(e){toast('❌ '+e.message)}
}
load();
</script>
