*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:100%;margin:0 auto}
h1{color:var(--gold);font-size:20px;margin-bottom:16px;text-align:center}
.nav-back{display:inline-block;color:var(--gold);text-decoration:none;font-size:13px;margin-bottom:12px;padding:4px 10px;border:1px solid var(--border);border-radius:6px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:14px}
.card-title{font-size:15px;font-weight:600;color:var(--gold);margin-bottom:10px}
.identity-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.id-tab{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;font-size:13px;transition:all .2s;display:flex;align-items:center;gap:6px}
.tab-ic{width:16px;height:16px;flex:none}
.id-tab.active{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.info-item{padding:8px 10px;background:var(--bg);border-radius:6px;border:1px solid var(--border)}
.info-label{font-size:11px;color:var(--muted);margin-bottom:2px}
.info-value{font-size:14px;color:var(--text)}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}
.stat-box{flex:1;min-width:80px;text-align:center;padding:10px;background:var(--bg);border-radius:8px;border:1px solid var(--border)}
.stat-num{font-size:22px;font-weight:700;color:var(--gold)}
.stat-label{font-size:11px;color:var(--muted);margin-top:2px}
.case-item{padding:10px;background:var(--bg);border-radius:6px;border:1px solid var(--border);margin-bottom:8px}
.case-symptoms{font-size:13px;margin-bottom:4px}
.case-diagnosis{font-size:12px;color:var(--muted)}
.bridge-box{padding:12px;background:linear-gradient(135deg,rgba(159,122,234,.1),rgba(66,153,225,.1));border:1px solid rgba(159,122,234,.3);border-radius:8px;margin-top:10px}
.bridge-title{font-size:13px;color:var(--purple);font-weight:600;margin-bottom:6px}
.bridge-content{font-size:12px;color:var(--text);line-height:1.6}
.btn{display:inline-block;padding:6px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:12px;text-decoration:none}
.btn-primary{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}
@media(max-width:768px){.info-grid{grid-template-columns:1fr}}
@media(max-width:480px){.stat-num{font-size:18px}}
@media(max-width:360px){.id-tab{padding:6px 10px;font-size:11px}}
@media print{body{background:#fff!important;color:#000!important;padding:8px!important}header.page-header-bar,.phb-back,.nav-back,nav,.nav-bar,.no-print,footer,.btn,button,.id-tab{display:none!important}.card{box-shadow:none!important;border:1px solid #ddd!important;page-break-inside:avoid}.card-title{color:#000!important}.info-grid{grid-template-columns:1fr 1fr!important}.info-item,.stat-box,.case-item{border:1px solid #ccc!important;background:#fff!important}.stat-num{color:#000!important}.bridge-box{background:none!important;border:1px solid #ddd!important}.bridge-title{color:#333!important}.empty{color:#666!important}a{color:#000!important;text-decoration:none!important}h1{color:#000!important;font-size:16px!important}}

/* R742: 按钮交互三态 */
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid #c9a84c;outline-offset:2px}
/* G14: 信众求测表单 + 时间线 */
.qc-in{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;color:var(--text);font-size:14px;font-family:inherit}
.qc-b{flex:1;min-width:0}
.qc-timeline{display:flex;flex-direction:column;gap:8px}
.qc-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;border-left:3px solid var(--muted)}
.qc-item.qc-done{border-left-color:var(--green)}
.qc-item.qc-draft{border-left-color:var(--gold)}
.qc-badge{font-size:10px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.qc-done .qc-badge,.qc-badge.qc-done{color:var(--green);border-color:rgba(72,187,120,.4)}
.qc-draft .qc-badge,.qc-badge.qc-draft{color:var(--gold);border-color:rgba(201,168,76,.4)}</style>

<script>

function switchId(id){currentId=id;document.querySelectorAll('.id-tab').forEach(function(t){t.classList.remove('active')});var t=document.querySelectorAll('.id-tab');for(var i=0;i<t.length;i++){var txt=t[i].textContent;var kw=id==='yuanzhu'?'缘':id==='patient'?'患':id==='believer'?'信':id==='wellness'?'康':id==='full'?'全':id;if(txt.indexOf(kw)>-1)t[i].classList.add('active')}render()}

if(currentId==='yuanzhu')renderY();else if(currentId==='patient')renderP();else if(currentId==='believer')renderB();else if(currentId==='wellness')renderW();else renderF()}

function renderP(){fj(API+'/api/patient/profile/'+uid).then(function(d){var u=d.user||{},cs=d.cases||[],s=d.stats||{};var h='<div class="card"><div class="card-title">🩺 患者档案</div><div class="info-grid">'+info('姓名',u.name||'')+info('性别',u.sex||'')+info('出生',u.birth_date||'')+'</div></div>';h+='<div class="card"><div class="card-title">📊 诊疗统计</div><div class="stat-row">'+stat(s.total_cases||0,'诊疗')+stat(s.pending_cases||0,'待处理')+stat(s.completed_cases||0,'完成')+stat(s.follow_up_count||0,'复诊')+'</div></div>';if(cs.length>0){h+='<div class="card"><div class="card-title">📊 诊疗记录</div>';cs.forEach(function(c){h+='<div class="case-item"><div class="case-symptoms">'+c.symptoms+'</div>'+(c.diagnosis?'<div class="case-diagnosis">辨证:'+c.diagnosis+'</div>':'')+(c.treatment_outcome?'<div class="case-diagnosis">疗效:'+c.treatment_outcome+'</div>':'')+'</div>'});h+='</div>'}c.innerHTML=h})}
function renderB(){var c=document.getElementById('content');c.innerHTML=
'<div class="card"><div class="card-title">📮 发起求测</div>'+
'<div style="display:grid;gap:8px">'+
'<select id="qcCat" class="qc-in"><option value="">选择求测类目（16 域）</option></select>'+
'<textarea id="qcMatter" class="qc-in" rows="2" placeholder="简述所问事项，如：想看看今年事业方向是否宜变动"></textarea>'+
'<div style="display:flex;gap:8px"><input id="qcName" class="qc-in" placeholder="称呼（选填）"><select id="qcGender" class="qc-in" style="max-width:90px"><option value="男">男</option><option value="女">女</option></select></div>'+
'<div style="display:flex;gap:6px;flex-wrap:wrap"><input id="qcY" class="qc-in qc-b" placeholder="出生年"><input id="qcM" class="qc-in qc-b" placeholder="月"><input id="qcD" class="qc-in qc-b" placeholder="日"><input id="qcH" class="qc-in qc-b" placeholder="时(选填)"></div>'+
'<input id="qcPhone" class="qc-in" placeholder="手机号（接收核对完成通知）" inputmode="tel" maxlength="11">'+
'<label style="font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;line-height:1.5"><input type="checkbox" id="qcAge" style="margin-top:2px">我已年满 18 周岁。未成年人暂不开放信众求测服务。</label>'+
'<button class="btn btn-primary" id="qcSubmit" onclick="submitQiuce()" style="padding:10px">提交求测（AI 初稿 → 命理师核对）</button>'+
'<div style="font-size:11px;color:var(--muted);line-height:1.6">本服务为传统易学参考，不构成医学诊断或重大决策依据；AI 初稿经命理师核对后方可作为正式报告。</div>'+
'</div></div>'+
'<div class="card"><div class="card-title">📋 我的报告 <button class="btn" style="float:right;padding:2px 10px;font-size:11px" onclick="loadMyQiuce()">刷新</button></div><div id="qcMine"><div class="empty">填写手机号提交求测后，这里会出现您的报告时间线</div></div></div>'+
'<div class="card"><div class="card-title">🩺 我的就诊记录（只读）</div><div id="qcEmr"><div class="empty">与求测同手机号自动关联，仅展示不修改</div></div></div>';
var sel=document.getElementById('qcCat');QIUCE_CATS.forEach(function(k){var o=document.createElement('option');o.value=k.id;o.textContent=k.name+(k.needBirth?'（需生辰）':'');sel.appendChild(o)});
try{var saved=localStorage.getItem('qiuce_phone');if(saved)document.getElementById('qcPhone').value=saved;if(saved){loadMyQiuce();loadMyEmr()}}catch(e){}}

function qcPost(u,body){return fetch(API+u,{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)}).then(function(r){return r.json()})}

if(!document.getElementById('qcAge').checked){alert('请确认您已年满 18 周岁');return}

else alert(d&&(d.message||d.error)||'提交失败')}).catch(function(e){btn.disabled=false;btn.textContent='提交求测（AI 初稿 → 命理师核对）';alert('网络异常，请稍后再试')})}
function loadMyQiuce(){var phone=document.getElementById('qcPhone').value.trim();if(!/^1\d{10}$/.test(phone))return;
qcGet('/api/public/qiuce/mine?phone='+phone).then(function(d){var m=document.getElementById('qcMine');var list=(d&&d.data&&d.data.list)||(d&&d.list)||[];

var h='<div class="qc-timeline">';list.forEach(function(it){var cls=it.status==='master_reviewed'?'qc-done':it.status==='ai_draft'?'qc-draft':'qc-wait';
h+='<div class="qc-item '+cls+'"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:13px">'+escapeHtml(it.categoryName)+' · #'+it.id+'</b><span class="qc-badge">'+escapeHtml(it.statusLabel)+'</span></div>'+
'<div style="font-size:12px;color:var(--muted);margin:4px 0">'+escapeHtml(it.matter)+'</div>'+
'<div style="font-size:11px;color:var(--muted)">'+escapeHtml(it.created_at||'')+'</div>'+
'<div style="margin-top:6px;display:flex;gap:8px"><button class="btn" style="font-size:11px;padding:4px 10px" onclick="viewQiuce('+it.id+')">查看报告</button><button class="btn" style="font-size:11px;padding:4px 10px" onclick="againQiuce(\''+it.category+'\')">再次求测</button></div></div>'});
m.innerHTML=h+'</div>'}).catch(function(){})}
function viewQiuce(id){var phone=document.getElementById('qcPhone').value.trim();
qcGet('/api/public/qiuce/'+id+'?phone='+phone).then(function(d){var it=(d&&d.data)||d||{};
var w=document.getElementById('qcView');if(!w){w=document.createElement('div');w.id='qcView';document.getElementById('qcMine').parentNode.appendChild(w)}
w.innerHTML='<div class="qc-item" style="border-color:var(--gold)"><div style="display:flex;justify-content:space-between;align-items:center"><b>'+escapeHtml(it.categoryName||'')+' 报告 · #'+id+'</b><span class="qc-badge '+(it.status==='master_reviewed'?'qc-done':'qc-draft')+'">'+escapeHtml(it.statusLabel||'')+'</span></div>'+
(it.reviewer?'<div style="font-size:11px;color:var(--green);margin-top:4px">核对：'+escapeHtml(it.reviewer)+(it.reviewedAt?' · '+escapeHtml(it.reviewedAt):'')+'</div>':'')+
'<pre style="white-space:pre-wrap;word-break:break-word;font-size:12px;line-height:1.8;margin-top:8px;max-height:50vh;overflow:auto">'+escapeHtml(it.draft||'报告整理中')+'</pre>'+
'<div style="font-size:11px;color:var(--muted);margin-top:6px">'+escapeHtml(it.disclaimer||'')+'</div></div>';
w.scrollIntoView({behavior:'smooth'})}).catch(function(){alert('查询失败')})}
function againQiuce(cat){document.getElementById('qcCat').value=cat;document.getElementById('qcMatter').value='';document.getElementById('qcMatter').focus();window.scrollTo({top:0,behavior:'smooth'})}
function loadMyEmr(){var phone=document.getElementById('qcPhone').value.trim();if(!/^1\d{10}$/.test(phone))return;
qcGet('/api/public/my-emr?phone='+phone).then(function(d){var m=document.getElementById('qcEmr');var list=(d&&d.data&&d.data.list)||[];
if(!list.length){m.innerHTML='<div class="empty">该手机号暂无就诊记录</div>';return}
var h='';list.forEach(function(it){h+='<div class="case-item"><div class="case-symptoms">病历 #'+it.caseId+' · '+escapeHtml(it.complaint||'—')+'</div><div class="case-diagnosis">'+escapeHtml(it.syndrome||'')+' · '+(it.reviewStatus==='approved'?'医师已审核':'待审核')+' · '+escapeHtml(it.created_at||'')+'</div></div>'});
m.innerHTML=h+'<div style="font-size:11px;color:var(--muted)">仅展示，不可修改；完整病历请走患者通道</div>'}).catch(function(){})}
function renderW(){fj(API+'/api/wellness/profile/'+uid).then(function(d){var r=d.data||{};var h='<div class="card"><div class="card-title">🌿 康养人档案</div><div class="info-grid">'+info('姓名',r.name||'')+info('性别',r.sex||'')+info('年龄',r.age||'')+info('身高/体重',r.height||'')+info('出生',r.birth_date||'')+info('日主五行',r.day_element?(r.day_master+' / '+r.day_element):'')+'</div></div>';h+='<div class="card"><div class="card-title">⚠️ 风险等级</div>';var rl=r.risk_level||'normal';var rcl={high:'#f56565',mid:'#ed8936',normal:'#48bb78'}[rl]||'#48bb78';var rn={high:'高风险',mid:'中风险',normal:'正常'}[rl]||'正常';h+='<div style="padding:12px;background:'+rcl+'22;border-radius:8px;text-align:center"><div style="font-size:24px;color:'+rcl+'"><b>'+rn+'</b></div><div style="font-size:11px;color:var(--muted);margin-top:4px">综合日主五行+家族遗传+症状评估</div></div></div>';h+='<div class="card"><div class="card-title">🧬 家族遗传</div><div style="font-size:12px;line-height:1.6">'+(r.family_genetic||'无')+'</div></div>';if(r.bp)h+='<div class="card"><div class="card-title">🩺 西医指标</div><div style="font-size:12px;line-height:1.8">血压:'+r.bp+' | 心率:'+r.hr+' | 血糖:'+r.glucose+' | 血脂:'+r.lipid+'<br>肝:'+r.liver+' | 肾:'+r.kidney+'</div></div>';h+='<div class="card"><div class="card-title">中医体质</div><div style="font-size:12px;line-height:1.6">怕冷热:'+(r.temp_pref||'')+' | 出汗:'+(r.sweat||'')+' | 食欲:'+(r.appetite||'')+'<br>睡眠:'+(r.sleep||'')+' | 大便:'+(r.bowel||'')+' | 情绪:'+(r.mood||'')+' | 精力:'+(r.energy||'')+'<br>当前症状:'+(r.symptoms||'无')+'</div></div>';h+='<a class="btn btn-primary" href="wellness-guide.html" style="display:block;padding:12px;background:var(--gold);color:var(--bg);text-align:center;border-radius:8px;text-decoration:none;font-weight:600;margin-top:10px">🔄 重新生成健康预测</a>';
h+='<a class="btn btn-primary" href="wellness-weekly.html" style="display:block;padding:12px;background:var(--green);color:#000;text-align:center;border-radius:8px;text-decoration:none;font-weight:600;margin-top:8px">📅 进入周分析中心</a>';
h+='<a class="btn btn-primary" href="report-ocr.html" style="display:block;padding:12px;background:var(--purple);color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-weight:600;margin-top:8px">📊 体检报告OCR</a><a class="btn" href="report-interpret.html" style="display:block;padding:12px;background:var(--orange);color:#fff;text-align:center;border-radius:8px;text-decoration:none;font-weight:600;margin-top:8px">📊 统一报告解读</a>';
c.innerHTML=h}).catch(function(e){c.innerHTML='<div class="card"><div class="card-title">🌿 康养人档案</div><div class="empty">尚未创建康养人档案<br><br><a href="wellness-guide.html" class="btn btn-primary" style="display:inline-block;padding:10px 20px;background:var(--gold);color:var(--bg);border-radius:8px;text-decoration:none">开始健康评估 →</a></div></div>'})}
function renderF(){fj(API+'/api/person/'+uid+'/full').then(function(d){var u=d.user||{},ids=d.identities||[];var h='<div class="card"><div class="card-title">📊 统一档案</div><div class="info-grid">'+info('姓名',u.name||'')+info('身份',ids.join('/')||'无')+'</div></div>';if(d.yuanzhu)h+='<div class="card"><div class="card-title">☯ 缘主</div><div class="info-grid">'+info('日主',d.yuanzhu.day_master||'')+info('喜神',d.yuanzhu.xi_ele||'')+'</div></div>';if(d.medical)h+='<div class="card"><div class="card-title">注 医疗 ('+(d.medical.cases||[]).length+'条)</div></div>';c.innerHTML=h})}
render();
</script>
