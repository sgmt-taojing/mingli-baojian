<style>
:root{--gold:#c9a227;--brown:#6b4226;--bg:#fffbf2}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:#fff;border-radius:18px;padding:40px 32px;box-shadow:0 8px 32px rgba(107,66,38,.12);text-align:center;max-width:480px}
h1{color:var(--gold);font-size:24px;margin-bottom:8px}
.sub{color:#888;margin-bottom:24px;font-size:14px}
.spin{display:inline-block;width:40px;height:40px;border:4px solid #f0e4c2;border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-block;padding:12px 24px;background:var(--gold);color:#fff;border-radius:8px;text-decoration:none;margin:6px;font-size:14px}
.btn:hover{background:#a88519}
@media(max-width:360px){body{padding:10px 6px}.card{padding:24px 16px;border-radius:14px;max-width:100%}h1{font-size:20px}.sub{font-size:12px;margin-bottom:16px}.spin{width:32px;height:32px;border-width:3px}.btn{padding:10px 18px;font-size:13px;margin:4px}}
@media print{body{background:#fff!important;color:#000!important}.page-header-bar,.btn,.theme-ops,.no-print{display:none!important}.wrap,.container{width:100%!important;max-width:100%!important;margin:0!important;padding:8px!important}.card{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important}h1,h2,h3{break-after:avoid}table{width:100%!important;font-size:11px}img{max-width:100%!important}}
