<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>蒸馏缓存命中看板 · 命理宝鉴</title>
<link rel="stylesheet" href="css/ai-assistant-inline.css">
<style>
  :root{--paper:#0e0e13;--paper2:#16161d;--card:#1c1c24;--card-border:#2a2a35;--text:#e8e6e3;--muted:#9a97a3;--accent:#c9a962;--gold:#e5c877;--green:#4ade80;--red:#f87171;--blue:#60a5fa}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px;min-height:100vh}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:22px;font-weight:700;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:24px}
  .card{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px}
  .card .num{font-size:28px;font-weight:700;color:var(--gold)}
  .card .label{font-size:12px;color:var(--muted);margin-top:6px}
  .card.green .num{color:var(--green)}
  .card.blue .num{color:var(--blue)}
  .card.red .num{color:var(--red)}
  .section-title{font-size:14px;font-weight:600;color:var(--paper2);margin:24px 0 10px;border-bottom:1px solid var(--card-border);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:10px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--card-border)}
  th{background:var(--paper2);color:var(--muted);font-weight:600;font-size:12px}
  tr:hover td{background:rgba(201,169,98,.05)}
  .tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;background:rgba(201,169,98,.12);color:var(--gold)}
  .tag.green{background:rgba(74,222,128,.12);color:var(--green)}
  .tag.blue{background:rgba(96,165,250,.12);color:var(--blue)}
  .tag.red{background:rgba(248,113,113,.12);color:var(--red)}
  .bar{height:8px;background:var(--paper2);border-radius:4px;overflow:hidden;margin-top:8px}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:4px}
  .actions{display:flex;gap:10px;margin:16px 0}
  button{background:var(--card);color:var(--text);border:1px solid var(--card-border);border-radius:10px;padding:8px 16px;font-size:13px;cursor:pointer;transition:all .15s}
  button:hover{background:var(--paper2);border-color:var(--accent)}
  button.primary{background:var(--accent);color:#1a1a1a;font-weight:600;border:none}
  .footer{color:var(--muted);font-size:11px;margin-top:30px;text-align:center}
  .empty{color:var(--muted);text-align:center;padding:30px;font-size:13px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--paper2);border:1px solid var(--accent);color:var(--gold);padding:10px 20px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none}
  @media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>⚗️ 蒸馏缓存命中看板</h1>
  <div class="sub">distill-engine 运行时指标 · 三层缓存（LRU → KB 模糊匹配 → AI 蒸馏）· 每 10s 自动刷新</div>

  <div class="grid" id="statGrid">
    <div class="card"><div class="num" id="nRequests">-</div><div class="label">总请求数</div></div>
    <div class="card green"><div class="num" id="nSaved">-</div><div class="label">AI 调用节省</div></div>
    <div class="card green"><div class="num" id="nRate">-</div><div class="label">节省率</div></div>
    <div class="card blue"><div class="num" id="nLRU">-</div><div class="label">LRU 命中率</div></div>
    <div class="card"><div class="num" id="nAICalls">-</div><div class="label">实际 AI 调用</div></div>
    <div class="card red"><div class="num" id="nAIFail">-</div><div class="label">AI 失败</div></div>
    <div class="card"><div class="num" id="nModules">-</div><div class="label">已索引模块</div></div>
    <div class="card"><div class="num" id="nCacheSize">-</div><div class="label">LRU 缓存条目</div></div>
  </div>

  <div class="section-title" style="color:#e8e6e3">KB 兜底命中日志（kb_fallback → kb_hit_log）</div>
  <div id="hitTable"><div class="empty">加载中…</div></div>

  <div class="section-title" style="color:#e8e6e3">三层路由分布</div>
  <div id="routeBar"></div>

  <div class="actions">
    <button class="primary" onclick="refreshAll(true)">刷新</button>
    <button onclick="reindex()">重建索引</button>
  </div>

  <div class="footer">命理宝鉴 · distill-engine · P1-8 健康看板 · <span id="lastUpdate">-</span></div>
  <div id="toast"></div>
</div>

<script>
(function () {
  'use strict';
  const API = '/api/distill';
  const HIT_API = '/api/ai/kb-hit-stats';

  // ── 通用 fetch（带 UA 头，绕 BLOCKED_UA 反爬虫）──
  function getJson(url) {
    return fetch(url, { headers: { 'User-Agent': 'Mozilla/5.0 (compatible; kb-dashboard)' } })
      .then(function (r) { return r.json(); })
      .catch(function () { return null; });
  }
  function postJson(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'User-Agent': 'Mozilla/5.0 (compatible; kb-dashboard)' },
      body: JSON.stringify(body || {}),
    }).then(function (r) { return r.json(); }).catch(function () { return null; });
  }

  function setText(id, v) { var el = document.getElementById(id); if (el) el.textContent = v; }
  function pct(x) { return (x * 100).toFixed(1) + '%'; }

  // ── 主统计 ──
  function renderStats(s) {
    if (!s) { setText('nRequests', 'ERR'); return; }
    setText('nRequests', s.requests || 0);
    setText('nSaved', s.cache_saved || 0);
    setText('nRate', pct(s.savings_rate || 0));
    setText('nLRU', pct(s.cache && s.cache.hit_rate || 0));
    setText('nAICalls', s.ai_calls_made || 0);
    setText('nAIFail', (s.runner && s.runner.failed) || 0);
    setText('nModules', (s.router && s.router.modules) || 0);
    setText('nCacheSize', (s.cache && s.cache.size) || 0);
  }

  // ── 路由分布条 ──
  function renderRouteBar(s) {
    var el = document.getElementById('routeBar');
    if (!el) return;
    if (!s || !s.requests) { el.innerHTML = '<div class="empty">暂无请求数据 — 调用 /api/distill/check 或 /api/distill/run 后展示</div>'; return; }
    var total = Math.max(1, s.requests);
    var lru = s.cache ? s.cache.hits : 0;
    var kb = Math.max(0, (s.kb_match_saved || 0));
    var ai = Math.max(0, s.ai_calls_made || 0);
    var html = '<table><tr><th>路由层</th><th>次数</th><th>占比</th><th style="width:40%">分布</th></tr>';
    var rows = [
      ['L1 LRU 缓存', lru, 'green'],
      ['L2 KB 模糊匹配', kb, 'blue'],
      ['L3 AI 蒸馏', ai, 'gold'],
    ];
    rows.forEach(function (r) {
      var p = r[1] / total * 100;
      html += '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td><td>' + p.toFixed(1) + '%</td><td><div class="bar"><i style="width:' + p + '%"></i></div></td></tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }

  // ── KB 兜底命中日志 ──
  function renderHits(data) {
    var el = document.getElementById('hitTable');
    if (!el) return;
    if (!data || !data.ok) { el.innerHTML = '<div class="empty">无兜底命中记录（尚未触发 kb_fallback 或统计端点未就绪）</div>'; return; }
    var list = data.recent || [];
    if (!list.length) { el.innerHTML = '<div class="empty">暂无 kb_fallback 记录 — 当 AI 上游失败时自动兜底并在此记录</div>'; return; }
    var html = '<table><tr><th>时间</th><th>模块</th><th>查询</th><th>命中数</th><th>来源</th></tr>';
    list.forEach(function (r) {
      html += '<tr><td>' + (r.created_at || '') + '</td><td><span class="tag">' + (r.module || '-') + '</span></td><td>' + (r.query || '').substring(0, 40) + '</td><td>' + (r.hits || 0) + '</td><td><span class="tag blue">' + (r.source || '-') + '</span></td></tr>';
    });
    html += '</table>';
    el.innerHTML = html;
  }

  function refreshAll(showMsg) {
    var ts = Date.now();
    getJson(API + '/stats?t=' + ts).then(function (s) {
      renderStats(s);
      renderRouteBar(s);
      setText('lastUpdate', new Date().toLocaleTimeString());
    });
    getJson(HIT_API + '?t=' + ts).then(renderHits);
  }

  function showToast(msg) {
    var el = document.getElementById('toast');
    if (!el) { return; }
    el.textContent = msg;
    el.style.opacity = '1';
    clearTimeout(el._t);
    el._t = setTimeout(function () { el.style.opacity = '0'; }, 2500);
  }

  function reindex() {
    postJson(API + '/reindex').then(function (r) {
      showToast(r && r.ok !== false ? '索引重建完成 ✓' : '索引重建失败，请查看服务日志');
      refreshAll(true);
    });
  }

  refreshAll();
  setInterval(refreshAll, 10000);
})();
</script>
</body>
</html>
