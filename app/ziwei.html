<!-- 交叉比对 -->
<div class="zw-compare">
  <div class="zw-compare-title">更 紫微×八字 交叉比对</div>
  <div class="zw-compare-hint">紫微斗数和八字是两套独立的命理体系。八字看五行格局，紫微看星曜宫位。两者交叉验证准确率更高。</div>
  <div id="zw-compare-result" style="font-size:12px;color:var(--zw-paper3)">排盘后自动生成比对分析</div>

<script src="js/ziwei-engine.js" defer></script>
<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
(function(){
  // 初始化下拉
  var ySel = document.getElementById('zw-year');
  var mSel = document.getElementById('zw-month');
  var dSel = document.getElementById('zw-day');
  var hSel = document.getElementById('zw-hour');
  for(var y=1940;y<=2025;y++){var o=document.createElement('option');o.value=y;o.textContent=y+'年';ySel.appendChild(o);}
  for(var m=1;m<=12;m++){var o=document.createElement('option');o.value=m;o.textContent=m+'月';mSel.appendChild(o);}
  for(var d=1;d<=31;d++){var o=document.createElement('option');o.value=d;o.textContent=d+'日';dSel.appendChild(o);}
  var hours=[['子时',0],['丑时',1],['寅时',3],['卯时',5],['辰时',7],['巳时',9],['午时',11],['未时',13],['申时',15],['酉时',17],['戌时',19],['亥时',21]];
  hours.forEach(function(h){var o=document.createElement('option');o.value=h[1];o.textContent=h[0]+' ('+(h[1]<10?'0'+h[1]:h[1])+':00)';hSel.appendChild(o);});
})();

var zwCalMode = 'solar';
function switchZwCal(mode){
  zwCalMode = mode;
  document.querySelectorAll('#zw-cal-switch button').forEach(function(b){
    b.classList.toggle('active', b.textContent === (mode==='solar'?'阳历':'农历'));
  });
}
function switchZwLunar(){
  zwCalMode = zwCalMode === 'solar' ? 'lunar' : 'solar';
  var btn = document.getElementById('zw-lunar-toggle');
  if(btn) btn.textContent = zwCalMode === 'lunar' ? '☀️ 切换阳历' : '📅 切换农历';
}

function runZiweiPaipan(){
  var year = parseInt(document.getElementById('zw-year').value);
  var month = parseInt(document.getElementById('zw-month').value);
  var day = parseInt(document.getElementById('zw-day').value);
  var hour = parseInt(document.getElementById('zw-hour').value);
  var sex = document.getElementById('zw-sex').value;
  if(!year || !month || !day){ showToast('请填写完整的出生年月日'); return; }
  if(!hour && hour !== 0){ hour = 12; }

  var result = ZiweiEngine.paipan(year, month, day, hour, zwCalMode === 'lunar', sex);
  var name = document.getElementById('zw-name').value || '';
  var container = document.getElementById('ziwei-result');
  ZiweiEngine.renderChart(container, result, name, sex);

  // 交叉比对提示
  var compareEl = document.getElementById('zw-compare-result');
  if(compareEl){
    var mingStar = result.palaces[0].stars[0] || '空宫';
    var starNames = {ziwei:'紫微',tianji:'天机',taiyang:'太阳',wuqu:'武曲',lianzhen:'廉贞',tianfu:'天府',taiyin:'太阴',tanlang:'贪狼',jumen:'巨门',tianxiang:'天相',tianliang:'天梁',qisha:'七杀',pojun:'破军'};
    var mingStarName = starNames[mingStar] || '空宫';
    var html = '<div style="padding:10px;background:rgba(201,168,76,.06);border-radius:6px;margin-bottom:8px">';
    html += '<div style="color:var(--zw-gold);font-weight:600;margin-bottom:4px">紫微命宫主星：' + mingStarName + '</div>';
    html += '<div style="font-size:11px;color:var(--zw-paper3)">五行局：' + result.wuxingJu + ' · 年干支：' + result.yearGanZhi + '</div>';
    html += '</div>';
    html += '<div style="font-size:11px;line-height:1.8">建议同时排八字命盘，比对日主五行与紫微主星的脏腑对应关系。例如：紫微七杀入命 → 金气偏旺 → 肺/大肠需注意；天同太阴入命 → 水气偏旺 → 肾/膀胱需注意。</div>';
    html += '<div style="margin-top:8px"><a href="bazi.html" style="color:var(--zw-gold);font-size:12px">→ 去排八字命盘做比对</a></div>';
    compareEl.innerHTML = html;
  }
}

async function generateZiweiReport(){
  try{
    const year = +document.getElementById('zw-year')?.value || 1990;
    const month = +document.getElementById('zw-month')?.value || 6;
    const day = +document.getElementById('zw-day')?.value || 15;
    const hour = +document.getElementById('zw-hour')?.value || 10;
    const gender = document.getElementById('zw-sex')?.value || 'male';
    const name = document.getElementById('zw-name')?.value || '缘主';
    const lunar = window.zwCalMode === 'lunar';
    
    const _lang = (typeof I18N !== 'undefined' && I18N.locale && !I18N.locale.startsWith('zh')) ? 'en' : 'zh';
    const body = { year, month, day, hour, gender, name, lunar, leapMonth: false, lang: _lang };
    
    const csrfRes = await fetch(API_BASE+'/api/csrf-token', {signal: AbortSignal.timeout(15000)}).then(r=>r.json()).catch(()=>({csrfToken:''}));
    const csrf = csrfRes.csrfToken || csrfRes.token || '';
    
    const r = await fetch(API_BASE+'/api/paipan/ziwei/report', { signal: AbortSignal.timeout(15000),
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},
      body: JSON.stringify(body), signal: AbortSignal.timeout(15000) }).then(r=>r.json());
    
    if(!r.ok){
      const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
      fn('报告生成失败：'+(r.error||r.message||''));
      return;
    }
    
    sessionStorage.setItem('lastReport', JSON.stringify(r));
    window.location.href = 'report-interpret.html?module=ziwei&name='+encodeURIComponent(name);
  }catch(e){
    const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
    fn('生成失败：'+esc(e.message));
  }
}
</script>
