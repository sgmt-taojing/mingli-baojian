<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KB 批量管理 · R45-A</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/admin-kb-batch-inline.css">
  <link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<div class="container">
<h1>🛠️ KB 批量管理 · R45-A</h1>
<div class="sub">知识库批量操作 · 紫微 12 宫 · 八字十神 · 化解古籍</div>

<div class="tabs">
  <div class="tab active" data-tab="stats">📊 总览</div>
  <div class="tab" data-tab="batch">⚡ 批量操作</div>
  <div class="tab" data-tab="ingest">📥 批量入库</div>
  <div class="tab" data-tab="audit">🔍 审计</div>
  <div class="tab" data-tab="export">📤 导出</div>
</div>

<!-- 总览 -->
<div id="panel-stats" class="panel active">
  <div class="grid" id="statsGrid"></div>
  <h3 style="color:var(--gold);margin:20px 0 12px">📈 模块分布 Top 12</h3>
  <table id="modulesTable">
    <thead><tr><th>模块</th><th>条目</th><th>占比</th><th>来源</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<!-- 批量操作 -->
<div id="panel-batch" class="panel">
  <h3 style="color:var(--gold);margin-bottom:12px">⚡ 批量操作</h3>
  <div class="row">
    <select id="batchModule" aria-label="选择模块">
      <option value="">-- 选择模块 --</option>
    </select>
    <select id="batchAction" aria-label="选择操作">
      <option value="promote">提升信任分 +0.1</option>
      <option value="demote">降低信任分 -0.1</option>
      <option value="tag">加标签</option>
      <option value="retag">改标签</option>
    </select>
    <input  id="batchTag" placeholder="标签 (如 八字/化解)" style="width:160px" aria-label="标签 (如 八字/化解)">
    <button class="btn warn" onclick="batchExecute()">执行</button>
  </div>
  <div id="batchResult" class="log"></div>
</div>

<!-- 批量入库 -->
<div id="panel-ingest" class="panel">
  <h3 style="color:var(--gold);margin-bottom:12px">📥 批量入库</h3>
  <div class="row">
    <select id="ingestModel" aria-label="选择入库模型">
      <option value="r45_palace">紫微 12 宫</option>
      <option value="r45_shishen">八字十神</option>
      <option value="r45_huajie">化解古籍</option>
      <option value="r45_lifeplan">人生规划</option>
      <option value="r45_tcm">中医体质</option>
    </select>
    <select id="ingestMode" aria-label="选择入库模式">
      <option value="auto">自动生成</option>
      <option value="manual">手工粘贴</option>
    </select>
  </div>
  <div id="ingestArea">
    <textarea id="ingestText" placeholder="JSON Lines (每行一条: {module, title, content, category, keywords, score})"></textarea>
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn" onclick="ingestExecute()">📥 入库</button>
    <button class="btn warn" onclick="ingestGenerate()">🤖 生成示例</button>
  </div>
  <div id="ingestResult" class="log"></div>
</div>

<!-- 审计 -->
<div id="panel-audit" class="panel">
  <h3 style="color:var(--gold);margin-bottom:12px">🔍 KB 审计</h3>
  <div class="row">
    <button class="btn" onclick="auditQuality()">质量扫描</button>
    <button class="btn warn" onclick="auditDuplicate()">重复检测</button>
    <button class="btn danger" onclick="auditLowScore()">低分条目</button>
  </div>
  <div id="auditResult" class="log"></div>
</div>

<!-- 导出 -->
<div id="panel-export" class="panel">
  <h3 style="color:var(--gold);margin-bottom:12px">📤 数据导出</h3>
  <div class="row">
    <select id="exportModule" aria-label="选择导出模块">
      <option value="">-- 全部 --</option>
    </select>
    <select id="exportFormat" aria-label="选择导出格式">
      <option value="json">JSON</option>
      <option value="csv">CSV</option>
      <option value="sql">SQL</option>
    </select>
    <button class="btn" onclick="exportData()">📤 下载</button>
  </div>
  <div id="exportResult" class="log"></div>
</div>

</div>


  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/admin-kb-batch-inline.js" defer></script>
  <script src="js/mobile-nav.js" defer></script>
</body>
</html>

<style>
/* R98-q 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>
