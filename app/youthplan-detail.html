<main id="main-content" role="main">
<div class="wrap">
  <header>
    <h1>青少年专属规划</h1>
    <p>分阶段成长引擎 · 命理宝鉴</p>
  </header>

  <!-- 输入区 -->
  <div class="card" id="input">
    <h2>表 孩子信息</h2>
    <label for="yName">姓名/昵称</label>
    <input aria-label="yName" id="yName" placeholder="例：小明" value="">
    <div class="row">
      <div>
        <label for="yGrade">当前学段</label>
        <select aria-label="yGrade" id="yGrade">
          <option value="kindergarten">学龄前（3-6岁）</option>
          <option value="primary" selected>小学（7-12岁）</option>
          <option value="junior">初中（13-15岁）</option>
          <option value="senior">高中（16-18岁）</option>
          <option value="college">大学（19-22岁）</option>
        </select>
      </div>
      <div>
        <label for="yScore">学业表现</label>
        <select aria-label="yScore" id="yScore">
          <option value="excellent">优秀（前 10%）</option>
          <option value="good">良好（前 30%）</option>
          <option value="average" selected>一般（中等）</option>
          <option value="needImprove">待提高</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="yBirthplace">出生地（可选）</label>
        <input aria-label="yBirthplace" id="yBirthplace" placeholder="例：北京">
      </div>
      <div>
        <label for="yResidence">现居地（可选）</label>
        <input aria-label="yResidence" id="yResidence" placeholder="例：上海">
      </div>
    </div>
    <label for="yExpect">家长期望（可选）</label>
    <textarea id="yExpect" placeholder="例：希望培养数学思维 + 体魄健壮" aria-label="例：希望培养数学思维 + 体魄健壮"></textarea>
    <button class="btn" id="genBtn" onclick="generate()">光 生成专属规划</button>
  </div>

  <!-- 报告区 -->
  <div class="report" id="report"></div>

  <!-- footer -->
  <p style="text-align:center;font-size:11px;opacity:.85;margin:24px 0;letter-spacing:1px">命理宝鉴 · 仅供参考 · 命数只占 30%，努力占 70%</p>
</div>
