<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>设备管理中心 · 易道智鉴</title>
<link rel="preload" href="css/divination-hub.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="css/divination-hub.css"></noscript>

<link rel="stylesheet" href="css/device-management-inline.css">
</head>
<body data-kb-module="mobile">
<div class="wrap">
  <header>
    <h1>设备管理中心</h1>
    <p>DEVICES · HEALTH · LIVE STATUS</p>
  </header>

  <!-- === 摘要卡 === -->
  <div class="summary-grid">
    <div class="summary-card ok">
      <div class="label">在线设备</div>
      <div class="value" id="sumOnline">0</div>
      <div class="sub">已连接可用</div>
    </div>
    <div class="summary-card warn">
      <div class="label">离线设备</div>
      <div class="value" id="sumOffline">0</div>
      <div class="sub">未连接 / 未启用</div>
    </div>
    <div class="summary-card err">
      <div class="label">异常设备</div>
      <div class="value" id="sumError">0</div>
      <div class="sub">权限拒绝 / 硬件错误</div>
    </div>
    <div class="summary-card">
      <div class="label">服务健康</div>
      <div class="value" id="sumHealth">—</div>
      <div class="sub">6 项核心服务</div>
    </div>
  </div>

  <!-- === R72 · 智能眼镜一键进入 === -->
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;padding:14px;background:linear-gradient(135deg,rgba(201,168,76,.08),transparent);border:1px solid rgba(201,168,76,.25);border-radius:10px;align-items:center">
    <div style="flex:1;min-width:200px">
      <div style="font-size:14px;color:var(--gold);font-weight:500;margin-bottom:4px">🥽 智能眼镜已就绪</div>
      <div style="font-size:11px;color:var(--paper3)">进入控制台 → HUD 投屏 / R18 流式问诊 / R19 OCR / R20 语音 STT / 28 舌象</div>
    </div>
    <a href="glass-console.html" class="dev-btn" style="padding:10px 20px;background:var(--gold);color:#000;text-decoration:none;border:none;font-weight:600">🥽 进入眼镜控制台 →</a>
  </div>

  <!-- === 穿戴 SDK 探测 === -->
  <div class="section-title">穿戴 SDK 探测 <span class="badge" id="sdkBadge">未检测</span></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">
    <button class="dev-btn" onclick="probeRokid()" style="padding:8px 16px">👓 探测 Rokid 原生桥</button>
    <button class="dev-btn" onclick="testCapture()" style="padding:8px 16px">📸 测试拍照</button>
    <button class="dev-btn" onclick="testSpeak()" style="padding:8px 16px">🔊 测试骨传导 TTS</button>
  </div>
  <div id="sdkResult" style="font-size:11px;color:var(--paper3);margin-bottom:14px;padding:10px;background:var(--ink3);border-radius:var(--radius);display:none"></div>

  <!-- === 添加设备入口 === -->
  <a href="camera-capture.html" class="add-device-cta">＋ 添加新设备（Type-C 即插即用）</a>

  <!-- === 已注册设备 === -->
  <div class="section-title">已注册设备 <span class="badge" id="devCountBadge">0 台</span></div>
  <div class="device-grid" id="deviceGrid">
    <div class="device-card offline" id="loading-dev">
      <div class="device-head">
        <div class="device-icon">⏳</div>
        <div class="device-name">检测中…</div>
      </div>
      <div class="device-meta">
        <div><span class="meta-label">状态</span><span class="meta-value">等待浏览器授权</span></div>
      </div>
      <div class="device-actions">
        <button class="dev-btn" onclick="requestPermissions()">🔓 授权摄像头/麦克风</button>
      </div>
    </div>
  </div>

  <!-- === 后端服务健康 === -->
  <div class="section-title">后端服务健康 <span class="badge" id="healthBadge">实时监测</span></div>
  <div class="health-list" id="healthList">
    <div class="health-row">
      <div><div class="service-name">检测中…</div></div>
      <div class="latency">—</div>
      <div></div>
      <div class="actions"></div>
    </div>
  </div>

  <!-- === 事件日志 === -->
  <div class="section-title">设备事件日志 <span class="badge" id="logBadge">最近 24h</span></div>
  <div class="log-list" id="logList">
    <div class="log-entry"><span class="time">--:--:--</span><span class="msg">等待首次检测…</span></div>
  </div>
</div>

<script src="js/device-platform.js"></script>
<script src="js/kb-hit-counter.js" defer></script>
<script src="js/device-kb-bridge.js" defer></script>

<script src="js/device-management-inline.js" defer></script>
</body>
</html>
