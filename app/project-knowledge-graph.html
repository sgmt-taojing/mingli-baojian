<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命理宝鉴 · 全项目知识图谱 2026-09-25</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#0d1117; color:#e6edf3; overflow:hidden; }
  #graph { display:block; cursor:grab; }
  #panel { position:fixed; right:0; top:0; width:340px; height:100vh; background:#161b22; border-left:1px solid #30363d; padding:20px; overflow-y:auto; transition:transform .25s; }
  #panel.hidden { transform:translateX(100%); }
  #panel h2 { font-size:18px; margin-bottom:4px; color:#f0b429; }
  #panel .cat { font-size:12px; color:#8b949e; margin-bottom:12px; }
  #panel .desc { font-size:13px; line-height:1.8; color:#c9d1d9; white-space:pre-wrap; }
  #panel .metric { margin-top:12px; padding:10px; background:#0d1117; border-radius:8px; font-size:12px; line-height:1.9; }
  #panel .metric b { color:#58a6ff; }
  #legend { position:fixed; left:16px; top:16px; background:rgba(22,27,34,.92); border:1px solid #30363d; border-radius:10px; padding:12px 16px; font-size:12px; line-height:2; z-index:5; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle; }
  #tip { position:fixed; pointer-events:none; background:#1c2128; border:1px solid #444c56; border-radius:6px; padding:6px 10px; font-size:12px; display:none; z-index:9; max-width:260px; }
  #header { position:fixed; left:16px; bottom:16px; font-size:11px; color:#6e7681; z-index:5; }
</style>
</head>
<body>
<canvas id="graph"></canvas>
<div id="legend">
  <b style="color:#f0b429">命理宝鉴 · 知识图谱</b> <span style="color:#6e7681">2026-09-25</span><br>
  <span class="dot" style="background:#f0b429"></span>平台核心
  <span class="dot" style="background:#58a6ff"></span>服务中心（五端）
  <span class="dot" style="background:#3fb950"></span>排盘引擎 ×8
  <span class="dot" style="background:#bc8cff"></span>民俗/信众工具
  <span class="dot" style="background:#f778ba"></span>知识库域
  <span class="dot" style="background:#ffa657"></span>模型链（MLX）
  <span class="dot" style="background:#79c0ff"></span>运行时服务
  <span class="dot" style="background:#d29922"></span>外部协同
</div>
<div id="panel" class="hidden">
  <h2 id="p-title"></h2>
  <div class="cat" id="p-cat"></div>
  <div class="desc" id="p-desc"></div>
  <div class="metric" id="p-metric"></div>
</div>
<div id="tip"></div>
<div id="header">拖拽平移 · 滚轮缩放 · 点击节点看详情</div>
<script>
const DATA = {
  nodes: [
    {id:'root', label:'命理宝鉴', cat:'core', desc:'命理×中医双引擎 SaaS 平台。\n五端服务：管理员/命理师/医生/患者/缘主。\n本地优先部署，1606 次提交，182 页面前端。', metric:'Git 提交: <b>1606</b><br>前端页面: <b>182</b><br>服务脚本: <b>343</b><br>launchd 常驻: <b>~50 项</b>'},
    // 五大服务中心
    {id:'c-admin', label:'管理员中心', cat:'center', parent:'root', desc:'center-admin.html\n排盘专业工具仅对管理员与命理师开放。\nKB 管理/模型管理/巡检面板。'},
    {id:'c-master', label:'命理师中心', cat:'center', parent:'root', desc:'center-master.html\n批注队列（48h SLA）、专业排盘七工具、\n名人案例库、点读解读（点宫位看白话）。'},
    {id:'c-doctor', label:'医生中心', cat:'center', parent:'root', desc:'center-doctor.html\n问诊台（一帧采集）、医技开单、叫号队列、\n电子病历/处方审核签名。'},
    {id:'c-patient', label:'患者中心', cat:'center', parent:'root', desc:'center-patient.html\n专有通道：建档→采集→AI 草稿→\n双师审核→病历/处方/命理批注。'},
    {id:'c-yuanzhu', label:'缘主中心', cat:'center', parent:'root', desc:'center-yuanzhu.html\n信众/大众入口：问答式采集、问事服务中心、\n民俗工具中心、每日推送。'},
    // 排盘引擎
    {id:'e-bazi', label:'八字排盘', cat:'engine', parent:'c-master', desc:'bazi-engine-wrapper.js\n古制完整版：真太阳时、大运流年、十神格局。\n点读：点干支看白话解释。', metric:'KB 条目: <b>1,835</b><br>BaziQA: <b>35.9%</b>（v9.3）'},
    {id:'e-ziwei', label:'紫微斗数', cat:'engine', parent:'c-master', desc:'ziwei-engine-node.js v3.0\n真太阳时+小限+流年+大限细化。\n点宫位看星曜组合白话。', metric:'KB 条目: <b>2,013</b>'},
    {id:'e-liuyao', label:'六爻', cat:'engine', parent:'c-master', desc:'京氏易传+增删卜易经典层。\n点爻看爻辞白话解读。', metric:'KB 条目: <b>366</b>（liuyue）'},
    {id:'e-qimen', label:'奇门遁甲', cat:'engine', parent:'c-master', desc:'转盘奇门，九宫格点读浮动解读。', metric:'KB 条目: <b>939</b>'},
    {id:'e-fengshui', label:'风水罗盘', cat:'engine', parent:'c-master', desc:'九宫飞星+山向，天玉经/青囊奥语经典层。\n点九宫看飞星白话。', metric:'KB 条目: <b>781</b>'},
    {id:'e-meihua', label:'梅花易数', cat:'engine', parent:'c-master', desc:'时间起卦/数字起卦。\n⚠️ 原典零（全书无 PD 净本），待寻源。', metric:'KB 条目: <b>282</b>（现代整理）'},
    {id:'e-liuren', label:'大六壬', cat:'engine', parent:'c-master', desc:'六壬课式排盘。', metric:'KB 条目: <b>464</b>'},
    {id:'e-zeri', label:'择日', cat:'engine', parent:'c-master', desc:'协纪辨方书体系，v1/v2 双版。\n民俗面问答化可达。', metric:'KB 条目: <b>325</b>'},
    // 民俗工具
    {id:'m-wenshi', label:'问事服务中心', cat:'folk', parent:'c-yuanzhu', desc:'16 域问事：八字/紫微/六爻/风水等。\n问答式采集，语音输入+拍照上传，\n全维度白话报告。'},
    {id:'m-minsu', label:'民俗工具中心', cat:'folk', parent:'c-yuanzhu', desc:'姓名测评/取名改名/公司取名、\n手机号测+荐号、合婚 v2、太岁化解、\n黄历择日、节气节日、家庭关系。'},
    {id:'m-life', label:'生命周期报告', cat:'folk', parent:'c-yuanzhu', desc:'生命流报告/时间轴/命格指数/人生规划。\n⚠️ 命格指数已接真排盘（P0 修复）。'},
    {id:'m-push', label:'每日推送', cat:'folk', parent:'c-yuanzhu', desc:'晨推 06:00 / 暮推 18:00 / 节日加推。\n企业微信智能机器人长连接通道。\n白话层：宜忌/神煞/吉时全配通俗解读。'},
    // 知识库
    {id:'kb-mingli', label:'命理知识域', cat:'kb', parent:'root', desc:'mingli 域 16,129 条 + 各模块：\n倪海厦天纪 5,787 / 紫微 2,013 / 八字 1,835\n奇门 939 / 风水 781 / 易经 586 / 咒语 548\n六壬 464 / 六爻 366 / 择日 325 / 口诀 347', metric:'命理域合计: <b>~35,000 条</b><br>占比仅 <b>11%</b>（医学 85%）<br>⚠️ 命理知识密度是短板'},
    {id:'kb-tcm', label:'医学知识域', cat:'kb', parent:'root', desc:'tcm 207,743 + 伤寒 20,218 + 方剂 14,014\n+ 倪师人纪 10,500 + 诊断 9,303 + 内经 5,279…\nG24 后存量 36,121 条标 reference 参考域，\n诊疗链路只命中 tcm 移植栈。', metric:'医学域合计: <b>~283,000 条</b><br>参考域隔离: <b>36,121 条</b>'},
    {id:'kb-canon', label:'经典依据层', cat:'kb', parent:'kb-mingli', desc:'渊海子平/三命通会/滴天髓/子平真诠/\n星历考原/天玉经/增删卜易等原典实时命中，\n报告页挂经典依据卡（六链路验收通过）。'},
    {id:'kb-verify', label:'真人校正库', cat:'kb', parent:'kb-mingli', desc:'名人八字反校：BaziQA 50 人 488 题。\n目标 10,000 真人校正库（进行中）。\n⚠️ wiki 702 名人事件待网络恢复补抓。'},
    // 模型链
    {id:'ml-v93', label:'v9.3-7b（在线）', cat:'model', parent:'root', desc:'MLX LoRA 微调链最新版。\n8960 推理服务在线。\nBaziQA 35.9%（v92 36.7%）\n感情+3.0/财富+5.4/事业+4.2\n健康-11.0 留账 v9.4。', metric:'训练数据: <b>1,161 条</b><br>Loss: 2.33→<b>1.41</b><br>应期专题: <b>11 条</b>'},
    {id:'ml-chain', label:'微调管线', cat:'model', parent:'ml-v93', desc:'数据蒸馏→JSONL→LoRA 300 轮→\nfuse→launchd 热切换→488 题复测，\n全链自动（v93-chain.sh）。'},
    {id:'ml-distill', label:'知识蒸馏', cat:'model', parent:'ml-v93', desc:'distillery/：倪师天纪字幕 179 文件\nR1-R4 多轮 SOP 已收敛（G26）。\n应期专题 yingqi-series.py 管线。\n⚠️ 再婚/丧偶两批 0/10 全拒待重蒸。'},
    // 运行时
    {id:'rt-api', label:'API 8920', cat:'runtime', parent:'root', desc:'api-server-v2.js 主服务。\nKB 检索/排盘/报告/认证/推送。\n熔断器：provider 连败 3 次开路 5 分钟。'},
    {id:'rt-mlx', label:'推理 8960', cat:'runtime', parent:'root', desc:'MLX 本地推理，当前挂 v9.3-7b。\n16GB 内存约束：训练时须停 8960。'},
    {id:'rt-med', label:'医学栈 8972/8974', cat:'runtime', parent:'root', desc:'medical-stack：tcm 内化栈。\n8972 诊断 / 8974 批注层。\n命理批注唯一合流点（R745/756/757 守卫）。'},
    {id:'rt-vision', label:'视觉采集群', cat:'runtime', parent:'c-doctor', desc:'面/舌/手/眼四诊 + 命理三相\n（fortune_face/mole/palm）并行识别。\n一帧采集，实时 AI 病历+命理草案。'},
    {id:'rt-wecom', label:'推送守护', cat:'runtime', parent:'m-push', desc:'wecom-aibot-daemon：企业微信智能机器人\n长连接（心跳/重连/会话登记/队列外发）。'},
    // 外部协同
    {id:'x-tcm', label:'中医标准智能体', cat:'ext', parent:'rt-med', desc:'医学能力唯一源头。\nG17 六层验收 6/6 全签、G18 补丁机制。\n15min 镜像通道内化，只适配不训练。'},
    {id:'x-family', label:'家庭生活助手', cat:'ext', parent:'root', desc:'G13 病历回流（命理批注剥离）\nG21 命理能力包发版（paipan v1.x）。'},
    {id:'x-g2claw', label:'G2CLAW 云端', cat:'ext', parent:'ml-distill', desc:'云端蒸馏算力。⚠️ 持续 500 故障中，\n熔断器兜底，再婚/丧偶专题排队等恢复。'},
  ],
  edges: []
};
DATA.nodes.forEach(n => { if (n.parent) DATA.edges.push([n.parent, n.id]); });

const COLORS = {core:'#f0b429', center:'#58a6ff', engine:'#3fb950', folk:'#bc8cff', kb:'#f778ba', model:'#ffa657', runtime:'#79c0ff', ext:'#d29922'};
const CATNAME = {core:'平台核心', center:'服务中心', engine:'排盘引擎', folk:'民俗/信众工具', kb:'知识库域', model:'模型链', runtime:'运行时服务', ext:'外部协同'};

const canvas = document.getElementById('graph');
const ctx = canvas.getContext('2d');
let W, H, cam = {x:180, y:0, z:0.92};
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

// 布局：径向（根在中心，按父节点扇形展开）
const pos = {};
const byParent = {};
DATA.nodes.forEach(n => { byParent[n.parent] = byParent[n.parent] || []; byParent[n.parent].push(n.id); });
function layout() {
  pos['root'] = {x:0, y:0};
  const L1 = byParent['root'] || [];
  L1.forEach((id, i) => {
    const a = (i / L1.length) * Math.PI * 2 - Math.PI/2;
    pos[id] = {x: Math.cos(a)*220, y: Math.sin(a)*220};
    const L2 = byParent[id] || [];
    L2.forEach((id2, j) => {
      const spread = Math.min(L2.length * 0.5, Math.PI * 1.2);
      const a2 = a - spread/2 + (L2.length > 1 ? j * spread/(L2.length-1) : 0);
      const r2 = 220 + 130 + (byParent[id2] ? 30 : 0);
      pos[id2] = {x: Math.cos(a2)*r2, y: Math.sin(a2)*r2};
      const L3 = byParent[id2] || [];
      L3.forEach((id3, k) => {
        const a3 = a2 + (k - (L3.length-1)/2) * 0.35;
        pos[id3] = {x: pos[id2].x + Math.cos(a3)*110, y: pos[id2].y + Math.sin(a3)*110};
      });
    });
  });
}
layout();

let drag = null, hover = null, selected = null;
const nodeR = id => id === 'root' ? 34 : (byParent[id] ? 20 : 13);

function toScreen(p){ return {x: (p.x - cam.x) * cam.z + W/2, y: (p.y - cam.y) * cam.z + H/2}; }
function toWorld(sx, sy){ return {x: (sx - W/2)/cam.z + cam.x, y: (sy - H/2)/cam.z + cam.y}; }

function draw() {
  ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,W,H);
  // 边
  DATA.edges.forEach(([a,b]) => {
    const pa = toScreen(pos[a]), pb = toScreen(pos[b]);
    ctx.strokeStyle = 'rgba(139,148,158,.35)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
  });
  // 节点
  DATA.nodes.forEach(n => {
    const p = toScreen(pos[n.id]);
    const r = nodeR(n.id) * Math.max(cam.z, .7);
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI*2);
    ctx.fillStyle = COLORS[n.cat];
    ctx.globalAlpha = (hover === n.id || selected === n.id) ? 1 : .85;
    ctx.fill(); ctx.globalAlpha = 1;
    if (hover === n.id || selected === n.id) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke(); }
    // 标签
    ctx.fillStyle = '#e6edf3';
    ctx.font = `${n.id==='root' ? 15 : 11}px -apple-system, "PingFang SC"`;
    ctx.textAlign = 'center';
    ctx.fillText(n.label, p.x, p.y + r + 14);
  });
  requestAnimationFrame(draw);
}
draw();

canvas.addEventListener('mousedown', e => { drag = {x:e.clientX, y:e.clientY, cam:{...cam}}; canvas.style.cursor='grabbing'; });
addEventListener('mousemove', e => {
  const tip = document.getElementById('tip');
  if (drag) {
    cam.x = drag.cam.x - (e.clientX - drag.x)/cam.z;
    cam.y = drag.cam.y - (e.clientY - drag.y)/cam.z;
    return;
  }
  const w = toWorld(e.clientX, e.clientY);
  hover = null;
  for (const n of DATA.nodes) {
    const d = Math.hypot(w.x - pos[n.id].x, w.y - pos[n.id].y);
    if (d < nodeR(n.id) + 6) { hover = n.id; break; }
  }
  canvas.style.cursor = hover ? 'pointer' : 'grab';
  if (hover) {
    const n = DATA.nodes.find(x => x.id === hover);
    tip.style.display = 'block'; tip.style.left = (e.clientX+14)+'px'; tip.style.top = (e.clientY+10)+'px';
    tip.innerHTML = `<b style="color:${COLORS[n.cat]}">${n.label}</b><br><span style="color:#8b949e">${CATNAME[n.cat]}</span>`;
  } else tip.style.display = 'none';
});
addEventListener('mouseup', e => {
  if (drag && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) < 5 && hover) select(hover);
  drag = null; canvas.style.cursor = hover ? 'pointer' : 'grab';
});
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.12 : 0.89;
  cam.z = Math.min(3, Math.max(.4, cam.z * f));
}, {passive:false});

function select(id) {
  selected = id;
  const n = DATA.nodes.find(x => x.id === id);
  document.getElementById('panel').classList.remove('hidden');
  document.getElementById('p-title').textContent = n.label;
  document.getElementById('p-cat').textContent = CATNAME[n.cat];
  document.getElementById('p-desc').textContent = n.desc || '';
  document.getElementById('p-metric').innerHTML = n.metric || '';
}
select('root');
</script>
</body>
</html>
