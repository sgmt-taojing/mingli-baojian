<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" var(--ink)>
<title>生命指数全鉴 · 易道智鉴</title>
<script src="js/wx-dim-bias.js"></script>
<script src="js/module-reports-kb.js" defer></script>
<script src="js/kb-fallback-indicator.js" defer></script>
<meta name="description" content="10 维度生命指数评估：事业/财运/健康/婚姻/学业/家庭/人际/精神/享福/寿元。可分享、可打印。">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/lifeindex-detail-inline.css">
</head>
<body data-kb-module="lifeindex">
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<div class="wrap">
  <header>
    <h1>生命指数全鉴</h1>
    <p>12 维度 · 五行偏重 · 易道智鉴</p>
    <div class="back-home"><a href="ai-assistant.html">← 返回 AI 助手</a> | <a href="divination-hub.html">🏠 主平台</a></div>
  </header>
  <div class="card" id="input">
    <h2>📋 基础信息</h2>
    <div class="row">
      <div><label for="liEle">五行主属</label>
        <select id="liEle" aria-label="liEle">
          <option value="金">金 · 锐进果断</option>
          <option value="木">木 · 生发学习</option>
          <option value="水">水 · 智慧灵活</option>
          <option value="火">火 · 热情表达</option>
          <option value="土">土 · 稳重承担</option>
        </select>
      </div>
      <div><label for="liAge">年龄</label><input id="liAge" type="number" min="1" max="120" value="32" aria-label="liAge"></div>
    </div>
    <label for="liFocus">关注方向（影响关键词加权）</label>
    <input id="liFocus" placeholder="例：金融、理财、稳定" aria-label="例：金融、理财、稳定">
    <label for="liExtra">补充情况（可选，影响领域细节）</label>
    <textarea id="liExtra" placeholder="例：金融行业从业5年，已婚一孩，今年开始关注健康" aria-label="例：金融行业从业5年，已婚一孩，今年开始关注健康"></textarea>
    <button class="btn" id="genBtn" onclick="generate()">✨ 生成生命指数</button>
  </div>
  <div class="report" id="report"></div>
  <p style="text-align:center;font-size:11px;opacity:.4;margin:24px 0;letter-spacing:1px">易道智鉴 · 仅供参考 · 命数只占 30%，努力占 70%</p>
</div>

  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/lifeindex-detail-inline.js" defer></script>
</body>
</html>
