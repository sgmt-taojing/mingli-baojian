<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-baojian/activate.html">
<title>激活 · 选择您的地区和语言</title>
<style>
:root{--bg:#0f1420;--card:#1a2233;--card2:#202a40;--line:#2c3854;--text:#e8edf7;--dim:#8b98b5;--accent:#4f8cff;--green:#2ecc71;--amber:#f5b942}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Hiragino Sans",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{max-width:480px;width:90%;padding:40px 0}
.logo{text-align:center;margin-bottom:36px}
.logo .icon{font-size:48px}
.logo h1{font-size:22px;font-weight:700;margin-top:10px}
.logo .sub{font-size:13px;color:var(--dim);margin-top:4px}
.step-dots{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);transition:.2s}
.dot.on{background:var(--accent);width:24px;border-radius:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px}
.card h2{font-size:17px;font-weight:700;margin-bottom:6px}
.card .hint{font-size:13px;color:var(--dim);margin-bottom:20px}
.option{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card2);border:2px solid transparent;border-radius:12px;cursor:pointer;margin-bottom:8px;transition:.12s}
.option:hover{border-color:rgba(79,140,255,.3)}
.option.on{border-color:var(--accent);background:rgba(79,140,255,.08)}
.option .flag{font-size:28px}
.option .info{flex:1}
.option .name{font-size:15px;font-weight:600}
.option .desc{font-size:11px;color:var(--dim);margin-top:2px}
.option .check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;transition:.2s}
.option.on .check{background:var(--accent);border-color:var(--accent)}
.option.on .check::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lang-grid .option{margin:0}
.actions{display:flex;gap:10px;margin-top:24px}
.btn{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.summary{background:var(--card2);border-radius:12px;padding:16px;margin-top:16px;font-size:13px;line-height:2}
.summary .row{display:flex;justify-content:space-between;align-items:center}
.summary .row .label{color:var(--dim)}
.summary .row .val{font-weight:600}
.summary .note{font-size:11px;color:var(--amber);margin-top:10px;line-height:1.7;padding:10px;background:rgba(245,185,66,.08);border-radius:8px}
.hidden{display:none!important}
.fade-in{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

/* R737: 移动端适配 */
@media(max-width:768px){
  body{font-size:14px}
  .container,.wrap,.main,.content{max-width:100%!important;padding:12px!important}
  table{display:block;overflow-x:auto}
  img,video,canvas{max-width:100%;height:auto}
  input,select,textarea{max-width:100%!important;box-sizing:border-box}
  .grid{grid-template-columns:1fr!important}
}
@media(max-width:480px){
  body{font-size:13px}
  button{min-height:36px}
}
</style>
<link rel="stylesheet" href="css/theme-unified.css">
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="icon">🦞</div>
    <h1 id="brandTitle">命理宝鉴</h1>
    <div class="sub" id="brandSub">Eastern Wisdom Platform</div>
  </div>

  <div class="step-dots">
    <div class="dot on" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <!-- Step 1: 选国别 -->
  <div class="card fade-in" id="step1">
    <h2 id="s1Title">选择您的国家或地区</h2>
    <p class="hint" id="s1Hint">这将决定可用的功能和法律合规配置</p>
    <div id="regionList"></div>
  </div>

  <!-- Step 2: 选语言 -->
  <div class="card fade-in hidden" id="step2">
    <h2 id="s2Title">选择您的语言</h2>
    <p class="hint" id="s2Hint">系统将据此切换全部界面文字</p>
    <div class="lang-grid" id="langList"></div>
  </div>

  <!-- Step 3: 确认 -->
  <div class="card fade-in hidden" id="step3">
    <h2 id="s3Title">确认您的配置</h2>
    <p class="hint" id="s3Hint">激活后可随时在设置中修改</p>
    <div class="summary" id="summaryBox"></div>
    <div class="actions">
      <button class="btn ghost" id="s3Back">返回</button>
      <button class="btn primary" id="s3Activate" onclick="doActivate()">🚀 激活</button>
    </div>
  </div>

  <div class="actions" id="s12Actions">
    <button class="btn ghost" id="s1Back" style="display:none" onclick="prevStep()">返回</button>
    <button class="btn primary" id="nextBtn" onclick="nextStep()" disabled>下一步</button>
  </div>

  <div id="activating" class="hidden" style="text-align:center;padding:40px">
    <div class="spin"></div>
    <div style="margin-top:12px;color:var(--dim);font-size:14px" id="actText">正在激活…</div>
  </div>

  <div id="doneScreen" class="hidden" style="text-align:center;padding:30px 0">
    <div style="font-size:52px;margin-bottom:14px">✅</div>
    <div style="font-size:18px;font-weight:700;margin-bottom:6px" id="doneTitle">激活完成</div>
    <div style="font-size:13px;color:var(--dim);margin-bottom:28px" id="doneSub">正在跳转…</div>
    <button class="btn primary" style="max-width:200px;margin:0 auto;display:block" onclick="goToApp()">进入系统 →</button>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:8920';
let options = { regions: [], languages: [], traditions: [] };
let selected = { region: null, locale: null };
let step = 1;
let profile = null;

const BRAND = {
  'zh-CN': { title: '命理宝鉴', sub: '东方智慧平台' },
  'zh-TW': { title: '命理寶鑑', sub: '東方智慧平台' },
  'en-SG': { title: 'Eastern Wisdom', sub: 'Traditional Knowledge Platform' },
  'en-US': { title: 'Eastern Wisdom', sub: 'Traditional Knowledge Platform' },
  'ja-JP': { title: '東洋智慧', sub: '伝統知識プラットフォーム' },
  'ko-KR': { title: '동양 지혜', sub: '전통 지식 플랫폼' },
  'vi-VN': { title: 'Eastern Wisdom', sub: 'Nền tảng tri thức truyền thống' },
};

// 加载选项
async function loadOptions() {
  try {
    const res = await fetch(API + '/api/activate/options');
    const d = await res.json();
    if (d.code === 0) {
      options = d.data;
      renderRegions();
    }
  } catch (e) {
    // 降级：硬编码选项
    options = {
      regions: [
        { code: 'cn', name: '中国大陆', flag: '🇨🇳' },
        { code: 'sg', name: 'Singapore / 东南亚', flag: '🇸🇬' },
        { code: 'jp', name: '日本', flag: '🇯🇵' },
        { code: 'us', name: 'United States', flag: '🇺🇸' },
        { code: 'eu', name: 'Europe', flag: '🇪🇺' },
        { code: 'kr', name: '한국', flag: '🇰🇷' },
        { code: 'vn', name: 'Việt Nam', flag: '🇻🇳' },
      ],
      languages: [],
    };
    renderRegions();
  }
}

function renderRegions() {
  const box = document.getElementById('regionList');
  box.innerHTML = options.regions.map(r => `
    <div class="option" data-region="${r.code}" onclick="selectRegion('${r.code}')">
      <span class="flag">${r.flag || '🌍'}</span>
      <div class="info">
        <div class="name">${r.name}</div>
        <div class="desc">${regionDesc(r.code)}</div>
      </div>
      <div class="check"></div>
    </div>`).join('');
}

function regionDesc(code) {
  return {
    cn: '全功能 · 简体中文 · 中医+命理',
    sg: '全功能 · 英文/中文 · TCM + Fortune + Wellness',
    jp: '漢方 + 四柱推命 · 日本語対応',
    us: 'Eastern Astrology + Wellness · English',
    eu: 'Eastern Astrology + Wellness · GDPR',
    kr: '한방 + 사주 · 한국어',
    vn: 'Nam Thuoc + TCM + 命理 · Tiếng Việt',
  }[code] || '';
}

function selectRegion(code) {
  selected.region = code;
  document.querySelectorAll('#regionList .option').forEach(el => {
    el.classList.toggle('on', el.dataset.region === code);
  });
  document.getElementById('nextBtn').disabled = false;
  // 品牌名联动
  const regionLocale = { cn: 'zh-CN', sg: 'en-SG', jp: 'ja-JP', us: 'en-US', eu: 'en-US', kr: 'ko-KR', vn: 'vi-VN' }[code];
  updateBrand(regionLocale);
}

function renderLangs() {
  // 推荐语言排序
  const recs = {
    cn: ['zh-CN'], sg: ['en-SG', 'zh-CN', 'zh-TW'], jp: ['ja-JP', 'en-SG'],
    us: ['en-US', 'en-SG'], eu: ['en-US', 'en-SG'], kr: ['ko-KR'], vn: ['vi-VN', 'en-SG'],
  };
  const rec = recs[selected.region] || ['en-SG'];
  const all = options.languages.length ? options.languages : [
    { code: 'zh-CN', name: '简体中文', native: '简体中文' },
    { code: 'zh-TW', name: '繁體中文', native: '繁體中文' },
    { code: 'en-SG', name: 'English (SEA)', native: 'English' },
    { code: 'en-US', name: 'English (US)', native: 'English (US)' },
    { code: 'ja-JP', name: '日本語', native: '日本語' },
    { code: 'ko-KR', name: '한국어', native: '한국어' },
    { code: 'vi-VN', name: 'Tiếng Việt', native: 'Tiếng Việt' },
  ];
  // 推荐的排前面
  const sorted = [...all].sort((a, b) => {
    const ai = rec.indexOf(a.code), bi = rec.indexOf(b.code);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  });
  const box = document.getElementById('langList');
  box.innerHTML = sorted.map(l => `
    <div class="option" data-lang="${l.code}" onclick="selectLang('${l.code}')">
      <div class="info">
        <div class="name">${l.native}</div>
        <div class="desc">${l.name}${rec.includes(l.code) ? ' · 推荐' : ''}</div>
      </div>
      <div class="check"></div>
    </div>`).join('');
  // 默认选推荐第一
  if (rec.length) selectLang(rec[0]);
}

function selectLang(code) {
  selected.locale = code;
  document.querySelectorAll('#langList .option').forEach(el => {
    el.classList.toggle('on', el.dataset.lang === code);
  });
  document.getElementById('nextBtn').disabled = false;
  updateBrand(code);
}

function updateBrand(locale) {
  const b = BRAND[locale] || BRAND['en-SG'];
  document.getElementById('brandTitle').textContent = b.title;
  document.getElementById('brandSub').textContent = b.sub;
  // 步骤标题翻译
  const t = {
    'zh-CN': { s1: '选择您的国家或地区', s1h: '这将决定可用的功能和法律合规配置', s2: '选择您的语言', s2h: '系统将据此切换全部界面文字', s3: '确认您的配置', s3h: '激活后可随时在设置中修改', next: '下一步', activate: '🚀 激活' },
    'en-SG': { s1: 'Choose Your Country or Region', s1h: 'This determines available features and legal compliance', s2: 'Choose Your Language', s2h: 'The interface will switch accordingly', s3: 'Confirm Your Configuration', s3h: 'You can change this later in Settings', next: 'Next', activate: '🚀 Activate' },
    'ja-JP': { s1: '国または地域を選択', s1h: '利用可能な機能と法的準拠が決まります', s2: '言語を選択', s2h: 'インターフェースが切り替わります', s3: '設定の確認', s3h: '設定で後から変更できます', next: '次へ', activate: '🚀 アクティベート' },
  };
  const tt = t[locale] || t['en-SG'];
  document.getElementById('s1Title').textContent = tt.s1;
  document.getElementById('s1Hint').textContent = tt.s1h;
  document.getElementById('s2Title').textContent = tt.s2;
  document.getElementById('s2Hint').textContent = tt.s2h;
  document.getElementById('s3Title').textContent = tt.s3;
  document.getElementById('s3Hint').textContent = tt.s3h;
  document.getElementById('nextBtn').textContent = tt.next;
}

function nextStep() {
  if (step === 1 && selected.region) {
    step = 2;
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('dot1').classList.remove('on');
    document.getElementById('dot2').classList.add('on');
    document.getElementById('s1Back').style.display = '';
    renderLangs();
    document.getElementById('nextBtn').disabled = true;
  } else if (step === 2 && selected.locale) {
    step = 3;
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
    document.getElementById('dot2').classList.remove('on');
    document.getElementById('dot3').classList.add('on');
    document.getElementById('s12Actions').style.display = 'none';
    renderSummary();
  }
}

function prevStep() {
  if (step === 2) {
    step = 1;
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step1').classList.remove('hidden');
    document.getElementById('dot2').classList.remove('on');
    document.getElementById('dot1').classList.add('on');
    document.getElementById('s1Back').style.display = 'none';
    document.getElementById('nextBtn').disabled = !selected.region;
  } else if (step === 3) {
    step = 2;
    document.getElementById('step3').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    document.getElementById('dot3').classList.remove('on');
    document.getElementById('dot2').classList.add('on');
    document.getElementById('s12Actions').style.display = '';
  }
}

async function renderSummary() {
  // 调 API 获取完整 profile
  try {
    const res = await fetch(API + '/api/activate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ region: selected.region, locale: selected.locale }),
    });
    const d = await res.json();
    if (d.code === 0) profile = d.data;
  } catch (_) { /* 降级 */ }

  const r = options.regions.find(r => r.code === selected.region);
  const f = profile ? profile.features : {};
  const traditions = (profile?.recommendations?.formulaTraditions) || ['tcm'];
  const notes = (profile?.recommendations?.complianceNotes) || [];

  const traditionNames = { tcm: '中医方剂', kampo: '日本漢方', hanbang: '韓方', ayurveda: '阿育吠陀', western: '西方草本', nam_thuoc: '越南南药' };
  const localeName = options.languages.find(l => l.code === selected.locale)?.native || selected.locale;

  document.getElementById('summaryBox').innerHTML = `
    <div class="row"><span class="label">地区</span><span class="val">${r?.flag || '🌍'} ${r?.name || selected.region}</span></div>
    <div class="row"><span class="label">语言</span><span class="val">${localeName}</span></div>
    <div class="row"><span class="label">命理排盘</span><span class="val">${f.showFortune ? '✅' : '❌'}</span></div>
    <div class="row"><span class="label">中医/传统医学</span><span class="val">${f.showTCM ? '✅' : '❌'}</span></div>
    <div class="row"><span class="label">方剂建议</span><span class="val">${f.showPrescription ? '✅' : '❌（法规限制）'}</span></div>
    <div class="row"><span class="label">AI 视觉诊断</span><span class="val">${f.showAIVision ? '✅' : '❌'}</span></div>
    <div class="row"><span class="label">无人化自主</span><span class="val">${f.showAutopilot ? '✅' : '❌'}</span></div>
    <div class="row"><span class="label">方剂体系</span><span class="val">${traditions.map(t => traditionNames[t] || t).join('、')}</span></div>
    <div class="row"><span class="label">隐私法规</span><span class="val">${f.privacyLaw || '—'}</span></div>
    ${notes.length ? `<div class="note">⚠ ${notes.join('<br>⚠ ')}</div>` : ''}
  `;
}

async function doActivate() {
  document.getElementById('step3').classList.add('hidden');
  document.getElementById('activating').classList.remove('hidden');
  // 保存到 localStorage
  localStorage.setItem('mbj_region', selected.region);
  localStorage.setItem('mbj_locale', selected.locale);
  localStorage.setItem('mbj_activated', new Date().toISOString());
  // 调 API 保存
  try {
    await fetch(API + '/api/activate/save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId: 'local_user', region: selected.region, locale: selected.locale }),
    });
  } catch (_) {}
  await new Promise(r => setTimeout(r, 800));
  document.getElementById('activating').classList.add('hidden');
  document.getElementById('doneScreen').classList.remove('hidden');
  // 2.5s 后自动跳转
  setTimeout(goToApp, 2500);
}

function goToApp() {
  // 激活后跳主页（带上 region+locale 参数）
  const url = `/index.html?region=${selected.region}&locale=${selected.locale}&activated=1`;
  window.location.href = url;
}

// 已激活 → 跳过
if (localStorage.getItem('mbj_activated')) {
  // 直接进入 app
  window.location.href = '/index.html';
} else {
  loadOptions();
}
</script>
<script src="js/mobile-nav.js" defer></script>
</body>
</html>
