<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5, user-scalable=yes">
<meta name="theme-color" var(--ink)>
<title>疗愈音乐诊断 · 易道智鉴</title>
<script src="js/wx-dim-bias.js" defer></script>
<script src="js/module-reports-kb.js" defer></script>
<script src="js/kb-fallback-indicator.js" defer></script>
<meta name="description" content="五行音乐诊断：情志+五行→推荐调性+5 段播放列表+7 日疗程。可分享、可打印、Edge-TTS 试听。">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/music-detail-inline.css">
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body data-kb-module="music">
<div class="wrap">
<header>
  <h1>疗愈音乐诊断</h1>
  <p>五行音乐 · 情志调和 · 7 日疗程</p>
  <div class="back-home"><a href="ai-assistant.html">← 返回 AI 助手</a> | <a href="divination-hub.html">🏠 主平台</a></div>
</header>

<!-- 输入区 -->
<div id="input">
  <div class="card">
    <h2>🌀 情志·五行输入</h2>
    <label for="mEmotion">情志状态（焦虑 / 愤怒 / 抑郁 / 疲劳 / 悲伤 / 急躁）</label>
    <input aria-label="mEmotion" id="mEmotion" placeholder="如：焦虑" value="焦虑">
    <div class="row">
      <div>
        <label for="mElement">五行主属</label>
        <select aria-label="mElement" id="mElement">
          <option value="金">金 · 锐进</option>
          <option value="木">木 · 生发</option>
          <option value="水">水 · 智慧</option>
          <option value="火">火 · 表达</option>
          <option value="土">土 · 稳重</option>
        </select>
      </div>
      <div>
        <label for="mScene">聆听场景</label>
        <select aria-label="mScene" id="mScene">
          <option value="晨起">晨起</option>
          <option value="工作间歇">工作间歇</option>
          <option value="睡前">睡前</option>
          <option value="冥想">冥想</option>
          <option value="运动后">运动后</option>
        </select>
      </div>
    </div>
    <label for="mExtra">附加诉求（可选）</label>
    <textarea id="mExtra" placeholder="如：希望快速入眠 / 缓解胸闷 / 提振精神" aria-label="如：希望快速入眠 / 缓解胸闷 / 提振精神"></textarea>
    <button class="btn" id="genBtn" onclick="generate()">✨ 生成疗愈方案</button>
  </div>
</div>

<!-- 报告区 -->
<div id="report" class="report"></div>

</div>


<script src="js/music-detail-inline.js" defer></script>
<script src="js/mobile-nav.js" defer></script>

<style>
/* R98-t 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>

<style>
/* R98-t 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>
</body>
</html>
