<div id="input">

<div class="field" style="margin-bottom:10px">
  <label for="m-name">姓名</label>
  <input aria-label="姓名" type="text" id="m-name" placeholder="请输入姓名" maxlength="20" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px">
</div>
<div class="row" style="gap:8px;margin-bottom:10px">
  <div class="field"><label for="m-year">出生年</label><input aria-label="出生年" type="number" id="m-year" placeholder="年" value="1990" min="1900" max="2100" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px"></div>
  <div class="field"><label for="m-month">月</label><input aria-label="月" type="number" id="m-month" placeholder="月" value="1" min="1" max="12" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px"></div>
  <div class="field"><label for="m-day">日</label><input aria-label="日" type="number" id="m-day" placeholder="日" value="1" min="1" max="31" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px"></div>
  <div class="field"><label for="m-hour">时辰</label><input aria-label="时辰" type="number" id="m-hour" placeholder="时(0-23)" value="12" min="0" max="23" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px"></div>
</div>
<div class="field" style="margin-bottom:10px">
  <label for="m-sex">性别</label>
  <select id="m-sex" aria-label="性别" style="width:100%;padding:8px 12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#fff;font-size:13px">
    <option value="">-- 请选择 --</option>
    <option value="male">男</option>
    <option value="female">女</option>
  </select>
</div>
    <label for="mEmotion">情志状态（焦虑 / 愤怒 / 抑郁 / 疲劳 / 悲伤 / 急躁）</label>
    <input aria-label="mEmotion" id="mEmotion" placeholder="如：焦虑" value="焦虑">
    <div class="row">
      <div>
        <label for="mElement">五行主属</label>
        <select aria-label="mElement" id="mElement">
          <option value="金">金 · 锐进</option>
          <option value="木">木 · 生发</option>
          <option value="水">水 · 智慧</option>
          <option value="火">火 · 表达</option>
          <option value="土">土 · 稳重</option>
        </select>
      </div>
      <div>
        <label for="mScene">聆听场景</label>
        <select aria-label="mScene" id="mScene">
          <option value="晨起">晨起</option>
          <option value="工作间歇">工作间歇</option>
          <option value="睡前">睡前</option>
          <option value="冥想">冥想</option>
          <option value="运动后">运动后</option>
        </select>
      </div>
    </div>
    <label for="mExtra">附加诉求（可选）</label>
    <textarea id="mExtra" placeholder="如：希望快速入眠 / 缓解胸闷 / 提振精神" aria-label="如：希望快速入眠 / 缓解胸闷 / 提振精神"></textarea>
    <button class="btn" id="genBtn" onclick="generate()">光 生成疗愈方案</button>
