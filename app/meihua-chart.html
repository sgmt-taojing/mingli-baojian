<div class="mh-form">
  <input aria-label="姓名" type="text" id="mh-name" placeholder="姓名(可选)" maxlength="20">
  <select id="mh-sex" aria-label="性别"><option value="male">男</option><option value="female">女</option></select>
  <input aria-label="年" type="number" id="mh-year" placeholder="年" value="1990" min="1900" max="2100">
  <input aria-label="月" type="number" id="mh-month" placeholder="月" value="10" min="1" max="12">
  <input aria-label="日" type="number" id="mh-day" placeholder="日" value="28" min="1" max="31">
  <input aria-label="时" type="number" id="mh-hour" placeholder="时" value="7" min="0" max="23">
  <input aria-label="数字1" type="number" id="mh-num1" placeholder="数字1(可选)" min="0" max="99">
  <input aria-label="数字2" type="number" id="mh-num2" placeholder="数字2(可选)" min="0" max="99">
  <input aria-label="数字3" type="number" id="mh-num3" placeholder="数字3(可选)" min="0" max="99">
  <input aria-label="出生地经度" type="number" id="mh-lng" placeholder="经度(默认121.47)" value="121.47" step="0.01" min="73" max="135" title="出生地经度（用于真太阳时校正）">
  <input aria-label="流年" type="number" id="mh-target-year" placeholder="流年" value="2026" min="1900" max="2100" title="查流年运势的目标年份">
  <button onclick="doPaipan()">排盘</button>

<button onclick="generateFullReport('meihua')" style="margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,#ffb44d,#ff7e5f);color:#0f1820;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px">📜 出具梅花易数报告</button>
<script>
async function generateFullReport(mod){
  try{
    const inputs = {};
    document.querySelectorAll('input,select').forEach(el=>{
      const m = el.id && el.id.match(/^[a-z]+-(.+)$/);
      if(m) if(el.type==='number' && el.value) inputs[m[1]] = +el.value;
        else inputs[m[1]] = el.value;
    });
    if(inputs.lunar===undefined) inputs.lunar = (window.zwCalMode==='lunar') || (window.lrCalMode==='lunar');
    if(inputs.leapMonth===undefined) inputs.leapMonth = false;
    
    const csrfRes = await fetch(API_BASE+'/api/csrf-token').then(r=>r.json()).catch(()=>({csrfToken:''}));
    const csrf = csrfRes.csrfToken || csrfRes.token || '';
    
    const r = await fetch(API_BASE+'/api/paipan/'+mod+'/report', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},
      body: JSON.stringify({
        ...inputs,
        // 字段映射：前端字段名 → 后端期望字段名
        query: inputs.question || inputs.query || '',
        divinationTime: inputs.divinationTime || new Date().toISOString().slice(0,16).replace('T',' '),
        gender: inputs.sex || inputs.gender || 'male',
        questions: [inputs.question||''].filter(Boolean),
        options: { name: inputs.name||'缘主' }
      })
    }).then(r=>r.json());
    
    if(!r.ok){
      const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
      fn('报告生成失败：'+(r.error||''));
      return;
    }
    
    // 保存报告到 sessionStorage，跳到报告展示页
    sessionStorage.setItem('lastReport', JSON.stringify(r));
    window.location.href = 'report-interpret.html?module='+mod+'&name='+encodeURIComponent(inputs.name||'缘主');
  }catch(e){
    const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
    fn('生成失败：'+e.message);
    console.error(e);
  }
}
</script>

<div id="mh-content" style="display:none"></div>
<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
async function doPaipan(){
  const y=document.getElementById('mh-year').value;
  const m=document.getElementById('mh-month').value;
  const d=document.getElementById('mh-day').value;
  const h=document.getElementById('mh-hour').value;
  if(!y||!m||!d||h===''){showToast('请填写完整的年月日时');return;}
  const name = document.getElementById('mh-name').value || '';
  const sex = document.getElementById('mh-sex').value;
  const num1 = document.getElementById('mh-num1').value;
  const num2 = document.getElementById('mh-num2').value;
  const num3 = document.getElementById('mh-num3').value;
  const lngEl = document.getElementById('mh-lng');
  const lng = lngEl ? (+lngEl.value || 121.47) : 121.47;
  const tyEl = document.getElementById('mh-target-year');
  const targetYear = tyEl ? (+tyEl.value || new Date().getFullYear()) : new Date().getFullYear();
  const now = new Date();
  const currentAge = now.getFullYear() - +y;
  const body = {year:+y,month:+m,day:+d,hour:+h,name,sex,lng,targetYear,currentAge};
  if(num1) body.num1 = +num1;
  if(num2) body.num2 = +num2;
  if(num3) body.num3 = +num3;
  let r, rSvg;
  try {
    [r, rSvg] = await Promise.all([
      fetch(API_BASE+'/api/paipan/meihua',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)}),
      fetch(API_BASE+'/api/paipan/meihua/svg',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(20000)})
    ]);
  } catch(e) {
    showToast('排盘请求失败：' + (e && e.message || '网络异常') + '，请重试','err');
    return;
  }
  const data=await r.json();
  if(!data.ok){showToast('排盘失败: '+data.error);return;}
  const svg = await rSvg.text();
  renderChart(data.chart);
  renderSvg(svg);
  renderFlow(data.flow, targetYear, currentAge);
  if(data.interpretation) renderInterpretation(data.interpretation);
}
function renderChart(c){
  document.getElementById('mh-meta').textContent=`动爻：${c.dongYaoName} | ${c.meta?c.meta.method:''}`;
  const ct=document.getElementById('mh-content');
  ct.style.display='block';
  let html='<div class="mh-chart">';
  // 本卦
  html+=`<div class="mh-gua"><div class="mh-gua-name">本卦：${c.guaName}</div>`;
  let sym='';
  for(let i=c.yaos.length-1;i>=0;i--) sym+=c.yaos[i].yin?'⚋':'⚊';
  html+=`<div class="mh-gua-sym">${sym}</div>`;
  html+=`<div class="mh-gua-label">${c.upper.name}(${c.upper.nature}·${c.upper.wuxing}) / ${c.lower.name}(${c.lower.nature}·${c.lower.wuxing})</div></div>`;
  // 六爻
  for(let i=c.yaos.length-1;i>=0;i--){
    const y=c.yaos[i];
    const cls=y.isDong?'mh-yao dong':'mh-yao';
    const line=y.yin?'— —':'———';
    const tag=y.isDong?'<span style="color:var(--red)">○动</span>':'';
    const tiTag=(i===c.tiYong.dongYao)?'<span style="color:var(--gold)">用</span>':'<span style="color:var(--jade)">体</span>';
    html+=`<div class="${cls}"><div class="pos">${y.positionName}</div><div class="line">${line}</div><div class="wx">${y.isUpper?'上卦':'下卦'}</div><div class="tag">${tiTag} ${tag}</div></div>`;
  }
  html+='</div>';
  // 变卦 & 互卦
  html+='<div class="mh-chart" style="margin-top:8px">';
  if(c.bianGua) html+=`<div class="mh-gua"><div class="mh-gua-name">变卦：${c.bianGua.name}</div><div class="mh-gua-label">${c.bianGua.upper.name}(${c.bianGua.upper.wuxing}) / ${c.bianGua.lower.name}(${c.bianGua.lower.wuxing})</div></div>`;
  if(c.huGua) html+=`<div class="mh-gua"><div class="mh-gua-name">互卦：${c.huGua.name}</div><div class="mh-gua-label">${c.huGua.upper.name}(${c.huGua.upper.wuxing}) / ${c.huGua.lower.name}(${c.huGua.lower.wuxing})</div></div>`;
  html+='</div>';
  // 体用分析
  const ty=c.tiYong;
  const relClass=ty.relation.includes('吉')?'ji':(ty.relation.includes('凶')?'xiong':'ping');
  html+='<div class="mh-tiyong"><h3>体用分析</h3>';
  html+=`<div class="mh-tiyong-row"><span class="mh-tiyong-label">体卦</span><span class="mh-tiyong-val">${ty.tiGua.name}（${ty.tiGua.wuxing}）</span></div>`;
  html+=`<div class="mh-tiyong-row"><span class="mh-tiyong-label">用卦</span><span class="mh-tiyong-val">${ty.yongGua.name}（${ty.yongGua.wuxing}）</span></div>`;
  html+=`<div class="mh-tiyong-row"><span class="mh-tiyong-label">体用关系</span><span class="mh-tiyong-val mh-rel ${relClass}">${ty.relation}</span></div>`;
  if(ty.bianYongGua){
    const bRelClass=ty.bianRelation.includes('吉')?'ji':(ty.bianRelation.includes('凶')?'xiong':'ping');
    html+=`<div class="mh-tiyong-row"><span class="mh-tiyong-label">变用</span><span class="mh-tiyong-val">${ty.bianYongGua.name}（${ty.bianYongGua.wuxing}）</span></div>`;
    html+=`<div class="mh-tiyong-row"><span class="mh-tiyong-label">变用关系</span><span class="mh-tiyong-val mh-rel ${bRelClass}">${ty.bianRelation}</span></div>`;
  }
  html+='</div>';
  ct.innerHTML=html;
}

function renderSvg(svg){
  const old = document.getElementById('mh-svg-host');
  if(old) old.remove();
  const host = document.createElement('div');
  host.id = 'mh-svg-host';
  host.style.cssText = 'max-width:800px;margin:16px auto;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;padding:8px;text-align:center';
  host.innerHTML = '<div style="font-size:12px;color:var(--gold,#c9a84c);margin-bottom:6px">📜 高清盘图（R474 SVG · 可右键保存 / 微信长按分享）</div>' + svg;
  const content = document.getElementById('mh-content');
  if(content) content.parentNode.insertBefore(host, content);
}

function renderFlow(flow, targetYear, currentAge){
  const old = document.getElementById('mh-flow-host');
  if(old) old.remove();
  if(!flow) return;
  const ln = flow.liuNian || {};
  const xx = flow.xiaoXian || {};
  const dx = flow.currentDaXian || {};
  const host = document.createElement('div');
  host.id = 'mh-flow-host';
  host.style.cssText = 'max-width:800px;margin:12px auto;padding:12px;background:var(--card,#141928);border:1px solid var(--border,#2a3450);border-radius:8px;font-size:12px;color:var(--paper,#e8dcc8)';
  host.innerHTML = `
    <div style="color:var(--gold,#c9a84c);font-weight:600;margin-bottom:8px">🌊 ${targetYear} 流年 · 现年 ${currentAge} 岁</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:11px">
      <div style="background:rgba(201,168,76,.08);padding:8px;border-radius:6px">
        <div style="color:var(--gold,#c9a84c)">流年</div>
        <div>${ln.ganZhi||''}（${ln.shengXiao||''}）</div>
        <div style="color:var(--paper3);margin-top:2px">${ln.naYin||''}</div>
      </div>
      <div style="background:rgba(78,201,176,.08);padding:8px;border-radius:6px">
        <div style="color:var(--jade,#4ec9b0)">小限</div>
        <div>${xx.palaceName||''}宫</div>
        <div style="color:var(--paper3);margin-top:2px">${xx.direction||''}</div>
      </div>
      <div style="background:rgba(99,179,237,.08);padding:8px;border-radius:6px">
        <div style="color:var(--blue,#63b3ed)">大限</div>
        <div>${dx.startAge||''} - ${dx.endAge||''} 岁</div>
        <div style="color:var(--paper3);margin-top:2px">${dx.ganZhi||''} · ${dx.palaceName||''}</div>
      </div>
    </div>`;
  const content = document.getElementById('mh-content');
  if(content) content.parentNode.insertBefore(host, content);
  else document.body.appendChild(host);
}

function renderInterpretation(i){
  if(!i) return;
  const el=document.getElementById('paipan-interpretation')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-interpretation';
    d.style.cssText='margin:16px 0;padding:16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:12px';
    document.querySelector('.zw-grid,.qm-grid,.ly-grid,.lr-grid,.mh-grid,.fs-grid,main,body').appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">卷 断盘解读</div>';
  if(i.summary) h+='<div style="font-size:13px;line-height:1.7;opacity:.9;margin-bottom:8px">'+i.summary+'</div>';
  if(i.advice) h+='<div style="font-size:13px;line-height:1.7;opacity:.75">'+i.advice+'</div>';
  if(i.guaJi) h+='<div style="font-size:12px;opacity:.6;margin-top:6px">卦象：'+i.guaJi+'</div>';
  el.innerHTML=h;
  el.style.display='block';
}
</script>
