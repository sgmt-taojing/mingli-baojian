<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🛡️ 智能体训练矩阵 · 监控总览</title>
<style>
/* ═══════════ 设计系统 ═══════════ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070f;
  --card:#0b1020;
  --card-2:#0e1528;
  --line:rgba(0,212,255,0.10);
  --line-hot:rgba(0,212,255,0.28);
  --text:#e6ecff;
  --dim:#5a6a90;
  --green:#00ffa3;
  --yellow:#ffb800;
  --red:#ff3860;
  --blue:#00d4ff;
  --purple:#8b6cff;
  --radius:12px;
  --shadow:0 4px 24px rgba(0,0,0,0.45);
}
body{
  background:var(--bg);
  background-image:
    radial-gradient(900px 400px at 15% -5%,rgba(0,212,255,0.07),transparent 60%),
    radial-gradient(900px 400px at 85% -5%,rgba(139,108,255,0.06),transparent 60%);
  background-attachment:fixed;
  color:var(--text);
  font-family:'SF Mono','Menlo','Cascadia Code',monospace;
  font-size:12.5px;line-height:1.5;
  padding:14px;min-height:100vh;
}
/* ═══════════ 顶栏 ═══════════ */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-bottom:12px;
  background:linear-gradient(135deg,rgba(0,212,255,0.05),rgba(139,108,255,0.05));
  border:1px solid var(--line);border-radius:var(--radius);}
.topbar h1{font-size:17px;letter-spacing:0.5px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.topbar .status{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;border:1px solid var(--line);background:rgba(255,255,255,0.02);white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%}
.pill.green{color:var(--green);border-color:rgba(0,255,163,0.25)}.pill.green .dot{background:var(--green);box-shadow:0 0 6px var(--green)}
.pill.yellow{color:var(--yellow);border-color:rgba(255,184,0,0.25)}.pill.yellow .dot{background:var(--yellow)}
.pill.red{color:var(--red);border-color:rgba(255,56,96,0.3)}.pill.red .dot{background:var(--red);box-shadow:0 0 6px var(--red)}
.pill.dim{color:var(--dim)}
/* ═══════════ KPI 行 ═══════════ */
.kpi-row{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:1.5px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0.5}
.kpi .v{font-size:19px;font-weight:800}
.kpi .l{font-size:8.5px;color:var(--dim);text-transform:uppercase;letter-spacing:0.8px;margin-top:2px}
/* ═══════════ 三栏布局 ═══════════ */
.cols{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);background:rgba(0,212,255,0.02)}
.panel-head .n{font-size:10px;color:var(--text);background:var(--card-2);padding:1px 8px;border-radius:10px;letter-spacing:0}
.panel-body{padding:10px 12px}
/* ═══════════ 项目卡 ═══════════ */
.proj{display:flex;align-items:center;gap:8px;padding:8px;border-radius:8px;border-bottom:1px solid rgba(0,212,255,0.04);transition:background 0.15s}
.proj:last-child{border:0}
.proj:hover{background:rgba(0,212,255,0.04)}
.proj .ic{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--card-2);border:1px solid var(--line)}
.proj .meta{flex:1;min-width:0}
.proj .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .nm.main{color:var(--blue)}
.proj .sub{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .nums{display:flex;gap:8px;flex-shrink:0;font-size:10px;color:var(--dim)}
.proj .nums b{font-size:10.5px}
.children{background:rgba(0,212,255,0.02);border-left:1px solid var(--line);margin-left:17px;padding-left:4px;border-radius:0 8px 8px 0}
.grade{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;border:1px solid}
.grade.A{color:var(--green);border-color:rgba(0,255,163,0.4);background:rgba(0,255,163,0.08)}
.grade.B{color:var(--yellow);border-color:rgba(255,184,0,0.4);background:rgba(255,184,0,0.08)}
.grade.C{color:var(--red);border-color:rgba(255,56,96,0.4);background:rgba(255,56,96,0.08)}
.grade.D{color:var(--red);border-color:var(--red);background:rgba(255,56,96,0.2)}
/* ═══════════ 服务/探针 ═══════════ */
.svc{display:flex;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px solid rgba(0,212,255,0.03);font-size:11.5px}
.svc:last-child{border:0}
.svc .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.svc .dot.run{background:var(--green);box-shadow:0 0 6px var(--green);animation:pulse 2.4s infinite}
.svc .dot.warn{background:var(--yellow)}
.svc .dot.stop{background:var(--red)}
.svc .port{font-weight:700;color:var(--blue);width:42px;flex-shrink:0}
.svc .lbl{flex:1;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc .val{flex-shrink:0;font-size:10px;color:var(--dim)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.45}}
/* ═══════════ 蒸馏链路 ═══════════ */
.flow{display:flex;align-items:center;gap:6px;padding:7px 4px;border-bottom:1px solid rgba(0,212,255,0.03);font-size:11px}
.flow:last-child{border:0}
.flow .tag{width:34px;text-align:center;padding:2px 0;border-radius:4px;font-size:9.5px;font-weight:700;flex-shrink:0}
.flow .tag.lm{background:rgba(139,108,255,0.15);color:var(--purple)}
.flow .tag.med{background:rgba(0,212,255,0.12);color:var(--blue)}
.flow .tag.vis{background:rgba(0,255,163,0.10);color:var(--green)}
.flow .path{flex:1;font-size:10px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flow .cnt{flex-shrink:0;font-size:10px}
.flow .cnt b{font-size:10.5px}
/* ═══════════ 磁盘 ═══════════ */
.disk{display:flex;align-items:center;gap:8px;padding:6px 0}
.disk .lbl{width:42px;font-weight:700;font-size:11px;flex-shrink:0}
.disk .bar{flex:1;height:12px;border-radius:6px;background:var(--card-2);overflow:hidden}
.disk .fill{height:100%;border-radius:6px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:8.5px;font-weight:700;color:#fff}
.disk .det{width:96px;text-align:right;font-size:9.5px;color:var(--dim);flex-shrink:0}
/* ═══════════ 告警 ═══════════ */
.alert{display:flex;gap:6px;align-items:flex-start;padding:5px 0;font-size:11px;border-bottom:1px solid rgba(0,212,255,0.03)}
.alert:last-child{border:0}
/* ═══════════ 自动化 ═══════════ */
.auto{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.auto .cell{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center}
.auto .t{font-weight:700;font-size:10.5px}
.auto .d{font-size:8.5px;color:var(--dim);margin-top:2px}
/* ═══════════ 阶段进度 + 健康 ═══════════ */
.stage{font-size:9px;color:var(--dim);margin-top:2px;display:flex;align-items:center;gap:5px}
.stage .bar{flex:1;height:4px;border-radius:2px;background:var(--card-2);overflow:hidden}
.stage .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.stage .pct{color:var(--dim);font-size:8.5px;flex-shrink:0}
.hgrade{display:inline-flex;width:22px;height:22px;border-radius:6px;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;border:1px solid}
.hgrade.S{color:#fff;border-color:var(--blue);background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 0 8px rgba(0,212,255,0.4)}
.hgrade.A{color:var(--green);border-color:rgba(0,255,163,0.4);background:rgba(0,255,163,0.08)}
.hgrade.B{color:var(--yellow);border-color:rgba(255,184,0,0.4);background:rgba(255,184,0,0.08)}
.hgrade.C{color:var(--red);border-color:rgba(255,56,96,0.4);background:rgba(255,56,96,0.08)}
.hgrade.D{color:var(--red);border-color:var(--red);background:rgba(255,56,96,0.2)}
/* ═══════════ 底部 ═══════════ */
.footer{margin-top:12px;text-align:center;color:var(--dim);font-size:10.5px;padding:8px}
.footer b{color:var(--blue)}
/* ═══════════ 响应式 ═══════════ */
@media(max-width:1320px){.cols{grid-template-columns:1fr 1.2fr}.col-r{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:12px}}
@media(max-width:960px){.cols{grid-template-columns:1fr}.col-r{display:flex}.kpi-row{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.kpi-row{grid-template-columns:repeat(2,1fr)}.topbar{flex-direction:column;align-items:flex-start}.status{justify-content:flex-start}}
</style>
<link rel="stylesheet" href="css/theme-unified.css">
</head>
<body>

<div class="topbar" id="topbar"></div>
<div class="kpi-row" id="kpis"></div>
<div class="cols" id="cols"></div>
<div class="footer" id="footer"></div>

<script>
const DATA_URL = 'monitor-data.json';
const n = v => v>=1000 ? (v/1000).toFixed(1)+'K' : v;
const esc = s => String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function render(){
  try{
    const res = await fetch(DATA_URL+'?t='+Date.now());
    const D = await res.json();
    const S = D.summary;
    const main = D.projects.filter(p=>p.isMain);
    const subs = D.projects.filter(p=>!p.isMain);
    const running = D.services.filter(s=>s.status==='running').length;

    /* ── 顶栏 ── */
    document.getElementById('topbar').innerHTML = `
      <h1>🛡️ 智能体训练矩阵 · 监控总览</h1>
      <div class="status">
        <span class="pill green"><span class="dot"></span>服务 ${running}/${D.services.length}</span>
        <span class="pill ${S.avgScore>=90?'green':'yellow'}"><span class="dot"></span>安全评分 ${S.avgScore}</span>
        <span class="pill ${S.failedTasks>0?'red':'green'}"><span class="dot"></span>任务 ${S.failedTasks>0?S.failedTasks+' 失败':'正常'}</span>
        <span class="pill ${S.totalAlerts>0?'red':'green'}"><span class="dot"></span>告警 ${S.totalAlerts}</span>
        <span class="pill dim">⏱ ${esc(D.timestamp)}</span>
      </div>`;

    /* ── KPI 行 ── */
    document.getElementById('kpis').innerHTML = [
      ['核心智能体', S.mainProjects, 'var(--purple)'],
      ['KB 条目', n(S.totalKB), 'var(--blue)'],
      ['功能总量', n(S.totalFeatures), 'var(--text)'],
      ['API 端点', n(S.totalAPIs), 'var(--green)'],
      ['AI 模型', S.totalModels, 'var(--cyan)'],
      ['平均延迟', (S.avgLatency||0)+'ms', S.avgLatency>200?'var(--yellow)':'var(--dim)'],
      ['训练样本', n(S.totalTrainingSamples||0), 'var(--purple)'],
      ['测试用例', n(S.totalTests), 'var(--yellow)'],
    ].map(([l,v,c])=>`<div class="kpi"><div class="v" style="color:${c}">${v}</div><div class="l">${l}</div></div>`).join('');

    /* ── 左栏：项目矩阵（树形隶属） ── */
    const buildTree = () => {
      // 子模块按 parent 挂到核心项目下
      const tree = main.map(p => ({...p, children: subs.filter(s => s.parent === p.name)}));
      const orphans = subs.filter(s => !main.some(m => m.name === s.parent));
      return {tree, orphans};
    };
    const {tree, orphans} = buildTree();
    const hasChild = t => t.children.length > 0;
    const left = `
      <div class="panel">
        <div class="panel-head">🧠 项目矩阵 <span class="n">${main.length} 核心 + ${subs.length} 子模块</span></div>
        <div class="panel-body" id="projTree">
          ${tree.map(t=>`
            <div>
              <div class="proj" style="cursor:${hasChild(t)?'pointer':'default'}" data-toggle="${t.dir}">
                <span class="ic" style="color:var(--blue)">★</span>
                <div class="meta">
                  <div class="nm main">${esc(t.name)}</div>
                  <div class="sub">KB ${n(t.kbCount)}${t.kbTarget?'/'+n(t.kbTarget):''} · 样本 ${t.trainingSamples?n(t.trainingSamples):'-'} · 模型 ${t.models}</div>
                  ${t.goal?`<div class="stage"><span style="max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(t.goal)}">${esc(t.stage||'')}</span><span class="bar"><span class="fill" style="width:${Math.max(t.kbProgress,t.sampleProgress,t.modelProgress,t.stageIndex/t.stageTotal*100)}%"></span></span><span class="pct">${Math.max(t.kbProgress,t.sampleProgress,t.modelProgress,t.stageIndex/t.stageTotal*100)}%</span></div>`:''}
                </div>
                ${hasChild(t)?`<span class="toggle" data-tg="${t.dir}" style="width:20px;text-align:center;color:var(--blue);font-weight:800;cursor:pointer;flex-shrink:0">+</span>`:''}
                <span class="hgrade ${t.hgrade}" title="综合健康 ${t.health}/100">${t.hgrade}</span>
              </div>
              <div class="children" id="ch-${t.dir}" style="display:none">
                ${t.children.map(c=>`
                  <div class="proj child">
                    <span class="ic" style="color:var(--dim);width:20px;height:20px;font-size:10px;margin-left:6px">└</span>
                    <div class="meta">
                      <div class="nm" style="font-size:12px">${esc(c.name)}</div>
                      <div class="sub">KB ${n(c.kbCount)} · 功能 ${n(c.totalFeatures)}</div>
                    </div>
                    <span class="grade ${c.grade}" style="width:20px;height:20px;font-size:10px">${c.grade}</span>
                  </div>`).join('')}
              </div>
            </div>`).join('')}
          ${orphans.length?`<div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:8px 4px 2px">独立项目</div>
          ${orphans.map(c=>`
            <div class="proj">
              <span class="ic" style="color:var(--dim)">·</span>
              <div class="meta">
                <div class="nm" style="font-size:12px">${esc(c.name)}</div>
                <div class="sub">KB ${n(c.kbCount)} · 功能 ${n(c.totalFeatures)}</div>
              </div>
              <span class="grade ${c.grade}" style="width:20px;height:20px;font-size:10px">${c.grade}</span>
            </div>`).join('')}`:''}
        </div>
      </div>`;

    /* ── 训练提示词生成 ── */
    const genPrompts = () => {
      const list = [];
      const prioOf = (p, kind, pct) => {
        if (p.hgrade === 'S' || p.hgrade === 'A') return {tag:'P2', color:'var(--blue)'};
        if (pct < 50 || p.hgrade === 'C' || p.hgrade === 'D') return {tag:'P0', color:'var(--red)'};
        return {tag:'P1', color:'var(--yellow)'};
      };
      main.forEach(p=>{
        if(p.kbTarget>0 && p.kbProgress<100){
          const gap = p.kbTarget - p.kbCount;
          const pr = prioOf(p,'kb',p.kbProgress);
          list.push({p, pr, type:'📚 KB 缺口', gap, pct:p.kbProgress,
            reason: p.kbProgress < 50 ? '知识库严重不足，阻断能力输出' : p.kbProgress < 90 ? '接近目标，需持续补充' : '仅差少量，可冲刺达标',
            benefit: p.kbProgress < 50 ? '达标后可支撑核心问答闭环' : '达标后进入运营迭代阶段',
            text:`【${p.name}】KB 未达标：${p.kbCount}/${p.kbTarget}（${p.kbProgress}%），缺口 ${gap} 条。\n建议：${p.reason}。\n行动：1) 运行增量蒸馏 2) 同步权威源最新条目 3) 两周内达 ${Math.round(p.kbTarget*0.9)} 条。\n预期收益：${p.benefit}。`});
        }
        if(p.sampleTarget>0 && p.sampleProgress<100){
          const gap = p.sampleTarget - p.trainingSamples;
          const pr = prioOf(p,'sample',p.sampleProgress);
          list.push({p, pr, type:'🧪 样本缺口', gap, pct:p.sampleProgress,
            reason: p.sampleProgress < 40 ? '训练数据太少，模型效果受限' : '数据不足，影响微调质量',
            benefit: '样本达标后微调效果显著提升',
            text:`【${p.name}】训练样本未达标：${p.trainingSamples}/${p.sampleTarget}（${p.sampleProgress}%），缺口 ${gap} 条。\n建议：${p.reason}。\n行动：1) 反馈/案例聚合 SFT 2) 数据扩增 3) 生成 DPO 对。\n预期收益：${p.benefit}。`});
        }
        if(p.modelTarget>0 && p.modelProgress<100){
          const gap = p.modelTarget - p.models;
          const pr = prioOf(p,'model',p.modelProgress);
          list.push({p, pr, type:'🤖 模型缺口', gap, pct:p.modelProgress,
            reason: '算法能力未齐备，影响视觉诊疗闭环',
            benefit: '模型齐备后视觉推理全链路打通',
            text:`【${p.name}】模型未达标：${p.models}/${p.modelTarget}（${p.modelProgress}%），缺口 ${gap} 个。\n建议：${p.reason}。\n行动：1) 检查训练队列 2) 补充训练数据 3) 启动训练。\n预期收益：${p.benefit}。`});
        }
        if(p.staleDays>7){
          const pr = p.staleDays>14 ? {tag:'P0',color:'var(--red)'} : {tag:'P1',color:'var(--yellow)'};
          list.push({p, pr, type:'🐌 停滞', gap:0, pct:0,
            reason:'长期无提交，项目活力下降',
            benefit:'恢复迭代后可继续推进里程碑',
            text:`【${p.name}】已停滞 ${p.staleDays} 天无提交。\n建议：${p.reason}。\n行动：1) 检查阻塞 2) 提交未完成工作 3) 恢复节奏。\n预期收益：${p.benefit}。`});
        }
      });
      list.sort((a,b)=>({P0:0,P1:1,P2:2}[a.pr.tag]-{P0:0,P1:1,P2:2}[b.pr.tag]));
      return list;
    };
    const PM = (()=>{
      const pl = genPrompts();
      const top3 = pl.slice(0,3);
      const p0 = pl.filter(x=>x.pr.tag==='P0').length;
      const p1 = pl.filter(x=>x.pr.tag==='P1').length;
      const p2 = pl.filter(x=>x.pr.tag==='P2').length;
      return {pl, top3, p0, p1, p2};
    })();
    const prompts = genPrompts();

    /* ── 中栏：训练指挥台 ── */
    const probes = D.probes||[];
    const procs = D.procResources||[];
    const middle = `
      <div class="panel" style="border-color:${PM.p0>0?'rgba(255,56,96,0.4)':PM.p1>0?'rgba(255,184,0,0.35)':'rgba(0,255,163,0.25)'}">
        <div class="panel-head">🎯 产品经理决策台 <span class="n">${PM.p0>0?'<span style="color:var(--red)">P0×'+PM.p0+'</span> ':''}${PM.p1>0?'<span style="color:var(--yellow)">P1×'+PM.p1+'</span> ':''}${PM.p2>0?'<span style="color:var(--blue)">P2×'+PM.p2+'</span> ':''}${PM.pl.length===0?'<span style="color:var(--green)">全部达标</span>':''}</span></div>
        <div class="panel-body">
          ${PM.top3.length?`<div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding-bottom:4px">📌 本周 Top 3 决策</div>`:''}
          ${PM.top3.map((pr,i)=>`
            <div style="background:rgba(0,212,255,0.03);border-left:3px solid ${pr.pr.color};border-radius:6px;padding:7px 10px;margin-bottom:7px">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
                <span class="pm-prio" style="background:${pr.pr.color}22;color:${pr.pr.color};border:1px solid ${pr.pr.color};border-radius:4px;padding:1px 6px;font-size:9px;font-weight:800">${pr.pr.tag}</span>
                <span style="font-weight:700;font-size:11px;color:var(--text)">${esc(pr.p.name)}</span>
                <span style="font-size:10px;color:var(--dim)">${pr.type} · ${pr.pct}%</span>
                <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
                  <button class="copy-btn" data-copy="${i}" style="background:var(--card-2);border:1px solid var(--line);color:var(--blue);border-radius:5px;padding:2px 8px;font-size:10px;cursor:pointer;font-family:inherit">📋</button>
                </span>
              </div>
              <div class="prompt-text" id="pt-${i}" style="font-size:10px;color:var(--dim);white-space:pre-wrap;line-height:1.6">${esc(pr.text)}</div>
              ${pr.p.kbRate!==undefined?`<div style="font-size:9px;margin-top:3px;color:${pr.p.kbRate>0?'var(--green)':'var(--red)'}">${pr.p.kbRate>0?'📈 增速 '+pr.p.kbRate+' 条/天 · 预计 '+pr.p.kbEta+' 天后达标':'➖ 无增长趋势 · 需人工干预'}</div>`:''}
            </div>`).join('')}
          ${PM.pl.slice(3).map((pr,i)=>`
            <div style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-bottom:1px solid rgba(0,212,255,0.04);font-size:10.5px">
              <span class="pm-prio" style="color:${pr.pr.color};font-weight:800;width:22px">${pr.pr.tag}</span>
              <b style="color:var(--text)">${esc(pr.p.name)}</b>
              <span style="color:var(--dim)">${pr.type} · ${pr.pct}% · 差 ${pr.gap}</span>
              <span style="margin-left:auto"><button class="copy-btn" data-copy="${i+3}" style="background:none;border:none;color:var(--blue);cursor:pointer;font-size:11px">📋</button></span>
            </div>`).join('')}
          ${PM.pl.length===0?'<div class="alert" style="color:var(--green)">✅ 所有核心项目目标达标</div>':''}
          ${PM.top3.length?`<div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:8px 0 2px">全部待行动 ${PM.pl.length} 项</div>`:''}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🟢 服务探针 <span class="n">${probes.filter(p=>p.http>0&&p.http<400).length}/${probes.length} 正常 · ${S.avgLatency||0}ms 平均</span></div>
        <div class="panel-body">
          ${probes.map(p=>{
            const ok=p.http>0&&p.http<400; const slow=p.latency>200;
            return `<div class="svc">
              <span class="dot ${ok?(slow?'warn':'run'):'stop'}"></span>
              <span class="port">${p.port}</span>
              <span class="lbl">HTTP ${p.http}${slow?' · 慢':''}</span>
              <span class="val">${p.latency}ms</span>
            </div>`}).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🏋️ 训练资产 <span class="n">${S.totalTrainingSamples||0} 样本 · ${S.totalCheckpoints||0} ckpt</span></div>
        <div class="panel-body">
          ${main.filter(p=>p.trainingSamples>0||p.checkpoints>0).map(p=>{
            const last = p.lastTraining || '-';
            const hot = last.startsWith(new Date().toISOString().slice(5,10).replace('-','-').slice(0,5)+'-'+String(new Date().getDate()).padStart(2,'0')) || last.includes('08-10');
            return `<div class="svc">
              <span class="dot ${hot?'run':'dim'}"></span>
              <span class="lbl" style="color:var(--blue)">${esc(p.name)}</span>
              <span class="val">${n(p.trainingSamples)} 样本 · ${p.trainingSize}MB · ckpt ${p.checkpoints}</span>
            </div>
            <div style="font-size:9px;color:var(--dim);padding:0 4px 4px 12px;margin-top:-4px">🕐 最近训练 ${esc(last)}${hot?' · <span style="color:var(--green)">今天活跃</span>':''}</div>`}).join('')||'<div class="alert" style="color:var(--dim)">无训练数据</div>'}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">⚙️ 进程资源 <span class="n">${procs.length} 关键进程</span></div>
        <div class="panel-body">
          ${procs.slice(0,8).map(p=>`
            <div class="svc">
              <span class="dot ${parseFloat(p.cpu)>50?'warn':'run'}"></span>
              <span class="lbl">${esc(p.name)}</span>
              <span class="val">CPU ${p.cpu}% · MEM ${p.mem}%</span>
            </div>`).join('')||'<div class="alert" style="color:var(--dim)">无进程数据</div>'}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">⏱ 定时任务 <span class="n">${S.failedTasks>0?'<span style="color:var(--red)">'+S.failedTasks+' 失败</span>':'全部正常'}</span></div>
        <div class="panel-body">
          ${(D.launchdFailed||[]).map(f=>`<div class="alert" style="color:var(--red)">❌ ${esc(f.label)} <span style="margin-left:auto;color:var(--dim)">exit ${f.exit_code}</span></div>`).join('')||'<div class="alert" style="color:var(--green)">✅ 所有 launchd 任务正常</div>'}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">⚠️ 风险暴露 <span class="n">${(()=>{
          const stale=D.projects.filter(p=>p.staleDays>7);
          const under=D.projects.filter(p=>p.isMain&&((p.kbTarget>0&&p.kbProgress<100)||(p.sampleTarget>0&&p.sampleProgress<100)||(p.modelTarget>0&&p.modelProgress<100)));
          const lowh=D.projects.filter(p=>p.isMain&&p.hgrade<='C');
          return stale.length+under.length+lowh.length+(S.failedTasks||0);
        })()}</span></div>
        <div class="panel-body">
          ${(()=>{
            let rows='';
            const under=D.projects.filter(p=>p.isMain&&((p.kbTarget>0&&p.kbProgress<100)||(p.sampleTarget>0&&p.sampleProgress<100)||(p.modelTarget>0&&p.modelProgress<100)));
            under.forEach(p=>{
              const lacks=[];
              if(p.kbTarget>0&&p.kbProgress<100)lacks.push('KB '+p.kbProgress+'%/'+p.kbTarget);
              if(p.sampleTarget>0&&p.sampleProgress<100)lacks.push('样本 '+p.sampleProgress+'%/'+p.sampleTarget);
              if(p.modelTarget>0&&p.modelProgress<100)lacks.push('模型 '+p.modelProgress+'%/'+p.modelTarget);
              rows+=`<div class="alert" style="color:var(--yellow)">⚠️ <b style="color:var(--text)">${esc(p.name)}</b> 未达标：${esc(lacks.join(' · '))}</div>`;
            });
            D.projects.filter(p=>p.staleDays>7).forEach(p=>{
              rows+=`<div class="alert" style="color:var(--yellow)">🐌 <b style="color:var(--text)">${esc(p.name)}</b> 停滞 ${p.staleDays} 天无提交</div>`;
            });
            D.projects.filter(p=>p.isMain&&p.hgrade<='C').forEach(p=>{
              rows+=`<div class="alert" style="color:var(--red)">🔴 <b style="color:var(--text)">${esc(p.name)}</b> 健康 ${p.hgrade} 级 (${p.health}/100)</div>`;
            });
            (D.launchdFailed||[]).forEach(f=>{
              rows+=`<div class="alert" style="color:var(--red)">⚙️ <b style="color:var(--text)">${esc(f.label)}</b> 崩溃 exit ${f.exit_code}</div>`;
            });
            return rows||'<div class="alert" style="color:var(--green)">✅ 无风险暴露</div>';
          })()}
        </div>
      </div>`;

    /* ── 右栏：安全 / 蒸馏 / 磁盘 ── */
    const dist = D.distillation||[];
    const hist = D.distillHistory||[];
    /* R113: 规划拓扑六流状态（来自采集器 distillTopology 区块，缺省兜底） */
    const topo = D.distillTopology||{};
    const topoFlows = topo.flows||[];
    const stBadge = s => ({ok:'<span class="pill green" style="padding:1px 8px;font-size:9px"><span class="dot"></span>通</span>',
                            partial:'<span class="pill yellow" style="padding:1px 8px;font-size:9px"><span class="dot"></span>部分</span>',
                            gap:'<span class="pill red" style="padding:1px 8px;font-size:9px"><span class="dot"></span>缺口</span>',
                            dep:'<span class="pill dim" style="padding:1px 8px;font-size:9px"><span class="dot"></span>依赖</span>'}[s]||'');
    const right = `
      <div class="panel" style="grid-column:1/-1">
        <div class="panel-head">🗺️ 蒸馏规划拓扑（目标形态） <span class="n">${topo.updated?esc(String(topo.updated).slice(5,16))+' 口径':'R113 静态口径'}</span></div>
        <div class="panel-body" style="display:grid;grid-template-columns:minmax(280px,1.1fr) minmax(240px,1fr);gap:10px;align-items:start">
          <div style="text-align:center">
            <a href="assets/distill-topology.png" target="_blank" title="点击看大图">
              <img src="assets/distill-topology.png" alt="蒸馏目标拓扑图" style="max-width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in">
            </a>
            <div style="font-size:9px;color:var(--dim);margin-top:4px">三源六流：命理只出自命理宝鉴 · 医学只出自中医标准 · 算法只出自视频平台 · 用法遵从消费方</div>
          </div>
          <div>
            ${topoFlows.length?topoFlows.map(f=>`<div class="flow" style="padding:5px 4px">
              <span class="tag {{'命理':'lm','医学':'med','视觉':'vis'}[f.domain]||'lm'}">${f.domain}</span>
              <span class="path" style="flex:1">${esc(f.name)}</span>
              ${stBadge(f.status)}
            </div>
            <div style="font-size:9px;color:var(--dim);padding:2px 4px 0 30px">${esc(f.note||'')}</div>`).join(''):'<div class="alert" style="color:var(--dim)">拓扑流数据待采集器下次刷新注入（distillTopology）</div>'}
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🔒 知识蒸馏链路 <span class="n">动态 · ${D.distillLastCheck?esc(D.distillLastCheck.slice(11,16)):'-'} 检查</span></div>
        <div class="panel-body">
          ${dist.map(l=>{
            const ok=l.state!=='idle'&&l.state!=='error';
            const delta=l.last_delta||0;
            const tagCls={命理:'lm',医学:'med',视觉:'vis'}[l.domain]||'lm';
            return `<div class="flow">
              <span class="tag ${tagCls}">${l.domain}</span>
              <span class="path">${esc(l.source)} <span style="color:var(--dim)">${n(l.source_kb)}条</span> → ${esc(l.target)}</span>
              <span class="cnt">${delta>0?'<b style="color:var(--green)">+'+delta+'</b> ':''}<b style="color:${ok?'var(--green)':'var(--yellow)'}">${n(l.total||l.target_kb)}</b></span>
            </div>
            <div style="font-size:9px;color:var(--dim);padding:0 4px 4px 40px;margin-top:-4px">${l.last_run?'🕐 '+esc(String(l.last_run).slice(5,16))+' · '+esc(l.note||''):esc(l.note||'')}</div>`}).join('')}
          ${hist.length?`<div style="font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1px;padding:8px 4px 2px">最近蒸馏活动</div>
          ${hist.slice(-6).reverse().map(h=>`<div class="svc" style="font-size:10px">
            <span class="dot ${h.delta>0?'run':'dim'}"></span>
            <span class="lbl">${esc(h.domain)}</span>
            <span class="val" style="color:${h.delta>0?'var(--green)':'var(--dim)'}">+${h.delta} → ${n(h.total)} · ${esc(String(h.time).slice(5,16))}</span>
          </div>`).join('')}`:''}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">💾 磁盘空间</div>
        <div class="panel-body">
          ${(D.disks||[]).map(d=>{
            const x=parseInt(d.pct);const c=x>80?'var(--red)':x>60?'var(--yellow)':'var(--green)';
            return `<div class="disk">
              <span class="lbl">${d.label}</span>
              <span class="bar"><span class="fill" style="width:${Math.min(x,100)}%;background:${c}">${d.pct}</span></span>
              <span class="det">${d.used} / ${d.total}</span>
            </div>`}).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🚨 告警 <span class="n">${S.totalAlerts}</span></div>
        <div class="panel-body">
          ${(D.alerts||[]).map(a=>{
            const ok=a.startsWith('✅'),bad=a.startsWith('❌')||a.startsWith('🔴'),warn=a.startsWith('⚠️');
            const c=ok?'var(--green)':bad?'var(--red)':warn?'var(--yellow)':'var(--text)';
            return `<div class="alert" style="color:${c}">${bad?'●':ok?'●':'●'} ${esc(a)}</div>`}).join('')}
        </div>
      </div>
      <div class="panel">
        <div class="panel-head">🤖 自动化运维</div>
        <div class="panel-body">
          <div class="auto">
            <div class="cell"><div class="t" style="color:var(--blue)">周日 02:00</div><div class="d">📦 全量备份</div></div>
            <div class="cell"><div class="t" style="color:var(--purple)">周日 03:00</div><div class="d">🔄 自动蒸馏</div></div>
            <div class="cell"><div class="t" style="color:var(--green)">5 分钟</div><div class="d">📊 数据采集</div></div>
          </div>
          <div style="margin-top:8px;font-size:9.5px;color:var(--dim);text-align:center">备份 ${D.backup.status==='ok'?'✅ '+esc(D.backup.lastSnapshot):D.backup.status==='unavailable'?'<span style="color:var(--red)">⚠️ data1 不可用</span>':'未知'} · 快照 ${D.backup.snapshotCount} · bundle ${D.backup.bundleCount}</div>
        </div>
      </div>`;

    document.getElementById('cols').innerHTML = `
      <div class="col col-l">${left}</div>
      <div class="col col-m">${middle}</div>
      <div class="col col-r">${right}</div>`;

    // 复制训练提示词
    document.getElementById('cols').addEventListener('click', e => {
      const btn = e.target.closest('.copy-btn');
      if (!btn) return;
      const idx = btn.getAttribute('data-copy');
      const el = document.getElementById('pt-' + idx);
      if (!el) return;
      const txt = el.textContent;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(()=>{ btn.textContent = '✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制',1500); }).catch(()=>fallbackCopy(txt,btn));
      } else { fallbackCopy(txt,btn); }
    });
    function fallbackCopy(txt,btn){
      const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); btn.textContent='✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制',1500); }catch(err){ btn.textContent='❌ 失败'; }
      document.body.removeChild(ta);
    }

    // 事件委托：点击 +/− 展开折叠子模块
    document.getElementById('cols').addEventListener('click', e => {
      const tg = e.target.closest('[data-tg]');
      if (!tg) return;
      const dir = tg.getAttribute('data-tg');
      const box = document.getElementById('ch-' + dir);
      if (!box) return;
      const open = box.style.display !== 'none';
      box.style.display = open ? 'none' : 'block';
      tg.textContent = open ? '+' : '−';
    });

    document.getElementById('footer').innerHTML = `🔄 数据每 5 分钟自动刷新 · 上次更新 <b>${esc(D.timestamp)}</b> · <a href="javascript:location.reload()" style="color:var(--blue)">手动刷新</a>`;
  }catch(e){
    document.getElementById('cols').innerHTML = `<div class="panel"><div class="panel-body" style="padding:40px;text-align:center;color:var(--red)">⚠️ 数据加载失败: ${esc(e.message)}</div></div>`;
  }
}
render();
setInterval(render, 60000);
</script>
</body>
</html>
