<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>命理宝鉴 · 服务套餐</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0b1020;color:#e8eefc;font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:24px 16px;max-width:960px;margin:0 auto}
h1{font-size:24px;color:#e8c87a;text-align:center;margin-bottom:6px;letter-spacing:2px}
.sub{text-align:center;color:#7a8aab;font-size:13px;margin-bottom:24px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px}
.plan{background:#101a2e;border:1px solid rgba(120,160,255,.2);border-radius:14px;padding:20px;text-align:center}
.plan.hot{border-color:#e8c87a;box-shadow:0 0 20px rgba(232,200,122,.15)}
.plan .pname{font-size:16px;font-weight:700;margin-bottom:4px}
.plan .price{font-size:28px;color:#e8c87a;font-weight:800;margin:8px 0}
.plan .price span{font-size:13px;color:#7a8aab;font-weight:400}
.plan ul{list-style:none;text-align:left;font-size:13px;color:#aab8d8;margin:12px 0}
.plan li{padding:4px 0;border-bottom:1px dashed rgba(120,160,255,.1)}
.plan li:before{content:'✓ ';color:#3ddc97}
.buy-btn{display:inline-block;padding:10px 32px;border-radius:10px;border:1px solid #e8c87a;color:#e8c87a;text-decoration:none;font-size:14px;cursor:pointer;background:transparent;transition:.2s}
.buy-btn:hover{background:#e8c87a;color:#0b1020}
.order{background:#101a2e;border:1px solid rgba(120,160,255,.2);border-radius:14px;padding:20px;margin-bottom:24px}
.order h3{color:#e8c87a;margin-bottom:12px}
.order .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.order input,.order select{flex:1;min-width:160px;padding:10px;border-radius:8px;border:1px solid rgba(120,160,255,.3);background:#0b1020;color:#e8eefc;font-size:14px}
.order button{padding:10px 28px;border-radius:8px;border:none;background:#e8c87a;color:#0b1020;font-weight:700;cursor:pointer}
#result{margin-top:10px;padding:10px;border-radius:8px;background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.3);display:none;font-size:13px}
</style>
<link rel="stylesheet" href="css/theme-unified.css">
</head>
<body>
<h1>命理宝鉴 · 服务套餐</h1>
<div class="sub">独立商用 · 按需订阅 · 随时开通</div>

<div class="plans">
  <div class="plan">
    <div class="pname">体验版</div>
    <div class="price">¥0<span> / 月</span></div>
    <ul>
      <li>基础功能试用</li>
      <li>每日 10 次调用</li>
      <li>标准响应速度</li>
    </ul>
    <button class="buy-btn" onclick="buy('体验版',0)">选择</button>
  </div>
  <div class="plan hot">
    <div class="pname">专业版</div>
    <div class="price">¥99<span> / 月</span></div>
    <ul>
      <li>全部功能解锁</li>
      <li>每日 500 次调用</li>
      <li>优先响应 + 专属支持</li>
      <li>数据导出</li>
    </ul>
    <button class="buy-btn" onclick="buy('专业版',99)">选择</button>
  </div>
  <div class="plan">
    <div class="pname">企业版</div>
    <div class="price">¥999<span> / 月</span></div>
    <ul>
      <li>不限调用</li>
      <li>私有化部署</li>
      <li>专属客户成功经理</li>
      <li>SLA 99.9%</li>
    </ul>
    <button class="buy-btn" onclick="buy('企业版',999)">选择</button>
  </div>
</div>

<div class="order">
  <h3>开通服务</h3>
  <div class="row">
    <input id="plan" value="专业版" readonly>
    <input id="contact" placeholder="联系方式（手机/邮箱）">
    <select id="pay-method"><option value="wechat">微信支付</option><option value="alipay">支付宝</option><option value="transfer">对公转账</option></select>
    <input id="org" placeholder="企业/组织名（选填）">
  </div>
  <button onclick="submitOrder()">提交订单</button>
  <div id="result"></div>
</div>

<script>
function buy(name, price){ document.getElementById('plan').value = name + ' ¥' + price + '/月'; }
var ORDER_API = 'http://127.0.0.1:8963/api/order';
function submitOrder(){
  var contact = document.getElementById('contact').value.trim();
  if(!contact){ document.getElementById('result').style.display='block';
    document.getElementById('result').style.background='rgba(255,93,115,.1)';
    document.getElementById('result').style.borderColor='rgba(255,93,115,.3)';
    document.getElementById('result').textContent='请填写联系方式'; return; }
  var plan = document.getElementById('plan').value;
  var pay = (document.getElementById('pay-method')||{}).value || 'wechat';
  var org = document.getElementById('org').value.trim();
  var planName = plan.split(' ')[0];
  var payload = {plan: planName, contact: contact, org: org, pay_method: pay};
  function showResult(msg, ok){
    document.getElementById('result').style.display='block';
    document.getElementById('result').style.background = ok ? 'rgba(61,220,151,.1)' : 'rgba(255,93,115,.1)';
    document.getElementById('result').style.borderColor = ok ? 'rgba(61,220,151,.3)' : 'rgba(255,93,115,.3)';
    document.getElementById('result').textContent = msg;
  }
  function localFallback(){
    try{
      var orders = JSON.parse(localStorage.getItem('shop_orders')||'[]');
      orders.push({plan: planName, contact: contact, org: org, pay: pay, status:'pending', ts:new Date().toISOString()});
      localStorage.setItem('shop_orders', JSON.stringify(orders));
    }catch(e){}
    showResult('✓ 订单已提交（本地登记），工作人员将联系您开通。', true);
  }
  try{
    fetch(ORDER_API, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload), timeout: 5000})
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.ok && d.order){
          showResult('✓ 订单已提交，订单号 ' + d.order.id + '（支付方式：' + d.order.pay_method + '），工作人员将联系您开通。', true);
        } else { localFallback(); }
      })
      .catch(function(){ localFallback(); });
  }catch(e){ localFallback(); }
}
</script>
<div class="sub" style="margin-top:20px;font-size:11px;color:#5a6a90;border-top:1px solid rgba(120,160,255,.15);padding-top:12px">⚠ 本系统输出仅供参考，不构成医疗/法律/金融等专业建议。涉及疾病诊断、处方、剂量请咨询持证专业人士；急症请立即就医。</div>
</body>
</html>
