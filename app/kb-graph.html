    <span class="stat" id="stat">加载中…</span>
    <button onclick="document.getElementById('searchInput').value='';searchGraph();clearCurrentSearchHistory();" title="清除搜索" style="font-size:11px">✖</button>

    <canvas id="minimapCanvas" width="180" height="115" style="display:block"></canvas>
  </div>

<!-- R255: vis-network CDN + jsdelivr fallback + unpkg + unpkg2（4 重） -->
<script>
(function(){
  function loadVis(){
    if(typeof vis !== 'undefined' && vis.Network){ return Promise.resolve(); }
    var CDNS = [
      'https://cdn.jsdelivr.net/npm/vis-network@9.1.6/dist/vis-network.min.js',
      'https://cdn.jsdelivr.net/npm/vis-network@9.1.9/dist/vis-network.min.js',
      'https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.js',
      'https://unpkg.com/vis-network@9.1.9/dist/vis-network.min.js'
    ];
    return new Promise(function(resolve){
      var idx = 0;
      function tryNext(){
        if(idx >= CDNS.length){ console.error('[vis] all CDNs failed'); resolve(); return; }
        var s = document.createElement('script');
        s.src = CDNS[idx++];
        s.async = false;
        s.onload = function(){ console.warn('[vis] loaded:', s.src); resolve(); };
        s.onerror = function(){ console.warn('[vis] failed:', s.src); tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    });
  }
  window._loadVisNetwork = loadVis;
})();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('service-worker.js').catch(function(e){console.warn('[SW]', e);});
  });
  function _r89LBadge(){
    var b = document.getElementById('r89NetBadge');
    if(!b) return;
    if(!navigator.onLine){ b.textContent='⚠️ 离线'; b.style.background='#ef4444'; b.style.display='block'; }
    else { b.textContent='🟢 在线'; b.style.background='#10b981'; setTimeout(function(){ if(navigator.onLine) b.style.display='none'; }, 2000); }
  }
  window.addEventListener('online', _r89LBadge);
  window.addEventListener('offline', _r89LBadge);
  document.addEventListener('DOMContentLoaded', _r89LBadge);
}
</script>
