<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>🔮 知识图谱 · 命理宝鉴</title>
<link rel="stylesheet" href="css/divination-hub.css">

<link rel="stylesheet" href="css/kb-graph-inline.css">
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>
<div class="wrap">
  <a class="back-home" href="/app/divination-hub.html">← 返回命理宝鉴</a>
  <h1>🔮 知识图谱 · 命理宝鉴</h1>
  <p class="sub">可视化 32 个 KB 模块的引用关系与热点分布</p>
  <div class="toolbar">
    <select id="levelFilter"><option value="all">全部等级</option><option value="premium">premium</option><option value="registered">registered</option><option value="professional">professional</option><option value="admin">admin</option></select>
    <select id="recModFilter"><option value="">📊 选择模块智能推荐</option></select>
    <div style="position:relative;display:inline-block">
    <input id="searchInput" type="search" placeholder="🔍 搜索节点 (name/id/拼音)" aria-label="搜索知识图谱节点" style="background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--paper);padding:5px 10px;border-radius:6px;font:inherit;font-size:12px;width:160px">
    <div id="searchStats" style="display:none;font-size:11px;color:var(--paper);opacity:.85;margin-top:4px;padding-left:2px"></div>
    <div id="searchHistory" style="display:none;position:absolute;top:100%;left:0;right:0;background:rgba(20,18,15,.98);border:1px solid var(--line);border-radius:6px;margin-top:2px;max-height:200px;overflow-y:auto;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.5)"></div>
  </div>
    <button onclick="highlightHubs()">🔥 热门节点</button>
    <button onclick="highlightRecs()">🧠 推荐关联</button>
    <button onclick="clusterByLevel()" title="按等级折叠为 5 个 cluster">📦 折叠等级</button>
    <button onclick="unclusterAll()" title="展开所有 cluster">📂 展开全部</button>
    <button onclick="downloadGraphImage()" title="导出 PNG 截图">📷 截图</button>
    <button onclick="resetView()">🔄 重置视图</button>
    <button onclick="fitGraph()">🔍 适应屏幕</button>
    <span class="sep"></span>
    <span class="stat" id="stat">加载中…</span>
    <button onclick="document.getElementById('searchInput').value='';searchGraph();clearCurrentSearchHistory();" title="清除搜索" style="font-size:11px">✖</button>
  </div>
  <div id="graph"></div>
  <div class="legend" id="legend"></div>
</div>

<!-- 节点详情模态 -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="m-title">—</h3>
    <div id="m-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/dist/vis-network.min.js"></script>
<script src="js/kb-recommend-feedback.js"></script>

<script src="js/kb-graph-inline.js" defer></script>
<script src="js/mobile-nav.js" defer></script>
</body>
</html>

<style>
/* R98-i 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>
