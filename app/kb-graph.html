<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,user-scalable=yes">
<title>🔮 知识图谱 · 命理宝鉴</title>
<link rel="stylesheet" href="css/divination-hub.css">
<style>
:root{--gold:#c9a84c;--bronze:#8b6914;--paper:#f0e6d3;--line:rgba(201,168,76,.15);--bg:#0a0a0a}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);min-height:100vh;font-family:'Noto Serif SC',serif;padding:16px;line-height:1.7}
.wrap{max-width:960px;margin:0 auto}
h1{text-align:center;font-size:22px;color:var(--gold);margin:8px 0 6px;letter-spacing:3px}
.sub{text-align:center;font-size:12px;color:var(--paper);opacity:.6;margin-bottom:16px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.toolbar button,.toolbar select{padding:8px 14px;background:rgba(201,168,76,.1);color:var(--paper);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px;cursor:pointer;transition:all .2s}
.toolbar button:hover,.toolbar select:hover{border-color:var(--gold);color:var(--gold);background:rgba(201,168,76,.18)}
.toolbar .sep{flex:1}
.stat{font-size:12px;color:var(--paper);opacity:.7}
.stat b{color:var(--gold);font-size:14px}
#graph{width:100%;height:68vh;background:radial-gradient(ellipse at center,#111 0%,#0a0a0a 70%);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.vis-network{outline:none}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;just-items:center}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;opacity:.75}
.legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--line)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:2000;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal-box{background:linear-gradient(135deg,#1a1208,#0a0a0a);border:1px solid var(--gold);border-radius:14px;padding:24px;max-width:520px;width:100%;box-shadow:0 20px 60px rgba(201,168,76,.25);animation:qrmodal-in .3s ease-out}
.modal-box h3{color:var(--gold);font-size:18px;margin-bottom:10px;letter-spacing:2px}
.modal-box p{font-size:13px;line-height:1.8;color:var(--paper);opacity:.88;margin:6px 0}
.modal-box .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.modal-box .row .k{opacity:.65}
.modal-box .row .v{color:var(--gold);font-weight:600}
.modal-close{position:absolute;top:8px;right:12px;background:0 0;border:none;color:var(--paper);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:all .15s}
.modal-close:hover{background:rgba(201,168,76,.15);color:var(--gold)}
@keyframes qrmodal-in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
.back-home{display:inline-block;margin-bottom:12px;padding:6px 12px;background:rgba(201,168,76,.1);color:var(--gold);border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px;text-decoration:none;transition:all .2s}
.back-home:hover{background:rgba(201,168,76,.2);border-color:var(--gold)}
@media(max-width:480px){h1{font-size:18px}#graph{height:55vh}}
</style>
</head>
<body>
<div class="wrap">
  <a class="back-home" href="/app/divination-hub.html">← 返回命理宝鉴</a>
  <h1>🔮 知识图谱 · 命理宝鉴</h1>
  <p class="sub">可视化 32 个 KB 模块的引用关系与热点分布</p>
  <div class="toolbar">
    <select id="levelFilter"><option value="all">全部等级</option><option value="premium">premium</option><option value="registered">registered</option><option value="professional">professional</option><option value="admin">admin</option></select>
    <button onclick="highlightHubs()">🔥 热门节点</button>
    <button onclick="resetView()">🔄 重置视图</button>
    <button onclick="fitGraph()">🔍 适应屏幕</button>
    <span class="sep"></span>
    <span class="stat" id="stat">加载中…</span>
  </div>
  <div id="graph"></div>
  <div class="legend" id="legend"></div>
</div>

<!-- 节点详情模态 -->
<div class="modal-overlay" id="modal">
  <div class="modal-box" style="position:relative">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h3 id="m-title">—</h3>
    <div id="m-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.6/dist/vis-network.min.js"></script>
<script>
(function(){
  var LEVEL_COLOR = {premium:'#e74c3c',registered:'#3498db',member:'#2ecc71',professional:'#9b59b6',admin:'#f39c12',public:'#1abc9c'};
  var LEVEL_LABEL = {premium:'Premium',registered:'Registered',member:'Member',professional:'Professional',admin:'Admin',public:'Public'};
  var ALL_NODES = [], ALL_EDGES = [], network = null;

  async function load(){
    // 使用 fetch（现代浏览器/移动端/Edge/Firefox/Chrome/Safari 均内置）
    var r = await fetch('/api/kb/graph', {cache:'no-cache'});
    var j = await r.json();
    if(j.code !== 0){ document.getElementById('stat').textContent='加载失败'; return; }
    var d = j.data;
    ALL_NODES = d.nodes.map(function(n){
      return {id:n.id, label:n.name||n.id, title:'【'+LEVEL_LABEL[n.level]||n.level+'】\nxref:'+(n.xref_count||0)+'  被引用:'+(n.referenced||0)+'  命中:'+(n.hit_count||0)+'\n'+n.id, group:n.level, value:n.xref_count||1, color:{background:LEVEL_COLOR[n.level]||'#888',border:'#c9a84c'}};
    });
    ALL_EDGES = d.edges.map(function(e){ return {from:e.source, to:e.target, value:Math.min(e.weight,16), arrows:'to', color:{color:'rgba(201,168,76,.35)',highlight:'#c9a84c'}}; });
    document.getElementById('stat').innerHTML = '模块 <b>' + d.stats.total_modules + '</b> · 引用边 <b>' + d.stats.total_xrefs + '</b> · 孤立 <b>' + (d.stats.isolated||[]).length + '</b>';
    renderLegend(d.stats.by_level);
    draw(ALL_NODES, ALL_EDGES);
  }

  function draw(nodes, edges){
    var container = document.getElementById('graph');
    var data = {nodes: new vis.DataSet(nodes), edges: new vis.DataSet(edges)};
    var opts = {
      physics:{barnesHut:{gravitationalConstant:-4200,springLength:140,springConstant:.04},stabilization:{iterations:120}},
      layout:{improvedLayout:true},
      interaction:{hover:true,tooltipDelay:200,navigationButtons:true,keyboard:{enabled:true}},
      nodes:{shape:'dot',font:{face:'Noto Serif SC',color:'#f0e6d3',size:13},borderWidth:2,shadow:{enabled:true,color:'rgba(0,0,0,.6)',size:8}},
      edges:{smooth:{type:'continuous'},width:.6,font:{face:'Noto Serif SC',color:'#f0e6d3',size:10,strokeWidth:3,align:'top'}},
    };
    if(network){ network.destroy(); }
    network = new vis.Network(container, data, opts);
    network.on('click', function(p){
      if(p.nodes.length){
        var n = ALL_NODES.find(function(x){return x.id===p.nodes[0];});
        if(n){ showModal(n); }
      }
    });
    network.fit({animation:{duration:600,easingFunction:'easeInOutQuad'}});
  }

  function renderLegend(byLevel){
    var el = document.getElementById('legend');
    el.innerHTML = '';
    Object.keys(LEVEL_LABEL).forEach(function(k){
      var count = (byLevel && byLevel[k]) || 0;
      if(count === 0 && k !== 'public') return;
      var item = document.createElement('div');
      item.className = 'legend-item';
      item.innerHTML = '<span class="legend-dot" style="background:'+(LEVEL_COLOR[k]||'#888')+'"></span><span>'+LEVEL_LABEL[k]+' ('+count+')</span>';
      el.appendChild(item);
    });
  }

  function highlightHubs(){
    var hubIds = [];
    ALL_NODES.forEach(function(n){ if(n.value >= 16) hubIds.push(n.id); });
    if(!hubIds.length){ alert('无热点节点'); return; }
    var nodes = ALL_NODES.map(function(n){ return {id:n.id, opacity:n.value >= 16 ? 1 : .15}; });
    var edges = ALL_EDGES.map(function(e){ return {from:e.from, to:e.to, opacity:(hubIds.includes(e.from)||hubIds.includes(e.to)) ? 1 : .1}; });
    draw(nodes, edges);
  }

  function resetView(){
    draw(ALL_NODES.slice(), ALL_EDGES.slice());
  }
  function fitGraph(){ if(network) network.fit({animation:{duration:500}}); }

  window.showModal = function(n){
    document.getElementById('m-title').textContent = n.label;
    document.getElementById('m-body').innerHTML =
      '<div class="row"><span class="k">模块 ID</span><span class="v">' + n.id + '</span></div>' +
      '<div class="row"><span class="k">等级</span><span class="v">' + (n.group||'—') + '</span></div>' +
      '<div class="row"><span class="k">引用次数</span><span class="v">' + (n.xref_count||0) + '</span></div>' +
      '<div class="row"><span class="k">被引用</span><span class="v">' + (n.referenced||0) + '</span></div>' +
      '<div class="row"><span class="k">KB 命中</span><span class="v">' + (n.hit_count||0) + '</span></div>';
    document.getElementById('modal').classList.add('show');
  };
  window.closeModal = function(){ document.getElementById('modal').classList.remove('show'); };
  document.getElementById('modal').addEventListener('click', function(e){ if(e.target===this) closeModal(); });
  document.getElementById('levelFilter').addEventListener('change', function(e){
    var v = e.target.value;
    if(v === 'all'){ draw(ALL_NODES.slice(), ALL_EDGES.slice()); return; }
    var ids = new Set(ALL_NODES.filter(function(n){return n.group===v;}).map(function(n){return n.id;}));
    var nodes = ALL_NODES.map(function(n){ return {id:n.id, opacity:ids.has(n.id)?1:.12}; });
    var edges = ALL_EDGES.map(function(e){ return {from:e.from,to:e.to,opacity:(ids.has(e.from)&&ids.has(e.to))?1:.08}; });
    draw(nodes, edges);
  });
  load();
})();
</script>
</body>
</html>
