<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KB 图谱 · 命理宝鉴</title>
<style>
:root {
  --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #e6edf3;
  --muted: #8b949e; --accent: #58a6ff; --gold: #f5d76e; --green: #56d364; --red: #f85149;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; line-height: 1.6; min-height: 100vh; }
header { padding: 20px 24px 12px; border-bottom: 1px solid var(--border); background: var(--card); }
header h1 { font-size: 1.3rem; color: var(--gold); }
header .meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
.toolbar { display: flex; gap: 12px; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.toolbar button { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
.toolbar button:hover { opacity: 0.85; }
.toolbar input { background: var(--bg); color: var(--text); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; flex: 1; min-width: 180px; }
.toolbar .pill { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; background: rgba(88,166,255,0.15); color: var(--accent); }
.stats { display: flex; gap: 24px; padding: 10px 24px; background: var(--card); border-bottom: 1px solid var(--border); font-size: 0.85rem; }
.stats .stat-value { font-weight: 700; color: var(--gold); margin-right: 4px; }
#canvas-wrap { position: relative; width: 100%; height: calc(100vh - 220px); min-height: 400px; background: #010409; overflow: hidden; }
svg.graph { width: 100%; height: 100%; cursor: grab; }
svg.graph:active { cursor: grabbing; }
.legend { position: absolute; top: 12px; right: 12px; background: rgba(22,27,34,0.92); border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; font-size: 0.78rem; backdrop-filter: blur(6px); }
.legend-title { color: var(--gold); font-weight: 600; margin-bottom: 6px; }
.legend-row { display: flex; align-items: center; gap: 8px; padding: 2px 0; color: var(--muted); }
.legend-dot { width: 12px; height: 12px; border-radius: 50%; }
.detail-panel { position: absolute; bottom: 12px; left: 12px; right: 12px; max-width: 480px; background: rgba(22,27,34,0.96); border: 1px solid var(--border); padding: 14px 18px; border-radius: 8px; font-size: 0.85rem; backdrop-filter: blur(6px); display: none; }
.detail-panel.open { display: block; }
.detail-panel h3 { color: var(--gold); margin-bottom: 6px; font-size: 1rem; }
.detail-panel .close { position: absolute; top: 8px; right: 12px; cursor: pointer; color: var(--muted); font-size: 1.1rem; }
.detail-panel .meta { color: var(--muted); font-size: 0.78rem; }
.detail-panel ul { margin-top: 8px; padding-left: 18px; }
.detail-panel li { padding: 2px 0; }
.node circle { stroke: #30363d; stroke-width: 2; transition: stroke 0.2s, filter 0.2s; cursor: pointer; }
.node:hover circle { stroke: var(--gold); filter: drop-shadow(0 0 8px var(--gold)); }
.node text { font-size: 11px; fill: var(--text); pointer-events: none; text-anchor: middle; }
.node.premium circle { fill: var(--gold); }
.node.registered circle { fill: var(--accent); }
.node.guest circle { fill: var(--green); }
.edge { stroke: #30363d; stroke-opacity: 0.6; transition: stroke-opacity 0.2s; }
.edge:hover { stroke-opacity: 1; stroke: var(--gold); }
.edge-label { font-size: 9px; fill: var(--muted); pointer-events: none; }
.error { padding: 24px; color: var(--red); }
@media (max-width: 768px) {
  header { padding: 14px 16px 10px; }
  .toolbar { padding: 10px 16px; }
  .stats { padding: 10px 16px; flex-wrap: wrap; gap: 12px; }
  #canvas-wrap { height: calc(100vh - 240px); }
  .legend { font-size: 0.7rem; padding: 8px 10px; }
  .detail-panel { left: 8px; right: 8px; max-width: none; }
}
</style>
</head>
<body>

<header>
<h1>🕸 KB 图谱 · 知识库关系网络</h1>
<div class="meta">命理宝鉴 · 22 模块 / 12,538 条 KB · 力导向可视化 · 节点大小=KB 体量 · 连边粗细=引用强度</div>
</header>

<div class="toolbar">
<button id="btn-refresh">🔄 刷新</button>
<button id="btn-reset">🎯 居中</button>
<button id="btn-search-toggle">🔍 过滤</button>
<input id="search" placeholder="输入模块名/关键词过滤（例：八字、倪海厦、tcm）…" />
<span class="pill">⚡ 力导向</span>
<span class="pill">🎨 SVG</span>
</div>

<div class="stats">
<div><span class="stat-value" id="stat-nodes">0</span>节点</div>
<div><span class="stat-value" id="stat-edges">0</span>关系</div>
<div><span class="stat-value" id="stat-modules">0</span>模块</div>
<div><span class="stat-value" id="stat-hit">0</span>总命中</div>
<div><span class="stat-value" id="stat-size">0</span>KB 体量</div>
<div id="status" style="margin-left:auto;color:var(--muted)">加载中…</div>
</div>

<div id="canvas-wrap">
<svg class="graph" id="svg"></svg>
<div class="legend">
<div class="legend-title">节点等级</div>
<div class="legend-row"><span class="legend-dot" style="background:var(--gold)"></span>premium · 权威库</div>
<div class="legend-row"><span class="legend-dot" style="background:var(--accent)"></span>registered · 注册可见</div>
<div class="legend-row"><span class="legend-dot" style="background:var(--green)"></span>guest · 公开</div>
<div style="margin-top:6px;color:var(--muted);font-size:0.7rem">节点越大 = KB 体量越大<br>边越粗 = 引用次数越多</div>
</div>
<div class="detail-panel" id="detail">
<span class="close" id="detail-close">×</span>
<h3 id="detail-name">—</h3>
<div class="meta" id="detail-meta">—</div>
<ul id="detail-links"></ul>
</div>
</div>

<script src="/js/components-loader.js"></script>
<script>
(async function() {
  const svg = document.getElementById('svg');
  const NS = 'http://www.w3.org/2000/svg';
  const status = document.getElementById('status');
  let state = { nodes: [], edges: [], positions: new Map(), dragging: null, selected: null };

  const levelColor = (l) => l === 'premium' ? 'var(--gold)' : l === 'guest' ? 'var(--green)' : 'var(--accent)';

  async function fetchGraph() {
    status.textContent = '拉取 /api/kb/graph…';
    try {
      const r = await fetch('/api/kb/graph');
      const j = await r.json();
      state.nodes = j.data?.nodes || j.nodes || [];
      state.edges = j.data?.edges || j.edges || [];
      document.getElementById('stat-nodes').textContent = state.nodes.length;
      document.getElementById('stat-edges').textContent = state.edges.length;
      document.getElementById('stat-modules').textContent = new Set(state.nodes.map(n=>n.id.split('-')[0])).size;
      document.getElementById('stat-hit').textContent = state.nodes.reduce((s,n)=>s+(n.hit_count||0),0);
      document.getElementById('stat-size').textContent = state.nodes.reduce((s,n)=>s+(n.size_kb||0),0).toFixed(0);
      status.textContent = '✓ 已加载';
      layout();
    } catch (e) {
      status.textContent = '✗ 加载失败';
      document.getElementById('canvas-wrap').innerHTML = '<div class="error">加载失败：'+e.message+'</div>';
    }
  }

  // 力导向布局
  function layout() {
    const W = svg.clientWidth || 800, H = svg.clientHeight || 600;
    svg.innerHTML = '';
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('id', 'graph-g');
    svg.appendChild(g);

    const positions = new Map();
    state.nodes.forEach((n, i) => {
      const angle = (i / state.nodes.length) * Math.PI * 2;
      const r = Math.min(W, H) * 0.35;
      positions.set(n.id, {
        x: W/2 + Math.cos(angle) * r * (0.5 + Math.random()*0.5),
        y: H/2 + Math.sin(angle) * r * (0.5 + Math.random()*0.5),
        vx: 0, vy: 0
      });
    });
    state.positions = positions;

    // 边
    const edgesG = document.createElementNS(NS, 'g');
    state.edges.forEach(e => {
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('class', 'edge');
      line.setAttribute('stroke-width', Math.min(5, Math.max(1, e.weight||1)/2));
      line.dataset.source = e.source;
      line.dataset.target = e.target;
      line.addEventListener('click', () => selectEdge(e));
      edgesG.appendChild(line);
    });
    g.appendChild(edgesG);

    // 节点
    const nodesG = document.createElementNS(NS, 'g');
    state.nodes.forEach(n => {
      const gn = document.createElementNS(NS, 'g');
      gn.setAttribute('class', 'node ' + (n.level||'registered'));
      gn.dataset.id = n.id;
      const circle = document.createElementNS(NS, 'circle');
      const r = Math.max(8, Math.min(40, Math.sqrt((n.size_kb||10)/50)));
      circle.setAttribute('r', r);
      gn.appendChild(circle);
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('dy', -r - 4);
      text.textContent = n.name.length > 6 ? n.name.slice(0,6) + '…' : n.name;
      gn.appendChild(text);
      gn.addEventListener('click', () => selectNode(n));
      nodesG.appendChild(gn);
    });
    g.appendChild(nodesG);

    // 标签（按 hover/select 显示）
    const labelG = document.createElementNS(NS, 'g');
    labelG.setAttribute('id', 'labels');
    g.appendChild(labelG);

    let iter = 0;
    const maxIter = 250;
    function tick() {
      if (iter++ > maxIter) return;
      // 斥力
      state.nodes.forEach(n => {
        const p = positions.get(n.id);
        state.nodes.forEach(m => {
          if (m.id === n.id) return;
          const q = positions.get(m.id);
          const dx = p.x - q.x, dy = p.y - q.y;
          const dist2 = dx*dx + dy*dy + 0.01;
          const dist = Math.sqrt(dist2);
          const f = 1500 / dist2;
          p.vx += dx / dist * f;
          p.vy += dy / dist * f;
        });
      });
      // 引力（边）
      state.edges.forEach(e => {
        const p = positions.get(e.source), q = positions.get(e.target);
        if (!p || !q) return;
        const dx = q.x - p.x, dy = q.y - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy) + 0.01;
        const f = dist / 60 * (e.weight||1);
        p.vx += dx/dist * f;
        p.vy += dy/dist * f;
        q.vx -= dx/dist * f;
        q.vy -= dy/dist * f;
      });
      // 中心引力
      state.nodes.forEach(n => {
        const p = positions.get(n.id);
        p.vx += (W/2 - p.x) * 0.005;
        p.vy += (H/2 - p.y) * 0.005;
      });
      // 应用
      positions.forEach(p => {
        p.vx *= 0.7; p.vy *= 0.7;
        p.x += p.vx; p.y += p.vy;
        p.x = Math.max(20, Math.min(W-20, p.x));
        p.y = Math.max(20, Math.min(H-20, p.y));
      });
      // 更新 DOM
      svg.querySelectorAll('.edge').forEach(line => {
        const p = positions.get(line.dataset.source);
        const q = positions.get(line.dataset.target);
        if (p && q) {
          line.setAttribute('x1', p.x);
          line.setAttribute('y1', p.y);
          line.setAttribute('x2', q.x);
          line.setAttribute('y2', q.y);
        }
      });
      svg.querySelectorAll('.node').forEach(gn => {
        const p = positions.get(gn.dataset.id);
        if (p) gn.setAttribute('transform', `translate(${p.x},${p.y})`);
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // 拖拽
    svg.addEventListener('mousedown', (ev) => {
      const t = ev.target.closest('.node');
      if (!t) return;
      const id = t.dataset.id;
      state.dragging = id;
    });
    svg.addEventListener('mousemove', (ev) => {
      if (!state.dragging) return;
      const pt = svg.createSVGPoint();
      pt.x = ev.clientX; pt.y = ev.clientY;
      const m = svg.getScreenCTM().inverse();
      const local = pt.matrixTransform(m);
      const p = positions.get(state.dragging);
      if (p) { p.x = local.x; p.y = local.y; p.vx = 0; p.vy = 0; }
    });
    svg.addEventListener('mouseup', () => { state.dragging = null; });
    svg.addEventListener('mouseleave', () => { state.dragging = null; });

    // 缩放
    svg.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const scale = ev.deltaY > 0 ? 0.9 : 1.1;
      const t = svg.querySelector('#graph-g');
      const m = t.getAttribute('transform') || '';
      const tr = m.match(/translate\(([-\d.]+),([-\d.]+)\)/);
      let x = 0, y = 0;
      if (tr) { x = parseFloat(tr[1]); y = parseFloat(tr[2]); }
      // 简单以图心缩放
      const cx = W/2, cy = H/2;
      x = cx - (cx - x) * scale;
      y = cy - (cy - y) * scale;
      t.setAttribute('transform', `translate(${x},${y}) scale(${parseFloat((t.getAttribute('data-s')||'1')) * scale})`);
      t.setAttribute('data-s', parseFloat((t.getAttribute('data-s')||'1')) * scale);
    }, { passive: false });
  }

  function selectNode(n) {
    state.selected = n.id;
    const incoming = state.edges.filter(e => e.target === n.id);
    const outgoing = state.edges.filter(e => e.source === n.id);
    const detail = document.getElementById('detail');
    document.getElementById('detail-name').textContent = n.name;
    document.getElementById('detail-meta').innerHTML = `<span style="color:var(--gold)">${n.id}</span> · 等级 ${n.level||'registered'} · ${(n.size_kb||0).toFixed(1)}KB · 命中 ${n.hit_count||0} · 引用 ${n.xref_count||0}`;
    const ul = document.getElementById('detail-links');
    ul.innerHTML = '';
    if (incoming.length) {
      ul.innerHTML += '<li style="color:var(--muted);margin-top:6px">← 入向引用</li>';
      incoming.slice(0,10).forEach(e => {
        const li = document.createElement('li');
        li.textContent = `${e.source} → [weight ${e.weight||1}] · ${e.reason||''}`;
        ul.appendChild(li);
      });
    }
    if (outgoing.length) {
      ul.innerHTML += '<li style="color:var(--muted);margin-top:6px">→ 出向引用</li>';
      outgoing.slice(0,10).forEach(e => {
        const li = document.createElement('li');
        li.textContent = `→ ${e.target} [weight ${e.weight||1}] · ${e.reason||''}`;
        ul.appendChild(li);
      });
    }
    detail.classList.add('open');
  }

  function selectEdge(e) {
    const detail = document.getElementById('detail');
    document.getElementById('detail-name').textContent = `${e.source} → ${e.target}`;
    document.getElementById('detail-meta').innerHTML = `权重 ${e.weight||1} · 原因 ${e.reason||'—'}`;
    const ul = document.getElementById('detail-links');
    ul.innerHTML = '';
    if (e.sample) {
      const li = document.createElement('li');
      li.innerHTML = `<code style="font-size:0.75rem;background:var(--bg);padding:2px 6px;border-radius:3px">${e.sample.slice(0,200)}</code>`;
      ul.appendChild(li);
    }
    detail.classList.add('open');
  }

  document.getElementById('detail-close').onclick = () => document.getElementById('detail').classList.remove('open');
  document.getElementById('btn-refresh').onclick = fetchGraph;
  document.getElementById('btn-reset').onclick = () => {
    const t = svg.querySelector('#graph-g');
    if (t) { t.setAttribute('transform', ''); t.setAttribute('data-s', '1'); }
    layout();
  };

  // 过滤
  document.getElementById('search').oninput = (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    svg.querySelectorAll('.node').forEach(gn => {
      const id = gn.dataset.id;
      const match = !q || id.toLowerCase().includes(q);
      gn.style.opacity = match ? '1' : '0.15';
    });
  };

  fetchGraph();
})();
</script>
</body>
</html>
