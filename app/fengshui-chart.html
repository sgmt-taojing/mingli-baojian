<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>风水排盘 · 命理宝鉴</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#0a0e17;--card:#141928;--border:#2a3450;--gold:#c9a84c;--jade:#4ec9b0;--paper:#e8dcc8;--paper2:#b8a88a;--paper3:#8b7e6a;--red:#ef4444;--green:#10b981;}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:'PingFang SC','Microsoft YaHei',sans-serif;padding:12px;min-height:100vh}
.fs-header{text-align:center;margin-bottom:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px}
.fs-title{font-size:18px;color:var(--gold);letter-spacing:2px;margin-bottom:4px}
.fs-meta{font-size:12px;color:var(--paper3);line-height:1.8}
.fs-form{max-width:500px;margin:0 auto 16px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.fs-form input{padding:8px;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:6px;color:var(--paper);font-size:12px}
.fs-form button{grid-column:1/-1;padding:10px;background:var(--gold);color:var(--bg);border:none;border-radius:6px;font-size:14px;font-weight:600;cursor:pointer}
.fs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:600px;margin:0 auto 12px}
.fs-gong{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;min-height:110px;position:relative}
.fs-gong.center{background:rgba(201,168,76,.05);border-color:var(--gold);border-style:dashed}
.fs-gong.kong{opacity:.5}
.fs-gong-name{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:2px}
.fs-gong-dir{font-size:9px;color:var(--paper3);margin-bottom:6px}
.fs-row{display:flex;gap:4px;margin-bottom:3px;align-items:center}
.fs-label{font-size:9px;color:var(--paper3);width:20px;flex-shrink:0}
.fs-val{font-size:11px}
.fs-val.yun{color:var(--gold)}
.fs-val.shan{color:var(--jade)}
.fs-val.xiang{color:var(--blue,#63b3ed)}
.fs-ji{color:var(--red);font-size:9px}
.fs-jixiong{font-size:8px;padding:1px 3px;border-radius:2px;margin-left:4px}
.fs-jixiong.ji{background:rgba(16,185,129,.12);color:var(--green)}
.fs-jixiong.xiong{background:rgba(239,68,68,.12);color:var(--red)}
.fs-info{max-width:600px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fs-info-card{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;line-height:1.8}
.fs-info-card h4{color:var(--gold);font-size:12px;margin-bottom:6px}
@media(max-width:768px){.fs-gong{min-height:90px;padding:6px}.fs-val{font-size:10px}.fs-info{grid-template-columns:1fr}}
@media(max-width:360px){.fs-gong{min-height:75px;padding:4px}.fs-gong-name{font-size:9px}.fs-val{font-size:9px}.fs-label{font-size:7px;width:14px}}
</style>
  <link rel="stylesheet" href="css/mobile-nav.css">
<link rel="stylesheet" href="css/theme-systems.css">
<link rel="stylesheet" href="css/flow-engine.css">
<link rel="stylesheet" href="css/page-header.css">
</head>
<body class="theme-zhouyi">
<div class="page-header-bar">
  <div class="phb-left">
    <span class="phb-theme-dot"></span>
    <span class="phb-title">风水排盘</span>
  </div>
  <a class="phb-back" href="divination-hub.html">← 返回</a>
</div>

<div class="flow-steps-wrap" style="padding:12px 24px 0">
<div class="flow-steps"><div class="flow-step active"><span class="flow-step-num">1</span><span>输入宅向</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">2</span><span>选择元运</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">3</span><span>排盘分析</span></div><span class="flow-step-arrow">→</span><div class="flow-step active"><span class="flow-step-num">4</span><span>查看建议</span></div></div>
<div class="flow-hint">输入房屋坐向和建造年代。</div>
</div>
<a href="divination-hub.html" style="position:fixed;top:8px;left:8px;z-index:9999;padding:6px 14px;border:1px solid rgba(201,168,76,.25);border-radius:6px;background:rgba(12,12,12,.9);color:#c9a84c;font-size:12px;letter-spacing:2px;text-decoration:none;backdrop-filter:blur(8px)">← 返回首页</a>

<a href="divination-hub.html" style="position:fixed;top:12px;left:12px;z-index:9999;padding:8px 14px;background:var(--gold,#c9a227);color:#fff;border-radius:20px;font-size:12px;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:.85">← 首页</a>

<div class="fs-header">
  <div class="fs-title">🧭 风水排盘</div>
  <div id="fs-meta" class="fs-meta">请输入信息排盘</div>
</div>
<div class="fs-form">
  <input type="number" id="fs-year" placeholder="年份" value="2026" min="1900" max="2100">
  <input type="text" id="fs-sitting" placeholder="坐山(如子)" value="子">
  <input type="text" id="fs-facing" placeholder="朝向(如午)" value="午">
  <button onclick="doPaipan()">排盘</button>
</div>
<div id="fs-grid" class="fs-grid" style="display:none"></div>
<div id="fs-info" class="fs-info" style="display:none"></div>
<script>
async function doPaipan(){
  const y=document.getElementById('fs-year').value;
  const s=document.getElementById('fs-sitting').value;
  const f=document.getElementById('fs-facing').value;
  const r=await fetch('/api/paipan/fengshui',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({year:+y,sittingMountain:s,facingMountain:f})});
  const data=await r.json();
  if(!data.ok){showToast('排盘失败: '+data.error);return;}
  renderChart(data.chart); if(data.interpretation) renderInterpretation(data.interpretation);
}
function renderChart(c){
  document.getElementById('fs-meta').innerHTML=`${c.year}年 · ${c.yunName} · 坐${c.sittingMountain}向${c.facingMountain}<br>山星:${c.mountainStar} | 向星:${c.facingStar}`;
  const grid=document.getElementById('fs-grid');
  grid.style.display='grid';
  const layout=[4,9,2,3,5,7,8,1,6];
  grid.innerHTML='';
  for(const p of layout){
    const pal=c.palaces.find(x=>x.palace===p);
    if(!pal) continue;
    const div=document.createElement('div');
    const cls=['fs-gong'];
    if(p===5) cls.push('center');
    div.className=cls.join(' ');
    let html=`<div class="fs-gong-name">${pal.name}宫</div><div class="fs-gong-dir">${pal.direction}</div>`;
    if(p!==5){
      const jb=pal.auspicious==='吉'?'ji':'xiong';
      html+=`<div class="fs-row"><span class="fs-label">运</span><span class="fs-val yun">${pal.yunStar}<span class="fs-jixiong ${jb}">${pal.auspicious}</span></span></div>`;
      html+=`<div class="fs-row"><span class="fs-label">山</span><span class="fs-val shan">${pal.mountainStar}</span></div>`;
      html+=`<div class="fs-row"><span class="fs-label">向</span><span class="fs-val xiang">${pal.facingStar}</span></div>`;
    } else {
      html+=`<div class="fs-row"><span class="fs-label">运</span><span class="fs-val yun">${pal.yunStar}</span></div>`;
      html+=`<div class="fs-row"><span class="fs-label">山</span><span class="fs-val shan">${pal.mountainStar}</span></div>`;
      html+=`<div class="fs-row"><span class="fs-label">向</span><span class="fs-val xiang">${pal.facingStar}</span></div>`;
    }
    div.innerHTML=html;
    grid.appendChild(div);
  }
  const info=document.getElementById('fs-info');
  info.style.display='grid';
  let ih='';
  ih+=`<div class="fs-info-card"><h4>太岁三煞</h4>`;
  if(c.taisui) ih+=`太岁：${c.taisui.zhi}（${c.taisui.direction}）<br>`;
  if(c.sansha) ih+=`三煞：${c.sansha.join('、')}<br>`;
  ih+='</div>';
  ih+=`<div class="fs-info-card"><h4>九星吉凶</h4>`;
  ih+='1白·吉 2黑·凶 3碧·凶<br>4绿·吉 5黄·大凶 6白·吉<br>7赤·凶 8白·吉 9紫·吉';
  ih+='</div>';
  info.innerHTML=ih;
}

function renderInterpretation(i){
  if(!i) return;
  const el=document.getElementById('paipan-interpretation')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-interpretation';
    d.style.cssText='margin:16px 0;padding:16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:12px';
    document.querySelector('.zw-grid,.qm-grid,.ly-grid,.lr-grid,.mh-grid,.fs-grid,main,body').appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📜 断盘解读</div>';
  if(i.summary) h+='<div style="font-size:13px;line-height:1.7;opacity:.9;margin-bottom:8px">'+i.summary+'</div>';
  if(i.advice) h+='<div style="font-size:13px;line-height:1.7;opacity:.75">'+i.advice+'</div>';
  if(i.guaJi) h+='<div style="font-size:12px;opacity:.6;margin-top:6px">卦象：'+i.guaJi+'</div>';
  el.innerHTML=h;
  el.style.display='block';
}
</script>
  <script src="js/mobile-nav.js"></script>
</body>
</html>
