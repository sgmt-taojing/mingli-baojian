<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" data-r308-anti-crawler>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>分享中心 · 易道智鉴</title>
<link rel="stylesheet" href="css/a11y-fix.css">

<link rel="stylesheet" href="css/share-center-inline.css">
  <link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>
<a href="#main-content" class="skip-link">跳到主要内容</a>
<main id="main-content">
<div class="top">
  <a href="divination-hub.html" class="back">← 返回</a>
  <h1>📤 分享中心</h1>
</div>
<div class="body">

  <!-- 个人名片 -->
  <div class="section-title">🎴 我的命理名片</div>
  <div class="card-preview" id="cardPreview">
    <div class="card-avatar" id="cardAvatar">🦞</div>
    <div class="card-name" id="cardName">缘主</div>
    <div class="card-title-text" id="cardTitle">易道智鉴 · 专属命理名片</div>
    <div class="card-bazi" id="cardBazi">登录后显示八字信息</div>
    <div class="card-stats">
      <div class="card-stat"><div class="num" id="statReports">0</div><div class="lbl">报告</div></div>
      <div class="card-stat"><div class="num" id="statDays">0</div><div class="lbl">使用天数</div></div>
      <div class="card-stat"><div class="num" id="statPoints">0</div><div class="lbl">积分</div></div>
    </div>
    <div class="card-qr" id="cardQr">二维码</div>
  </div>

  <!-- 分享渠道 -->
  <div class="share-grid">
    <button class="share-btn" onclick="shareTo('wechat')"><span class="icon">💬</span><span class="label">微信</span></button>
    <button class="share-btn" onclick="shareTo('poster')"><span class="icon">🖼️</span><span class="label">海报</span></button>
    <button class="share-btn" onclick="shareTo('link')"><span class="icon">🔗</span><span class="label">链接</span></button>
    <button class="share-btn" onclick="shareTo('save')"><span class="icon">💾</span><span class="label">保存</span></button>
  </div>

  <!-- 我的报告 -->
  <div class="section-title">📋 我的报告</div>
  <div class="report-list" id="reportList">
    <button class="report-item a11y-btn-reset" onclick="location.href='lifeindex-detail.html'">
      <div class="r-icon">🌟</button>
      <div class="r-info"><div class="r-name">生命指数报告</div><div class="r-desc">十维度运势评分 + 五行权重</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='lifeplan-detail.html'">
      <div class="r-icon">🗺️</button>
      <div class="r-info"><div class="r-name">人生蓝图</div><div class="r-desc">时间轴 + 12 领域矩阵 + 行动清单</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='music-detail.html'">
      <div class="r-icon">🎵</button>
      <div class="r-info"><div class="r-name">五行音乐处方</div><div class="r-desc">宫商角徵羽 × 情绪调理</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='youthplan-detail.html'">
      <div class="r-icon">🌱</button>
      <div class="r-info"><div class="r-name">青少年规划</div><div class="r-desc">4 阶段成长模板 + 学业指南</div></div>
      <div class="r-go">›</div>
    </div>
  </div>

  <!-- 才艺宫 -->
  <div class="section-title">🎨 才艺宫</div>
  <div class="talent-grid">
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-bazi'">
      <span class="t-icon">🔮</span>
      <div class="t-name">八字排盘</button>
      <div class="t-sub">四柱 + 十神 + 大运</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-ziwei'">
      <span class="t-icon">🌟</span>
      <div class="t-name">紫微斗数</button>
      <div class="t-sub">12 宫位 + 流年</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-qimen'">
      <span class="t-icon">🎯</span>
      <div class="t-name">奇门遁甲</button>
      <div class="t-sub">天地人神 + 八门</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-liuyao'">
      <span class="t-icon">🪙</span>
      <div class="t-name">六爻占卜</button>
      <div class="t-sub">纳甲 + 六亲</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-fengshui'">
      <span class="t-icon">🏠</span>
      <div class="t-name">风水布局</button>
      <div class="t-sub">八宅 + 玄空飞星</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='tcm-clinic.html'">
      <span class="t-icon">🏥</span>
      <div class="t-name">中医诊疗</button>
      <div class="t-sub">体质 + 方剂 + 针灸</div>
    </div>
  </div>

</div>
</main>

<script src="js/share-center-inline.js" defer></script>
  <script src="js/mobile-nav.js" defer></script>

<style>
/* R98-z 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>

<style>
/* R98-z 480+360 紧凑断点 */
@media(max-width:480px){

  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>
</body>
</html>
