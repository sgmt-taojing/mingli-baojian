<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>分享中心 · 易道智鉴</title>
<link rel="stylesheet" href="css/a11y-fix.css">
<style>
:root{--ink:#080808;--ink2:#111;--ink3:#1a1a1a;--paper:#f0e8d8;--paper2:#d4c9b0;--paper3:#a09080;--gold:#c9a84c;--gold2:#e8cc7a;--gold3:#d4b86a;--jade:#27ae60;--jade2:#2ecc71;--cinn:#c0392b;--cinn2:#e74c3c;--cyan:#2980b9;--border:rgba(201,168,76,.15);--font:'PingFang SC','Microsoft YaHei',serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;font-family:var(--font);background:var(--ink);color:var(--paper);line-height:1.8}
.top{position:sticky;top:0;background:rgba(8,8,8,.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:calc(12px + env(safe-area-inset-top,0)) 18px 10px;display:flex;align-items:center;gap:12px;z-index:10}
.top h1{font-size:18px;color:var(--gold);letter-spacing:3px;font-weight:600}
.top .back{font-size:13px;color:var(--paper3);text-decoration:none}
.body{padding:18px;max-width:560px;margin:0 auto;padding-bottom:calc(60px + env(safe-area-inset-bottom,0))}
/* 名片 */
.card-preview{background:linear-gradient(135deg,var(--ink2),var(--ink3));border:1px solid var(--gold);border-radius:16px;padding:24px 20px;text-align:center;position:relative;overflow:hidden}
.card-preview::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(201,168,76,.06) 0%,transparent 60%);pointer-events:none}
.card-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--gold),var(--gold3));display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 10px;position:relative;z-index:1}
.card-name{font-size:20px;color:var(--gold);font-weight:700;letter-spacing:2px;position:relative;z-index:1}
.card-title-text{font-size:12px;color:var(--paper3);margin-top:4px;position:relative;z-index:1}
.card-bazi{font-size:13px;color:var(--paper2);margin-top:12px;letter-spacing:1px;position:relative;z-index:1}
.card-stats{display:flex;justify-content:center;gap:24px;margin-top:14px;position:relative;z-index:1}
.card-stat{text-align:center}
.card-stat .num{font-size:20px;color:var(--gold);font-weight:700}
.card-stat .lbl{font-size:10px;color:var(--paper3)}
.card-qr{width:80px;height:80px;background:var(--paper);border-radius:8px;margin:14px auto 0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink);position:relative;z-index:1}
/* 分享按钮组 */
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.share-btn{background:var(--ink2);border:1px solid var(--border);border-radius:12px;padding:14px 6px;text-align:center;cursor:pointer;transition:all .2s}
.share-btn:active{transform:scale(.95);border-color:var(--gold)}
.share-btn .icon{font-size:28px;display:block;margin-bottom:4px}
.share-btn .label{font-size:11px;color:var(--paper3)}
/* 报告列表 */
.report-list{margin-top:10px}
.report-item{display:flex;align-items:center;gap:12px;background:var(--ink2);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.report-item:active{transform:scale(.98)}
.report-item .r-icon{font-size:28px;min-width:36px;text-align:center}
.report-item .r-info{flex:1}
.report-item .r-name{font-size:14px;color:var(--gold);font-weight:600}
.report-item .r-desc{font-size:11px;color:var(--paper3);margin-top:2px}
.report-item .r-go{font-size:18px;color:var(--paper3)}
/* 才艺宫 */
.talent-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}
.talent-card{background:linear-gradient(135deg,rgba(201,168,76,.06),rgba(201,168,76,.01));border:1px solid var(--border);border-radius:12px;padding:16px 12px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.talent-card:active{transform:scale(.96);border-color:var(--gold)}
.talent-card .t-icon{font-size:32px;display:block;margin-bottom:6px}
.talent-card .t-name{font-size:13px;color:var(--gold);font-weight:600}
.talent-card .t-sub{font-size:10px;color:var(--paper3);margin-top:2px}
/* section */
.section-title{font-size:14px;color:var(--gold);letter-spacing:2px;margin:18px 0 10px;display:flex;align-items:center;gap:6px}
.section-title::before{content:'';width:3px;height:16px;background:var(--gold);border-radius:2px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--ink2);color:var(--paper);padding:10px 20px;border-radius:10px;border:1px solid var(--gold);z-index:1000;font-size:13px;animation:slideUp .3s}
@keyframes slideUp{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">跳到主要内容</a>
<main id="main-content">
<div class="top">
  <a href="divination-hub.html" class="back">← 返回</a>
  <h1>📤 分享中心</h1>
</div>
<div class="body">

  <!-- 个人名片 -->
  <div class="section-title">🎴 我的命理名片</div>
  <div class="card-preview" id="cardPreview">
    <div class="card-avatar" id="cardAvatar">🦞</div>
    <div class="card-name" id="cardName">缘主</div>
    <div class="card-title-text" id="cardTitle">易道智鉴 · 专属命理名片</div>
    <div class="card-bazi" id="cardBazi">登录后显示八字信息</div>
    <div class="card-stats">
      <div class="card-stat"><div class="num" id="statReports">0</div><div class="lbl">报告</div></div>
      <div class="card-stat"><div class="num" id="statDays">0</div><div class="lbl">使用天数</div></div>
      <div class="card-stat"><div class="num" id="statPoints">0</div><div class="lbl">积分</div></div>
    </div>
    <div class="card-qr" id="cardQr">二维码</div>
  </div>

  <!-- 分享渠道 -->
  <div class="share-grid">
    <button class="share-btn" onclick="shareTo('wechat')"><span class="icon">💬</span><span class="label">微信</span></button>
    <button class="share-btn" onclick="shareTo('poster')"><span class="icon">🖼️</span><span class="label">海报</span></button>
    <button class="share-btn" onclick="shareTo('link')"><span class="icon">🔗</span><span class="label">链接</span></button>
    <button class="share-btn" onclick="shareTo('save')"><span class="icon">💾</span><span class="label">保存</span></button>
  </div>

  <!-- 我的报告 -->
  <div class="section-title">📋 我的报告</div>
  <div class="report-list" id="reportList">
    <button class="report-item a11y-btn-reset" onclick="location.href='lifeindex-detail.html'">
      <div class="r-icon">🌟</button>
      <div class="r-info"><div class="r-name">生命指数报告</div><div class="r-desc">十维度运势评分 + 五行权重</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='lifeplan-detail.html'">
      <div class="r-icon">🗺️</button>
      <div class="r-info"><div class="r-name">人生蓝图</div><div class="r-desc">时间轴 + 12 领域矩阵 + 行动清单</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='music-detail.html'">
      <div class="r-icon">🎵</button>
      <div class="r-info"><div class="r-name">五行音乐处方</div><div class="r-desc">宫商角徵羽 × 情绪调理</div></div>
      <div class="r-go">›</div>
    </div>
    <button class="report-item a11y-btn-reset" onclick="location.href='youthplan-detail.html'">
      <div class="r-icon">🌱</button>
      <div class="r-info"><div class="r-name">青少年规划</div><div class="r-desc">4 阶段成长模板 + 学业指南</div></div>
      <div class="r-go">›</div>
    </div>
  </div>

  <!-- 才艺宫 -->
  <div class="section-title">🎨 才艺宫</div>
  <div class="talent-grid">
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-bazi'">
      <span class="t-icon">🔮</span>
      <div class="t-name">八字排盘</button>
      <div class="t-sub">四柱 + 十神 + 大运</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-ziwei'">
      <span class="t-icon">🌟</span>
      <div class="t-name">紫微斗数</button>
      <div class="t-sub">12 宫位 + 流年</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-qimen'">
      <span class="t-icon">🎯</span>
      <div class="t-name">奇门遁甲</button>
      <div class="t-sub">天地人神 + 八门</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-liuyao'">
      <span class="t-icon">🪙</span>
      <div class="t-name">六爻占卜</button>
      <div class="t-sub">纳甲 + 六亲</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='divination-hub.html#section-fengshui'">
      <span class="t-icon">🏠</span>
      <div class="t-name">风水布局</button>
      <div class="t-sub">八宅 + 玄空飞星</div>
    </div>
    <button class="talent-card a11y-btn-reset" onclick="location.href='tcm-clinic.html'">
      <span class="t-icon">🏥</span>
      <div class="t-name">中医诊疗</button>
      <div class="t-sub">体质 + 方剂 + 针灸</div>
    </div>
  </div>

</div>
</main>
<script>
(function(){
  // 读取用户数据
  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('userProfile') || '{}'); } catch(e){}
  var name = profile.name || profile.nickname || '缘主';
  var avatar = profile.avatar || '🦞';
  var bazi = profile.bazi || '';
  var reports = parseInt(localStorage.getItem('_total_reports') || '0', 10);
  var days = Math.floor((Date.now() - parseInt(localStorage.getItem('_first_visit') || Date.now(), 10)) / 86400000);
  var points = parseInt(localStorage.getItem('_feedback_points') || '0', 10);

  document.getElementById('cardName').textContent = name;
  document.getElementById('cardAvatar').textContent = avatar;
  if (bazi) {
    document.getElementById('cardBazi').textContent = bazi;
  }
  document.getElementById('statReports').textContent = reports;
  document.getElementById('statDays').textContent = Math.max(1, days);
  document.getElementById('statPoints').textContent = points;

  // 首次访问打点
  if (!localStorage.getItem('_first_visit')) {
    localStorage.setItem('_first_visit', Date.now().toString());
  }
})();

function shareTo(channel){
  var profile = {};
  try { profile = JSON.parse(localStorage.getItem('userProfile') || '{}'); } catch(e){}
  var name = profile.name || '缘主';
  var url = location.origin + '/divination-hub.html';
  var text = name + ' 邀您体验易道智鉴 · 命理宝鉴';

  if (channel === 'link') {
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function(){
        showToast('链接已复制');
      }, function(){ showToast('复制失败，请手动复制'); });
    } else {
      showToast('浏览器不支持自动复制');
    }
    return;
  }

  if (channel === 'wechat' && navigator.share) {
    navigator.share({ title: '易道智鉴', text: text, url: url }).catch(function(){});
    return;
  }

  if (channel === 'poster') {
    showToast('海报生成中…请截图保存名片');
    setTimeout(function(){
      var card = document.getElementById('cardPreview');
      card.style.boxShadow = '0 0 30px rgba(201,168,76,.4)';
      card.style.transform = 'scale(1.02)';
      card.style.transition = 'all .3s';
      setTimeout(function(){
        card.style.boxShadow = '';
        card.style.transform = '';
      }, 2000);
    }, 100);
    return;
  }

  if (channel === 'save') {
    showToast('请截图保存名片');
    return;
  }

  showToast('分享功能开发中');
}

function showToast(msg){
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();
  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2500);
}
</script>
</body>
</html>
