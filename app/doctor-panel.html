<style>
:root{--gold:#c9a84c;--bg:#0e1726;--card:#1a2332;--border:#2d3748;--text:#c9d1d9;--muted:#718096;--green:#48bb78;--red:#f56565;--blue:#4299e1;--purple:#9f7aea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto;min-height:100vh}
h1{color:var(--gold);font-size:17px;margin-bottom:4px;text-align:center}
.sub{text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px}
.nav-back{display:inline-block;color:var(--gold);text-decoration:none;font-size:12px;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;border-left:3px solid var(--gold);padding-left:8px}
.bridge-box{padding:10px;background:linear-gradient(135deg,rgba(159,122,234,.1),rgba(66,153,225,.1));border:1px solid rgba(159,122,234,.3);border-radius:8px;margin:8px 0;font-size:12px;line-height:1.6}
.form-group{margin-bottom:10px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
textarea,select,input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:60px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn{display:block;width:100%;padding:12px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn-secondary{background:var(--blue)}
.btn-intake{background:var(--green);margin-bottom:6px;width:100%}
.btn-reject{background:var(--red)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.case-list-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer}
.case-list-item.active{border-color:var(--gold);background:rgba(201,168,76,.08)}
.empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}
.queue-bar{position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:10;border-bottom:1px solid var(--border);margin-bottom:10px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.queue-chip{flex:0 0 auto;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;color:var(--muted);white-space:nowrap}
.queue-chip.active{background:rgba(201,168,76,.15);border-color:var(--gold);color:var(--gold)}
.queue-chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.dot-pending{background:var(--blue)}.dot-doctor{background:var(--gold)}.dot-done{background:var(--green)}
/* 卡片流 */
.swipe-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:14px;transition:transform .2s,opacity .2s}
.swipe-card.rejecting{transform:translateX(-120%);opacity:.3}
.swipe-card.accepting{transform:translateX(120%);opacity:.3}
.photo-strip{display:flex;gap:6px;overflow-x:auto;margin:10px 0;padding-bottom:6px}
.photo-strip img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid var(--border);flex:0 0 auto}
.ai-draft{background:rgba(72,187,120,.08);border:1px solid rgba(72,187,120,.3);border-radius:8px;padding:10px;font-size:12px;line-height:1.6;margin:8px 0}
.ai-draft .tag{display:inline-block;background:rgba(72,187,120,.2);color:var(--green);font-size:10px;padding:2px 8px;border-radius:10px;margin-bottom:6px}
.kb-chip{display:inline-block;background:rgba(66,153,225,.12);color:var(--blue);font-size:10px;padding:2px 8px;border-radius:10px;margin:2px 4px 2px 0}
.risk-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:6px}
.risk-1{background:rgba(72,187,120,.15);color:var(--green)}
.risk-2{background:rgba(236,201,75,.15);color:#ecc94b}
.risk-3{background:rgba(245,101,101,.15);color:var(--red)}
.swipe-actions{display:flex;gap:8px;margin-top:12px}
.swipe-actions .btn{flex:1;margin-top:0;padding:10px;font-size:13px}
.meta-line{font-size:11px;color:var(--muted);margin:2px 0}
.edit-panel{display:none;margin-top:12px;border-top:1px dashed var(--border);padding-top:10px}
.edit-panel.show{display:block}
.stat-row{display:flex;gap:8px;margin-bottom:10px}
.stat-box{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.stat-box .num{font-size:18px;font-weight:700;color:var(--gold)}
.stat-box .lbl{font-size:10px;color:var(--muted)}
@media(max-width:360px){body{padding:8px 6px}h1{font-size:15px}.card{padding:10px 8px}.card-title{font-size:12px}textarea,select,input{font-size:12px;padding:6px}.row{flex-direction:column;gap:0}.btn{padding:10px;font-size:13px}.case-list-item{padding:8px;font-size:12px}.empty{font-size:12px;padding:14px}.photo-strip img{width:64px;height:64px}}
@media print{body{background:#fff!important;color:#000!important}.page-header-bar,.nav-back,.btn,.no-print,.queue-bar,.swipe-actions{display:none!important}.card,.swipe-card{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important}h1,h2,h3{break-after:avoid}table{width:100%!important;font-size:11px}img{max-width:100%!important}}
</style>

<main>

<div class="flow-steps-wrap" style="padding:12px 24px 0">
<div class="flow-steps"><div class="flow-step active"><span class="flow-step-num">1</span><span>待审队列</span></div><span class="flow-step-arrow">→</span><div class="flow-step"><span class="flow-step-num">2</span><span>查看 AI 初稿</span></div><span class="flow-step-arrow">→</span><div class="flow-step"><span class="flow-step-num">3</span><span>采纳/编辑</span></div><span class="flow-step-arrow">→</span><div class="flow-step"><span class="flow-step-num">4</span><span>提交处方</span></div></div>
<div class="flow-hint">一屏一张待审卡片 · 采纳即提交 · 修改留痕</div>

<!-- 紧急 SOS 横幅 -->
<div id="sos-banner" style="display:none;background:linear-gradient(135deg,#7f1d1d,#991b1b);border:1px solid #f87171;border-radius:10px;padding:12px;margin-bottom:10px">

</div>

<div class="stat-row">
  <div class="stat-box"><div class="num" id="stat-pending">0</div><div class="lbl">待审</div></div>

</div>

<script>
var API=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
var token=localStorage.getItem('admin_token')||localStorage.getItem('token')||'';
var allCases=[];
var currentCase=null;
var stats={pending:0,done:0,total:0};

function authHeaders(){var h={'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;return h}

function showToast(msg){
  var t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2332;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.4)';
  document.body.appendChild(t);
  setTimeout(function(){t.remove()},2200);
}

function loadQueue(){
  fetch(API+'/api/clinic/review-queue',{headers:authHeaders(),signal:AbortSignal.timeout(15000)}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok){document.getElementById('card-stream').innerHTML='<div class="empty">加载失败：'+(d.error||d.message||'请先登录')+'</div>';return}
    allCases=d.queue||[];
    renderStats();
    renderQueueBar();
    renderCards();
  }).catch(function(e){
    document.getElementById('card-stream').innerHTML='<div class="empty">网络错误：'+esc(esc(e.message))+'</div>';
  })
}

function renderStats(){
  stats.pending=allCases.filter(function(c){return c.status==='pending_doctor'||c.status==='pending_master'||c.status==='pending'}).length;
  stats.done=allCases.filter(function(c){return c.status==='completed'||c.status==='approved'}).length;
  stats.total=allCases.length;
  document.getElementById('stat-pending').textContent=stats.pending;
  document.getElementById('stat-done').textContent=stats.done;
  document.getElementById('stat-total').textContent=stats.total;
  var rt=document.getElementById('refresh-time');if(rt){var now=new Date();rt.textContent=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')+':'+now.getSeconds().toString().padStart(2,'0')}
}

function renderQueueBar(){
  var bar=document.getElementById('queue-bar');
  var statuses=[];
  allCases.forEach(function(c){if(statuses.indexOf(c.status)<0)statuses.push(c.status)});
  var html='<div class="queue-chip active" onclick="filterQueue(\'\',this)">全部 ('+allCases.length+')</div>';
  statuses.forEach(function(s){
    var label=s==='pending_doctor'?'待医生':s==='pending_master'?'待大师':s==='completed'?'已完成':s==='approved'?'已批准':s==='rejected'?'驳回待修订':s;
    var dot=s==='pending_doctor'?'dot-doctor':s==='pending_master'?'dot-pending':s==='completed'?'dot-done':'dot-pending';
    html+='<div class="queue-chip" onclick="filterQueue(\''+s+'\',this)"><span class="dot '+dot+'"></span>'+label+' ('+allCases.filter(function(c){return c.status===s}).length+')</div>';
  });
  bar.innerHTML=html;
}

function filterQueue(status,el){
  document.querySelectorAll('.queue-chip').forEach(function(c){c.classList.remove('active')});
  el.classList.add('active');
  var list=status?allCases.filter(function(c){return c.status===status}):allCases;
  renderCards(list);
}

function riskLabel(c){
  var s=(c.symptoms||'')+(c.constitution||'')+(c.aiDraft||'');
  if(/癌|肿瘤|血光|自杀|急症|大出血|心梗|脑梗|晕厥/.test(s))return '<span class="risk-badge risk-3">⚠️ 高危</span>';
  if(/久病|慢性|反复|多年|重症/.test(s))return '<span class="risk-badge risk-2">中度</span>';
  return '<span class="risk-badge risk-1">常规</span>';
}

function renderCards(list){
  var cards=list||allCases;
  var el=document.getElementById('card-stream');
  var emptyEl=document.getElementById('empty-state');
  if(!cards.length){el.innerHTML='';emptyEl.style.display='block';return}
  emptyEl.style.display='none';
  var html='';
  cards.forEach(function(c){
    var photos=(c.photos||[]).map(function(p){return '<img src="'+(p.startsWith('http')?p:API+p)+'" alt="采集照片" loading="lazy" onerror="this.style.display=\'none\'">'}).join('');
    var kb=(c.kbHits||[]).map(function(k){return '<span class="kb-chip">📚 '+k.title+' ('+k.trust+')</span>'}).join('');
    html+='<div class="swipe-card" id="card-'+c.id+'" data-status="'+c.status+'">'+
      '<div style="display:flex;justify-content:space-between;align-items:center">'+
        '<div style="font-weight:600;font-size:14px;color:var(--gold)">'+(c.caseNumber||('#'+c.id))+'</div>'+
        riskLabel(c)+
      '</div>'+
      '<div class="meta-line">患者：'+(c.patientName||'匿名')+' '+(c.patientSex||'')+' '+(c.birthYear?('('+c.birthYear+'年生)'):'')+'</div>'+
      '<div class="meta-line">状态：'+c.status+' · 提交：'+(c.createdAt||'').slice(0,16)+'</div>'+
      '<div style="margin-top:8px;font-size:13px;line-height:1.6"><b>症状：</b>'+(c.symptoms||'—')+'</div>'+
      '<div style="font-size:12px;color:var(--muted);margin-top:2px"><b>体质：</b>'+(c.constitution||'—')+'</div>'+
      (photos?'<div class="photo-strip">'+photos+'</div>':'')+
      (kb?'<div style="margin:6px 0">'+kb+'</div>':'')+
      (c.aiDraft?'<div class="ai-draft"><span class="tag">🤖 AI 初稿'+(c.aiGenerated?'<b style="color:#48bb78"> · 自动生成</b>':'')+'</span><br>'+(c.aiDraft||'').slice(0,400)+'</div>':'')+
      (c.sessionId?'<div class="ai-draft" style="border-color:rgba(201,168,76,.3)"><span class="tag" style="color:#c9a84c">📋 智能问诊室病历'+(c.caseNumber?' · '+c.caseNumber:'')+'</span>'+
        (c.syndromeType?'<br><b>AI 辨证：</b>'+esc(c.syndromeType):'')+
        (c.aiDiagnosis?'<br><b>AI 诊断：</b>'+esc(c.aiDiagnosis).slice(0,300):'')+
        (c.voiceTranscript?'<br><b>对话记录：</b><span style="color:var(--muted);font-size:11px">'+esc(c.voiceTranscript).slice(0,200)+'…</span>':'')+
        (c.reviewNotes?'<br><b>复核意见：</b>'+esc(c.reviewNotes).slice(0,150):'')+
      '</div>':'')+
      '<div class="swipe-actions no-print">'+
        '<button class="btn btn-intake" onclick="quickIntake('+JSON.stringify({id:c.id,name:c.patientName||'',sex:c.patientSex||'',year:c.birthYear||'',birthDate:c.birthDate||'',birthHour:c.birthHour||'',symptoms:c.symptoms||'',constitution:c.constitution||''}).replace(/"/g,'&quot;')+')" title="一键带入患者信息到采集工具">⚡ 快速采集</button>'+
        (c.status==='pending_doctor'||c.status==='pending'?
          '<button class="btn btn-reject" onclick="rejectCase('+c.id+')">✕ 驳回</button>'+
          '<button class="btn btn-secondary" onclick="openEdit('+c.id+')">✎ 编辑</button>'+
          '<button class="btn" onclick="acceptCase('+c.id+')">✓ 采纳</button>'
        :(c.status==='rejected'?
          '<button class="btn btn-reject" disabled style="opacity:.6">✕ 已驳回</button>'+
          '<button class="btn" onclick="reviseCase('+c.id+')">🔄 修订重出</button>'
        :'<div style="text-align:center;color:var(--green);font-size:13px;padding:8px">✔ 已处理</div>'))+
      '</div>'+
      '<div class="edit-panel" id="edit-'+c.id+'"></div>'+
    '</div>';
  });
  el.innerHTML=html;
}

// 🔄 R728: 驳回修订闭环——医生修订后重出（更新归档病历，状态回到复核流）
function reviseCase(id){
  var c=allCases.find(function(x){return x.id===id});
  if(!c||!c.sessionId){showToast('此病历非问诊室归档，请走编辑流程','warn');return}
  var panel=document.getElementById('edit-'+id);
  if(panel&&!panel.classList.contains('show')){openEdit(id)}
  // 修订面板顶部加"修订重出"操作条
  if(panel){
    var bar=document.createElement('div');
    bar.style.cssText='margin-bottom:10px;padding:10px;background:rgba(230,126,34,.08);border:1px solid rgba(230,126,34,.3);border-radius:8px';
    bar.innerHTML='<div style="font-size:12px;color:#e67e22;margin-bottom:8px">🔄 驳回修订：修改后重新出具，将回到复核流</div>'+
      '<textarea id="revise-notes-'+id+'" placeholder="修订说明（会覆盖原复核意见）…" style="width:100%;min-height:48px;background:rgba(255,255,255,.05);border:1px solid rgba(230,126,34,.3);border-radius:6px;padding:8px;color:#eee;font-size:12px;font-family:inherit"></textarea>'+
      '<button class="btn" style="margin-top:8px;width:100%;background:rgba(230,126,34,.15);border-color:#e67e22;color:#e67e22" onclick="submitRevise('+id+')">📤 修订重出（重新进入复核流）</button>';
    panel.insertBefore(bar, panel.firstChild);
  }
}
function submitRevise(id){
  var c=allCases.find(function(x){return x.id===id});
  if(!c||!c.sessionId)return;
  var notes=(document.getElementById('revise-notes-'+id+'')||{}).value||'';
  if(!notes.trim()){showToast('请填写修订说明','warn');return}
  fetch(API+'/api/public/emr-archive',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    signal:AbortSignal.timeout(10000),
    body:JSON.stringify({
      sessionId:c.sessionId, role:'doctor',
      emr:{complaint:(c.symptoms||'').slice(0,2000), syndrome:(c.syndromeType||''), reviewStatus:'modified', reviewNotes:'【修订重出】'+notes.trim()}
    })
  }).then(function(r){return r.json()}).then(function(d){
    if(d.ok){showToast('已修订重出（病历号 #'+d.caseId+'），回到复核流','ok');setTimeout(function(){loadQueue()},600)}
    else{showToast('修订失败：'+(d.message||d.error||'未知'),'error')}
  }).catch(function(){showToast('修订请求失败，请重试','error')});
}

// ⚡ 一键带入采集工具（零重复输入）
function quickIntake(p){
  var qs=[];
  if(p.name)qs.push('name='+encodeURIComponent(p.name));
  if(p.sex)qs.push('sex='+encodeURIComponent(p.sex));
  if(p.year)qs.push('year='+encodeURIComponent(p.year));
  if(p.birthDate)qs.push('birthDate='+encodeURIComponent(p.birthDate));
  if(p.birthHour!==undefined&&p.birthHour!==null&&p.birthHour!=='')qs.push('birthHour='+encodeURIComponent(p.birthHour));
  if(p.symptoms)qs.push('symptoms='+encodeURIComponent(p.symptoms));

function applyRxTemplate(id){

// 一键采纳：从内联 textarea 读值（展开了就取编辑后的，没展开用草稿 初稿）
function acceptCase(id){
  var c=allCases.find(function(x){return x.id===id});
  if(!c)return;
  var diagEl=document.getElementById('diag-'+id);
  var rxEl=document.getElementById('rx-'+id);
  var diagnosis=diagEl&&diagEl.value?diagEl.value.trim():c.diagnosis||c.aiDraft||'';
  var prescription=rxEl&&rxEl.value?rxEl.value.trim():c.prescription||'';
  if(!diagnosis){showToast('该案例无 AI 初稿，请先编辑填写');openEdit(id);return}
  submitDiagnosis(id,{diagnosis:diagnosis,prescription:prescription},'采纳确认');
}

// 驳回：确认替换（去掉 confirm 弹框）
function rejectCase(id){
  showToast('确认驳回？3 秒内再点驳回即确认');
  var card=document.getElementById('card-'+id);
  if(card._rejectArmed){card._rejectArmed=false;doReject(id);return}
  card._rejectArmed=true;
  setTimeout(function(){if(card._rejectArmed){card._rejectArmed=false;showToast('驳回已取消')}},3000);
}
function doReject(id){
  fetch(API+'/api/clinic/submit-diagnosis',{method:'POST',headers:authHeaders(),body:JSON.stringify({caseId:id,diagnosis:'',prescription:'',reviewComment:'医生驳回，请补充信息',signal:AbortSignal.timeout(15000)}),signal:AbortSignal.timeout(15000)})
  .then(function(r){return r.json()}).then(function(d){
    var card=document.getElementById('card-'+id);
    if(card)card.classList.add('rejecting');
    setTimeout(function(){loadQueue()},400);
  }).catch(function(err){ showToast('驳回失败：'+(err&&err.message||'网络异常')+'，请重试','err'); });
}

function submitEdit(id){
  var diag=document.getElementById('diag-'+id);
  var rx=document.getElementById('rx-'+id);
  submitDiagnosis(id,{
    diagnosis:diag&&diag.value?diag.value:'',
    prescription:rx&&rx.value?rx.value:''
  },'医生编辑提交');
}

function submitDiagnosis(id,data,note){
  fetch(API+'/api/clinic/submit-diagnosis',{method:'POST',headers:authHeaders(),body:JSON.stringify({caseId:id,diagnosis:data.diagnosis||'',prescription:data.prescription||'',reviewComment:data.doctor_comment||note||'',signal:AbortSignal.timeout(15000)}),signal:AbortSignal.timeout(15000)})
  .then(function(r){return r.json()}).then(function(d){
    var card=document.getElementById('card-'+id);
    if(card)card.classList.add('accepting');
    showToast(d.ok||d.message?'✅ '+(d.message||'提交成功'):'⚠️ '+(d.error||'提交失败'));
    setTimeout(function(){loadQueue()},400);
  }).catch(function(err){ showToast('提交失败：'+(err&&err.message||'网络异常')+'，请重试','err'); });
}

loadQueue();

// === 商用效率：15s 自动轮询 + 新案例提醒 ===
var lastCount=allCases.length;
var pollTimer=setInterval(function(){
  // 轻量轮询：只取数量变化，有新案例才重渲染
  fetch(API+'/api/clinic/review-queue',{headers:authHeaders(),signal:AbortSignal.timeout(15000)}).then(function(r){return r.json()}).then(function(d){
    if(!d.ok||!d.queue)return;
    var newCount=d.queue.length;
    if(newCount>lastCount){
      // 新案例到达：声音提醒 + 重渲染
      try{
        var ctx=new (window.AudioContext||window.webkitAudioContext)();
        var osc=ctx.createOscillator();
        var gain=ctx.createGain();
        osc.connect(gain);gain.connect(ctx.destination);
        osc.frequency.value=880;gain.gain.value=0.15;
        osc.start();osc.stop(ctx.currentTime+0.4);
      }catch(e){}
      showToast('🔔 新案例到达 ('+(newCount-lastCount)+' 个)');
      allCases=d.queue;
      lastCount=newCount;
      renderStats();renderQueueBar();renderCards();
    }else{
      lastCount=newCount;
    }
  }).catch(function(){});
  // SOS 紧急事件检查
  checkSOS();
},15000);

// 🚨 SOS 紧急事件检查（新紧急事件 → 红色横幅 + 警报音）
var lastSOSId=0;
function checkSOS(){
  fetch(API+'/api/clinic/emergency-events',{headers:authHeaders(),signal:AbortSignal.timeout(15000)})
  .then(function(r){return r.json()}).then(function(d){
    if(!d.ok||!d.events||!d.events.length)return;
    var latest=d.events[0];
    if(latest.id>lastSOSId){
      lastSOSId=latest.id;
      document.getElementById('sos-banner').style.display='block';
      document.getElementById('sos-banner-detail').textContent=(latest.detail||'紧急求助')+' · '+(latest.created_at||'').slice(0,16);
      // 三次警报音
      try{
        var ctx=new (window.AudioContext||window.webkitAudioContext)();
        for(var i=0;i<3;i++){
          var osc=ctx.createOscillator();
          var gain=ctx.createGain();
          osc.connect(gain);gain.connect(ctx.destination);
          osc.frequency.value=1200;gain.gain.value=0.2;
          osc.start(ctx.currentTime+i*0.4);osc.stop(ctx.currentTime+i*0.4+0.3);
        }
      }catch(e){}
      showToast('🚨 紧急求助到达！');
    }
  }).catch(function(){});
}

// ═══ R720 快捷键（医生工作台）：J/K 上下移动 · A 采纳 · R 驳回 · E 编辑 · F 过滤 \u21aa 帮助面板 ═══
(function(){
  const helpHtml = '<div id="kbdHelp" style="display:none;position:fixed;bottom:16px;right:16px;z-index:99999;background:#111;border:1px solid rgba(201,168,76,.3);border-radius:10px;padding:14px 18px;font-size:12px;color:#d4c9b0;box-shadow:0 8px 32px rgba(0,0,0,.5);max-width:280px">'
    + '<div style="color:#e8cc7a;font-weight:600;margin-bottom:8px">\u952e\u76d8\u5feb\u6377\u952e</div>'
    + '<div>J / K \u2014 \u4e0a\u4e00\u4f8b / \u4e0b\u4e00\u4f8b</div>'
    + '<div>A \u2014 \u91c7\u7eb3\u5e76\u63d0\u4ea4</div>'
    + '<div>R \u2014 \u9a73\u56de</div>'
    + '<div>E \u2014 \u7f16\u8f91\u7231\u606f\u6848</div>'
    + '<div>? \u2014 \u663e\u793a/\u9690\u85cf\u672c\u9762\u677f</div>'
    + '</div>';
  document.body.insertAdjacentHTML('beforeend', helpHtml);
  let cursor = 0;
  function visibleCards(){ return Array.from(document.querySelectorAll('.queue-card, .card-item, [data-case-id]')); }
  document.addEventListener('keydown', function(e){
    if (e.target.matches('input, textarea, select')) return;
    const k = e.key.toLowerCase();
    if (k === '?') { const h = document.getElementById('kbdHelp'); h.style.display = h.style.display === 'none' ? 'block' : 'none'; return; }
    const cards = visibleCards();
    if (!cards.length) return;
    if (k === 'j' || k === 'k') {
      e.preventDefault();
      cursor = Math.max(0, Math.min(cards.length - 1, cursor + (k === 'j' ? 1 : -1)));
      cards[cursor].scrollIntoView({behavior:'smooth', block:'center'});
      cards[cursor].style.outline = '2px solid rgba(201,168,76,.6)';
      setTimeout(() => { cards[cursor].style.outline = ''; }, 800);
      return;
    }
    // A/R/E 需要当前案例 id：从高亮卡片上找按钮
    const card = cards[cursor];
    if (!card) return;
    const btns = card.querySelectorAll('button');
    const findBtn = (txt) => Array.from(btns).find(b => (b.textContent || '').includes(txt));
    if (k === 'a') { const b = findBtn('采纳'); if (b) { e.preventDefault(); b.click(); } }
    else if (k === 'r') { const b = findBtn('驳回'); if (b) { e.preventDefault(); b.click(); } }
    else if (k === 'e') { const b = findBtn('编辑'); if (b) { e.preventDefault(); b.click(); } }
  });
})();
</script>

<script>
// ═══ R721: EMR 会话拉取（医生端） ═══
function toggleEmrDrawer(show, sid){
  var d = document.getElementById('emrDrawer');
  d.style.display = show ? 'block' : 'none';
  if (show && sid) {
    document.getElementById('emrSidInput').value = sid;
    fetchEmrSession();
  }
}
// ═══ R722: 活跃会话列表 + WS 自动刷新 ═══
let _emrCurrentSid = null;
function loadEmrSessionList(){
  fetch('http://127.0.0.1:8920/api/public/emr-sessions', { signal: AbortSignal.timeout(6000) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      var box = document.getElementById('emrSessionList');
      if (!d.ok || !d.count) {
        box.innerHTML = '<div style="font-size:11px;color:#666;padding:4px 0">暂无活跃采集会话</div>';
        return;
      }
      var html = '<div style="font-size:10px;color:#888;letter-spacing:1px;margin-bottom:6px">活跃会话（' + d.count + '）</div>';
      d.sessions.forEach(function(sess){
        var ago = sess.updatedMsAgo < 60000 ? Math.round(sess.updatedMsAgo/1000) + '秒前' : Math.round(sess.updatedMsAgo/60000) + '分前';
        var stColor = sess.reviewStatus === 'approved' ? '#2ecc71' : sess.reviewStatus === 'rejected' ? '#e74c3c' : '#e67e22';
        html += '<div onclick="selectEmrSession(\'' + sess.sessionId + '\')" style="display:flex;align-items:center;gap:8px;padding:7px 10px;margin-bottom:4px;background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.12);border-radius:8px;cursor:pointer;transition:.15s" onmouseover="this.style.background=&quot;rgba(201,168,76,.08)&quot;" onmouseout="this.style.background=&quot;rgba(255,255,255,.03)&quot;">'
          + '<span style="width:6px;height:6px;border-radius:50%;background:' + stColor + ';flex-shrink:0"></span>'
          + '<span style="flex:1;font-size:12px;color:#d4c9b0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + (sess.complaint || sess.sessionId.slice(0, 20)) + '</span>'
          + '<span style="font-size:10px;color:#666;flex-shrink:0">' + ago + ' · ' + sess.fieldCount + '字段</span>'
          + '</div>';
      });
      box.innerHTML = html;
    })
    .catch(function(){ document.getElementById('emrSessionList').innerHTML = '<div style="font-size:11px;color:#666">列表加载失败</div>'; });
}
function selectEmrSession(sid){
  _emrCurrentSid = sid;
  document.getElementById('emrSidInput').value = sid;
  fetchEmrSession();
}
// 抽屉打开时刷新列表；WS 推送 emr-update 时自动重拉
var _origToggle = toggleEmrDrawer;
toggleEmrDrawer = function(show, sid){
  _origToggle(show, sid);
  if (show) loadEmrSessionList();
};
(function(){
  try {
    var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    var ws = new WebSocket(proto + '//127.0.0.1:8920' );
    ws.onmessage = function(ev){
      try {
        var msg = JSON.parse(ev.data);
        if (msg.type === 'emr-update' && _emrCurrentSid && msg.sessionId === _emrCurrentSid) {
          if (document.getElementById('emrDrawer').style.display !== 'none') fetchEmrSession();
        }
        // R734: 新病历归档/驳回到达 → toast + 队列自动刷新
        if (msg.type === 'case-archived') {
          showToast('📥 新病历 #' + msg.caseId + ' 已归档，队列已刷新', 'ok');
          if (typeof loadQueue === 'function') setTimeout(loadQueue, 500);
        }
      } catch (_) {}
    };
  } catch (_) {}
})();

function fetchEmrSession(){
  var sid = (document.getElementById('emrSidInput').value || '').trim();
  if (!sid) { showToast('请输入会话 ID'); return; }
  var body = document.getElementById('emrDrawerBody');
  body.innerHTML = '<div style="color:#888;padding:20px 0">拉取中…</div>';
  fetch('http://127.0.0.1:8920/api/public/emr-session/' + encodeURIComponent(sid), { signal: AbortSignal.timeout(8000) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) {
        body.innerHTML = '<div style="color:#e74c3c;padding:20px 0">' + (d.error === 'NOT_FOUND' ? '会话不存在（可能已过期或未开始采集）' : d.error === 'EXPIRED' ? '会话已过期' : '拉取失败') + '</div>';
        return;
      }
      document.getElementById('emrDrawerSid').textContent = sid;
      renderEmrBody(d.emr, d.role, d.ts);
    })
    .catch(function(){ body.innerHTML = '<div style="color:#e74c3c;padding:20px 0">网络错误，请稍后重试</div>'; });
}
function renderEmrBody(emr, role, ts){
  var FIELDS = [
    ['complaint', '主诉'],
    ['examination', '望诊所见'],
    ['diagnosis', 'AI 诊断'],
    ['syndrome', '证型'],
    ['prescription', '处方'],
    ['visionFeatures', '视觉特征'],
    ['visionMatches', 'KB 匹配'],
    ['voiceLog', '问诊对话'],
    ['reviewNotes', '审核意见']
  ];
  var html = '';
  FIELDS.forEach(function(f){
    var v = emr[f[0]] || '';
    if (!v) return;
    html += '<div style="margin-bottom:14px"><div style="font-size:10px;color:var(--gold,#c9a84c);letter-spacing:1px;margin-bottom:4px">' + f[1] + '</div>'
      + '<div style="background:rgba(255,255,255,.03);border:1px solid rgba(201,168,76,.1);border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-word">' + v.replace(/</g,'&lt;') + '</div></div>';
  });
  var statusMap = { approved: ['已通过','rgba(46,204,113,.15)','#2ecc71'], rejected: ['已驳回','rgba(231,76,60,.15)','#e74c3c'], pending: ['待审核','rgba(230,126,34,.15)','#e67e22'] };
  var st = statusMap[emr.reviewStatus] || statusMap.pending;
  html = '<div style="margin-bottom:16px"><span style="display:inline-block;padding:4px 12px;border-radius:10px;font-size:11px;font-weight:600;background:' + st[1] + ';color:' + st[2] + '">' + st[0] + '</span>'
    + '<span style="font-size:10px;color:#666;margin-left:8px">更新于 ' + new Date(ts).toLocaleString() + '</span></div>' + (html || '<div style="color:#888;padding:20px 0">病历字段为空</div>');
  // ═══ R724: 复核操作区（医生端 · 绿色系）——抽屉内直接采纳/驳回 ═══
  html += '<div style="margin-top:18px;padding-top:14px;border-top:1px solid rgba(201,168,76,.15)">'
    + '<div style="font-size:10px;color:var(--gold,#c9a84c);letter-spacing:1px;margin-bottom:8px">复核操作</div>'
    + '<input id="emrReviewNotes" placeholder="复核意见（驳回必填）…" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(201,168,76,.2);border-radius:6px;padding:9px 10px;color:#eee;font-size:12px;font-family:inherit;margin-bottom:10px">'
    + '<div style="display:flex;gap:8px">'
    + '<button onclick="submitEmrReview(&quot;approved&quot;)" style="flex:1;background:rgba(16,185,129,.12);border:1px solid #10b981;color:#10b981;border-radius:6px;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">✓ 采纳</button>'
    + '<button onclick="submitEmrReview(&quot;rejected&quot;)" style="flex:1;background:rgba(231,76,60,.12);border:1px solid #e74c3c;color:#e74c3c;border-radius:6px;padding:9px 0;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit">✕ 驳回</button>'
    + '</div></div>';
  document.getElementById('emrDrawerBody').innerHTML = html;
}
// ═══ R724: 复核提交（医生端）——POST 后刷新抽屉，徽章显示新状态 ═══
function submitEmrReview(action){
  var sid = (document.getElementById('emrSidInput').value || '').trim();
  if (!sid) { showToast('请先拉取会话病历'); return; }
  var notes = (document.getElementById('emrReviewNotes') ? document.getElementById('emrReviewNotes').value : '') || '';
  if (action === 'rejected' && !notes.trim()) { showToast('驳回必须填写原因'); return; }
  fetch('http://127.0.0.1:8920/api/public/emr-session', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ sessionId: sid, role: 'doctor', emr: { reviewStatus: action, reviewNotes: notes } }),
    signal: AbortSignal.timeout(8000)
  })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d.ok) { showToast('复核提交失败，请重试'); return; }
      fetchEmrSession();
    })
    .catch(function(){ showToast('复核提交失败，请重试'); });
}
// 键盘快捷键：D 呼出实时病历
document.addEventListener('keydown', function(e){
  if (e.target.matches('input, textarea, select')) return;
  if (e.key.toLowerCase() === 'd') {
    e.preventDefault();
    var d = document.getElementById('emrDrawer');
    toggleEmrDrawer(d.style.display === 'none');
  }
});
</script>
