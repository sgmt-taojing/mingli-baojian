<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易道智鉴 · 推演工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/divination-tools-inline.css">
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<div style="position:fixed;top:12px;right:12px;z-index:99998">
  <a href="tcm-clinic.html" style="display:inline-block;padding:6px 16px;background:rgba(201,168,76,0.12);color:var(--gold,#c9a84c);border:1px solid rgba(201,168,76,0.25);border-radius:16px;font-size:12px;text-decoration:none;font-family:'Noto Serif SC',serif;letter-spacing:1px">🏥 中医诊疗</a>
</div>
  <div class="header">
    <h1>🔮 推演工具集</h1>
    <p>多种命理推演辅助工具，助您洞察天机</p>
  </div>
  
  <div class="tools-grid">
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">☯️</ml-tap>
      <div class="tool-title">八字排盘</div>
      <div class="tool-desc">输入生辰信息，获取完整八字命盘与人生解读</div>
    </div>
    
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">🏠</ml-tap>
      <div class="tool-title">风水罗盘</div>
      <div class="tool-desc">居家风水分析，户型吉凶判断</div>
    </div>
    
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">📱</ml-tap>
      <div class="tool-title">手机号吉凶</div>
      <div class="tool-desc">数字能量分析，号码运势评估</div>
    </div>
    
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">✍️</ml-tap>
      <div class="tool-title">姓名评分</div>
      <div class="tool-desc">三才五格分析，姓名改运建议</div>
    </div>
    
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">📊</ml-tap>
      <div class="tool-title">公司取名</div>
      <div class="tool-desc">企业命名咨询，商号风水设计</div>
    </div>
    
    <ml-tap class="tool-card" onclick="window.location.href='divination-hub.html'" style="display:block"
      <div class="tool-icon">🎲</ml-tap>
      <div class="tool-title">六十四卦</div>
      <div class="tool-desc">周易占卜，卦象详解</div>
    </div>
  </div>
  
  <div class="nav-bar">
    <button class="nav-btn" onclick="window.location.href='divination-hub.html'">🏠 主平台</button>
    <button class="nav-btn" onclick="window.location.href='divination-knowledge.html'">📚 知识库</button>
    <button class="nav-btn" onclick="window.location.href='divination-shop.html'">🛒 商城</button>
  </div>

<script src="js/ui-toast.js" defer></script>
  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/mobile-nav.js" defer></script>
</body>
</html>
