<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="站内消息">
<title>站内消息 · 易道智鉴</title>

  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/im-inline.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">

<!-- 顶栏 -->
<header class="topbar">
  <a class="back" href="divination-hub.html" title="返回首页">←</a>
  <h1>站内消息</h1>
  <ml-tap class="new-btn" id="newBtn" role="button" tabindex="0">＋ 新建</ml-tap>
  <span class="badge" id="topBadge"></span>
</header>

<!-- 视图 Tab -->
<nav class="tabs">
  <div class="tab active" data-view="sessions">会话</div>
  <div class="tab" data-view="directory">通讯录</div>
</nav>

<!-- 会话视图 -->
<section class="view active" id="view-sessions">
  <div class="session-list" id="sessionList">
    <div class="loading"><span class="spinner"></span>加载会话中...</div>
  </div>
</section>

<!-- 通讯录视图 -->
<section class="view" id="view-directory">
  <div class="directory" id="directoryList">
    <div class="loading"><span class="spinner"></span>加载通讯录中...</div>
  </div>
</section>

<!-- 聊天面板 -->
<div class="chat" id="chatPanel">
  <header class="chat-header">
    <span class="back" id="chatBack">←</span>
    <span class="title" id="chatTitle">会话</span>
    <span class="ai-btn" id="aiBtn" style="display:none">✨ 召 AI</span>
  </header>
  <div class="chat-body" id="chatBody"></div>
  <div class="chat-input">
    <textarea id="msgInput" rows="1" placeholder="输入消息..." maxlength="4000"></textarea>
    <button class="send-btn" id="sendBtn">发送</button>
  </div>
</div>

<script src="js/ui-toast.js"></script>

  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/im-inline.js" defer></script>
</body>
</html>
