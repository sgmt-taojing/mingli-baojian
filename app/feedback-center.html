<style>
:root{
  --gold:#c9a84c; --gold2:#d4b85a; --ink:#1a1a2e; --paper:#f5f0e8;
  --bg:#0d1117; --surface:#161b22; --border:#30363d;
  --text:#c9d1d9; --text-muted:#8b949e;
  --green:#3fb950; --red:#f85149; --yellow:#d29922; --blue:#58a6ff; --purple:#a78bfa;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,'PingFang SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
.nav-bar{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center}
.nav-bar a{color:var(--gold);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:6px;transition:.2s}
.nav-bar a:hover{background:rgba(201,168,76,.15)}
.nav-bar a.active{background:rgba(201,168,76,.2);color:var(--gold2)}
.container{max-width:100%;margin:0 auto;padding:16px}
h1{font-size:20px;color:var(--gold);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.subtitle{color:var(--text-muted);font-size:13px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:13px;color:var(--gold);margin-bottom:6px;font-weight:600}
.form-group select,.form-group input,.form-group textarea{
  width:100%;padding:10px 12px;background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;
  transition:border-color .2s;
}
.form-group select:focus,.form-group input:focus,.form-group textarea:focus{
  outline:none;border-color:var(--gold);
}
.form-group textarea{min-height:100px;resize:vertical}
.form-row{display:flex;gap:12px}
.form-row .form-group{flex:1}
.category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.cat-btn{padding:10px 8px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:12px;color:var(--text);transition:.2s}
.cat-btn:hover{border-color:var(--gold);background:rgba(201,168,76,.08)}
.cat-btn.selected{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold2)}
.cat-btn .cat-icon{font-size:20px;display:block;margin-bottom:4px}
.priority-grid{display:flex;gap:8px}
.pri-btn{flex:1;padding:8px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;cursor:pointer;text-align:center;font-size:12px;color:var(--text);transition:.2s}
.pri-btn.selected{border-color:var(--gold);background:rgba(201,168,76,.15);color:var(--gold2)}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.upload-area:hover{border-color:var(--gold);background:rgba(201,168,76,.04)}
.upload-area .upload-icon{font-size:32px;margin-bottom:8px}
.upload-area .upload-text{font-size:13px;color:var(--text-muted)}
.upload-preview{position:relative;display:inline-block;margin-top:8px}
.upload-preview img{max-width:200px;border-radius:8px;border:1px solid var(--border)}
.upload-preview .remove{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:12px}
.voice-section{display:flex;flex-direction:column;gap:10px}
.voice-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.voice-btn{display:flex;align-items:center;gap:8px;padding:10px 16px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.3);border-radius:20px;cursor:pointer;color:var(--purple);font-size:13px;transition:.2s}
.voice-btn:hover{background:rgba(167,139,250,.2)}
.voice-btn.recording{background:var(--red);color:#fff;border-color:var(--red);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.device-select{padding:6px 10px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;max-width:200px}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;color:#1a1a2e;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.submit-btn:hover{opacity:.9;transform:translateY(-1px)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}
.my-tickets{margin-top:24px}
.my-tickets h2{font-size:16px;color:var(--gold);margin-bottom:12px}
.ticket-item{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.ticket-item:hover{border-color:var(--gold)}
.ticket-item .ti-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ticket-item .ti-title{font-size:14px;color:var(--text);font-weight:600}
.ticket-item .ti-meta{font-size:11px;color:var(--text-muted)}
.status-badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:600}
.status-open{background:rgba(248,81,73,.15);color:var(--red)}
.status-in_progress{background:rgba(210,153,34,.15);color:var(--yellow)}
.status-resolved{background:rgba(63,185,80,.15);color:var(--green)}
.status-closed{background:rgba(139,148,158,.15);color:var(--text-muted)}
.status-rejected{background:rgba(248,81,73,.1);color:var(--text-muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--gold);border-radius:8px;padding:10px 20px;color:var(--gold);font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1;bottom:30px}
.perm-warning{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.3);border-radius:8px;padding:10px;font-size:12px;color:var(--red);display:none;margin-top:8px}
.perm-warning.show{display:block}
@media(max-width:480px){.form-row{flex-direction:column}.category-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:360px){body{padding-bottom:50px}.container{padding:10px 8px}h1{font-size:17px}.subtitle{font-size:11px;margin-bottom:14px}.card{padding:12px 10px;margin-bottom:12px}.nav-bar{padding:6px 8px;gap:2px}.nav-bar a{font-size:11px;padding:5px 8px}.form-group label{font-size:12px}.form-group select,.form-group input,.form-group textarea{padding:8px 10px;font-size:13px}.form-group textarea{min-height:80px}.category-grid{grid-template-columns:repeat(2,1fr);gap:6px}.cat-btn{padding:8px 6px;font-size:11px}.cat-btn .cat-icon{font-size:17px}.toast{font-size:12px;padding:8px 14px;bottom:14px}}
*/
@media print{body{background:#fff!important;color:#000!important}.nav-bar,.page-header-bar,.btn,.no-print{display:none!important}.container{width:100%!important;max-width:100%!important;margin:0!important;padding:8px!important}.card,.form-group,.my-tickets{break-inside:avoid;box-shadow:none!important;border:1px solid #ccc!important}h1,h2,h3{break-after:avoid}table{width:100%!important;font-size:11px}img{max-width:100%!important}}

<div class="container">
  <h1>语 意见反馈</h1>

  <!-- 提交表单 -->
  <div class="card">
    <div class="form-group">
      <label>问题类别</label>
      <div class="category-grid" id="categoryGrid">
        <div class="cat-btn selected" data-cat="bug"><span class="cat-icon">虫</span>Bug反馈</div>

<script>
'use strict';
// === R326 站内反馈中心 v2（修真交互+设备选择）===

var API_BASE = (location.hostname === '127.0.0.1' || location.hostname === 'localhost' || location.hostname === '0.0.0.0')
  ? 'http://127.0.0.1:8920' : '';
var selectedCategory = 'bug';
var selectedPriority = 'high';
var screenshotFile = null;
var voiceBlob = null;
var mediaRecorder = null;
var voiceStream = null;
var isRecording = false;
var availableMics = [];

// --- 初始化 ---
function init() {
  // 类别选择
  var catBtns = document.querySelectorAll('.cat-btn');
  for (var i = 0; i < catBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        for (var j = 0; j < catBtns.length; j++) catBtns[j].classList.remove('selected');
        btn.classList.add('selected');
        selectedCategory = btn.getAttribute('data-cat');
      });
    })(catBtns[i]);
  }

  // 优先级选择
  var priBtns = document.querySelectorAll('.pri-btn');
  for (var i = 0; i < priBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        for (var j = 0; j < priBtns.length; j++) priBtns[j].classList.remove('selected');
        btn.classList.add('selected');
        selectedPriority = btn.getAttribute('data-pri');
      });
    })(priBtns[i]);
  }

  // 截图上传 — 点击区域触发 file input
  var uploadArea = document.getElementById('uploadArea');
  var screenshotInput = document.getElementById('screenshotInput');
  uploadArea.addEventListener('click', function() { screenshotInput.click(); });
  screenshotInput.addEventListener('change', function() { handleScreenshot(this); });

  // 拖拽上传
  uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.style.borderColor = 'var(--gold)'; });
  uploadArea.addEventListener('dragleave', function(e) { uploadArea.style.borderColor = ''; });
  uploadArea.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadArea.style.borderColor = '';
    if (e.dataTransfer.files.length > 0) {
      screenshotInput.files = e.dataTransfer.files;
      handleScreenshot(screenshotInput);
    }
  });

  // 语音按钮
  document.getElementById('voiceBtn').addEventListener('click', toggleVoice);

  // 提交按钮
  document.getElementById('submitBtn').addEventListener('click', submitTicket);

  // 回车键提交（在标题框按 Enter 聚焦到内容框；在内容框按 Ctrl+Enter 提交）
  document.getElementById('ticketTitle').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('ticketContent').focus();
    }
  });
  document.getElementById('ticketContent').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      submitTicket();
    }
  });

  // 枚举音频输入设备（麦克风）
  enumerateAudioDevices();

  // 加载我的工单
  loadMyTickets();
}

// --- 设备枚举 ---
function enumerateAudioDevices() {
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.enumerateDevices !== 'function') {
    document.getElementById('voiceStatus').textContent = '⚠️ 当前环境不支持设备枚举（需 HTTPS 或 localhost）';
    return;
  }
  navigator.mediaDevices.enumerateDevices().then(function(devices) {
    var mics = devices.filter(function(d) { return d.kind === 'audioinput'; });
    availableMics = mics;
    if (mics.length > 0) {
      var sel = document.getElementById('micDevice');
      sel.innerHTML = '<option value="">默认麦克风</option>';
      for (var i = 0; i < mics.length; i++) {
        var label = mics[i].label || '麦克风 ' + (i + 1);
        sel.innerHTML += '<option value="' + mics[i].deviceId + '">' + label + '</option>';
      }
      sel.style.display = mics.length > 1 ? 'inline-block' : 'none';
      sel.addEventListener('change', function() {
        if (isRecording) stopRecording();
      });
    }
  }).catch(function(e) {
    // 非安全上下文（非 HTTPS / 非 localhost）下 enumerateDevices 也会受限
    showPermWarning('设备枚举失败：' + e.message + '。请确认通过 https:// 或 localhost 访问。');
  });
}

function showPermWarning(msg) {
  var w = document.getElementById('permWarning');
  w.textContent = msg;
  w.classList.add('show');
}
function hidePermWarning() {
  document.getElementById('permWarning').classList.remove('show');
}

// --- 截图上传 ---
function handleScreenshot(input) {
  var file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('文件超过5MB限制'); return; }
  screenshotFile = file;
  var reader = new FileReader();
  reader.onload = function(e) {
    var preview = document.getElementById('screenshotPreview');
    preview.innerHTML = '<div class="upload-preview"><img loading="lazy" src="' + e.target.result + '" alt="上传预览图"><span class="remove" id="removeScr">关</span></div>';
    document.getElementById('removeScr').addEventListener('click', removeScreenshot);
  };
  reader.readAsDataURL(file);
}

function removeScreenshot() {
  screenshotFile = null;
  document.getElementById('screenshotPreview').innerHTML = '';
  document.getElementById('screenshotInput').value = '';
}

// --- 语音录制 ---
function toggleVoice() {
  if (isRecording) { stopRecording(); return; }
  startRecording();
}

function startRecording() {
  // 检查 API 可用性（部分浏览器在非安全上下文下 navigator.mediaDevices 为 undefined）
  if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== 'function') {
    var hint = '当前环境不支持麦克风录音。\n\n可能原因：\n';
    if (location.protocol !== 'https:' && !window.isSecureContext) {
      hint += '• 非安全上下文（需 HTTPS 或 localhost）\n';
      hint += '当前地址：' + location.protocol + '//' + location.hostname + ':' + location.port + '\n';
      hint += '请通过 https:// 访问或在本机 localhost 打开。';
    } else {
      hint += '• 浏览器不支持 getUserMedia API\n';
      hint += '请使用 Chrome 53+、Edge 79+、Safari 11+ 或 Firefox 36+';
    }
    showPermWarning(hint);
    return;
  }

  // 双重检查安全上下文
  if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    showPermWarning('⚠️ 麦克风需要安全上下文（HTTPS 或 localhost）。\n当前地址：' + location.hostname + '\n请通过 https:// 访问或在本地 localhost 打开。');
    return;
  }

  // 获取选中的设备 ID
  var deviceId = document.getElementById('micDevice').value || undefined;
  var constraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
  if (deviceId) constraints.audio.deviceId = { exact: deviceId };

  navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
    voiceStream = stream;
    hidePermWarning();

    // 选择支持的 MIME 类型
    var mimeType = 'audio/webm';
    if (!MediaRecorder.isTypeSupported(mimeType)) {
      mimeType = 'audio/ogg';
      if (!MediaRecorder.isTypeSupported(mimeType)) {
        mimeType = '';
      }
    }

    try {
      mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
    } catch(e) {
      showPermWarning('录音初始化失败：' + e.message);
      voiceStream.getTracks().forEach(function(t) { t.stop(); });
      return;
    }

    var chunks = [];
    mediaRecorder.ondataavailable = function(e) {
      if (e.data && e.data.size > 0) chunks.push(e.data);
    };
    mediaRecorder.onstop = function() {
      voiceBlob = new Blob(chunks, { type: mimeType || 'audio/webm' });
      var url = URL.createObjectURL(voiceBlob);
      var playback = document.getElementById('voicePlayback');
      playback.src = url;
      playback.style.display = 'block';
      document.getElementById('voiceStatus').textContent = '✅ 录音完成 (' + Math.round(voiceBlob.size / 1024) + 'KB)';
    };
    mediaRecorder.onerror = function(e) {
      showPermWarning('录音出错：' + (e.error ? e.error.message : '未知错误'));
      stopRecording();
    };

    mediaRecorder.start();
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceIcon').textContent = '⏹';
    document.getElementById('voiceText').textContent = '停止录音';
    document.getElementById('voiceStatus').textContent = '🔴 录音中...';
  }).catch(function(e) {
    if (e.name === 'NotAllowedError') {
      showPermWarning('❌ 麦克风权限被拒绝。请在浏览器地址栏点击🔒图标，允许麦克风访问后重试。');
    } else if (e.name === 'NotFoundError') {
      showPermWarning('❌ 未找到麦克风设备。请检查设备连接或选择其他设备。');
    } else if (e.name === 'NotReadableError') {
      showPermWarning('❌ 麦克风被其他程序占用。请关闭其他使用麦克风的程序后重试。');
    } else {
      showPermWarning('❌ 麦克风访问失败：' + e.name + ' — ' + e.message);
    }
  });
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
  if (voiceStream) {
    voiceStream.getTracks().forEach(function(t) { t.stop(); });
  }
  isRecording = false;
  document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('voiceIcon').textContent = '🎤';
  document.getElementById('voiceText').textContent = '重新录音';
}

// --- 提交工单 ---
function submitTicket() {
  var title = document.getElementById('ticketTitle').value.trim();
  var content = document.getElementById('ticketContent').value.trim();
  if (!title) { showToast('请输入标题'); document.getElementById('ticketTitle').focus(); return; }
  if (!content) { showToast('请输入详细描述'); document.getElementById('ticketContent').focus(); return; }

  var btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '提交中...';

  // 先上传语音（如有）
  var voiceUploadPromise = Promise.resolve(null);
  if (voiceBlob) {
    var voiceReader = new FileReader();
    voiceUploadPromise = new Promise(function(resolve) {
      voiceReader.onload = function() { resolve(voiceReader.result); };
      voiceReader.readAsDataURL(voiceBlob);
    }).then(function(voiceBase64) {
      return fetch(API_BASE + '/api/tickets/voice-upload', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ audio: voiceBase64 })
      }).then(function(r) { return r.json(); });
    }).then(function(vr) {
      if (vr.code === 0) return vr.data.voicePath;
      return null;
    }).catch(function() { return null; });
  }

  voiceUploadPromise.then(function(voicePath) {
    if (screenshotFile) {
      // 有截图 — FormData
      var formData = new FormData();
      formData.append('screenshot', screenshotFile);
      formData.append('category', selectedCategory);
      formData.append('priority', selectedPriority);
      formData.append('title', title);
      formData.append('content', content);
      formData.append('page_url', location.href);
      if (voicePath) formData.append('voice_path', voicePath);
      return fetch(API_BASE + '/api/tickets/create', { method: 'POST', body: formData });
    } else {
      // 无截图 — JSON
      return fetch(API_BASE + '/api/tickets/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          category: selectedCategory,
          priority: selectedPriority,
          title: title,
          content: content,
          page_url: location.href,
          voice_path: voicePath
        })
      });
    }
  }).then(function(r) { return r.json(); }).then(function(r) {
    handleResult(r);
  }).catch(function(e) {
    showToast('提交失败：' + e.message);
  }).finally(function() {
    btn.disabled = false;
    btn.textContent = '提交反馈';
  });
}

function handleResult(r) {
  if (r.code === 0) {
    // 显示成功卡片
    var successBox = document.createElement('div');
    successBox.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--surface);border:2px solid var(--green);border-radius:12px;padding:24px 32px;text-align:center;z-index:10000;box-shadow:0 8px 32px rgba(63,185,80,.3)';
    successBox.innerHTML = '<div style="font-size:48px;margin-bottom:12px">成</div>' +
      '<div style="color:var(--green);font-size:16px;font-weight:600;margin-bottom:6px">反馈已提交成功！</div>' +
      '<div style="color:var(--text-muted);font-size:13px">工单号 <b style="color:var(--gold)">#' + r.data.ticketId + '</b></div>' +
      '<div style="color:var(--text-muted);font-size:12px;margin-top:8px">我们将在 1-3 个工作日内处理</div>' +
      '<button type="button" onclick="this.parentElement.remove()" style="margin-top:14px;padding:6px 20px;background:var(--gold);color:#1a1a2e;border:none;border-radius:6px;cursor:pointer;font-weight:600">好的</button>';
    document.body.appendChild(successBox);
    setTimeout(function() { if (successBox.parentElement) successBox.remove(); }, 5000);

    // 清空表单
    document.getElementById('ticketTitle').value = '';
    document.getElementById('ticketContent').value = '';
    removeScreenshot();
    voiceBlob = null;
    document.getElementById('voicePlayback').style.display = 'none';
    document.getElementById('voiceStatus').textContent = '';
    loadMyTickets();
  } else {
    showToast('❌ ' + (r.message || '提交失败'));
  }
}

// --- 加载我的工单 ---
function loadMyTickets() {
  var token = localStorage.getItem('authToken');
  var headers = {};
  if (token) headers['Authorization'] = 'Bearer ' + token;

  // 优先加载自己的工单；未登录则加载最近公开工单
  var url = API_BASE + '/api/tickets/list';
  fetch(url, { headers: headers })
    .then(function(r) { return r.json(); })
    .then(function(r) {
      var list = document.getElementById('ticketsList');
      var catNames = {bug:'🐛 Bug',suggestion:'💡 建议',question:'❓ 咨询',praise:'👍 好评',feature_request:'✨ 新功能'};
      var statusNames = {open:'待处理',in_progress:'处理中',resolved:'已解决',closed:'已关闭',rejected:'已拒绝'};

      if (r.code === 0 && r.data.tickets.length > 0) {
        // 已登录 — 显示自己的工单
        list.innerHTML = r.data.tickets.map(function(t) {
          return '<div class="ticket-item" data-id="' + t.id + '">' +
            '<div class="ti-header"><span class="ti-title">' + escapeHtml(t.title) + '</span>' +
            '<span class="status-badge status-' + t.status + '">' + (statusNames[t.status]||t.status) + '</span></div>' +
            '<div class="ti-meta">' + (catNames[t.category]||t.category) + ' · ' + (t.created_at||'').substring(0,16) + '</div>' +
            (t.admin_reply ? '<div style="margin-top:4px;font-size:12px;color:var(--green)">语 官方已回复</div>' : '') +
          '</div>';
        }).join('');
        bindTicketClicks();
      } else {
        // 未登录 — 加载最近公开工单
        loadRecentTickets();
      }
    }).catch(function(e) {
      loadRecentTickets();
    });
}

function loadRecentTickets() {
  fetch(API_BASE + '/api/admin/tickets/list?pageSize=10', {})
    .then(function(r) { return r.json(); })
    .then(function(r) {
      var list = document.getElementById('ticketsList');
      var catNames = {bug:'🐛 Bug',suggestion:'💡 建议',question:'❓ 咨询',praise:'👍 好评',feature_request:'✨ 新功能'};
      var statusNames = {open:'待处理',in_progress:'处理中',resolved:'已解决',closed:'已关闭',rejected:'已拒绝'};
      var token = localStorage.getItem('authToken');

      if (r.code === 0 && r.data.tickets.length > 0) {
        var html = '';
        if (!token) {
          html += '<div style="background:rgba(88,166,255,.06);border:1px solid rgba(88,166,255,.2);border-radius:8px;padding:10px;margin-bottom:10px;font-size:12px;color:var(--blue)">' +
            '💡 <a href="login.html?redirect=feedback-center.html" style="color:var(--blue);font-weight:600">登录</a> 后可查看您的专属反馈记录' +
          '</div>';
        }
        html += '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px">最近反馈动态</div>';
        html += r.data.tickets.map(function(t) {
          return '<div class="ticket-item" data-id="' + t.id + '">' +
            '<div class="ti-header"><span class="ti-title">' + escapeHtml(t.title) + '</span>' +
            '<span class="status-badge status-' + t.status + '">' + (statusNames[t.status]||t.status) + '</span></div>' +
            '<div class="ti-meta">' + (catNames[t.category]||t.category) + ' · ' + (t.created_at||'').substring(0,16) + '</div>' +
            (t.admin_reply ? '<div style="margin-top:4px;font-size:12px;color:var(--green)">语 官方已回复</div>' : '') +
          '</div>';
        }).join('');
        list.innerHTML = html;
        bindTicketClicks();
      } else {
        list.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">暂无反馈记录，成为第一个反馈的人！</div>';
      }
    }).catch(function(e) {
      document.getElementById('ticketsList').innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px">暂无反馈记录，成为第一个反馈的人！</div>';
    });
}

function bindTicketClicks() {
  var items = document.querySelectorAll('.ticket-item');
  for (var i = 0; i < items.length; i++) {
    items[i].addEventListener('click', function() {
      var id = this.getAttribute('data-id');
      location.href = 'feedback-detail.html?id=' + id;
    });
  }
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 3000);
}

// --- 启动 ---
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
