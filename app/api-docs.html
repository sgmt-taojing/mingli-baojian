<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API 文档 · 命理宝鉴</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css">
<style>
  body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fafafa; }
  .topbar { background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%); color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .topbar h1 { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: 1px; }
  .topbar .meta { color: rgba(255,255,255,0.7); font-size: 13px; }
  .topbar a { color: #ffd700; text-decoration: none; padding: 6px 14px; border: 1px solid rgba(255,215,0,0.4); border-radius: 6px; font-size: 12px; }
  .topbar a:hover { background: rgba(255,215,0,0.1); }
  #swagger-ui { max-width: 1400px; margin: 0 auto; }
  .swagger-ui .info { margin: 24px 0; }
  .swagger-ui .info h2 { color: #2c3e50; }
</style>
</head>
<body>

<div class="topbar">
  <h1>📚 命理宝鉴 API 文档</h1>
  <span class="meta" id="apiMeta">OpenAPI 3.0.3 · loading...</span>
  <span style="flex:1"></span>
  <a href="divination-hub.html">← 返回首页</a>
  <a href="kb-graph.html">KB 图谱</a>
  <a href="/api/openapi.json" download>下载 JSON</a>
</div>

<div id="swagger-ui"></div>

<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js" crossorigin></script>
<script>
  window.onload = () => {
    SwaggerUIBundle({
      url: "/api/openapi.json",
      onComplete: function(swagger) {
        try {
          var routes = 0, tags = {};
          if (swagger && swagger.json && swagger.json.paths) {
            routes = Object.keys(swagger.json.paths).length;
            (swagger.json.tags || []).forEach(function(t){ tags[t.name] = true; });
            // 数路径上每个 tag 出现次数
            Object.values(swagger.json.paths).forEach(function(path){
              Object.values(path).forEach(function(op){
                if (op.tags) op.tags.forEach(function(t){ tags[t] = (tags[t]||0)+1; });
              });
            });
          }
          var tagCount = Object.keys(tags).length;
          document.getElementById('apiMeta').textContent = 'OpenAPI 3.0.3 · ' + routes + ' routes · ' + tagCount + ' tags';
        } catch(e) { /* ignore */ }
      },
      dom_id: "#swagger-ui",
      deepLinking: true,
      presets: [
        SwaggerUIBundle.presets.apis
      ],
      layout: "BaseLayout",
      docExpansion: "list",
      operationsSorter: "alpha",
      tagsSorter: "alpha",
      filter: true,
      tryItOutEnabled: true,
      requestInterceptor: (req) => {
        try {
          const csrf = document.cookie.match(/csrf_token=([^;]+)/);
          if (csrf && (req.url.includes('/api/') && !req.url.includes('/api/public/') && !req.url.includes('/api/csrf-token'))) {
            req.headers['X-CSRF-Token'] = csrf[1];
          }
        } catch (e) {}
        return req;
      }
    });
  };
</script>

</body>
</html>
