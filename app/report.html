<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就诊合并报告 · 命理宝鉴</title>
<style>
  :root{ --gold:#c9a84c; --bg:#14110c; --card:#1d1912; --border:rgba(201,168,76,.25); --muted:#8a7f66; --ink:#e8dfc8; --red:#f87171; --green:#4ade80; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font:14px/1.8 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; padding:16px; }
  .wrap{ max-width:760px; margin:0 auto; }
  .head{ text-align:center; padding:18px 0 14px; border-bottom:2px solid var(--gold); margin-bottom:14px; }
  .head h1{ font-size:20px; color:var(--gold); letter-spacing:2px; }
  .head .sub{ font-size:11px; color:var(--muted); margin-top:4px; }
  .badges{ display:flex; gap:8px; justify-content:center; margin-top:8px; flex-wrap:wrap; }
  .badge{ font-size:11px; padding:2px 10px; border-radius:10px; border:1px solid var(--border); color:var(--gold); }
  .badge.gray{ color:var(--muted); border-color:rgba(255,255,255,.12); }
  .badge.green{ color:var(--green); border-color:rgba(74,222,128,.4); }
  .sec{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .sec h2{ font-size:13px; color:var(--gold); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .sec .body{ white-space:pre-wrap; word-break:break-word; font-size:13px; }
  .sec .body.empty{ color:var(--muted); font-size:12px; }
  .ann{ border-left:3px solid #8b5cf6; padding:6px 10px; margin:6px 0; background:rgba(139,92,246,.06); border-radius:0 6px 6px 0; }
  .ann .meta{ font-size:10px; color:var(--muted); margin-bottom:2px; }
  .ann .wm{ display:inline-block; font-size:10px; color:#fbbf24; border:1px dashed #fbbf24; border-radius:4px; padding:0 5px; margin-left:6px; }
  .ann.approved .wm{ display:none; }
  .ann.rejected{ opacity:.55; }
  .disclaimer{ font-size:11px; color:var(--muted); text-align:center; padding:12px 8px; border-top:1px dashed var(--border); margin-top:6px; line-height:1.7; }
  .actions{ display:flex; gap:10px; justify-content:center; margin:14px 0; }
  .btn{ background:var(--gold); color:#14110c; border:none; border-radius:8px; padding:9px 22px; font-size:13px; cursor:pointer; }
  .btn.ghost{ background:transparent; color:var(--gold); border:1px solid var(--border); }
  .lookup{ text-align:center; padding:40px 0; }
  .lookup input{ width:min(420px,80%); padding:10px 12px; font-size:13px; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:8px; color:var(--ink); }
  .err{ text-align:center; color:var(--red); padding:30px 0; font-size:13px; }
  @media print{
    body{ background:#fff; color:#222; }
    .sec{ border:1px solid #ccc; background:#fff; break-inside:avoid; }
    .head h2,.head h1,.sec h2{ color:#8a6d1f; }
    .actions,.lookup{ display:none; }
    .disclaimer{ color:#666; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>就诊合并报告</h1>
    <div class="sub">命理宝鉴 · AI 实时诊疗一体化平台</div>
    <div class="badges" id="badges"></div>
  </div>
  <div id="main"><div class="lookup">
    <p style="color:var(--muted);margin-bottom:12px">输入会话 ID 查看您的合并报告（问诊完成归档后可查）</p>
    <input id="sidInput" placeholder="会话 ID，如 kmz_xxxxxx">
    <div id="sidErr" style="display:none;color:#c0392b;font-size:13px;margin-top:6px"></div>
    <div style="margin-top:12px"><button class="btn" onclick="loadReport($('sidInput').value.trim())">查询报告</button></div>
  </div></div>
  <div class="disclaimer" id="disclaimer" style="display:none"></div>
  <div class="actions" id="actions" style="display:none">
    <button class="btn" onclick="window.print()">🖨️ 打印 / 存 PDF</button>
    <button class="btn ghost" onclick="loadReport(curSid, true)">🔄 刷新（批注更新后点我）</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let curSid = '';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

const STATUS_NM = { pending:'待审核', approved:'已审核', rejected:'已驳回', modified:'修改通过', draft:'草稿（未归档）', pending_master:'待命理师批注' };

async function loadReport(sid, silent){
  const errEl = $('sidErr');
  if (errEl) errEl.style.display = 'none';
  if (!sid) {
    if (errEl) { errEl.textContent = '请输入会话 ID'; errEl.style.display = 'block'; }
    $('sidInput').focus();
    return;
  }
  curSid = sid;
  if (!silent) $('main').innerHTML = '<div class="lookup" style="color:var(--muted)">加载中…</div>';
  try {
    const r = await fetch('http://127.0.0.1:8920/api/public/emr-report/' + encodeURIComponent(sid), { signal: AbortSignal.timeout(10000) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.message || j.error || '查询失败');
    render(j);
  } catch (e) {
    $('main').innerHTML = '<div class="err">⚠️ ' + esc(e.name === 'AbortError' ? '查询超时，请重试' : e.message) + '</div>'
      + '<div class="lookup"><button class="btn ghost" onclick="loadReport(curSid)">重试</button></div>';
  }
}

function secHtml(icon, title, text){
  const has = text && String(text).trim();
  return '<div class="sec"><h2>' + icon + ' ' + title + '</h2><div class="body' + (has ? '' : ' empty') + '">' + (has ? esc(text) : '（暂无记录）') + '</div></div>';
}

function render(j){
  const s = j.sections || {};
  const anns = (j.annotations || []).filter(a => a.status !== 'rejected');
  $('badges').innerHTML =
    (j.caseId ? '<span class="badge">病历号 #' + j.caseId + '</span>' : '')
    + '<span class="badge ' + (j.reviewStatus === 'approved' ? 'green' : 'gray') + '">' + esc(STATUS_NM[j.reviewStatus] || j.reviewStatus || '—') + '</span>'
    + (j.draft ? '<span class="badge gray">草稿</span>' : '')
    + (j.createdAt ? '<span class="badge gray">' + esc(j.createdAt) + '</span>' : '');

  let h = '';
  h += secHtml('🗣️', '主诉', s.complaint);
  h += secHtml('👁️', '四诊（望闻问切采集）', s.examination);
  h += secHtml('🩺', '辨证', s.syndrome);
  h += secHtml('💊', '处方', s.prescription);
  if (s.labEvidence) h += secHtml('🧪', '检验旁证（西医指标佐证）', s.labEvidence);

  // 命理合参（AI 草案）+ 命理师批注（8974 旁路）
  let ml = '<div class="sec"><h2>🔮 命理合参 <span style="font-size:10px;color:var(--muted);font-weight:normal">传统易学参考 · 不构成医学诊断</span></h2>';
  if (s.mingli) ml += '<div class="body" style="margin-bottom:8px">' + esc(s.mingli) + '</div>';
  if (anns.length) {
    ml += anns.map(a => {
      const pend = a.status !== 'approved';
      return '<div class="ann ' + (pend ? '' : 'approved') + '">'
        + '<div class="meta">' + (a.type === 'ai' ? '🤖 AI 草案' : '✍️ 命理师 ' + esc(a.author || '')) + ' · ' + esc((a.created_at || '').slice(0, 16))
        + (pend ? '<span class="wm">待命理师核对</span>' : ' · ✅ 已核对' + (a.reviewer ? '（' + esc(a.reviewer) + '）' : '')) + '</div>'
        + '<div class="body">' + esc(a.content || '') + '</div></div>';
    }).join('');
  } else if (!s.mingli) {
    ml += '<div class="body empty">（本病例无命理内容）</div>';
  }
  ml += '</div>';
  if (s.mingli || anns.length) h += ml;

  if (s.reviewNotes) h += secHtml('📝', '审核意见', s.reviewNotes);
  if (s.voiceLog) h += secHtml('🎙️', '问诊语音记录', s.voiceLog);

  $('main').innerHTML = h;
  $('disclaimer').textContent = j.disclaimer || '本报告为辅助诊疗参考，最终诊疗决策由执业医师作出。';
  $('disclaimer').style.display = 'block';
  $('actions').style.display = 'flex';
}

// 入口：?sid= 直达
(function(){
  const sid = new URLSearchParams(location.search).get('sid');
  if (sid) loadReport(sid);
})();
</script>
</body>
</html>
