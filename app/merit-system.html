<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>易道智鉴 · 功德系统</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/merit-system-inline.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<div style="position:fixed;top:12px;right:12px;z-index:99998">
  <a href="tcm-clinic.html" style="display:inline-block;padding:6px 16px;background:rgba(201,168,76,0.12);color:var(--gold,#c9a84c);border:1px solid rgba(201,168,76,0.25);border-radius:16px;font-size:12px;text-decoration:none;font-family:'Noto Serif SC',serif;letter-spacing:1px">🏥 中医诊疗</a>
</div>
  <h1 style="color: var(--gold); margin-top: 40px;">🌸 功德系统</h1>
  <p style="color: var(--paper3);">积功累德，福报绵长</p>
  
  <div class="merit-circle">
    <div class="merit-num" id="meritNum">0</div>
    <div class="merit-label">当前功德</div>
  </div>
  
  <div class="quick-actions">
    <ml-tap class="action-btn" onclick="addMerit(1)" style="display:block"
      <div class="action-icon">🙏</ml-tap>
      <div class="action-text">每日签到</div>
      <div class="action-merit">+1 功德</div>
    </div>
    <ml-tap class="action-btn" onclick="addMerit(3)" style="display:block"
      <div class="action-icon">📖</ml-tap>
      <div class="action-text">诵经打卡</div>
      <div class="action-merit">+3 功德</div>
    </div>
    <ml-tap class="action-btn" onclick="addMerit(5)" style="display:block"
      <div class="action-icon">🕯️</ml-tap>
      <div class="action-text">供灯祈福</div>
      <div class="action-merit">+5 功德</div>
    </div>
    <ml-tap class="action-btn" onclick="addMerit(10)" style="display:block"
      <div class="action-icon">💎</ml-tap>
      <div class="action-text">放生回向</div>
      <div class="action-merit">+10 功德</div>
    </div>
  </div>
  
  <div class="info-box">
    <div class="info-title">功德获取方式</div>
    <div class="info-list">
      • 每日签到可获得1功德<br>
      • 诵经打卡可获得3功德<br>
      • 供灯祈福可获得5功德<br>
      • 放生回向可获得10功德<br>
      • 推荐好友可获得20功德
    </div>
  </div>
  
  <button onclick="window.location.href='divination-hub.html'"
          style="background: linear-gradient(135deg, var(--gold), var(--gold3));
                 border: none; color: var(--ink); padding: 15px 40px;
                 border-radius: 8px; cursor: pointer; font-weight: bold;
                 margin: 20px 0;">
    前往主平台查看完整功能
  </button>
  
  <div class="nav-bar">
  <a href="divination-hub.html" class="file-nav-btn">🏠 主平台</a>
  <a href="divination-almanac.html" class="file-nav-btn">📅 黄历</a>
  <a href="divination-integrated.html" class="file-nav-btn">🧬 体质调理</a>
  <a href="tcm-clinic.html" class="file-nav-btn">🏥 中医诊疗</a>
  <a href="tcm-symptom.html" class="file-nav-btn">🩺 症状分析</a>
  <a href="divination-knowledge.html" class="file-nav-btn">📚 知识库</a>
  <a href="nihaisha-knowledge.html" class="file-nav-btn">🪷 倪师知识库</a>
  <a href="nihaisha-tool.html" class="file-nav-btn">🔬 倪师工具</a>
  <a href="nihaisha-learning.html" class="file-nav-btn">📖 倪师学堂</a>
  <a href="shuhan-knowledge.html" class="file-nav-btn">🎯 舒晗知识库</a>
  <a href="divination-shop.html" class="file-nav-btn">🛒 商城</a>
  <a href="divination-membership.html" class="file-nav-btn">💎 会员</a>
  <a href="wechat-hub.html" class="file-nav-btn">📱 缘主工具</a>
  <a href="login.html" class="file-nav-btn">🔐 登录</a>
</div>
  
  <script src="js/ui-toast.js" defer></script>
<script src="js/toast-helper.js"></script>

  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/merit-system-inline.js" defer></script>
</body>
</html>
