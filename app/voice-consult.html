<style>
:root{--gold:#c9a84c;--bg:#0e1726;--card:#1a2332;--border:#2d3748;--text:#c9d1d9;--muted:#718096;--green:#48bb78;--red:#f56565;--blue:#4299e1;--purple:#9f7aea}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:0 auto;min-height:100vh}
h1{color:var(--gold);font-size:17px;margin-bottom:4px;text-align:center}
.sub{text-align:center;font-size:11px;color:var(--muted);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;color:var(--gold);margin-bottom:8px;border-left:3px solid var(--gold);padding-left:8px}
textarea,select,input{width:100%;padding:8px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:13px;font-family:inherit}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.btn{display:block;width:100%;padding:12px;background:var(--gold);color:#0e1726;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px}
.btn-green{background:var(--green);color:#fff}
.btn-red{background:var(--red);color:#fff}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
/* 录音动画 */
.rec-btn{width:88px;height:88px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:all .3s;border:none;position:relative}
.rec-btn.idle{background:var(--gold);color:#0e1726}
.rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1.2s infinite}
.rec-btn.playing{background:var(--green);color:#fff}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,101,101,.5)}70%{box-shadow:0 0 0 22px rgba(245,101,101,0)}100%{box-shadow:0 0 0 0 rgba(245,101,101,0)}}
.timer{text-align:center;font-size:22px;font-weight:700;color:var(--gold);margin:6px 0;font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.7}
.transcript{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:13px;line-height:1.8;min-height:60px;margin:8px 0;color:var(--text)}
.transcript .live{color:var(--blue)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tag-preview{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.3);color:var(--gold);font-size:11px;padding:3px 10px;border-radius:14px}
.tag.symptom{background:rgba(72,187,120,.12);border-color:rgba(72,187,120,.3);color:var(--green)}
.tag.birth{background:rgba(66,153,225,.12);border-color:rgba(66,153,225,.3);color:var(--blue)}
.tag.query{background:rgba(159,122,234,.12);border-color:rgba(159,122,234,.3);color:var(--purple)}
.step-num{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;background:var(--gold);color:#0e1726;border-radius:50%;font-size:11px;font-weight:700;margin-right:6px}
.flow-steps-wrap{margin-bottom:8px}
@media(max-width:360px){body{padding:8px 6px}h1{font-size:15px}.card{padding:10px 8px}.card-title{font-size:12px}textarea{font-size:12px;padding:6px}.btn{padding:10px;font-size:13px}.rec-btn{width:72px;height:72px;font-size:12px}}

/* R742: 按钮交互三态 */
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:not-allowed}

<div class="card">

<script>
var API=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
var token=localStorage.getItem('admin_token')||localStorage.getItem('token')||'';
var mediaRecorder=null;
var mediaStream=null;
var chunks=[];
var recordedBlob=null;
var recSeconds=0;
var recTimer=null;
var isRecording=false;
var recognition=null;
var finalText='';

function authHeaders(){var h={'Content-Type':'application/json'};if(token)h['Authorization']='Bearer '+token;return h}
function showToast(msg){var t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1a2332;border:1px solid var(--gold);color:var(--gold);padding:10px 18px;border-radius:20px;font-size:13px;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.4)';document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

// ========== 录音 ==========
function toggleRecord(){
  if(isRecording){stopRecord();return}
  startRecord();
}

function startRecord(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showToast('浏览器不支持录音，请用 Chrome/Edge');return}
  // R697: 读取实时语音模式开关
  var liveEl=document.getElementById('liveMode');
  liveMode=liveEl?liveEl.checked:false;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaStream=stream;
    chunks=[];
    recordedBlob=null;
    finalText='';
    mediaRecorder=new MediaRecorder(stream);
    mediaRecorder.ondataavailable=function(e){if(e.data.size>0)chunks.push(e.data)};
    mediaRecorder.onstop=function(){
      recordedBlob=new Blob(chunks,{type:'audio/webm'});
      document.getElementById('rec-btn').className='rec-btn idle';
      document.getElementById('rec-icon').textContent='🎤';
      document.getElementById('rec-hint').textContent='录音完成（'+recSeconds+'秒）';
      document.getElementById('transcript-card').style.display='block';
      stopRecognition();
    };
    mediaRecorder.start();
    isRecording=true;
    recSeconds=0;
    document.getElementById('timer').textContent='00:00';
    document.getElementById('rec-btn').className='rec-btn recording';
    document.getElementById('rec-icon').textContent='⏹';
    document.getElementById('rec-hint').textContent=liveMode?'🎙️ 实时模式 · 边说边查 KB · 再次点击停止':'正在录音，再次点击停止';
    recTimer=setInterval(function(){
      recSeconds++;
      var m=String(Math.floor(recSeconds/60)).padStart(2,'0');
      var s=String(recSeconds%60).padStart(2,'0');
      document.getElementById('timer').textContent=m+':'+s;
      if(recSeconds>=90){stopRecord()}
    },1000);
    // 同时启动 ASR 实时转写
    startRecognition();
  }).catch(function(e){showToast('无法访问麦克风：'+esc(e.message))});
}

function stopRecord(){
  if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
  if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop()})}
  isRecording=false;
  if(recTimer)clearInterval(recTimer);
}

// ========== ASR 实时转写 ==========
// R697: 升级为「实时语音 → 知识库即时响应」流式交互
// 说话过程中：interim 文本实时显示 + 防抖 500ms 自动查 KB + 实时症状提取
let liveMode = false;          // 实时语音模式开关
let silenceTimer = null;       // R697: 停顿自动停止计时器
let kbLiveTimer = null;        // KB 查询防抖
let lastKbQuery = '';          // 去重
let kbCardCount = 0;           // KB 卡片计数

function startRecognition(){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return;
  recognition=new SR();
  recognition.lang='zh-CN';
  recognition.continuous=true;
  recognition.interimResults=true;
  recognition.onresult=function(e){
    var text='';
    var interim='';
    var finals='';
    for(var i=0;i<e.results.length;i++){
      if(e.results[i].isFinal){
        finals+=e.results[i][0].transcript;
      }else{
        interim+=e.results[i][0].transcript;
      }
    }
    text=finals+interim;
    finalText=text;
    // R697: 停顿自动停止（实时模式·3 秒无新语音自动收尾）
    if(liveMode && isRecording){
      if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null}
      silenceTimer=setTimeout(function(){
        if(isRecording && liveMode){
          var hint=document.getElementById('rec-hint');
          if(hint)hint.textContent='检测到停顿，自动结束';
          stopRecord();
        }
      },3000);
    }
    // 实时显示（final 白色 + interim 金色）
    document.getElementById('transcript').innerHTML='<span class="live">'+escapeHtml(finals)+'</span>'+(interim?'<span style="color:var(--gold2,#c9a84c);opacity:.85">'+escapeHtml(interim)+'</span>':'');
    // R697: 实时语音 → KB 即时响应（防抖 500ms，边说话边查）
    if(liveMode && text && text.trim().length>=3){
      scheduleKbQuery(text.trim());
    }
    // R697: 实时症状提取（每 1.5s 节流，边说话边出标签）
    if(interim && text.length>=8 && (!window.__lastExtractTs || Date.now()-window.__lastExtractTs>1500)){
      window.__lastExtractTs=Date.now();
      try{previewExtract(text)}catch(_){}
    }
  };
  recognition.onerror=function(){};
  recognition.onend=function(){
    // 实时模式自动续接（防止识别器自动停止）
    if(liveMode && isRecording){
      try{recognition.start()}catch(_){}
    }
  };
  try{recognition.start()}catch(e){}
}

// R697: KB 实时查询调度（防抖 + 去重）
function scheduleKbQuery(text){
  if(text===lastKbQuery)return;
  lastKbQuery=text;
  if(kbLiveTimer)clearTimeout(kbLiveTimer);
  kbLiveTimer=setTimeout(function(){streamKbToLive(text)},500);
}

// R697: KB 流式响应（说话中即时返回匹配词条）
function streamKbToLive(query){
  var card=document.getElementById('kb-live-card');
  var qEl=document.getElementById('kbLiveQuery');
  var box=document.getElementById('kbLiveResults');
  if(!card||!box)return;
  card.style.display='block';
  qEl.textContent='🔍 '+query.slice(0,60);
  // 简短查询直接查，长查询取最近 30 字（聚焦最新意图）
  var q=query.length>30?query.slice(-30):query;
  fetch(API+'/api/public/kb-search?q='+encodeURIComponent(q)+'&module=tcm&limit=3',{signal:AbortSignal.timeout(8000)})
  .then(function(r){return r.json()})
  .then(function(d){
    var results=(d&&d.data&&d.data.results)||[];
    if(!results.length){qEl.textContent='🔍 '+query.slice(0,60)+' · 暂无直接匹配';return}
    // 流式追加卡片（保留最近 6 条）
    var item=document.createElement('div');
    item.style.cssText='background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.18);border-radius:8px;padding:8px 10px;font-size:12px';
    item.innerHTML='<div style="color:var(--gold2,#c9a84c);font-weight:600;margin-bottom:4px">'+escapeHtml(results[0].title||'').slice(0,50)+'</div>'+'<div style="color:var(--text);opacity:.85;line-height:1.6">'+escapeHtml((results[0].snippet||results[0].summary||'').slice(0,110))+'</div>';
    box.insertBefore(item,box.firstChild);
    kbCardCount++;
    while(box.children.length>6)box.removeChild(box.lastChild);
    qEl.textContent='🔍 '+query.slice(0,60)+' · 命中 '+results.length+' 条';
    // 实时预判：命中≥2 条且含症状词 → 提示可提前分析
    if(results.length>=2 && /失眠|头痛|胃|咳嗽|痛|虚|湿|热|寒|痒|胀/.test(q)){
      qEl.textContent=qEl.textContent+' · 可提前分析 ✓';
      document.getElementById('transcript-card').style.display='block';
    }
  })
  .catch(function(){});
}

function stopRecognition(){
  if(recognition){try{recognition.stop()}catch(e){}recognition=null}
  if(silenceTimer){clearTimeout(silenceTimer);silenceTimer=null}
  if(kbLiveTimer){clearTimeout(kbLiveTimer);kbLiveTimer=null}
  if(finalText){
    document.getElementById('transcript').textContent=finalText;
  }else{
    document.getElementById('transcript').textContent='未识别到语音内容，请手动输入或重新录音';
    document.getElementById('transcript').innerHTML='<textarea id="manual-text" aria-label="手动输入" style="min-height:80px" placeholder="请手动输入症状描述..."></textarea>';
  }
}

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function clearAll(){
  if(mediaStream){mediaStream.getTracks().forEach(function(t){t.stop()})}
  isRecording=false;
  if(recTimer)clearInterval(recTimer);
  recordedBlob=null;
  finalText='';
  document.getElementById('rec-btn').className='rec-btn idle';
  document.getElementById('rec-icon').textContent='🎤';
  document.getElementById('timer').textContent='00:00';
  document.getElementById('rec-hint').textContent='点击开始录音';
  document.getElementById('transcript-card').style.display='none';
  document.getElementById('extract-card').style.display='none';
  document.getElementById('transcript').textContent='正在转写...';
}

// ========== 自动提取 ==========
var SYMPTOM_WORDS=['痛','疼','酸','麻','胀','晕','失眠','多梦','咳嗽','痰','胸闷','心悸','胃','反酸','食欲','便秘','腹泻','乏力','疲劳','出汗','怕冷','怕热','口干','口苦','头痛','发热','痒','肿','炎症','结节','月经','白带','尿','大便','气短','喘'];
var BIRTH_PATTERN=/(\d{4})年(\d{1,2})月(\d{1,2})日(?:[上下]?午)?(\d{1,2})?[点时]/;
var QUERY_WORDS=['事业','工作','财运','感情','婚姻','健康','学业','考试','求职','搬家','出行','诉讼','官司','投资','开店'];

// R697: 提取逻辑抽成独立函数（实时语音模式边说话边调用）
// silent=true 时不滚动、不弹卡（由 onresult 节流触发）
function previewExtract(text, silent){
  if(!text||text.length<3)return;
  // 提取症状
  var symptoms=new Set();
  SYMPTOM_WORDS.forEach(function(w){
    if(text.indexOf(w)>=0)symptoms.add(w);
  });
  var symptomStr=Array.from(symptoms).join('、');
  if(!symptomStr)symptomStr=text.slice(0,50);
  
  // 提取出生时间
  var birthMatch=text.match(BIRTH_PATTERN);
  var birth=null;
  if(birthMatch){
    birth={year:birthMatch[1],month:birthMatch[2],day:birthMatch[3],hour:birthMatch[4]||''};
  }
  
  // 提取问事
  var queryWords=QUERY_WORDS.filter(function(w){return text.indexOf(w)>=0});
  var queryStr=queryWords.length?queryWords.slice(0,3).join('、'):'综合';
  
  // 渲染标签
  var tags='';
  Array.from(symptoms).slice(0,8).forEach(function(s){tags+='<span class="tag symptom">'+s+'</span>'});
  if(birth)tags+='<span class="tag birth">出生：'+birth.year+'年'+birth.month+'月'+birth.day+'日'+(birth.hour?' '+birth.hour+'时':'')+'</span>';
  queryWords.forEach(function(q){tags+='<span class="tag query">'+q+'</span>'});
  var tp=document.getElementById('tag-preview');
  if(tp)tp.innerHTML=tags;
  
  var symEl=document.getElementById('symptoms');
  if(symEl)symEl.value=symptomStr;
  if(birth){
    var by=document.getElementById('birth-year');if(by)by.value=birth.year;
    var bm=document.getElementById('birth-month');if(bm)bm.value=birth.month;
    var bd=document.getElementById('birth-day');if(bd)bd.value=birth.day;
    var bh=document.getElementById('birth-hour');if(bh)bh.value=birth.hour;
  }
  var ec=document.getElementById('extract-card');
  if(ec)ec.style.display='block';
  if(!silent&&ec)ec.scrollIntoView({behavior:'smooth'});
}

function analyzeText(){
  var text=finalText;
  var manual=document.getElementById('manual-text');
  if(manual&&manual.value)text=manual.value;
  if(!text||text.length<3){showToast('请先输入或录制语音内容');return}
  previewExtract(text,false);
}

// ========== 提交 ==========
function submitConsult(){
  var symptoms=document.getElementById('symptoms').value;
  var constitution=document.getElementById('constitution').value;
  if(!symptoms){showToast('请填写症状');return}
  
  var body={symptoms:symptoms,constitution:constitution};
  var y=document.getElementById('birth-year').value;
  if(y)body.birthYear=Number(y);
  
  fetch(API+'/api/clinic/submit-symptom', {signal: AbortSignal.timeout(15000), method:'POST',headers:authHeaders(),body:JSON.stringify(body)})
  .then(function(r){return r.json()}).then(function(d){
    if(d.ok||d.caseId){
      document.getElementById('result-info').innerHTML='✅ 问诊提交成功！<br>案例号：'+(d.caseId||'')+'<br>已进入周易大师分析队列，随后由中医医生辨证处方。';
      document.getElementById('extract-card').style.display='none';
      document.getElementById('result-card').style.display='block';
      document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
    }else{
      showToast('提交失败：'+(d.error||d.message||'请先登录'));
    }
  }).catch(function(e){showToast('网络错误：'+esc(e.message))});
}

// 初始化：有 token 才显示完整流程
document.addEventListener('DOMContentLoaded',function(){
  if(!token){
    document.getElementById('rec-hint').textContent='提示：未登录，录音仍可用但提交需登录';
  }
});
