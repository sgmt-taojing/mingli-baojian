<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>KB 知识库管理面板 - 命理宝鉴</title>

  <link rel="stylesheet" href="css/a11y-fix.css">
<link rel="stylesheet" href="css/admin-kb-panel-inline.css">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
<main id="main-content" role="main">
<h1>📚 KB 知识库管理面板</h1>
<p class="kb-meta">实时统计 · 自动同步 · 命中追踪</p>
<div class="tabs">
  <ml-tap class="tab active" onclick="loadStats()" style="display:block"总览</ml-tap>
  <ml-tap class="tab" onclick="loadSearch()" style="display:block"搜索</ml-tap>
  <ml-tap class="tab" onclick="loadHits()" style="display:block"命中统计</ml-tap>
</div>
<input  id="searchBox" class="search-box" placeholder="搜索 KB 条目..." style="display:none" aria-label="搜索 KB 条目...">
<div id="statsPanel">
  <div class="kb-grid" id="kbGrid">加载中...</div>
</div>
<div id="searchPanel" style="display:none"></div>
<div id="hitsPanel" style="display:none"></div>

  <script src="js/a11y-divination-hub.js" defer></script>
  
</main>
<script src="js/admin-kb-panel-inline.js" defer></script>
</body>
</html>
