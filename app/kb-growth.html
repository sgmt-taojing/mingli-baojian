<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KB 增长时间线 · 命理宝鉴</title>
<link rel="stylesheet" href="css/a11y-fix.css">
<style>
:root{--c-bg:#0e1116;--c-panel:#161b22;--c-bd:#30363d;--c-text:#c9d1d9;--c-muted:#8b949e;--c-accent:#58a6ff;--c-success:#3fb950;--c-warn:#d29922;--c-purple:#bc8cff}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--c-bg);color:var(--c-text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:24px;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto}
h1{font-size:24px;margin-bottom:8px}
.muted{color:var(--c-muted);font-size:13px;margin-bottom:20px}
.panel{background:var(--c-panel);border:1px solid var(--c-bd);border-radius:8px;padding:20px;margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--c-panel);border:1px solid var(--c-bd);border-radius:8px;padding:16px}
.card .l{color:var(--c-muted);font-size:12px;margin-bottom:4px}
.card .v{font-size:22px;font-weight:600;color:var(--c-accent)}
.chart{position:relative;height:300px;margin-top:16px}
.chart svg{width:100%;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:12px}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:16px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--c-bd)}
th{color:var(--c-muted);font-weight:500}
.bar{height:8px;background:var(--c-bd);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-accent),var(--c-purple));border-radius:4px}
@media(max-width:768px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
@media(max-width:320px){.cards{grid-template-columns:1fr}}
</style>
<link rel="stylesheet" href="css/mobile-nav.css">
</head>
<body>
<div class="wrap">
<h1>📈 KB 增长时间线</h1>
<p class="muted">kb_formal 表按 promoted_at 聚合的每日新增 · 模块分布 · 累计趋势</p>

<div class="cards" id="summary"></div>

<div class="panel">
<h2 style="font-size:16px;margin-bottom:12px">累计增长曲线</h2>
<div class="chart" id="cumChart"></div>
</div>

<div class="panel">
<h2 style="font-size:16px;margin-bottom:12px">每日新增堆叠（按模块）</h2>
<div class="chart" id="dayChart"></div>
<div class="legend" id="legend"></div>
</div>

<div class="panel">
<h2 style="font-size:16px;margin-bottom:12px">模块总贡献 Top 15</h2>
<table id="modTable"><thead><tr><th>#</th><th>模块</th><th>总条数</th><th>占比</th></tr></thead><tbody></tbody></table>
</div>
</div>

<script>
const COLOR_POOL = ['#58a6ff','#3fb950','#d29922','#bc8cff','#f78166','#ff7b72','#79c0ff','#56d4dd','#e3b341','#db61a2','#a371f7','#7ee787','#ffa657','#f0883e','#8ddb8c'];

async function load(){
  const r = await fetch('/api/kb/growth-history');
  const d = await r.json();
  if(!d.ok) return;
  const days = d.days;
  const byModDay = d.byModDay;
  
  // 汇总卡片
  const total = days[days.length-1]?.total || 0;
  const first = days[0]?.day || '';
  const dailyAvg = Math.round(days.reduce((s,x)=>s+x.daily,0) / days.length);
  const topMod = Object.entries(d.topMods).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('summary').innerHTML = `
    <div class="card"><div class="l">KB 总条目</div><div class="v">${total.toLocaleString()}</div></div>
    <div class="card"><div class="l">起始日期</div><div class="v" style="font-size:16px">${first}</div></div>
    <div class="card"><div class="l">日均新增</div><div class="v">${dailyAvg.toLocaleString()}</div></div>
    <div class="card"><div class="l">最大模块</div><div class="v" style="font-size:16px">${topMod[0]} · ${topMod[1]}</div></div>
  `;
  
  drawCumCurve(days);
  drawDayStack(days, byModDay, d.topMods);
  drawModTable(d.topMods, total);
}

function drawCumCurve(days){
  const c = document.getElementById('cumChart');
  const W = c.clientWidth, H = 300, pad = {l:50,r:20,t:20,b:40};
  const xs = days.map((_,i)=> pad.l + (W-pad.l-pad.r) * i/(days.length-1));
  const maxV = days[days.length-1].total;
  const ys = days.map(d=> H-pad.b - (H-pad.t-pad.b) * d.total/maxV);
  
  const line = days.map((d,i)=> `${i?'L':'M'}${xs[i]},${ys[i]}`).join(' ');
  const area = line + ` L${xs[xs.length-1]},${H-pad.b} L${xs[0]},${H-pad.b} Z`;
  const dots = days.map((d,i)=> `<circle cx="${xs[i]}" cy="${ys[i]}" r="4" fill="#58a6ff"/><text x="${xs[i]}" y="${ys[i]-10}" fill="#c9d1d9" font-size="11" text-anchor="middle">${d.total}</text>`).join('');
  
  const labels = days.map((d,i)=> `<text x="${xs[i]}" y="${H-pad.b+18}" fill="#8b949e" font-size="11" text-anchor="middle">${d.day.slice(5)}</text>`).join('');
  
  c.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="grad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#grad)"/>
    <path d="${line}" fill="none" stroke="#58a6ff" stroke-width="2"/>
    ${dots}${labels}
  </svg>`;
}

function drawDayStack(days, byModDay, topMods){
  const c = document.getElementById('dayChart');
  const W = c.clientWidth, H = 300, pad = {l:50,r:20,t:20,b:40};
  const sortedMods = Object.entries(topMods).sort((a,b)=>b[1]-a[1]).slice(0, 10).map(([m])=>m);
  const maxV = Math.max(...days.map(d=>d.daily));
  const bw = (W-pad.l-pad.r) / days.length;
  
  let svg = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  days.forEach((day, i)=>{
    const x = pad.l + i*bw;
    let cum = 0;
    sortedMods.forEach((mod, mi)=>{
      const c2 = (byModDay[day.day]||{})[mod] || 0;
      if(!c2) return;
      const h = (H-pad.t-pad.b) * c2 / maxV;
      const y = H-pad.b - cum - h;
      cum += h;
      svg += `<rect x="${x+bw*0.15}" y="${y}" width="${bw*0.7}" height="${h}" fill="${COLOR_POOL[mi%COLOR_POOL.length]}" opacity="0.85"><title>${mod}: ${c2}</title></rect>`;
    });
    svg += `<text x="${x+bw/2}" y="${H-pad.b+18}" fill="#8b949e" font-size="11" text-anchor="middle">${day.day.slice(5)}</text>`;
    svg += `<text x="${x+bw/2}" y="${H-pad.b-4}" fill="#c9d1d9" font-size="11" text-anchor="middle">${day.daily}</text>`;
  });
  svg += `</svg>`;
  c.innerHTML = svg;
  
  document.getElementById('legend').innerHTML = sortedMods.map((m,i)=> 
    `<span><i style="background:${COLOR_POOL[i%COLOR_POOL.length]}"></i>${m}</span>`
  ).join('');
}

function drawModTable(topMods, total){
  const sorted = Object.entries(topMods).sort((a,b)=>b[1]-a[1]).slice(0, 15);
  const tbody = document.querySelector('#modTable tbody');
  tbody.innerHTML = sorted.map(([m,c],i)=> `
    <tr><td>${i+1}</td><td>${m}</td><td>${c.toLocaleString()}</td>
    <td><div class="bar"><i style="width:${(c/total*100).toFixed(1)}%"></i></div><small style="color:var(--c-muted)">${(c/total*100).toFixed(1)}%</small></td></tr>
  `).join('');
}

window.addEventListener("DOMContentLoaded", () => { if (typeof window.fetch !== "undefined") load(); });
</script>
<script src="js/mobile-nav.js" defer></script>

<style>
/* R98-s 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>

<style>
/* R98-s 480+360 紧凑断点 */
@media(max-width:480px){
  body{font-size:13px}
  .container,.main,.body,.wrap{max-width:100%;padding:8px}
  h1{font-size:18px}
  h2{font-size:15px}
  h3{font-size:13px}
  .btn{padding:6px 10px;font-size:12px}
  table{font-size:11px}
  .row{flex-wrap:wrap;gap:4px}
}
@media(max-width:360px){
  body{font-size:12px}
  .container,.main,.body,.wrap{padding:6px}
  h1{font-size:16px}
  h2{font-size:14px}
  h3{font-size:12px}
  .btn{padding:5px 8px;font-size:11px;width:100%}
  table{font-size:10px}
  .nav-bar a{padding:4px 6px;font-size:11px}
  .row{flex-direction:column;align-items:flex-start}
}
</style>
</body>
</html>
