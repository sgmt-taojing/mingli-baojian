<button onclick="generateFullReport('ziwei')" style="margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,#ffb44d,#ff7e5f);color:#0f1820;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;letter-spacing:2px">📜 出具紫微斗数报告</button>
<script>
async function generateFullReport(mod){
  try{
    const inputs = {};
    document.querySelectorAll('input,select').forEach(el=>{
      const m = el.id && el.id.match(/^[a-z]+-(.+)$/);
      if(m) if(el.type==='number' && el.value) inputs[m[1]] = +el.value;
        else inputs[m[1]] = el.value;
    });
    if(inputs.lunar===undefined) inputs.lunar = (window.zwCalMode==='lunar') || (window.lrCalMode==='lunar');
    inputs.leapMonth = document.getElementById('zw-leap')?.checked || false;
  if(inputs.leapMonth===undefined) inputs.leapMonth = false;
    
    const csrfRes = await fetch(API_BASE+'/api/csrf-token',{signal:AbortSignal.timeout(15000),headers:{'X-Skip-Interceptor':'1'}}).then(r=>r.json()).catch(()=>({csrfToken:''}));
    const csrf = csrfRes.csrfToken || csrfRes.token || '';
    
    const r = await fetch(API_BASE+'/api/paipan/'+mod+'/report', { signal: AbortSignal.timeout(15000),
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRF-Token':csrf,'X-Skip-Interceptor':'1'},
      body: JSON.stringify({
        ...inputs,
        questions: [inputs.question||''].filter(Boolean),
        options: { name: inputs.name||'缘主' }
      }), signal: AbortSignal.timeout(15000) }).then(r=>r.json());
    
    if(!r.ok){
      const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
      fn('报告生成失败：'+((r.message&&r.message!=='未知错误'?r.message:'')||r.error||'请检查输入')+(Array.isArray(r.missing)&&r.missing.length?('（缺少：'+r.missing.join('、')+'）'):(r.data&&Array.isArray(r.data.missing)&&r.data.missing.length?('（缺少：'+r.data.missing.join('、')+'）'):'')));
      return;
    }
    
    // R-DZ-TONGYUAN-RPT（2026-10-10）：生辰透传随报告走，报告页双源同参卡凭此复算道藏盘（服务端不存盘，前端自携带）
    r.birthPayload = {year:inputs.year, month:inputs.month, day:inputs.day, hour:inputs.hour, minute:30,
      sex:inputs.sex||'', isLunar:inputs.lunar===true||inputs.lunar==='true', leapMonth:!!inputs.leapMonth, name:inputs.name||''};
    // 保存报告到 sessionStorage，跳到报告展示页
    sessionStorage.setItem('lastReport', JSON.stringify(r));
    window.location.href = 'report-interpret.html?module='+mod+'&name='+encodeURIComponent(inputs.name||'缘主');
  }catch(e){
    const fn = typeof showToast==='function'?showToast:typeof toast==='function'?toast:alert;
    fn('生成失败：'+esc(e.message));
    console.error(e);
  }
}
</script>

<script>
const API_BASE=(location.hostname==='127.0.0.1'||location.hostname==='localhost')?'http://127.0.0.1:8920':'';
// 兼容护栏：escape-html.js 为 defer 脚本，导出 escHtml 而未导出裸 esc；本页历史代码用 esc()，待 defer 脚本就绪后兜底（2026-09-28）
window.addEventListener('DOMContentLoaded',function(){if(typeof window.esc==='undefined'&&typeof window.escHtml==='function')window.esc=window.escHtml;});
async function doPaipan(){
  const y=document.getElementById('zw-year').value;
  const m=document.getElementById('zw-month').value;
  const d=document.getElementById('zw-day').value;
  const h=document.getElementById('zw-hour').value;
  const s=document.getElementById('zw-sex').value;
  const lngEl = document.getElementById('zw-lng');
  const lng = lngEl ? (+lngEl.value || 121.47) : 121.47;
  if(!y||!m||!d||h===''){showToast('请填写完整的年月日时');return;}
  const name = document.getElementById('zw-name').value || '';
  const isLunar = zwCalMode === 'lunar';
  const leap = isLunar ? document.getElementById('zw-leap').checked : false;
  const tyEl = document.getElementById('zw-target-year');
  const targetYear = tyEl ? (+tyEl.value || new Date().getFullYear()) : new Date().getFullYear();
  const now = new Date();
  const currentAge = now.getFullYear() - +y;
  const payload = {year:+y,month:+m,day:+d,hour:+h,minute:30,sex:s,name,isLunar,leapMonth:leap,lng,targetYear,currentAge};
  let rJson, rSvg;
  try {
    [rJson, rSvg] = await Promise.all([
      fetch(API_BASE+'/api/paipan/ziwei',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(payload)}),
      proFetch(API_BASE+'/api/paipan/ziwei/svg',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(15000),body:JSON.stringify(payload)})
    ]);
  } catch(e) {
    showToast('排盘请求失败：' + (e && esc(e.message) || '网络异常') + '，请重试','err');
    return;
  }
  const data = await rJson.json();
  if(!data.ok){showToast('排盘失败: '+data.error);return;}
  const svg = await rSvg.text();
  window._zwSvgText = svg;                 // R-DZ-SVGPAIR：通行盘 SVG 留存，双盘对拍复用免再请求
  window._zwPayload = payload;
  renderChart(data.chart);
  if(window.PaipanNav) PaipanNav.notifyChart(data.chart);
  if(window.PaipanBaihua) PaipanBaihua.notify('ziwei', payload);
  renderSvg(svg);
  renderFlow(data.flow, targetYear, currentAge);
  renderGujin(data.chart);
  renderShuangyuan(data.chart, payload);   // R-DZ-TONGYUAN：道藏本双源同参
  if(data.ziweiReference) renderZiweiCanon(data.ziweiReference);   // R-ZW-CANON：主星諸星問答論引证
  if(data.interpretation) renderInterpretation(data.interpretation);
}

// R-ZW-CANON：命宫主星 → 紫微全书卷一諸星問答論原典引证卡
function renderZiweiCanon(ref){
  const old = document.getElementById('zw-canon-host');
  if(old) old.remove();
  if(!ref || !ref.stars || !ref.stars.length) return;
  const host = document.createElement('div');
  host.id = 'zw-canon-host';
  host.style.cssText = 'max-width:800px;margin:12px auto;padding:12px;background:var(--card,#141928);border:1px solid rgba(125,211,192,.25);border-left:3px solid #7dd3c0;border-radius:8px;font-size:12px;color:var(--paper,#e8dcc8)';
  let items = '';
  ref.stars.forEach(function(it){
    items += '<div style="margin-top:8px"><div style="font-size:12px;color:#7dd3c0">《紫微斗数全书》<span style="opacity:.55;font-size:11px">　'+esc(it.title||'')+'</span></div>'+
      '<div style="font-size:12px;line-height:1.9;opacity:.85">'+esc(it.quote||'')+'</div></div>';
  });
  host.innerHTML = '<div style="color:#7dd3c0;font-weight:600;margin-bottom:6px">📜 命宫主星 · 諸星問答論引证（命宫 '+esc(ref.mingGong||'')+' · '+esc(ref.wuxingJu||'')+'）</div>'+
    items+
    '<div style="margin-top:8px;font-size:11px;opacity:.5">原文照录'+esc(ref.source||'紫微斗数全书·卷一')+'，未作改写。</div>';
  const gujin = document.getElementById('zw-gujin-host');
  if(gujin && gujin.parentNode) gujin.parentNode.insertBefore(host, gujin);
  else { const main = document.querySelector('main') || document.body; main.appendChild(host); }
}

// ═══ 古今同参：康节本卷四古命例按五行局+命宫主星匹配（2026-09-28） ═══
async function renderGujin(chart){
  const old = document.getElementById('zw-gujin-host');
  if(old) old.remove();
  if(!chart || !chart.wuxingJu) return;
  const mg = (chart.palaces||[]).find(function(p){return p.isMingGong;}) || {};
  const myStars = (mg.mainStars||[]).map(function(s){return typeof s==='string'?s:(s&&(s.name||s.star))||'';}).filter(Boolean);
  // 格局级同参（2026-10-10）：整盘上传，服务端按命宫+三方四正+身宫+同局评分
  const myPalaces = (chart.palaces||[]).map(function(p){return {name:p.name,mainStars:(p.mainStars||[]).map(function(s){return typeof s==='string'?s:(s&&(s.name||s.star))||'';}).filter(Boolean),isMingGong:!!p.isMingGong,isShenGong:!!p.isShenGong};});
  let data;

      '</div>';

  host.innerHTML = '<div style="color:var(--gold,#c9a84c);font-weight:600;margin-bottom:6px">📖 古今同参 · '+esc(data.mingju)+' · '+subtitle+'古人同局命例 '+data.total+' 则</div>'+

// ═══ 双源同参：康节本（通行十四主星）× 道藏本（十八飞星杖锚）同盘对照（2026-10-10 R-DZ-TONGYUAN） ═══

      body:JSON.stringify({year:payload.year,month:payload.month,day:payload.day,hour:payload.hour,minute:payload.minute||30,sex:payload.sex,isLunar:payload.isLunar,leapMonth:payload.leapMonth})});

  const txShen = (chart.palaces||[]).find(function(p){return p.isShenGong;}) || {};
  const txMingZhi = txMing.ganZhi ? txMing.ganZhi.slice(-1) : '?';

  const txMingStars = (txMing.mainStars||[]).join('、') || '（无主星）';
  const dzMingP = dz.palaces.find(function(p){return p.isMing;}) || {stars:[]};
  const dzShenP = dz.palaces.find(function(p){return p.isShen;}) || {stars:[]};
  const dzMingStars = dzMingP.stars.map(function(s){return s.name;}).join('、') || '（无星躔）';
  const dzShenStars = dzShenP.stars.map(function(s){return s.name;}).join('、') || '（无星躔）';
  const mingDiff = txMingZhi !== dz.anchors.ming, shenDiff = txShenZhi !== dz.anchors.shen;
  const g = dz.geju;
  const row = function(label, tx, dzv, diff){
    return '<tr><td style="padding:5px 8px;color:var(--paper3);white-space:nowrap;border-top:1px solid var(--border,#2a3450)">'+label+'</td>'+
      '<td style="padding:5px 8px;border-top:1px solid var(--border,#2a3450)">'+tx+'</td>'+
      '<td style="padding:5px 8px;border-top:1px solid var(--border,#2a3450);color:'+(diff?'var(--gold,#c9a84c)':'inherit')+'">'+dzv+(diff?' <span style="font-size:10px;color:#e0a34c">异</span>':' <span style="font-size:10px;color:var(--jade,#4ec9b0)">同</span>')+'</td></tr>';
  };

  host.style.cssText = 'max-width:800px;margin:12px auto;padding:12px;background:var(--card,#141928);border:1px solid rgba(125,211,192,.25);border-left:3px solid var(--gold,#c9a84c);border-radius:8px;font-size:12px;color:var(--paper,#e8dcc8)';
  host.innerHTML = '<div style="color:var(--gold,#c9a84c);font-weight:600;margin-bottom:6px">⚖️ 双源同参 · 康节本（通行紫微）× 道藏本（十八飞星）'+(dz.derived?'<span style="font-size:10px;color:var(--paper3);font-weight:400;margin-left:8px">道藏盘依 '+esc(dz.derived.lunarDate)+' '+esc(dz.derived.yearGanZhi)+'年 起例</span>':'')+'</div>'+
    '<table style="width:100%;border-collapse:collapse;font-size:12px">'+
    '<tr style="color:var(--paper3);font-size:11px"><td style="padding:2px 8px"></td><td>康节本（'+esc(chart.wuxingJu||'')+'）</td><td>道藏本（杖锚 '+esc(dz.anchors.zhang)+'）</td></tr>'+
    row('命宫', esc(txMingZhi)+'宫（'+esc(txMingStars)+'）', esc(dz.anchors.ming)+'宫（'+esc(dzMingStars)+'）', mingDiff)+
    row('身宫', esc(txShenZhi)+'宫', esc(dz.anchors.shen)+'宫（'+esc(dzShenStars)+'）', shenDiff)+
    '</table>'+
    (g?'<div style="margin-top:8px;border-top:1px dashed var(--border,#2a3450);padding-top:8px">道藏五等判级：<b style="color:'+(g.grade.redline?'var(--red,#e06c75)':'var(--gold,#c9a84c)')+'">'+esc(g.grade.name)+'</b><span style="color:var(--paper3);font-size:11px;margin-left:8px">'+esc(g.zhouye.text)+'</span></div>':'')+
    '<div style="margin-top:8px"><a href="javascript:void(0)" onclick="toggleShuangyuanSvg()" style="color:#e0a34c;text-decoration:none;border-bottom:1px dashed #e0a34c;font-size:11px">🖼️ 双盘图对拍（点开同屏对比两系盘图）</a></div>'+
    '<div id="zw-sy-svgpair" style="display:none;margin-top:8px"></div>'+
    '<div style="color:var(--paper3);font-size:10px;margin-top:8px;line-height:1.7">两系不同源（紫微为锚 vs 杖星为锚），命宫异位属体系差异而非错误，对照为版本互证；道藏盘含三处存疑规则（安命读法/宫布方向/干阴阳异文），详见 <a href="daozang-duan.html" style="color:#e0a34c;text-decoration:none;border-bottom:1px dashed #e0a34c">道藏研究端</a>。凶断存真仅供研究。</div>';
  const gujin = document.getElementById('zw-gujin-host');
  if(gujin && gujin.parentNode) gujin.parentNode.insertBefore(host, gujin.nextSibling);
  else { const fl = document.getElementById('zw-flow-host'); if(fl && fl.parentNode) fl.parentNode.insertBefore(host, fl.nextSibling); else document.body.appendChild(host); }
}

// R-DZ-SVGPAIR：双盘图对拍——通行盘 SVG 复用排盘时留存，道藏盘图按同生辰现取，同屏并排
async function toggleShuangyuanSvg(){
  const box = document.getElementById('zw-sy-svgpair');
  if(!box) return;
  if(box.dataset.loaded === '1'){ box.style.display = box.style.display==='none' ? 'block' : 'none'; return; }
  const payload = window._zwPayload;
  if(!payload){ box.style.display='block'; box.innerHTML='<div style="font-size:11px;color:var(--paper3)">缺生辰参数，请先排盘。</div>'; return; }
  box.style.display = 'block';
  box.innerHTML = '<div style="font-size:11px;color:var(--paper3)">盘图绘制中…</div>';
  let dzSvg = '';
  try {
    const r = await fetch(API_BASE+'/api/daozang/paipan/svg',{method:'POST',headers:{'Content-Type':'application/json','X-Skip-Interceptor':'1'},signal:AbortSignal.timeout(10000),
      body:JSON.stringify({year:payload.year,month:payload.month,day:payload.day,hour:payload.hour,minute:payload.minute||30,sex:payload.sex,isLunar:payload.isLunar,leapMonth:payload.leapMonth})});
    if(r.ok) dzSvg = await r.text();
  } catch(e) {}
  const txSvg = window._zwSvgText || '';
  const svgOk = function(s){ return /^\s*(<\?xml[^>]*\?>)?\s*<svg/.test(s||''); };
  const cell = function(title, svg){
    return '<div style="flex:1;min-width:280px;background:#0a0e17;border:1px solid var(--border,#2a3450);border-radius:8px;padding:6px;text-align:center">'+
      '<div style="font-size:11px;color:var(--gold,#c9a84c);margin-bottom:4px">'+title+'</div>'+
      (svgOk(svg) ? svg.replace('<svg ','<svg style="width:100%;height:auto" ') : '<div style="font-size:11px;color:var(--paper3);padding:30px 0">盘图不可用（通行盘图需 pro 权限）</div>')+'</div>';
  };
  box.innerHTML = '<div style="display:flex;gap:8px;flex-wrap:wrap">'+cell('康节本 · 通行紫微', txSvg)+cell('道藏本 · 十八飞星', dzSvg)+'</div>';
  box.dataset.loaded = '1';
}

var BRIGHT={
 '紫微':['旺','旺','得','旺','庙','庙','旺','旺','得','旺','平','庙'],
 '天机':['得','旺','利','平','庙','陷','得','旺','利','平','庙','陷'],
 '太阳':['旺','庙','旺','旺','旺','得','得','陷','不','陷','陷','不'],
 '武曲':['得','利','庙','平','旺','庙','得','利','庙','平','旺','庙'],
 '天同':['利','平','平','庙','陷','不','旺','平','平','庙','旺','不'],
 '廉贞':['庙','平','利','陷','平','利','庙','平','利','陷','平','利'],
 '天府':['庙','得','庙','得','旺','庙','得','旺','庙','得','庙','庙'],
 '太阴':['旺','陷','陷','陷','不','不','利','不','旺','庙','庙','庙'],
 '贪狼':['平','利','庙','陷','旺','庙','平','利','庙','陷','旺','庙'],
 '巨门':['庙','庙','陷','旺','旺','不','庙','庙','陷','旺','旺','不'],
 '天相':['庙','陷','得','得','庙','得','庙','陷','得','得','庙','庙'],
 '天梁':['庙','庙','庙','陷','庙','旺','陷','得','庙','陷','庙','旺'],
 '七杀':['庙','旺','庙','平','旺','庙','庙','庙','庙','平','旺','庙'],
 '破军':['得','陷','旺','平','庙','旺','得','陷','旺','平','庙','旺'],
 '文昌':['陷','利','得','庙','陷','利','得','庙','陷','利','得','庙'],
 '文曲':['平','旺','得','庙','陷','旺','得','庙','陷','旺','得','庙'],
 '火星':['庙','利','陷','得','庙','利','陷','得','庙','利','陷','得'],
 '铃星':['庙','利','陷','得','庙','利','陷','得','庙','利','陷','得'],
 '擎羊':['','陷','庙','','陷','庙','','陷','庙','','陷','庙'],
 '陀罗':['陷','','庙','陷','','庙','陷','','庙','陷','','庙']
};
var BC_CLS={'庙':'b-miao','旺':'b-wang','得':'b-de','利':'b-li','平':'b-ping','不':'b-bu','陷':'b-xian'};
var ZW_POS={5:'1/1',6:'1/2',7:'1/3',8:'1/4',4:'2/1',9:'2/4',3:'3/1',10:'3/4',2:'4/1',1:'4/2',0:'4/3',11:'4/4'};
var ZHI='子丑寅卯辰巳午未申酉戌亥';
var _zwChart=null,_zwLayer='natal',_zwSel=-1;

function zwSihuaMap(){
  var sh=null;
  if(_zwLayer==='natal')sh=_zwChart&&_zwChart.siHua;
  else if(_zwLayer==='daxian')sh=window._zwFlow&&window._zwFlow.currentDaXian&&window._zwFlow.currentDaXian.siHua;
  else if(_zwLayer==='liunian')sh=window._zwFlow&&window._zwFlow.liuNian&&window._zwFlow.liuNian.siHua;
  var m={};
  if(sh){if(sh.lu)m[sh.lu]='禄';if(sh.quan)m[sh.quan]='权';if(sh.ke)m[sh.ke]='科';if(sh.ji)m[sh.ji]='忌';}
  return m;
}
function zwB(star,branch){var a=BRIGHT[star];if(!a)return '';return a[(branch+10)%12]||'';}
function zwStar(star,branch,shMap,cls){
  var b=zwB(star,branch),sh=shMap[star]||'';
  var h='<span class="zw-star '+cls+'">'+star;
  if(b)h+='<i class="zb '+BC_CLS[b]+'">'+b+'</i>';
  if(sh)h+='<i class="zs zs-'+sh+'">'+sh+'</i>';
  return h+'</span>';
}
function zwLayerBtn(id,label){
  return '<button class="'+(_zwLayer===id?'on':'')+'" onclick="zwSetLayer(\''+id+'\')">'+label+'</button>';
}
function zwSetLayer(l){_zwLayer=l;buildPro();}
function zwSelPalace(b){_zwSel=(_zwSel===b?-1:b);buildPro();}

function renderChart(c){
  _zwChart=c;
  const meta=document.getElementById('zw-meta');
  // 2026-10-16：真太阳时校正披露（经度默认 121.47°E，必须让用户看见校正值）
  const si=c.solarInfo;
  const solarHtml=(si&&si.applied)?'<br><span style="color:#7dd3c0;font-size:11px">【真太阳时】经度 '+esc(si.lng)+'°E · 校正 '+(si.correction_minutes>0?'+':'')+esc(si.correction_minutes)+' 分钟 → 真太阳时 '+si.true_hour+':'+('0'+si.true_minute).slice(-2)+'</span>':'';
  meta.innerHTML=`${c.yearGanZhi}年 · ${c.wuxingJu} · 命宫：${c.mingGong}<br>`+
    `<span>命主:${c.mingZhu||''}</span><span>身主:${c.shenZhu||''}</span>`+
    `<span>截空:${(c.jieKong||[]).join('、')}</span><span>旬空:${(c.xunKong||[]).join('、')}</span>`+solarHtml;
  buildPro();
}

function buildPro(){
  const c=_zwChart;if(!c)return;
  const fl=window._zwFlow||{};
  const shMap=zwSihuaMap();
  const grid=document.getElementById('zw-grid');
  grid.className='zw-grid pro';
  grid.innerHTML='';
  const byBranch={};
  c.palaces.forEach(p=>{byBranch[p.index]=p;});

  // 十二宫(地支固定方位)
  Object.keys(ZW_POS).forEach(function(bStr){
    const b=+bStr,p=byBranch[b]||{index:b,name:'',ganZhi:ZHI[b],mainStars:[]};
    const div=document.createElement('div');
    div.className='zw-gong pro';
    div.style.gridArea=ZW_POS[b];
    if(p.isMingGong)div.classList.add('ming');
    if(p.isShenGong)div.classList.add('shen');
    const dxNow=fl.currentDaXian&&fl.currentDaXian.palaceIdx===b;
    const lnNow=fl.liuNian&&ZHI[b]===fl.liuNian.zhi;
    if(dxNow)div.classList.add('dx-now');
    if(lnNow)div.classList.add('ln-now');
    if(_zwSel>=0){
      const grp=[_zwSel,(_zwSel+4)%12,(_zwSel+8)%12,(_zwSel+6)%12];
      div.classList.add(grp.indexOf(b)>=0?'sf-on':'sf-off');
    }
    let html='<div class="zw-gong-head"><span class="zw-gong-name">'+(p.name||'')+'</span>';
    if(p.isMingGong)html+='<span class="zw-gong-tag ming">命</span>';
    if(p.isShenGong)html+='<span class="zw-gong-tag shen">身</span>';
    if(lnNow)html+='<span class="zw-gong-ln">流年</span>';
    const dx=(c.daXian||[]).find(function(d){return d.palaceIdx===b;});
    if(dx)html+='<span class="zw-gong-dx">'+dx.startAge+'-'+dx.endAge+'</span>';
    if(p.name)html+='<span class="zw-tap" data-palace="'+p.name+'" title="点我出本宫白话解读">🔮</span>';
    html+='</div><div class="zw-stars">';
    const mains=p.mainStars||[];
    if(mains.length){
      mains.forEach(function(s){html+=zwStar(s,b,shMap,'main')+' ';});
    }else{
      const opp=byBranch[(b+6)%12];
      html+='<span class="zw-gong-kong">空宫·借对宫'+(opp&&(opp.mainStars||[]).join('')?'【'+(opp.mainStars||[]).join('')+'】':'')+'</span>';
    }
    (p.auxStars||[]).forEach(function(s){html+=zwStar(s,b,shMap,'aux')+' ';});
    (p.evilStars||[]).forEach(function(s){html+=zwStar(s,b,shMap,'evil')+' ';});
    (p.otherStars||[]).forEach(function(s){html+='<span class="zw-star other">'+s+'</span> ';});
    (p.changsheng||[]).forEach(function(s){html+='<span class="zw-star changsheng">'+s+'</span> ';});
    (p.boshi||[]).forEach(function(s){html+='<span class="zw-star boshi">'+s+'</span> ';});
    (p.jiangqian||[]).forEach(function(s){html+='<span class="zw-star jiangqian">'+s+'</span> ';});
    (p.suijian||[]).forEach(function(s){html+='<span class="zw-star suijian">'+s+'</span> ';});
    html+='</div>';
    html+='<div class="zw-gong-foot"><span>'+(p.ganZhi||ZHI[b])+'</span><span>'+(dx?dx.ganZhi+' 大限':'')+'</span></div>';
    div.innerHTML=html;
    div.addEventListener('click',function(){zwSelPalace(b);});
    grid.appendChild(div);
  });

  // R-TAP-Z：🔮徽标点读白话解读（capture 先拦，避免误触三方四正联动）
  if(!grid.dataset.tapBound){
    grid.dataset.tapBound='1';
    grid.addEventListener('click',function(ev){
      const t=ev.target&&ev.target.closest?ev.target.closest('.zw-tap'):null;
      if(!t||!grid.contains(t))return;
      ev.stopPropagation();ev.preventDefault();
      if(window.PaipanTap)PaipanTap.show({container:grid,anchor:t.closest('.zw-gong')||t,key:'zw'+t.dataset.palace,module:'ziwei',params:{palace:t.dataset.palace}});
    },true);
  }

  // 中央信息区
  const ctr=document.createElement('div');
  ctr.className='zw-center';
  ctr.style.gridArea='2/2/4/4';
  const dxC=fl.currentDaXian||{},ln=fl.liuNian||{};
  const shTxt=Object.keys(shMap).length?
    '化禄:<b style="color:#10b981">'+(shKey(shMap,'禄')||'—')+'</b> · 化权:<b style="color:#c9a84c">'+(shKey(shMap,'权')||'—')+'</b> · 化科:<b style="color:#63b3ed">'+(shKey(shMap,'科')||'—')+'</b> · 化忌:<b style="color:#ef4444">'+(shKey(shMap,'忌')||'—')+'</b>':'—';
  ctr.innerHTML='<div class="zc-t">紫微斗数 · 专业盘</div>'+
    '<div style="text-align:center">'+(c.yearGanZhi||'')+'年 · '+(c.wuxingJu||'')+'</div>'+
    '<div style="text-align:center">命宫 '+(c.mingGong||'')+' · 命主 '+(c.mingZhu||'')+' · 身主 '+(c.shenZhu||'')+'</div>'+
    '<div class="zw-layer">'+
      zwLayerBtn('natal','本命四化')+
      (dxC.siHua?zwLayerBtn('daxian','大限 '+(dxC.startAge||'')+'-'+(dxC.endAge||'')+'岁'):'')+
      (ln.siHua?zwLayerBtn('liunian','流年 '+(ln.year||'')+' '+(ln.ganZhi||'')):'')+
    '</div>'+
    '<div class="zw-sh-legend">'+shTxt+'</div>'+
    '<div class="zw-b-legend">亮度: <i class="zb b-miao">庙</i> <i class="zb b-wang">旺</i> <i class="zb b-de">得</i> <i class="zb b-li">利</i> <i class="zb b-ping">平</i> <i class="zb b-bu">不</i> <i class="zb b-xian">陷</i> · 点击宫位查看三方四正 · 点宫头 🔮 出本宫白话解读</div>';
  grid.appendChild(ctr);
  renderZwDetail();
}
function shKey(map,val){for(var k in map){if(map[k]===val)return k}return '';}

// 三方四正详情
function renderZwDetail(){
  let host=document.getElementById('zw-detail');
  if(!host){
    host=document.createElement('div');host.id='zw-detail';
    const grid=document.getElementById('zw-grid');
    grid.parentNode.insertBefore(host,grid.nextSibling);
  }
  const c=_zwChart;
  if(_zwSel<0||!c){host.className='';host.innerHTML='';return;}
  const b=_zwSel,byBranch={};
  c.palaces.forEach(p=>{byBranch[p.index]=p;});
  const shMap=zwSihuaMap();
  const roles=[[b,'本宫'],[(b+6)%12,'对宫'],[(b+4)%12,'三合'],[(b+8)%12,'三合']];
  let html='<div class="zd-t">三方四正 · '+ZHI[b]+'宫（'+(byBranch[b]?byBranch[b].name:'')+'）—— 再点一次取消</div>';
  roles.forEach(function(rb){
    const p=byBranch[rb[0]]||{name:'',ganZhi:ZHI[rb[0]],mainStars:[]};
    html+='<div class="zd-pal"><b>'+rb[1]+' · '+(p.name||'')+'宫（'+(p.ganZhi||ZHI[rb[0]])+'）</b> ';
    if(p.isMingGong)html+='<span class="zw-gong-tag ming">命</span> ';
    if((p.mainStars||[]).length){
      (p.mainStars||[]).forEach(function(s){html+=zwStar(s,rb[0],shMap,'main')+' ';});
    }else html+='<span class="zw-gong-kong">空宫</span> ';
    (p.auxStars||[]).forEach(function(s){html+=zwStar(s,rb[0],shMap,'aux')+' ';});
    (p.evilStars||[]).forEach(function(s){html+=zwStar(s,rb[0],shMap,'evil')+' ';});
    html+='</div>';
  });
  host.innerHTML=html;
  host.className='on';
}

function renderInterpretation(i){
  if(!i) return;
  const el=document.getElementById('paipan-interpretation')||(()=>{
    const d=document.createElement('div');
    d.id='paipan-interpretation';
    d.style.cssText='margin:16px 0;padding:16px;background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:12px';
    document.querySelector('.zw-grid,.qm-grid,.ly-grid,.lr-grid,.mh-grid,.fs-grid,main,body').appendChild(d);
    return d;
  })();
  let h='<div style="font-size:15px;font-weight:600;color:var(--gold,#c9a84c);margin-bottom:8px">📜 断盘解读</div>';
  if(i.summary) h+='<div style="font-size:13px;line-height:1.7;opacity:.9;margin-bottom:8px">'+i.summary+'</div>';
  if(i.advice) h+='<div style="font-size:13px;line-height:1.7;opacity:.75">'+i.advice+'</div>';
  if(i.guaJi) h+='<div style="font-size:12px;opacity:.6;margin-top:6px">卦象：'+i.guaJi+'</div>';
  el.innerHTML=h;
  el.style.display='block';
}
