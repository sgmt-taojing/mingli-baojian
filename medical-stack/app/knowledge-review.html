<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医学知识审核</title><style>body{font:16px system-ui;color:#173d38;background:#f4f7f4;max-width:1000px;margin:24px auto;padding:20px}section,article{background:white;padding:24px;border:1px solid #d8e4de;border-radius:12px;margin:18px 0}input,textarea{box-sizing:border-box;display:block;width:100%;padding:10px;margin:6px 0 14px;font:inherit}textarea{min-height:100px}button{background:#176856;color:white;padding:12px;border:0;border-radius:6px;cursor:pointer;margin:6px}input[type=checkbox]{display:inline;width:auto}#message{color:#9b381e}.hidden{display:none}small{color:#617267}</style></head><body><h1>医学知识审核</h1><p>只提交已去标识化的知识表述。病例签发不等于知识发布；发布须由另一位医生核验来源与使用权。</p><a href="clinical-workflow.html">返回诊断工作台</a><p id="message" role="status"></p><section id="login"><form id="loginForm"><label>医生账号<input name="username" required autocomplete="username"></label><label>密码<input name="password" required type="password" autocomplete="current-password"></label><button>登录</button></form></section><div id="work" class="hidden"><section><h2>源头证据检索</h2><p>结果仅供整理和复核，尚未成为临床规则。</p><label>关键词<input id="sourceQuery" minlength="2" maxlength="100"></label><button id="sourceSearch">检索待审资料</button><div id="sourceResults"></div></section><section><h2>提交知识候选</h2><form id="entryForm"><label>标题<input name="title" maxlength="200" required></label><label>证型<input name="syndrome" maxlength="200" required></label><label>独立整理的知识正文（至少100字）<textarea name="content" minlength="100" maxlength="10000" required></textarea></label><label>来源资料编号<input name="source_id" maxlength="300" required></label><label>页码或课程时间位置<input name="locator" maxlength="300" required></label><label>资料版本<input name="version" maxlength="300" required></label><button>提交独立审核</button></form></section><section><h2>审核与撤回</h2><label>本次审核或撤回依据<textarea id="reason" maxlength="1000"></textarea></label><label><input id="deidentified" type="checkbox"> 已核验不含个人信息</label><br><label><input id="rights" type="checkbox"> 已核验资料使用权</label><br><label><input id="evidence" type="checkbox"> 已核验原文、版本及适用范围</label><p>撤回后停止新的检索使用，历史报告保留原引用版本。</p><button id="refresh">刷新</button><button id="logout">退出</button><div id="entries"></div></section></div><script src="js/knowledge-review.js"></script></body></html>
