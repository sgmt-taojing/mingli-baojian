<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-medical/payment.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>收银台 · 命理宝鉴·医道</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--green:#16a34a;--blue:#2563eb;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.payment-box{background:var(--card);border-radius:16px;padding:32px 24px;width:400px;max-width:95vw;box-shadow:0 4px 24px rgba(0,0,0,.06);border:1px solid var(--border)}
.payment-box h1{font-size:20px;color:var(--primary);text-align:center;margin-bottom:4px;letter-spacing:2px}
.payment-box .sub{text-align:center;font-size:11px;color:var(--text3);margin-bottom:20px}
.order-info{background:#faf8f5;border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px}
.order-info .row{display:flex;justify-content:space-between;padding:4px 0}
.order-info .total{font-weight:700;font-size:16px;color:var(--primary);border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.payment-methods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.pay-method{padding:14px;border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:.2s}
.pay-method:hover{border-color:var(--primary);background:rgba(107,58,31,.03)}
.pay-method.selected{border-color:var(--primary);background:rgba(107,58,31,.06)}
.pay-method .icon{font-size:28px;margin-bottom:4px}
.pay-method .name{font-size:13px;font-weight:600}
.pay-method .desc{font-size:10px;color:var(--text3)}

.btn{width:100%;padding:14px;border-radius:8px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:var(--primary);color:#fff;transition:.2s;margin-top:8px}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}

.qr-section{text-align:center;padding:20px 0;display:none}
.qr-code{display:inline-block;padding:12px;background:#fff;border-radius:8px;border:1px solid var(--border)}
.qr-timer{font-size:12px;color:var(--text3);margin-top:8px}

.status-box{text-align:center;padding:20px;display:none}
.status-box.success{color:var(--green)}
.status-box .icon{font-size:48px;margin-bottom:8px}
.status-box p{font-size:13px;color:var(--text2);margin-top:4px}

.notice{text-align:center;font-size:10px;color:var(--text3);margin-top:12px}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/standard.css">
<script src="js/nav.js" defer></script>
<script src="js/global-search.js"></script>
<script src="js/ai-voice-assistant.js"></script>
<script src="js/seed-loader.js"></script>
<script src="js/crud-engine.js"></script>
<script src="js/realtime-engine.js"></script>
<script src="js/config-engine.js"></script>
<script src="js/rx-loop.js" defer></script>

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<script src="js/smart-search.js"></script>
<script src="js/ai-assistant.js"></script>
<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">收银台</span>
</div>

<div class="std-bar"><span class="std-tag">👥 使用对象 <b>患者</b></span><span class="std-tag">⚙️ 功能 <b>支付收银台</b></span><span class="std-tag">💎 使用价值 <b>微信/支付宝/医保/现金4通道支付</b></span></div>
<div class="payment-box" id="main-box">
  <h1>💳 收银台</h1>
  <div class="sub">命理宝鉴·医道 · 在线支付</div>

  <div class="order-info">
    <div class="row"><span>患者</span><span id="patient-name">---</span></div>
    <div class="row"><span>处方号</span><span id="rx-id" style="font-family:monospace">---</span></div>
    <div class="row"><span>中药费用</span><span id="herb-fee">¥0.00</span></div>
    <div class="row"><span id="decoction-label">煎药费</span><span id="decoction-fee">¥0.00</span></div>
    <div class="row"><span>诊查费</span><span>¥10.00</span></div>
    <div class="row" id="delivery-row" style="display:none"><span>快递费</span><span>¥15.00</span></div>
    <div class="row total"><span>合计</span><span id="total-fee">¥0.00</span></div>
  </div>

  <div class="payment-methods">
    <div class="pay-method selected" data-method="wechat" onclick="selectMethod('wechat')">
      <div class="icon">💚</div>
      <div class="name">微信支付</div>
      <div class="desc">扫码支付</div>
    </div>
    <div class="pay-method" data-method="alipay" onclick="selectMethod('alipay')">
      <div class="icon">💙</div>
      <div class="name">支付宝</div>
      <div class="desc">扫码支付</div>
    </div>
    <div class="pay-method" data-method="insurance" onclick="selectMethod('insurance')">
      <div class="icon">🏥</div>
      <div class="name">医保支付</div>
      <div class="desc">医保卡结算</div>
    </div>
    <div class="pay-method" data-method="cash" onclick="selectMethod('cash')">
      <div class="icon">💵</div>
      <div class="name">现金/刷卡</div>
      <div class="desc">线下支付</div>
    </div>
  </div>

  <button class="btn" id="pay-btn" onclick="processPayment()">确认支付</button>

  <!-- QR code for online payment -->
  <div class="qr-section" id="qr-section">
    <div class="qr-code">
      <div id="qrcode" style="width:180px;height:180px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text3)">扫码支付</div>
    </div>
    <div class="qr-timer">请在 <span id="qr-countdown">5:00</span> 内完成支付</div>
  </div>
  <div class="notice">🔒 支付由第三方通道处理，本系统不存储支付信息</div>
</div>

<!-- Success -->
<div class="status-box success" id="success-box" style="display:none">
  <div class="icon">✅</div>
  <h2>支付成功</h2>
  <p id="success-msg">处方已进入药房调配流程</p>
  <div class="order-info" style="margin-top:12px">
    <div class="row"><span>取药方式</span><span id="delivery-info">---</span></div>
    <div class="row"><span>预计取药</span><span id="ready-time">---</span></div>
  </div>
  <button class="btn" onclick="viewReport()" style="margin-top:16px">📋 查看报告</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
// R815：收银台接真结算——/api/prescription/unpaid 取待缴费处方，/api/prescription/settle 真结算
var params = new URLSearchParams(location.search);
var rxId = params.get('rx');
var paymentMethod = 'wechat';
var orderData = null;
var unpaidList = [];

document.addEventListener('DOMContentLoaded', function() {
  loadOrder();
});

function loadOrder() {
  fetch('/api/prescription/unpaid').then(function(r){ return r.json(); }).then(function(d) {
    unpaidList = d.list || [];
    if (rxId) {
      orderData = unpaidList.find(function(x){ return x.rx_id === rxId; }) || null;
      if (!orderData) {
        // 可能已支付或不存在——查详情确认
        fetch('/api/prescription/' + encodeURIComponent(rxId)).then(function(r){ return r.json(); }).then(function(j) {
          var rec = j.record || j.prescription || null;
          if (rec && rec.payment_status === 'paid') { showAlreadyPaid(rec); }
          else renderPickList('该处方不在待缴费列表');
        }).catch(function(){ renderPickList('处方查询失败'); });
        return;
      }
      renderOrder();
    } else {
      renderPickList();
    }
  }).catch(function() {
    document.querySelector('.payment-box .sub').textContent = '📡 服务离线，暂不能结算';
  });
}

// 无 rx 参数：收银员选择待缴费处方
function renderPickList(note) {
  var box = document.getElementById('main-box');
  var html = '<h1>💳 收银台</h1><div class="sub">选择待缴费处方' + (note ? '（' + note + '）' : '') + '</div>';
  if (!unpaidList.length) {
    html += '<div style="text-align:center;color:var(--text3);padding:24px">🎉 暂无待缴费处方<br><span style="font-size:11px">医生签发处方后自动出现在这里</span></div>';
  } else {
    html += unpaidList.map(function(u) {
      return '<div onclick="location.href=&quot;payment.html?rx=' + u.rx_id + '&quot;" style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer;font-size:13px">' +
        '<span><b>' + u.patient + '</b> · ' + (u.syndrome || '—') + '<br><span style="font-size:10px;color:var(--text3)">' + u.rx_id.slice(0, 16) + '… · ' + u.herb_count + '味 × ' + u.doses + '剂</span></span>' +
        '<span style="color:var(--primary);font-weight:700">¥' + u.amount + '</span></div>';
    }).join('');
  }
  box.innerHTML = html;
}

function renderOrder() {
  var o = orderData;
  document.getElementById('patient-name').textContent = o.patient;
  document.getElementById('rx-id').textContent = o.rx_id.slice(0, 18) + '…';
  // 费用结构（与签发即计价一致：药材费 + 诊查服务费）
  var herbFee = Math.max(0, o.amount - 10);
  document.getElementById('herb-fee').textContent = '¥' + herbFee.toFixed(2) + '（' + o.herb_count + '味 × ' + o.doses + '剂）';
  document.getElementById('decoction-label').textContent = '诊查费';
  document.getElementById('decoction-fee').textContent = '¥10.00';
  document.getElementById('total-fee').textContent = '¥' + Number(o.amount).toFixed(2);
}

function selectMethod(method) {
  paymentMethod = method;
  document.querySelectorAll('.pay-method').forEach(function(m){ m.classList.remove('selected'); });
  document.querySelector('.pay-method[data-method="' + method + '"]').classList.add('selected');
}

function processPayment() {
  if (!orderData) { toast('请先选择处方', 'warn'); return; }
  var btn = document.getElementById('pay-btn');
  if (paymentMethod === 'wechat' || paymentMethod === 'alipay') {
    btn.style.display = 'none';
    document.getElementById('qr-section').style.display = 'block';
    generateQR();
    // 扫码后人工确认（演示环境无真实支付回调）
    var qr = document.getElementById('qr-section');
    if (!document.getElementById('qr-confirm')) {
      var b = document.createElement('button');
      b.id = 'qr-confirm'; b.className = 'btn'; b.style.marginTop = '10px';
      b.textContent = '✅ 我已完成扫码支付';
      b.onclick = function(){ doSettle(); };
      qr.appendChild(b);
    }
  } else {
    doSettle();
  }
}

function generateQR() {
  var url = location.origin + location.pathname + '?rx=' + orderData.rx_id + '&amount=' + orderData.amount;
  var qrEl = document.getElementById('qrcode');
  if (typeof QRCode !== 'undefined') {
    qrEl.innerHTML = '';
    new QRCode(qrEl, { text: url, width: 180, height: 180 });
  }
}

function doSettle() {
  // R815：真结算——写入服务端处方记录（paid），药房调配/财务报表自动联动
  authFetch('/api/prescription/settle', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ rx_id: orderData.rx_id, method: paymentMethod, amount: orderData.amount })
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (!d.ok) { toast('结算失败：' + (d.error || ''), 'warn'); return; }
    showSuccess(d);
  }).catch(function(){ toast('网络错误', 'warn'); });
}

function showSuccess(d) {
  document.getElementById('main-box').style.display = 'none';
  document.getElementById('success-box').style.display = 'block';
  document.getElementById('success-msg').textContent = '处方已进入药房调配流程（实收 ¥' + (d.amount != null ? d.amount : orderData.amount) + ' · ' + ({insurance:'医保',wechat:'微信',alipay:'支付宝',cash:'现金'}[d.method] || d.method || '') + '）';
  document.getElementById('delivery-info').textContent = '🏥 药房自取';
  document.getElementById('ready-time').textContent = '以药房叫号为准';
}

function showAlreadyPaid(rec) {
  document.getElementById('main-box').style.display = 'none';
  document.getElementById('success-box').style.display = 'block';
  document.getElementById('success-msg').textContent = '该处方已于 ' + (rec.paid_at || '').slice(0, 16).replace('T', ' ') + ' 完成结算，无需重复缴费';
  document.getElementById('delivery-info').textContent = '🏥 药房自取';
  document.getElementById('ready-time').textContent = '以药房叫号为准';
}

function viewReport() {
  window.location.href = 'report.html?id=' + (orderData ? orderData.rx_id : '');
}

// Toast
</script>
<div style="font-size:10px;color:var(--text3);margin-top:8px">⚠️ 本系统内容内容供学习参考，用药请遵医嘱。</div>

</body>
