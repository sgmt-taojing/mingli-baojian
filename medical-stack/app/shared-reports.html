<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的授权报告</title><style>body{font:16px system-ui;color:#173d38;background:#f4f7f4;max-width:850px;margin:30px auto;padding:20px}section,article{background:white;border:1px solid #d8e4de;border-radius:12px;padding:22px;margin:16px 0}input,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;font:inherit}button{background:#176856;color:white;border:0;border-radius:6px;padding:12px;cursor:pointer;margin:6px}#message{color:#9b381e}.hidden{display:none}</style></head><body><h1>我的授权报告</h1><p>仅显示患者明确授权给当前账号、且仍在有效期内的报告。</p><p id="message" role="status"></p><section id="login"><form id="loginForm"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section><section id="work" class="hidden"><p id="account"></p><button id="refresh">刷新报告</button><button id="logout">退出</button><div id="reports"></div></section><script src="js/shared-reports.js"></script></body></html>
