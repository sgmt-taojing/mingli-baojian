<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-medical/messages.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔔</text></svg>">
<title>消息中心 · 命理宝鉴·医道</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--red-bg:#fef2f2;--green-bg:#f0fdf4;--blue-bg:#eff6ff;--gold-bg:#fffbeb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:16px;border-radius:0 0 12px 12px;margin-bottom:12px}
.header h1{font-size:18px}.header .sub{font-size:11px;opacity:.6}
.card{background:var(--card);border-radius:10px;padding:14px;margin:10px 0;border:1px solid var(--border)}
.card h3{font-size:14px;color:var(--primary);margin-bottom:8px}
.tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.tab{padding:6px 16px;border-radius:8px;font-size:12px;cursor:pointer;background:var(--bg);border:1px solid var(--border)}
.tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.msg-item{display:flex;gap:10px;padding:10px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.msg-item:hover{background:var(--bg)}
.msg-item.unread{background:var(--blue-bg)}
.msg-icon{font-size:22px;flex-shrink:0}
.msg-body{flex:1}
.msg-title{font-weight:600}
.msg-time{font-size:10px;color:var(--text3)}
.msg-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);margin-top:6px;flex-shrink:0}
.btn{display:inline-block;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.small{padding:4px 10px;font-size:11px;border:1px solid var(--border);background:var(--bg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
</style>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/standard.css">
<script src="js/nav.js"></script>
<script src="js/global-search.js"></script>
<script src="js/ai-voice-assistant.js"></script>
<script src="js/crud-engine.js"></script>
<script src="js/realtime-engine.js"></script>
<script src="js/config-engine.js"></script>
<script src="js/seed-loader.js"></script>

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<script src="js/smart-search.js"></script>
<script src="js/ai-assistant.js"></script>
<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">消息中心</span>
</div>

<div class="container">
  <div class="std-bar">
    <span class="std-tag">👥 使用对象 <b>全部角色</b></span>
    <span class="std-tag">⚙️ 功能 <b>消息通知中心</b></span>
    <span class="std-tag">💎 使用价值 <b>医嘱提醒·预约通知·系统公告集中管理</b></span>
  </div>
  <div class="header">
    <h1>🔔 消息中心</h1>
    <div class="sub">医嘱提醒 · 预约通知 · 报告送达 · 系统公告</div>
  </div>

  <div class="card">
    <div class="tabs" id="msg-tabs">
      <span class="tab active" data-tab="all" onclick="switchTab('all')">全部</span>
      <span class="tab" data-tab="remind" onclick="switchTab('remind')">提醒</span>
      <span class="tab" data-tab="appoint" onclick="switchTab('appoint')">预约</span>
      <span class="tab" data-tab="report" onclick="switchTab('report')">报告</span>
      <span class="tab" data-tab="system" onclick="switchTab('system')">系统</span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span id="msg-count" style="font-size:11px;color:var(--text3)"></span>
      <button class="btn small" onclick="markAllRead()">✅ 全部已读</button>
    </div>
    <div id="msg-list"></div>
  </div>
</div>

<script>
// ═══ 种子消息 ═══
function seedMsgs() {
  var msgs = TCM.store.get('messages');
  if (msgs && msgs.length) return;
  var now = Date.now();
  TCM.store.set('messages', [
    { id: 'M1', type: 'remind', icon: '💊', title: '服药提醒', body: '您的处方当归补血汤已配好，请按时服药，每日2次，饭前温服。', time: new Date(now - 30*60000).toISOString(), read: false },
    { id: 'M2', type: 'appoint', icon: '📅', title: '复诊预约成功', body: '您已预约 张仲景医生 内科 明日 09:30，请提前10分钟到院。', time: new Date(now - 2*3600000).toISOString(), read: false },
    { id: 'M3', type: 'report', icon: '📋', title: '体检报告已生成', body: '您的治未病体检报告已生成，健康指数 86 分，请查看详情。', time: new Date(now - 5*3600000).toISOString(), read: false },
    { id: 'M4', type: 'system', icon: '🏥', title: '医院公告', body: '本周六上午本院特邀北京中医药大学专家坐诊，欢迎预约。', time: new Date(now - 24*3600000).toISOString(), read: true },
    { id: 'M5', type: 'remind', icon: '📍', title: '针灸提醒', body: '您的针灸治疗预约（李理疗师 · 明日14:00）即将开始，请准时。', time: new Date(now - 26*3600000).toISOString(), read: true }
  ]);
}

var currentTab = 'all';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(function(el) {
    el.classList.toggle('active', el.dataset.tab === tab);
  });
  renderList();
}

function getMsgs() { return TCM.store.get('messages') || []; }

function renderList() {
  var msgs = getMsgs();
  var filtered = currentTab === 'all' ? msgs : msgs.filter(function(m) { return m.type === currentTab; });
  var unread = msgs.filter(function(m) { return !m.read; }).length;
  document.getElementById('msg-count').textContent = '共 ' + msgs.length + ' 条 · 未读 ' + unread;

  var html = '';
  for (var i = 0; i < filtered.length; i++) {
    var m = filtered[i];
    html += '<div class="msg-item' + (m.read ? '' : ' unread') + '" onclick="readMsg(\'' + m.id + '\')">' +
      '<div class="msg-icon">' + m.icon + '</div>' +
      '<div class="msg-body"><div class="msg-title">' + m.title + '</div>' +
      '<div style="color:var(--text2);font-size:11px;margin-top:2px">' + m.body + '</div>' +
      '<div class="msg-time">' + new Date(m.time).toLocaleString('zh-CN') + '</div></div>' +
      (m.read ? '' : '<div class="msg-dot"></div>') + '</div>';
  }
  document.getElementById('msg-list').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text3)">暂无消息</div>';
}

function readMsg(id) {
  var msgs = getMsgs();
  var m = msgs.find(function(x) { return x.id === id; });
  if (m && !m.read) {
    m.read = true;
    TCM.store.set('messages', msgs);
    renderList();
  }
}

function markAllRead() {
  var msgs = getMsgs();
  msgs.forEach(function(m) { m.read = true; });
  TCM.store.set('messages', msgs);
  renderList();
  toast('✅ 已全部标记为已读');
}

seedMsgs();
renderList();
</script>
<script src="js/error-interceptor.js"></script>
<script src="js/common.js"></script>
<script src="js/ui/states.js"></script>
<script src="js/ui/a11y.js"></script>
<script src="js/sw-version-listener.js"></script>
<script src="js/submit-guard.js"></script>
<script src="js/escape-html.js"></script>
</body>
</html>
