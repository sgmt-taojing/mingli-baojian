<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💊</text></svg>">
<link rel="stylesheet" href="css/standard.css">
<style>
:root { --bg:#fff8ee; --card:#fff; --primary:#b8860b; --accent:#c0392b; --green:#2e8b57; --blue:#2980b9; --text:#2c1810; --text2:#6b5b4f; --border:#e8dfc8; }
body { background: var(--bg); font-family: 'PingFang SC', sans-serif; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }

.header { background: linear-gradient(135deg, var(--primary), #8b6914); color: white; border-radius: 12px; padding: 20px 24px; margin-bottom: 16px; }
.header h1 { margin: 0 0 6px; font-size: 22px; }
.header p { margin: 0; opacity: 0.9; font-size: 13px; }

.patient-tabs { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.patient-tab { padding: 8px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 14px; }
.patient-tab.active { background: var(--primary); color: white; border-color: var(--primary); }

.summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
@media (max-width: 500px) { .summary-grid { grid-template-columns: 1fr 1fr; } }
.summary-card { background: var(--card); border-radius: 12px; padding: 14px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.summary-card .label { font-size: 11px; color: var(--text2); }
.summary-card .value { font-size: 24px; font-weight: 700; color: var(--primary); margin: 4px 0; }
.summary-card.good .value { color: var(--green); }
.summary-card.warn .value { color: #e67e22; }
.summary-card.bad .value { color: var(--accent); }

.med-list { background: var(--card); border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
.med-list h3 { margin: 0 0 12px; font-size: 16px; color: var(--primary); }

.med-item { display: grid; grid-template-columns: 80px 1fr auto auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f0e8; }
.med-item:last-child { border-bottom: 0; }
.med-time { font-size: 14px; font-weight: 700; color: var(--primary); }
.med-drug { font-size: 14px; }
.med-dose { font-size: 12px; color: var(--text2); margin-top: 2px; }
.med-status { padding: 4px 12px; border-radius: 16px; font-size: 12px; font-weight: 600; }
.med-status.taken { background: var(--green); color: white; }
.med-status.pending { background: #f39c12; color: white; }
.med-status.skipped { background: #95a5a6; color: white; }
.med-status.missed { background: var(--accent); color: white; }
.med-action { padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--card); cursor: pointer; font-size: 12px; }
.med-action:hover { background: var(--primary); color: white; }
/* R850 患者版条目卡片——药名点开看功效主治 */
.entry-link{color:var(--primary);cursor:pointer;border-bottom:1px dashed var(--primary);font-weight:600}
.entry-link:hover{background:var(--primary);color:#fff;border-radius:3px}

.timeline { background: var(--card); border-radius: 12px; padding: 16px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.timeline h3 { margin: 0 0 12px; font-size: 16px; color: var(--primary); }
.timeline-bar { height: 30px; border-radius: 6px; background: #f0e8d5; overflow: hidden; display: flex; margin: 8px 0; }
.bar-segment { display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: 600; }
.bar-segment.taken { background: var(--green); }
.bar-segment.skipped { background: #95a5a6; }
.bar-segment.missed { background: var(--accent); }
</style>

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">服药追踪</span>
</div>

<div class="wrap">
  <div class="header">
    <h1>💊 服药追踪</h1>
    <p>家庭成员按时服药 · 子女端远程确认 · KB 推荐依据</p>
  </div>

  <!-- 患者切换 -->
  <div class="patient-tabs" id="patient-tabs"></div>

  <!-- 摘要统计 -->
  <div class="summary-grid">
    <div class="summary-card good">
      <div class="label">今日已服</div>
      <div class="value" id="stat-taken">0</div>
      <div class="label">次</div>
    </div>
    <div class="summary-card warn">
      <div class="label">待服</div>
      <div class="value" id="stat-pending">0</div>
      <div class="label">次</div>
    </div>
    <div class="summary-card bad">
      <div class="label">漏服</div>
      <div class="value" id="stat-missed">0</div>
      <div class="label">次</div>
    </div>
  </div>

  <!-- 今日服药清单 -->
  <div class="med-list">
    <h3>📋 今日服药清单</h3>
    <div id="med-items"></div>
  </div>

  <!-- 7 日依从时间轴 -->
  <div class="timeline">
    <h3>📊 近 7 日依从率</h3>
    <div class="timeline-bar" id="timeline-bar"></div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text2);margin-top:4px">
      <span>7天前</span><span>6天</span><span>5天</span><span>4天</span><span>3天</span><span>2天</span><span>今天</span>
    </div>
  </div>
</div>

<script>
// R851：家庭成员从患者主索引实拉（真实建档患者），不再硬编码演示人名
let PATIENTS = [];
let currentPatient = '';
let meds = [];
let records = []; // 服药依从记录（服务端为准，localStorage 仅离线兜底）

async function loadFamilyPatients() {
  // R853：优先账号绑定的家庭成员（只见自家人）；未登录/未绑定 → 引导去家庭中心
  try {
    const r = await fetch('/api/family/members', {
      headers: { 'Authorization': 'Bearer ' + (localStorage.getItem('tcm_token') || '') }
    });
    if (r.status === 401) {
      document.getElementById('patient-tabs').innerHTML = '<div style="color:var(--text2);font-size:12px;padding:8px">请先<a href="login.html" style="color:var(--primary)">登录</a>后查看家庭成员服药任务</div>';
      document.getElementById('med-items').innerHTML = '';
      return;
    }
    const d = await r.json();
    PATIENTS = (d.members || []).map(m => ({ id: m.patient_id, name: m.name + '（' + m.relation + '）', age: m.age }));
  } catch (e) { PATIENTS = []; }
  if (!PATIENTS.length) {
    document.getElementById('patient-tabs').innerHTML = '<div style="color:var(--text2);font-size:12px;padding:8px">尚未绑定家庭成员——去<a href="family-hub.html" style="color:var(--primary)">🏡 家庭中心</a>绑定后，家人的服药任务会出现在这里</div>';
    document.getElementById('med-items').innerHTML = '';
    return;
  }
  if (!PATIENTS.some(p => p.id === currentPatient)) currentPatient = PATIENTS[0].id;
  loadMeds();
}

// R851：依从记录从服务端实拉（入纵向病程的同一份数据）
async function refreshAdherence() {
  if (!currentPatient) return;
  try {
    const r = await fetch('/api/home/med-adherence?patient_id=' + encodeURIComponent(currentPatient));
    const d = await r.json();
    if (d.ok) {
      records = (d.records || []).map(x => ({ drug: x.drug, time: x.scheduled_time, status: x.status, patient: x.patient_id, ts: x.ts }));
      localStorage.setItem('tcm_med_records', JSON.stringify(records.slice(-100)));  // 离线缓存
    }
  } catch (e) { /* 离线时用本地缓存 */ }
}

// 智能推断药品的常见服用时间（基于中药功效）
function inferTimes(drug) {
  const TONIC = ['党参','白术','茯苓','黄芪','山药','人参','太子参','西洋参']; // 补益 - 早晚饭前
  const NIGHT = ['酸枣仁','远志','茯神','合欢皮','夜交藤','柏子仁','珍珠母']; // 安神 - 睡前
  const LUNG = ['杏仁','川贝','沙参','麦冬','百合','百部','紫菀','款冬花']; // 润肺 - 早晚饭后
  const COLD = ['金银花','连翘','板蓝根','黄连','黄芩','栀子']; // 清热 - 饭后
  if (NIGHT.includes(drug)) return ['21:00'];
  if (TONIC.includes(drug)) return ['08:00', '12:00'];
  if (LUNG.includes(drug)) return ['08:00', '20:00'];
  if (COLD.includes(drug)) return ['08:00', '14:00', '20:00'];
  return ['08:00', '14:00', '20:00'];
}

async function loadMeds() {
  try {
    const r = await fetch('/api/home/med-schedule', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ patient_id: currentPatient })
    });
    const data = await r.json();
    // 简化：从 prescriptions.json 直接加载当前患者
    const fullResp = await fetch('/api/home/med-detail?patient_id=' + currentPatient);
    const full = await fullResp.json();
    meds = full.meds || [];
    await refreshAdherence();  // R851：依从记录服务端同源
    renderMeds();
  } catch (e) {
    // [sanitized] /* [sanitized] [;,]/* [sanitized] */'API failed', e) */;
    meds = [];
    renderMeds();
  }
}

function renderMeds() {
  // 渲染患者标签
  document.getElementById('patient-tabs').innerHTML = PATIENTS.map(p =>
    `<div class="patient-tab ${p.id === currentPatient ? 'active' : ''}" onclick="switchPatient('${p.id}')">${p.name}</div>`
  ).join('');

  // 服药清单
  const items = document.getElementById('med-items');
  if (meds.length === 0) {
    items.innerHTML = '<div style="color:var(--text2);text-align:center;padding:20px">该患者暂无服药记录</div>';
  } else {
    items.innerHTML = meds.map(m => {
      const time = m.time;
      const hour = parseInt(time.split(':')[0]);
      const now = new Date().getHours();
      let status = 'pending';
      if (hour < now) status = 'taken';
      return `
        <div class="med-item">
          <div class="med-time">${time}</div>
          <div>
            <div class="med-drug"><span class="entry-link" data-entry="${String(m.drug).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}" title="点击查看药物说明">${String(m.drug).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span></div>
            <div class="med-dose">${m.dose || '按方'} · 处方来源: ${m.source || 'EMR'}</div>
          </div>
          <div class="med-status ${status}">${status === 'taken' ? '✓ 已服' : '⏳ 待服'}</div>
          <button class="med-action" onclick="markTake('${m.drug}', '${time}')">标记</button>
        </div>
      `;
    }).join('');
  }

  // 摘要统计
  const taken = meds.filter(m => parseInt(m.time.split(':')[0]) < new Date().getHours()).length;
  const pending = meds.length - taken;
  document.getElementById('stat-taken').textContent = taken;
  document.getElementById('stat-pending').textContent = pending;
  document.getElementById('stat-missed').textContent = records.filter(r => r.status === 'missed').length;

  // 时间轴——R851：由真实依从记录逐日聚合，无记录的日子留空（不再编造数据）
  const bar = document.getElementById('timeline-bar');
  bar.innerHTML = '';
  for (let i = 6; i >= 0; i--) {
    const day = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    const dayRecs = records.filter(r => String(r.ts || '').slice(0, 10) === day);
    const dayTaken = dayRecs.filter(r => r.status === 'taken').length;
    const dayMissed = dayRecs.filter(r => r.status === 'missed').length;
    if (!dayRecs.length) {
      const seg = document.createElement('div');
      seg.className = 'bar-segment';
      seg.style.cssText = 'flex:1;background:var(--border);opacity:.35';
      seg.title = day + ' 无记录';
      bar.appendChild(seg);
      continue;
    }
    const segT = document.createElement('div');
    segT.className = 'bar-segment taken';
    segT.style.flex = Math.max(dayTaken, 0.001);
    if (dayTaken > 0) segT.textContent = dayTaken;
    segT.title = day + ' 已服 ' + dayTaken;
    bar.appendChild(segT);
    if (dayMissed > 0) {
      const m = document.createElement('div');
      m.className = 'bar-segment missed';
      m.style.flex = dayMissed;
      m.textContent = dayMissed;
      m.title = day + ' 漏服 ' + dayMissed;
      bar.appendChild(m);
    }
  }
}

function switchPatient(id) {
  currentPatient = id;
  loadMeds();
}

async function markTake(drug, time) {
  const status = await (window.confirmModal ? confirmModal(`${drug} @ ${time}\n\n点击「确认」= 已服，「取消」= 漏服`, { okText:'已服', cancelText:'漏服' }) : Promise.resolve(confirm(`${drug} @ ${time}`)));
  const st = status ? 'taken' : 'missed';
  records.push({ drug, time, status: st, patient: currentPatient, ts: new Date().toISOString() });
  localStorage.setItem('tcm_med_records', JSON.stringify(records.slice(-100)));  // 离线兜底
  // R851：依从回传服务端，入患者纵向病程（医生随访/疗效分析同源可见）
  let synced = false;
  try {
    const r = await fetch('/api/home/med-adherence', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ patient_id: currentPatient, drug, time, status: st })
    });
    const d = await r.json();
    synced = !!d.ok;
  } catch (e) { /* 离线 */ }
  var t=document.createElement('div');t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#8b4513;color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999';t.textContent=(status?'✓ 已记录已服':'✗ 已记录漏服，会自动推送给子女')+(synced?'':'（离线暂存本地）');document.body.appendChild(t);setTimeout(function(){t.remove()},2500);
  // 推送给子女（wechat-bot）
  fetch('/api/wechat/send', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      openid: 'wx_wang',
      type: 'medication',
      data: { time, drug, dose: '按方' }
    })
  }).catch(function(){ /* wechat-bot 离线 */ });
  if (synced) await refreshAdherence();
  renderMeds();
}

// 初始化
const saved = localStorage.getItem('tcm_med_records');
if (saved) { try { records = JSON.parse(saved); } catch (e) { records = []; } }
loadFamilyPatients();
</script>

<script>
/* ── R850 患者版条目卡片——服药清单药名点开看功效/主治/禁忌（复用 R846 端点） ── */
const _medEntryCache = {};
async function showMedEntryByName(name, x, y) {
  let card = document.getElementById('entry-card');
  if (!card) {
    card = document.createElement('div');
    card.id = 'entry-card';
    card.style.cssText = 'position:fixed;z-index:9999;max-width:340px;background:var(--card,#fff);border:1px solid var(--border,#ddd);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:16px;font-size:13px;line-height:1.8;text-align:left';
    document.body.appendChild(card);
    document.addEventListener('click', function(ev) {
      const c = document.getElementById('entry-card');
      if (c && !c.contains(ev.target) && !ev.target.classList.contains('entry-link')) c.remove();
    });
  }
  card.style.left = Math.min(x, window.innerWidth - 360) + 'px';
  card.style.top = Math.min(y, window.innerHeight - 280) + 'px';
  card.innerHTML = '<b>' + name + '</b> <span style="opacity:.6">查询中…</span>';
  if (!_medEntryCache[name]) {
    try {
      const resp = await fetch('/api/tcm/entry/info?name=' + encodeURIComponent(name));
      _medEntryCache[name] = await resp.json();
    } catch (e) { _medEntryCache[name] = { ok: false, error: e.message }; }
  }
  const d = _medEntryCache[name];
  if (!d || !d.ok) {
    card.innerHTML = '<b>' + name + '</b><div style="opacity:.6;margin-top:6px">知识库暂无该药说明，用药请遵医嘱</div>';
    return;
  }
  const modName = { 'tcm-herb': '药材', 'tcm-acupuncture': '穴位', 'tcm-formula': '方剂', 'tcm-syndrome': '证型' }[d.module] || d.module;
  const lines = String(d.content || '').split('\n').filter(Boolean)
    .map(l => '<div style="margin-top:4px">' + l.replace(/^(性味归经|功效|主治|出处|归经|定位|操作|禁忌|证机概要|临床表现|代表方剂|辨证要点|主症|舌象|脉象|加减法|证候表现|证机分析)(：)/, '<b style="color:var(--primary)">$1</b>$2') + '</div>').join('');
  // R856 鉴别诊断栏：同脏腑近证，点名可点跳转
  const diffs = (d.differentials || []).map(x =>
    '<div style="margin-top:3px">· <span class="entry-link" data-entry="' + x.name + '" title="点开鉴别">' + x.name + '</span> <span style="opacity:.7">' + String(x.gist).replace(/</g,'&lt;') + '</span></div>').join('');
  card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<b style="font-size:15px">' + d.title + '</b>' +
    '<span style="font-size:10px;opacity:.55;border:1px solid var(--border);border-radius:8px;padding:1px 8px">' + modName + '</span></div>' +
    lines +
    (diffs ? '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px"><b style="color:var(--primary)">鉴别诊断</b>' + diffs + '</div>' : '') +
    '<div style="margin-top:10px;font-size:11px;color:var(--text2);border-top:1px dashed var(--border);padding-top:6px">📖 药物知识供您了解，剂量与用法请严格遵医嘱</div>';
}
document.addEventListener('click', function(ev) {
  const el = ev.target.closest && ev.target.closest('.entry-link');
  if (el) { ev.stopPropagation(); showMedEntryByName(el.dataset.entry, ev.clientX, ev.clientY + 8); }
});
</script>
