<script>
const USERS = {
  admin: { password: 'admin123', name: '系统管理员', role: 'super_admin', roleName: '超级管理员', specialty: null, specialtyName: null },
  doc001: { password: 'doc123', name: '张仲景', role: 'doctor_internal', roleName: '内科医生', specialty: 'internal', specialtyName: '内科' },
  doc002: { password: 'doc123', name: '李时珍', role: 'doctor_acupuncture', roleName: '针灸科医生', specialty: 'acupuncture', specialtyName: '针灸科' },
  doc003: { password: 'doc123', name: '傅青主', role: 'doctor_gynecology', roleName: '妇科医生', specialty: 'gynecology', specialtyName: '妇科' },
  pharma001: { password: 'pharma123', name: '孙思邈', role: 'pharmacist', roleName: '药师' }
};

const ROLE_NAMES = {
  super_admin: '超级管理员', doctor_internal: '内科医生', doctor_acupuncture: '针灸科医生',
  doctor_gynecology: '妇科医生', doctor_pediatrics: '儿科医生', doctor_dermatology: '皮肤科医生',
  doctor_orthopedics: '骨伤科医生', pharmacist: '药师', patient: '患者'
};
const SPECIALTY_NAMES = {
  internal: '内科', acupuncture: '针灸科', gynecology: '妇科',
  pediatrics: '儿科', dermatology: '皮肤科', orthopedics: '骨伤科'
};

// 动态用户库（权限管理页创建的用户优先）
function getDynamicUser(uname) {
  try {
    var db = JSON.parse(localStorage.getItem('tcm_users_db') || '{}');
    var u = db[uname];
    if (!u || u.enabled === false) return null;
    return {
      password: u.password,
      name: u.name,
      role: u.role,
      roleName: ROLE_NAMES[u.role] || u.role,
      specialty: u.specialty || null,
      specialtyName: SPECIALTY_NAMES[u.specialty] || null
    };
  } catch(e) { return null; }
}

function login() {
  const uname = document.getElementById('username').value.trim();
  const pwd = document.getElementById('password').value;
  const errEl = document.getElementById('error');

  // R737 修真——表单校验走 uiStates.validateForm
  var formEl = errEl ? errEl.closest('form, .login-box') : null;
  if (window.uiStates && uiStates.validateForm) {
    var tmpForm = document.createElement('form');
    tmpForm.appendChild(document.getElementById('username').cloneNode(false));
    tmpForm.appendChild(document.getElementById('password').cloneNode(false));
    tmpForm.querySelector('#username').value = uname;
    tmpForm.querySelector('#password').value = pwd;
    var r = uiStates.validateForm(tmpForm);
    if (!r.ok) { errEl.textContent = r.errors.map(function(e){return e.message;}).join('，'); return; }
  }

  if (!uname || !pwd) { errEl.textContent = '请输入用户名和密码'; return; }
  
  const user = getDynamicUser(uname) || USERS[uname];
  if (!user) { errEl.textContent = '用户不存在'; return; }
  if (user.password !== pwd) { errEl.textContent = '密码错误'; return; }

  const userData = {
    id: uname, username: uname, name: user.name,
    role: user.role, roleName: user.roleName,
    specialty: user.specialty||null, specialtyName: user.specialtyName||null
  };
  localStorage.setItem('tcm_user', JSON.stringify(userData));

  const redirects = {
    super_admin: 'flows.html',
    doctor_internal: 'flows.html', doctor_acupuncture: 'flows.html',
    doctor_gynecology: 'flows.html', doctor_pediatrics: 'flows.html',
    doctor_dermatology: 'flows.html', doctor_orthopedics: 'flows.html',
    pharmacist: 'flows.html', patient: 'flows.html'
  };
  window.location.href = redirects[user.role] || 'flows.html';
}

// Show role hints
document.getElementById('username').addEventListener('input', function() {
  const u = getDynamicUser(this.value.trim()) || USERS[this.value.trim()];
  const hint = document.getElementById('role-hint');
  if (u) { hint.style.display='block'; hint.textContent = '👨‍⚕️ ' + u.name + ' · ' + u.roleName; }
  else hint.style.display = 'none';
});
</script>

    });
  };
})();
</script>
