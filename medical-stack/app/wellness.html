<head>

<title>治未病中心 · 命理宝鉴·医道</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--purple:#7c3aed;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--red-bg:#fef2f2;--green-bg:#f0fdf4;--blue-bg:#eff6ff;--gold-bg:#fffbeb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.container{max-width:900px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:16px;border-radius:0 0 12px 12px;margin-bottom:12px}
.header h1{font-size:18px}.header .sub{font-size:11px;opacity:.6}
.card{background:var(--card);border-radius:10px;padding:14px;margin:10px 0;border:1px solid var(--border)}
.card h3{font-size:14px;color:var(--primary);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.label{font-size:11px;color:var(--text3);margin:6px 0 2px;display:block}
.input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
.btn{display:inline-block;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);color:#fff}
.btn.small{padding:4px 10px;font-size:11px;border:1px solid var(--border);background:var(--bg)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.q-group{margin:8px 0}
.q-title{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.opt{display:inline-block;padding:5px 12px;border-radius:14px;font-size:11px;background:var(--bg);border:1px solid var(--border);cursor:pointer;margin:2px;transition:.15s}
.opt:hover{border-color:var(--primary)}
.opt.sel{background:var(--primary);color:#fff;border-color:var(--primary)}
.score-ring{width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto;border:8px solid var(--green);font-size:12px;color:var(--text2)}
.score-ring .num{font-size:34px;font-weight:800;color:var(--primary)}
.result-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--border);font-size:12px}
.result-row:last-child{border-bottom:none}
.report-item{padding:8px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer}
.report-item:hover{background:var(--bg)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
</style>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/standard.css">

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="wellness">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">治未病中心</span>
</div>

<div class="container">
  <div class="std-bar">
    <span class="std-tag">👥 使用对象 <b>患者/体检医生</b></span>
    <span class="std-tag">⚙️ 功能 <b>治未病·中医体检</b></span>
    <span class="std-tag">💎 使用价值 <b>体质辨识+九宫格评估+健康干预方案</b></span>
  </div>
  <div class="header">
    <h1>🌿 治未病中心 · 中医体检</h1>
    <div class="sub">上工治未病 — 体质辨识 · 九宫格评估 · 健康干预</div>
  </div>

  <!-- 体检问卷 -->
  <div class="card">
    <h3>📋 中医体检问卷 <span style="font-size:10px;color:var(--text3)">基于《中医体质分类与判定》标准</span></h3>
    <div class="grid2">
      <div><label class="label">姓名</label><input  class="input" id="wl-name" aria-label="wl name" data-validate="required|min=2"></div>
      <div><label class="label">年龄</label><input  class="input" id="wl-age" type="number" aria-label="wl age" data-validate="number"></div>
    </div>
    <div id="wl-questions"></div>
    <div class="btn-row"><button class="btn primary" onclick="runExam()">🔍 生成体检报告</button></div>
  </div>

  <!-- 报告 -->
  <div id="wl-report" style="display:none">
    <div class="card">
      <h3>🏆 健康评估报告</h3>
      <div class="score-ring" id="wl-ring"><span class="num" id="wl-score">0</span><span>健康指数</span></div>
      <div style="margin-top:12px" id="wl-details"></div>
      <div style="margin-top:10px">
        <h3>🌿 健康干预方案</h3>
        <div id="wl-plan" style="font-size:12px;line-height:1.9"></div>
      </div>
      <div class="btn-row">
        <button class="btn green" onclick="saveReport()">💾 存入健康档案</button>
        <button class="btn small" onclick="window.print()">🖨 打印</button>
      </div>
    </div>
  </div>

  <!-- 历史档案 -->
  <div class="card">
    <h3>📚 健康档案 <span id="wl-count" style="font-size:11px;color:var(--text3)"></span></h3>
    <div id="wl-reports"></div>
  </div>
</div>

<script>
// ═══ 体质问卷（9 维度 × 3 题，简化版）═══
var QUESTIONS = [
  { dim: '气虚', q: ['经常感到疲乏无力？', '容易气短(爬楼明显)？', '容易感冒？'] },
  { dim: '阳虚', q: ['手脚经常发凉？', '比常人怕冷？', '受凉后易腹泻？'] },
  { dim: '阴虚', q: ['手脚心发热？', '口干咽燥？', '夜间盗汗？'] },
  { dim: '痰湿', q: ['身体困重不爽？', '腹部肥满松软？', '喉咙有痰感？'] },
  { dim: '湿热', q: ['面部油腻？', '口苦口臭？', '大便黏滞不爽？'] },
  { dim: '血瘀', q: ['面色晦暗或有斑？', '身体有刺痛感？', '嘴唇颜色偏暗？'] },
  { dim: '气郁', q: ['情绪低落烦闷？', '容易紧张焦虑？', '胸胁胀闷感？'] },
  { dim: '血虚', q: ['面色苍白或萎黄？', '头晕眼花？', '指甲颜色偏淡？'] },
  { dim: '平和', q: ['精力充沛？', '睡眠良好？', '情绪稳定？'] }
];
var answers = {};

function renderQuestions() {
  var html = '';
  for (var i = 0; i < QUESTIONS.length; i++) {
    var g = QUESTIONS[i];
    html += '<div class="q-group"><div class="q-title">' + (i+1) + '. ' + g.dim + '维度</div>';
    for (var j = 0; j < g.q.length; j++) {
      html += '<div style="margin:4px 0;font-size:11px;color:var(--text2)">' + g.q[j] + '</div>' +
        '<span class="opt' + (answers[g.dim+'-'+j]===1?' sel':'') + '" onclick="setAns(\'' + g.dim + '\',' + j + ',1)">很少</span>' +
        '<span class="opt' + (answers[g.dim+'-'+j]===2?' sel':'') + '" onclick="setAns(\'' + g.dim + '\',' + j + ',2)">有时</span>' +
        '<span class="opt' + (answers[g.dim+'-'+j]===3?' sel':'') + '" onclick="setAns(\'' + g.dim + '\',' + j + ',3)">经常</span>' +
        '<span class="opt' + (answers[g.dim+'-'+j]===4?' sel':'') + '" onclick="setAns(\'' + g.dim + '\',' + j + ',4)">总是</span>';
    }
    html += '</div>';
  }
  document.getElementById('wl-questions').innerHTML = html;
}

function setAns(dim, j, val) {
  answers[dim + '-' + j] = val;
  renderQuestions();
}

function runExam() {
  var name = document.getElementById('wl-name').value.trim();
  if (!name) return toast('请填写姓名');
  var answered = Object.keys(answers).length;
  if (answered < 27) return toast('请完成全部 ' + 27 + ' 题（已答 ' + answered + ' 题）');

  // 各维度得分（按 平和质 反向计分）
  var dimScores = {};
  for (var i = 0; i < QUESTIONS.length; i++) {
    var g = QUESTIONS[i];
    var sum = 0;
    for (var j = 0; j < 3; j++) sum += answers[g.dim + '-' + j] || 2;
    dimScores[g.dim] = sum / 3;
  }

  // 健康指数 = 平和质得分(高好) + 其他维度反向
  var ping = dimScores['平和'];
  var otherAvg = 0, otherCount = 0;
  for (var k in dimScores) {
    if (k !== '平和') { otherAvg += dimScores[k]; otherCount++; }
  }
  otherAvg = otherAvg / otherCount;
  var score = Math.round((ping * 0.5 + (5 - otherAvg) * 0.5) / 4 * 100);
  score = Math.max(40, Math.min(98, score));

  // 判定体质（最高非平和维度）
  var maxDim = '', maxVal = 0;
  for (var m in dimScores) {
    if (m !== '平和' && dimScores[m] > maxVal) { maxVal = dimScores[m]; maxDim = m; }
  }
  var constitution = maxVal >= 3.2 ? maxDim + '质(偏颇明显)' : maxVal >= 2.5 ? maxDim + '质(倾向)' : '平和质';

  var report = {
    id: 'WL' + Date.now().toString(36).toUpperCase(),
    name: name,
    age: document.getElementById('wl-age').value,
    time: new Date().toISOString(),
    score: score,
    constitution: constitution,
    dims: dimScores
  };
  window.__lastReport = report;
  renderReport(report);
}

function renderReport(r) {
  document.getElementById('wl-report').style.display = 'block';
  var ring = document.getElementById('wl-ring');
  var color = r.score >= 85 ? '#16a34a' : r.score >= 70 ? '#b8860b' : '#c0392b';
  ring.style.borderColor = color;
  ring.querySelector('.num').style.color = color;
  document.getElementById('wl-score').textContent = r.score;

  // 维度明细
  var dimNames = { '气虚':'💨 气虚', '阳虚':'❄️ 阳虚', '阴虚':'🔥 阴虚', '痰湿':'💧 痰湿', '湿热':'🌡️ 湿热', '血瘀':'🩸 血瘀', '气郁':'😔 气郁', '血虚':'🩹 血虚', '平和':'✨ 平和' };
  var html = '';
  var keys = ['气虚','阳虚','阴虚','痰湿','湿热','血瘀','气郁','血虚','平和'];
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    var v = Math.round(r.dims[k] * 25);
    html += '<div class="result-row"><span>' + dimNames[k] + '</span>' +
      '<span style="width:60%"><span style="display:inline-block;height:8px;border-radius:4px;background:' + (k==='平和'?'var(--green)':v>60?'var(--accent)':'var(--gold)') + ';width:' + v + '%"></span></span>' +
      '<span>' + v + '/100</span></div>';
  }
  document.getElementById('wl-details').innerHTML =
    '<div class="result-row" style="border-bottom:2px solid var(--border)"><span><strong>体质判定</strong></span><span><strong>' + r.constitution + '</strong></span></div>' + html;

  // 干预方案
  var plans = {
    '气虚': '补气固表：黄芪山药粥、八段锦、足三里艾灸，忌劳累熬夜',
    '阳虚': '温阳散寒：羊肉生姜汤、晨起晒背、关元命门艾灸，忌生冷',
    '阴虚': '滋阴润燥：百合银耳羹、早睡养阴、太溪涌泉按揉，忌辛辣',
    '痰湿': '健脾祛湿：薏米赤小豆粥、快走微汗、丰隆阴陵泉按揉，控糖控油',
    '湿热': '清热利湿：绿豆冬瓜汤、游泳出汗、曲池阴陵泉按揉，忌烟酒',
    '血瘀': '活血化瘀：山楂黑豆、太极拉伸、血海合谷按揉，忌久坐',
    '气郁': '疏肝解郁：玫瑰花茶、唱歌运动、太冲膻中按揉，多社交',
    '血虚': '养血补血：红枣桂圆粥、早睡、三阴交血海按揉，忌思虑',
    '平和': '保持现状：均衡饮食、规律作息、适度运动，每年体检'
  };
  var maxDim2 = r.constitution.replace('质(偏颇明显)','').replace('质(倾向)','');
  document.getElementById('wl-plan').innerHTML =
    '<div><strong>🥗 饮食</strong>: ' + (plans[maxDim2] || plans['平和']).split('，')[0] + '</div>' +
    '<div><strong>🏃 运动</strong>: ' + (plans[maxDim2] || plans['平和']).split('，')[1] + '</div>' +
    '<div><strong>📍 穴位</strong>: ' + (plans[maxDim2] || plans['平和']).split('，')[2] + '</div>' +
    '<div><strong>🌙 生活</strong>: ' + (plans[maxDim2] || plans['平和']).split('，')[3] || '' + '</div>' +
    '<div style="margin-top:8px;font-size:10px;color:var(--text3)">⚠️ 本报告基于中医体质理论，仅供健康参考，不构成医疗诊断</div>';
}

function saveReport() {
  // R743 修真——提交前统一校验（uiStates.validateInputs）
  if (window.uiStates && uiStates.validateInputs && !window.__r743_injecting) {
    var _vr = uiStates.validateInputs(document);
    if (!_vr.ok) { uiStates.showValidationErrors(_vr); return; }
  }

  var r = window.__lastReport;
  if (!r) return toast('请先生成体检报告');
  TCM.store.push('wellness', r);
  renderHistory();
  toast('💾 体检报告已存入健康档案');
}

function renderHistory() {
  var list = TCM.store.get('wellness') || [];
  document.getElementById('wl-count').textContent = '共 ' + list.length + ' 份';
  var html = '';
  for (var i = 0; i < Math.min(list.length, 10); i++) {
    var r = list[i];
    html += '<div class="report-item" onclick="viewHistory(' + i + ')"><strong>' + r.name + '</strong> · 健康指数 ' + r.score + ' · ' + r.constitution +
      ' <span style="color:var(--text3);font-size:10px">' + new Date(r.time).toLocaleDateString('zh-CN') + '</span></div>';
  }
  document.getElementById('wl-reports').innerHTML = html || '<div style="padding:12px;color:var(--text3);font-size:12px">暂无体检记录</div>';
}

function viewHistory(i) {
  var list = TCM.store.get('wellness') || [];
  var r = list[i];
  if (r) renderReport(r);
}

renderQuestions();
renderHistory();
</script>

</script>
