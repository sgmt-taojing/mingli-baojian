<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#6b3a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="医师工作台">
<link rel="manifest" href="/pwa/manifest.json">
<link rel="apple-touch-icon" href="/pwa/icon-192.png">
<title>医师移动工作台 · 中医标准智能体</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0))}
.wrap{max-width:520px;margin:0 auto;padding:10px 12px}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 2px}
.top-bar h1{font-size:17px;color:var(--primary)}
.top-bar h1 small{font-size:10px;color:var(--text3);font-weight:400;display:block}
.doc-badge{font-size:11px;color:var(--text2);text-align:right}
.doc-badge b{color:var(--primary)}

.xlinks{display:flex;gap:8px;margin:4px 0 10px}
.xlinks a{flex:1;text-align:center;font-size:11px;padding:7px 4px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text2);text-decoration:none}
.xlinks a b{display:block;font-size:13px;margin-bottom:1px;color:var(--primary)}

/* 待办总览（首屏直出） */
.todos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.todo{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 4px;text-align:center;cursor:pointer}
.todo .n{font-size:22px;font-weight:700;color:var(--primary)}
.todo .n.hot{color:var(--accent)}
.todo .t{font-size:10px;color:var(--text2);margin-top:2px}

/* 底部 Tab 栏 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);display:flex;padding-bottom:env(safe-area-inset-bottom,0);z-index:50}
.tabbar button{flex:1;border:none;background:none;padding:8px 0 6px;font-size:10px;color:var(--text3);cursor:pointer;position:relative}
.tabbar button .ic{font-size:20px;display:block;margin-bottom:1px}
.tabbar button.on{color:var(--primary);font-weight:700}
.tabbar button .bdg{position:absolute;top:4px;right:50%;margin-right:-22px;background:var(--accent);color:#fff;font-size:9px;border-radius:8px;padding:0 5px;line-height:14px;min-width:14px}

.pane{display:none}
.pane.on{display:block}

.card{background:var(--card);border-radius:var(--radius);padding:12px;margin:8px 0;border:1px solid var(--border)}
.card h4{font-size:13px;color:var(--primary);margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.meta{font-size:11px;color:var(--text3);margin-bottom:6px}
.body-text{font-size:12px;color:var(--text2);line-height:1.6;white-space:pre-wrap}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:1px 6px;margin-right:4px}
.tag.red{background:#fdecea;color:var(--accent)}
.tag.green{background:#e8f7ee;color:var(--green)}
.tag.gold{background:#faf3e0;color:var(--gold)}
.tag.blue{background:#e8f0fe;color:var(--blue)}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:none;border-radius:8px;padding:9px;font-size:13px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--primary);color:#fff}
.btn.outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn.danger{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn:active{transform:scale(.97)}
.empty{text-align:center;color:var(--text3);font-size:12px;padding:26px 0}
.loading{text-align:center;color:var(--text3);font-size:12px;padding:20px 0}

/* 登录遮罩（医师验证码鉴权 · G10） */
.login-mask{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--card);border-radius:16px;border:1px solid var(--border);padding:24px 20px;width:100%;max-width:360px}
.login-card h2{font-size:16px;color:var(--primary);margin-bottom:4px}
.login-card p{font-size:11px;color:var(--text3);margin-bottom:16px}
.input{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;background:#fff}
.code-row{display:flex;gap:8px}
.code-row .input{flex:1}
.code-row .btn{flex:0 0 108px}
.login-err{color:var(--accent);font-size:11px;min-height:16px;margin-bottom:8px}
.offline-note{display:none;background:#fef3c7;color:#92600a;font-size:11px;border-radius:8px;padding:8px 10px;margin-bottom:10px}
</style>
</head>
<body>

<!-- 医师验证码登录（G10 鉴权，令牌仅存本页 sessionStorage） -->
<div class="login-mask" id="login-mask">
  <div class="login-card">
    <h2>🩺 医师移动工作台</h2>
    <p>手机验证码登录 · 审批/签发等操作全程留痕<br>辅助诊疗工具，最终诊疗决策由执业医师作出</p>
    <input class="input" id="login-phone" placeholder="医师手机号" inputmode="numeric" maxlength="11">
    <div class="code-row">
      <input class="input" id="login-code" placeholder="验证码" inputmode="numeric" maxlength="6">
      <button class="btn outline" id="login-code-btn" onclick="sendLoginCode()">获取验证码</button>
    </div>
    <div class="login-err" id="login-err"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">登录进入工作台</button>
  </div>
</div>

<div class="wrap">
  <div class="offline-note" id="offline-note">📡 当前离线：可浏览页面框架，数据与操作不可用（操作不会伪造成功）</div>
  <div class="top-bar">
    <h1>🩺 医师移动工作台<small>病历审批 · 药方确认 · 随访 · 急症 · 预约</small></h1>
    <div class="doc-badge" id="doc-badge"></div>
  </div>

  <div class="xlinks">
    <a href="doctor-dashboard.html"><b>🖥️ 桌面工作台</b>完整诊疗功能</a>
    <a href="home-tcm.html"><b>🏠 居家患者入口</b>患者侧自助服务</a>
    <a href="emergency.html"><b>🚑 急救指导</b>院前分诊话术</a>
  </div>

  <div class="todos" id="todos">
    <div class="todo" onclick="switchTab('emr')"><div class="n" id="n-emr">–</div><div class="t">待批病历</div></div>
    <div class="todo" onclick="switchTab('rx')"><div class="n" id="n-rx">–</div><div class="t">待审处方</div></div>
    <div class="todo" onclick="switchTab('followup')"><div class="n" id="n-fu">–</div><div class="t">待随访</div></div>
    <div class="todo" onclick="switchTab('emg')"><div class="n" id="n-emg">–</div><div class="t">急症待办</div></div>
  </div>

  <!-- ① 病历审批 -->
  <div class="pane" id="pane-emr">
    <div id="list-emr"><div class="loading">载入中…</div></div>
  </div>

  <!-- ② 药方确认 -->
  <div class="pane" id="pane-rx">
    <div id="list-rx"><div class="loading">载入中…</div></div>
  </div>

  <!-- ③ 随访处理 -->
  <div class="pane" id="pane-followup">
    <div id="list-fu"><div class="loading">载入中…</div></div>
  </div>

  <!-- ④ 急症转办 -->
  <div class="pane" id="pane-emg">
    <div id="oncall-card"></div>
    <div id="list-emg"><div class="loading">载入中…</div></div>
    <div class="card">
      <h4>➕ 登记应急事件</h4>
      <div class="code-row" style="margin-bottom:8px">
        <select class="input" id="emg-level" style="flex:1;margin:0">
          <option value="CRITICAL">CRITICAL 危重</option>
          <option value="WARNING">WARNING 警示</option>
          <option value="ROUTINE" selected>ROUTINE 一般</option>
        </select>
        <button class="btn primary" style="flex:0 0 96px" onclick="emgReport()">登记</button>
      </div>
      <input class="input" id="emg-symptoms" placeholder="症状简述（如：胸痛大汗 10 分钟）">
    </div>
  </div>

  <!-- ⑤ 排班预约（G12） -->
  <div class="pane" id="pane-appt">
    <div class="card" style="display:flex;gap:8px;align-items:center">
      <input class="input" id="appt-date" type="date" style="margin:0;flex:1" onchange="loadAppts()">
      <button class="btn outline" style="flex:0 0 72px" onclick="loadAppts()">刷新</button>
    </div>
    <div id="list-appt"><div class="loading">载入中…</div></div>
  </div>
</div>

<div class="tabbar">
  <button id="tab-emr" onclick="switchTab('emr')"><span class="ic">📋</span>病历审批<span class="bdg" id="bdg-emr" style="display:none"></span></button>
  <button id="tab-rx" onclick="switchTab('rx')"><span class="ic">🌿</span>药方确认<span class="bdg" id="bdg-rx" style="display:none"></span></button>
  <button id="tab-followup" onclick="switchTab('followup')"><span class="ic">📞</span>随访处理<span class="bdg" id="bdg-fu" style="display:none"></span></button>
  <button id="tab-emg" onclick="switchTab('emg')"><span class="ic">🚑</span>急症转办<span class="bdg" id="bdg-emg" style="display:none"></span></button>
  <button id="tab-appt" onclick="switchTab('appt')"><span class="ic">🗓️</span>排班预约</button>
</div>

<script>
'use strict';
var TOKEN = sessionStorage.getItem('mw_token') || '';
var DOCTOR = sessionStorage.getItem('mw_doctor') || '';
var CUR_TAB = 'emr';

function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (opts.body && typeof opts.body !== 'string') opts.body = JSON.stringify(opts.body);
  return fetch(path, opts).then(function(r){ return r.json(); });
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function toast(msg){ alert(msg); }

// ═══ 登录（G10 验证码鉴权）═══
function sendLoginCode() {
  var phone = document.getElementById('login-phone').value.trim();
  if (!/^1\d{10}$/.test(phone)) { document.getElementById('login-err').textContent = '请输入合法手机号'; return; }
  var btn = document.getElementById('login-code-btn'); btn.disabled = true;
  api('/api/sms/send-code', { method: 'POST', body: { phone: phone, scene: 'login' } }).then(function(d) {
    document.getElementById('login-err').textContent = d.ok ? ('验证码已发送（5 分钟有效）' + (d.mock ? '【模拟外发】' : '')) : (d.error || '发送失败');
    btn.disabled = false;
  }).catch(function(){ document.getElementById('login-err').textContent = '📡 服务离线'; btn.disabled = false; });
}
function doLogin() {
  var phone = document.getElementById('login-phone').value.trim();
  var code = document.getElementById('login-code').value.trim();
  api('/api/auth/login-phone', { method: 'POST', body: { phone: phone, code: code } }).then(function(d) {
    if (!d.ok) { document.getElementById('login-err').textContent = d.error || '登录失败'; return; }
    TOKEN = d.token; DOCTOR = (d.user && (d.user.name || d.user.username)) || phone;
    sessionStorage.setItem('mw_token', TOKEN);
    sessionStorage.setItem('mw_doctor', DOCTOR);
    enterWorkbench();
  }).catch(function(){ document.getElementById('login-err').textContent = '📡 服务离线'; });
}
function enterWorkbench() {
  document.getElementById('login-mask').style.display = 'none';
  document.getElementById('doc-badge').innerHTML = '<b>' + esc(DOCTOR) + '</b><br>已认证';
  refreshAll();
}
if (TOKEN) { enterWorkbench(); }
function syncOfflineNote() {
  document.getElementById('offline-note').style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('offline', syncOfflineNote);
window.addEventListener('online', syncOfflineNote);
syncOfflineNote();

// ═══ Tab 切换 ═══
var TABS = ['emr', 'rx', 'followup', 'emg', 'appt'];
function switchTab(t) {
  CUR_TAB = t;
  TABS.forEach(function(x) {
    document.getElementById('tab-' + x).classList.toggle('on', x === t);
    document.getElementById('pane-' + x).classList.toggle('on', x === t);
  });
  loadTab(t);
}
function setBdg(key, n) {
  var b = document.getElementById('bdg-' + key);
  b.style.display = n > 0 ? '' : 'none';
  b.textContent = n > 99 ? '99+' : n;
  var todoN = document.getElementById('n-' + key);
  if (todoN) { todoN.textContent = n; todoN.classList.toggle('hot', n > 0); }
}

// ═══ 数据加载 ═══
function refreshAll() { loadEmr(); loadRx(); loadFu(); loadEmg(); }
function loadTab(t) {
  if (t === 'emr') loadEmr();
  else if (t === 'rx') loadRx();
  else if (t === 'followup') loadFu();
  else if (t === 'emg') loadEmg();
  else if (t === 'appt') loadAppts();
}

// ① 病历审批：今日会话中 status=reviewing 的待签发病历
function loadEmr() {
  api('/api/clinic/sessions/today').then(function(d) {
    if (!d.ok) { document.getElementById('list-emr').innerHTML = '<div class="empty">📡 服务离线，数据不可用</div>'; return; }
    var list = (d.sessions || []).filter(function(s){ return s.status === 'reviewing'; });
    setBdg('emr', list.length);
    var box = document.getElementById('list-emr');
    if (!list.length) { box.innerHTML = '<div class="empty">✅ 暂无待审批病历</div>'; return; }
    box.innerHTML = list.map(function(s) {
      var name = s.patient || (s.profile && s.profile.name ? (s.profile.name.v || s.profile.name) : '') || '未命名';
      var syn = s.syndrome || (s.issued && (s.issued.syndrome || s.issued.diagnosis)) || '';
      var symptoms = s.symptoms || [];
      return '<div class="card"><h4>📋 ' + esc(name) + '<span class="tag blue">' + esc(s.sessionId.slice(-6)) + '</span></h4>' +
        '<div class="meta">' + esc((s.updatedAt || s.createdAt || '').slice(5, 16).replace('T', ' ')) + '</div>' +
        '<div class="body-text">' +
          (s.complaint ? '主诉：' + esc(s.complaint) + '\n' : '') +
          (Array.isArray(s.symptoms) && s.symptoms.length ? '症状：' + esc(s.symptoms.slice(0, 8).join('、')) + '\n' : '') +
          (syn ? '辨证：' + esc(syn) : '辨证：未定') +
        '</div>' +
        '<div class="actions">' +
          '<button class="btn primary" onclick="emrIssue(\'' + s.sessionId + '\')">✒️ 签发病历</button>' +
          '<button class="btn outline" onclick="emrReturn(\'' + s.sessionId + '\')">退回补充</button>' +
        '</div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list-emr').innerHTML = '<div class="empty">📡 服务离线</div>'; });
}
function emrIssue(id) {
  if (!confirm('确认签发该病历？签发后进入药房与随访流程。')) return;
  api('/api/clinic/session/' + id, { method: 'PUT', body: { status: 'issued' } }).then(function(d) {
    if (!d.ok) { toast(d.error || '签发失败'); return; }
    var fp = d.family_push;
    toast('病历已签发' + (fp && fp.pushed ? '，已同步家庭档案' : fp && fp.queued ? '，家庭端暂不可达已缓存待推' : ''));
    loadEmr();
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}
function emrReturn(id) {
  if (!confirm('退回该病历至采集阶段补充信息？')) return;
  api('/api/clinic/session/' + id, { method: 'PUT', body: { status: 'collecting' } }).then(function(d) {
    if (d.ok) loadEmr(); else toast(d.error || '操作失败');
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}

// ② 药方确认：review-queue 中 pending 处方
function loadRx() {
  api('/api/prescription/review-queue?status=pending').then(function(d) {
    if (!d.ok) { document.getElementById('list-rx').innerHTML = '<div class="empty">📡 服务离线，数据不可用</div>'; return; }
    var list = (d.queue || []).filter(function(r){ return r.status === 'pending' || r.status === 'pending_review'; });
    setBdg('rx', list.length);
    var box = document.getElementById('list-rx');
    if (!list.length) { box.innerHTML = '<div class="empty">✅ 暂无待确认处方</div>'; return; }
    box.innerHTML = list.map(function(r) {
      var herbs = (r.herbs || []).map(function(h){ return esc(h.name) + (h.dose ? h.dose + (h.unit || 'g') : ''); }).join('、');
      var warn = r.safety_check && r.safety_check.warning_count > 0;
      return '<div class="card"><h4>🌿 ' + esc((r.diagnosis && r.diagnosis.syndrome) || '处方') +
        (warn ? '<span class="tag red">⚠ ' + r.safety_check.warning_count + ' 项注意</span>' : '<span class="tag green">禁忌校验通过</span>') + '</h4>' +
        '<div class="meta">' + esc(r.rx_id) + ' · ' + esc((r.created_at || '').slice(5, 16).replace('T', ' ')) + ' · ' + (r.doses || 1) + ' 剂' + (r.price != null ? ' · ¥' + r.price : '') + '</div>' +
        '<div class="body-text">' + herbs + (r.advice ? '\n医嘱：' + esc(r.advice) : '') +
        (warn && r.safety_check.warnings ? '\n⚠ ' + esc(r.safety_check.warnings.slice(0, 3).join('；')) : '') + '</div>' +
        '<div class="actions">' +
          '<button class="btn primary" onclick="rxVerify(\'' + r.rx_id + '\',\'approve\')">✅ 确认</button>' +
          '<button class="btn danger" onclick="rxReject(\'' + r.rx_id + '\')">驳回</button>' +
        '</div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list-rx').innerHTML = '<div class="empty">📡 服务离线</div>'; });
}
function rxVerify(id, action, notes) {
  api('/api/prescription/verify', { method: 'POST', body: { rx_id: id, action: action, notes: notes || '' } }).then(function(d) {
    if (!d.ok) { toast(d.error || d.reason || '操作失败'); return; }
    toast(action === 'approve' ? '处方已确认，进入药房调配' : '已驳回');
    loadRx();
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}
function rxReject(id) {
  var notes = prompt('驳回原因（将通知开方医师）：');
  if (notes == null) return;
  rxVerify(id, 'reject', notes);
}

// ③ 随访处理：今日到期 + 已逾期
function loadFu() {
  api('/api/followup/list?due=today').then(function(d) {
    if (!d.ok) { document.getElementById('list-fu').innerHTML = '<div class="empty">📡 服务离线，数据不可用</div>'; return; }
    var list = d.list || [];
    setBdg('fu', list.length);
    var box = document.getElementById('list-fu');
    if (!list.length) { box.innerHTML = '<div class="empty">✅ 今日随访已清空</div>'; return; }
    var now = Date.now();
    box.innerHTML = list.map(function(f) {
      var overdue = f.due_at && new Date(f.due_at).getTime() < now;
      return '<div class="card"><h4>📞 ' + esc(f.patient_name || f.patient_id || '患者') +
        (overdue ? '<span class="tag red">已逾期</span>' : '<span class="tag gold">今日到期</span>') + '</h4>' +
        '<div class="meta">' + esc(f.type || '随访') + ' · 计划 ' + esc(String(f.due_at || '').slice(5, 16).replace('T', ' ')) + '</div>' +
        '<div class="body-text">' + esc(f.note || f.content || f.script || '') + '</div>' +
        '<div class="actions"><button class="btn primary" onclick="fuDone(\'' + f.id + '\')">✅ 完成随访</button></div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list-fu').innerHTML = '<div class="empty">📡 服务离线</div>'; });
}
function fuDone(id) {
  var fb = prompt('随访反馈（如：症状评分 0-10，服药后变化）：');
  if (fb == null) return;
  var m = fb.match(/(\d{1,2})\s*分/);
  api('/api/followup/complete', { method: 'POST', body: { id: id, feedback: fb, symptom_score: m ? parseInt(m[1], 10) : null } }).then(function(d) {
    if (d.ok) { toast('随访已完成'); loadFu(); } else toast(d.error || '操作失败');
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}

// ④ 急症转办：值班卡 + 待响应事件 + 登记
function loadEmg() {
  api('/api/emergency/oncall').then(function(d) {
    var c = document.getElementById('oncall-card');
    if (!d.ok) { c.innerHTML = ''; return; }
    var oc = d.oncall;
    c.innerHTML = '<div class="card"><h4>🛡️ 今日值班' + (d.weekend ? '<span class="tag red">周末快速响应</span>' : '<span class="tag green">工作日</span>') + '</h4>' +
      '<div class="body-text">' + (oc ? '值班责任：' + esc(oc.name) + '（' + esc(oc.title || '') + ' ' + esc(oc.specialty_name || '') + ' · ' + esc(oc.mode) + '）' : '今日无排班') +
      '\n响应 SLA：' + Math.round((d.sla_seconds || 300) / 60) + ' 分钟' +
      (d.duty && d.duty.length > 1 ? '\n在岗：' + d.duty.map(function(x){ return esc(x.name); }).join('、') : '') + '</div></div>';
  }).catch(function(){});
  api('/api/emergency/events').then(function(d) {
    if (!d.ok) { document.getElementById('list-emg').innerHTML = '<div class="empty">📡 服务离线，数据不可用</div>'; return; }
    var list = (d.events || d.list || []).filter(function(e){ return e.status === 'pending'; });
    setBdg('emg', list.length);
    var box = document.getElementById('list-emg');
    if (!list.length) { box.innerHTML = '<div class="empty">✅ 无待响应急症事件</div>'; return; }
    box.innerHTML = list.map(function(e) {
      var lv = e.level === 'CRITICAL' ? 'red' : e.level === 'WARNING' ? 'gold' : 'blue';
      return '<div class="card"><h4>🚑 ' + esc(e.level || 'ROUTINE') + '<span class="tag ' + lv + '">' + esc((e.created_at || '').slice(11, 16)) + '</span></h4>' +
        '<div class="body-text">' + esc(e.symptoms || '') + (e.source ? '\n来源：' + esc(e.source) : '') + '</div>' +
        '<div class="actions"><button class="btn primary" onclick="emgRespond(\'' + e.id + '\')">📣 签收响应</button></div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list-emg').innerHTML = '<div class="empty">📡 服务离线</div>'; });
}
function emgRespond(id) {
  api('/api/emergency/respond', { method: 'POST', body: { id: id } }).then(function(d) {
    if (!d.ok) { toast(d.error || '操作失败'); return; }
    var e = d.event || {};
    toast('已签收，响应用时 ' + (e.response_seconds != null ? e.response_seconds + ' 秒' : '—') + (e.within_sla ? '（SLA 达标）' : ''));
    loadEmg();
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}
function emgReport() {
  var level = document.getElementById('emg-level').value;
  var sym = document.getElementById('emg-symptoms').value.trim();
  if (!sym) { toast('请填写症状简述'); return; }
  api('/api/emergency/event', { method: 'POST', body: { level: level, symptoms: sym, source: 'mobile-workbench' } }).then(function(d) {
    if (d.ok) { document.getElementById('emg-symptoms').value = ''; toast('已登记入应急台账'); loadEmg(); }
    else toast(d.error || '登记失败');
  }).catch(function(){ toast('📡 服务离线，操作未执行'); });
}

// ⑤ 排班预约（G12 移动端入口）
function loadAppts() {
  var date = document.getElementById('appt-date').value || new Date().toLocaleDateString('sv-SE');
  api('/api/clinic/appointment/list?date=' + date).then(function(d) {
    if (!d.ok) { document.getElementById('list-appt').innerHTML = '<div class="empty">📡 服务离线，数据不可用</div>'; return; }
    var list = d.appointments || [];
    var box = document.getElementById('list-appt');
    if (!list.length) { box.innerHTML = '<div class="empty">当日暂无预约</div>'; return; }
    box.innerHTML = list.map(function(a) {
      var color = a.status === 'booked' ? 'gold' : a.status === 'checked_in' ? 'blue' : a.status === 'done' ? 'green' : 'red';
      return '<div class="card"><h4>🗓️ ' + esc(a.slot) + ' · ' + esc(a.patient_name) +
        '<span class="tag ' + color + '">' + esc(a.status_label || a.status) + '</span></h4>' +
        '<div class="meta">' + esc(a.doctor_name) + (a.phone_masked ? ' · ' + esc(a.phone_masked) : '') + '</div></div>';
    }).join('');
  }).catch(function(){ document.getElementById('list-appt').innerHTML = '<div class="empty">📡 服务离线</div>'; });
}

// 初始化：URL 指定 tab（manifest shortcuts），默认病历审批
document.getElementById('appt-date').value = new Date().toLocaleDateString('sv-SE');
var initTab = (location.search.match(/[?&]tab=(\w+)/) || [])[1];
if (initTab === 'followup') initTab = 'followup';
if (TABS.indexOf(initTab) >= 0) switchTab(initTab); else switchTab('emr');
</script>
