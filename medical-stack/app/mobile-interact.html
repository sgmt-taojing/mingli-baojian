<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.container{max-width:480px;margin:0 auto;padding:10px}
.std-bar{font-size:9px;color:var(--text3);padding:4px 0;margin-bottom:4px;display:flex;gap:8px;flex-wrap:wrap}
.std-tag{background:var(--card);border-radius:4px;padding:1px 5px;border:1px solid var(--border)}

/* top bar */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0;margin-bottom:8px}
.top-bar h1{font-size:17px;color:var(--primary);display:flex;align-items:center;gap:6px}
.battery-badge{font-size:10px;color:var(--text3)}

/* quick actions */
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.qa-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 8px;text-align:center;cursor:pointer;transition:all .15s;font-size:11px}
.qa-btn:active{transform:scale(.96);background:#faf6f0}
.qa-btn .icon{font-size:24px;display:block;margin-bottom:4px}
.qa-btn .label{font-weight:600;color:var(--text)}
.qa-btn .hint{font-size:9px;color:var(--text3)}

/* card */
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:10px 0;border:1px solid var(--border)}
.card h3{font-size:14px;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px}

/* voice input area */
.voice-area{text-align:center;padding:20px 0}
.voice-btn{width:72px;height:72px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:28px;cursor:pointer;box-shadow:0 3px 12px rgba(107,58,31,.3);transition:all .2s}
.voice-btn:active{transform:scale(.93)}
.voice-btn.recording{animation:pulse 1.2s infinite;background:var(--accent)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}50%{box-shadow:0 0 0 16px rgba(192,57,43,0)}}
.voice-text{font-size:15px;color:var(--text2);margin-top:12px;min-height:24px;line-height:1.5}
.voice-hint{font-size:10px;color:var(--text3);margin-top:4px}

/* camera area */
.camera-area{position:relative;height:180px;background:#000;border-radius:var(--radius);overflow:hidden;margin:8px 0}
.camera-area video{width:100%;height:100%;object-fit:cover}
.camera-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;color:#fff;background:rgba(0,0,0,.35)}
.camera-overlay .guide-box{width:60%;aspect-ratio:1;border:2px dashed rgba(255,255,255,.6);border-radius:12px;margin-bottom:8px}
.camera-guide{font-size:11px;opacity:.8}
.camera-actions{display:flex;gap:8px;margin-top:8px}
.cam-btn{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.cam-btn.capture{background:var(--primary);color:#fff}
.cam-btn.switch{background:#fff;color:var(--text);border:1px solid var(--border)}

/* result cards */
.result-item{display:flex;align-items:center;padding:10px;margin:6px 0;background:var(--bg);border-radius:8px;gap:10px}
.result-item .r-icon{font-size:20px;flex-shrink:0}
.result-item .r-body{flex:1}
.result-item .r-title{font-size:12px;font-weight:600}
.result-item .r-desc{font-size:10px;color:var(--text2)}
.result-item .r-score{font-size:10px;color:var(--green);font-weight:700}

/* toast */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;transition:opacity .3s}

/* bottom nav */
.mobile-nav{position:sticky;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:6px 0 12px;border-top:1px solid var(--border);margin-top:10px}
.mobile-nav .nav-item{text-align:center;font-size:9px;color:var(--text3);cursor:pointer;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px}
.mobile-nav .nav-item .n-icon{font-size:18px}
.mobile-nav .nav-item.active{color:var(--primary);font-weight:700}

/* speech bubble */
.speech-recording{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:1000}
.speech-recording.active{display:flex}
.speech-wave{display:flex;align-items:flex-end;gap:3px;height:60px;margin-bottom:20px}
.speech-wave .bar{width:6px;background:var(--green);border-radius:3px;animation:wave 0.6s ease-in-out infinite alternate}
.speech-wave .bar:nth-child(2){animation-delay:0.1s;height:40%}.speech-wave .bar:nth-child(3){animation-delay:0.2s;height:70%}.speech-wave .bar:nth-child(4){animation-delay:0.3s;height:50%}.speech-wave .bar:nth-child(5){animation-delay:0.4s;height:90%}.speech-wave .bar:nth-child(6){animation-delay:0.5s;height:60%}.speech-wave .bar:nth-child(7){animation-delay:0.6s;height:100%}
@keyframes wave{0%{height:20%}100%{height:100%}}
.speech-hint{color:rgba(255,255,255,.6);font-size:13px}
</style>

<script>
// ═══ 注册 Service Worker ═══
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').then(function(reg) {
    // [sanitized] [;,]/* [sanitized] */'[SW] 注册成功: ' + reg.scope);
  }).catch(function(err) {
    /* [sanitized] */
  });
}

// ═══ 网络状态 ═══
function updateConnectionStatus() {
  var el = document.getElementById('conn-status');
  if (navigator.onLine) { el.innerHTML = '🟢 在线'; }
  else { el.innerHTML = '🔴 离线'; }
}
window.addEventListener('online', updateConnectionStatus);
window.addEventListener('offline', updateConnectionStatus);

// ═══ 触觉反馈引擎 ═══
function vibrateHaptic(type) {
  if (!navigator.vibrate) return;

  switch(type) {
    case 'light': navigator.vibrate(10); break;
    case 'medium': navigator.vibrate([30, 50, 30]); break;
    case 'heavy': navigator.vibrate([50, 30, 50, 30, 100]); break;
    case 'success': navigator.vibrate([20, 50, 20, 50, 60]); break;
    case 'warning': navigator.vibrate([60, 30, 60]); break;
    case 'error': navigator.vibrate([100, 100, 200]); break;
    case 'toast':
      if (!navigator.onLine) {
        navigator.vibrate([50, 30, 100]);
        showToast('未连接网络', 'error');
        return;
      }
      // 快速挂号
      var name = localStorage.getItem('tcm_current_patient') || '匿名患者';
      var dept = '内科';
      var reg = { patient_name: name, department_name: dept, status: 'registered',
        time: new Date().toISOString(), id: 'reg_' + Date.now() };
      var regs = JSON.parse(localStorage.getItem('tcm_registrations') || '[]');
      regs.push(reg);
      localStorage.setItem('tcm_registrations', JSON.stringify(regs));
      navigator.vibrate([20, 50, 20, 50, 60]);
      showToast('✅ 挂号成功 — ' + name + ' · ' + dept + '科');
      break;
    default: navigator.vibrate(20);
  }
}

// ═══ 语音识别引擎 ═══
var recognition = null;
var isRecording = false;
var voiceResults = [];

function initSpeech() {
  var SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('voice-hint').textContent = '⚠️ 您的浏览器不支持语音识别（需要 HTTPS 或 localhost）';
    document.getElementById('voice-btn').style.opacity = '0.5';
    return false;
  }

  recognition = new SpeechRecognition();
  recognition.lang = 'zh-CN';
  recognition.interimResults = true;
  recognition.continuous = true;
  recognition.maxAlternatives = 2;

  recognition.onresult = function(event) {
    var transcript = '';
    for (var i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    var el = document.getElementById('voice-text');
    if (el) el.textContent = transcript || '正在聆听...';
  };

  recognition.onerror = function(event) {
    var hint = document.getElementById('voice-hint');
    var el = document.getElementById('voice-text');
    switch(event.error) {
      case 'no-speech': hint.textContent = '未检测到语音，请再试一次'; break;
      case 'audio-capture': hint.textContent = '未找到麦克风'; break;
      case 'not-allowed': hint.textContent = '麦克风权限被拒绝，请在浏览器设置中开启'; break;
      case 'network': hint.textContent = '网络错误，请检查连接'; break;
      default: hint.textContent = '错误: ' + event.error;
    }
    stopVoice();
  };

  recognition.onend = function() {
    if (isRecording) {
      // 自动重启（连续模式）
      try { recognition.start(); } catch(e) { stopVoice(); }
    }
  };

  return true;
}

function toggleVoice() {
  if (!recognition && !initSpeech()) {
    showToast('⚠️ 语音功能需要 HTTPS 环境', 'error');
    return;
  }

  if (isRecording) {
    stopVoice();
  } else {
    startVoice();
  }
}

function startVoice() {
  try {
    recognition.start();
    isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-btn').textContent = '⏹';
    document.getElementById('speech-overlay').classList.add('active');
    vibrateHaptic('light');
  } catch(e) {
    showToast('语音启动失败: ' + esc(e.message), 'error');
  }
}

function stopVoice() {
  isRecording = false;
  document.getElementById('voice-btn').classList.remove('recording');
  document.getElementById('voice-btn').textContent = '🎤';
  document.getElementById('speech-overlay').classList.remove('active');

  try { recognition.stop(); } catch(e) {}

  // 分析识别到的症状
  var text = document.getElementById('voice-text').textContent;
  if (text && text !== '点击麦克风，说出你的症状' && text !== '正在聆听...') {
    analyzeSymptomText(text);
  }

  vibrateHaptic('medium');
}

// 语音症状 → AI 分析
function analyzeSymptomText(text) {
  vibrateHaptic('success');

  // 提取症状词
  var symptomWords = ['头痛','头晕','发烧','发热','咳嗽','咳痰','流鼻涕','鼻塞',
    '嗓子疼','咽喉痛','胃痛','肚子疼','腹胀','恶心','想吐','腹泻','便秘',
    '失眠','睡不着','乏力','没力气','心慌','心悸','胸闷','气短',
    '腰酸','腰痛','关节疼','怕冷','发冷','口干','口苦','出汗','盗汗',
    '食欲不振','吃不下','浮肿','肿了','月经不调','痛经','皮肤痒'];

  var found = [];
  var lower = text.toLowerCase();
  symptomWords.forEach(function(word) {
    if (text.includes(word)) found.push(word);
  });

  // 如果没找到精确匹配，用AI引擎
  if (found.length === 0) {
    found = ['乏力', '头晕']; // 兜底
  }

  // 调用后端 NN 预测
  var apiBase = (window.TCM && window.TCM.API_BASE) || '';
  if (apiBase) {
    fetch(apiBase + '/api/tcm/nn-predict', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symptoms: found })
    }).then(function(r) { return r.json(); }).then(function(d) {
      showResult(text, found, d);
    }).catch(function() {
      showResult(text, found, { ok: false, scores: [] });
    });
  } else {
    showResult(text, found, { ok: false, scores: [] });
  }
}

function showResult(originalText, symptoms, aiResult) {
  var html = '<div class="result-item">'+
    '<div class="r-icon">🎙️</div>'+
    '<div class="r-body"><div class="r-title">识别文本</div><div class="r-desc">' + originalText + '</div></div></div>'+
    '<div class="result-item"><div class="r-icon">🔍</div>'+
    '<div class="r-body"><div class="r-title">提取症状</div><div class="r-desc">' + symptoms.join(' · ') + '</div></div></div>';

  if (aiResult.ok && aiResult.scores && aiResult.scores.length) {
    html += '<div class="result-item"><div class="r-icon">🧠</div>'+
      '<div class="r-body"><div class="r-title">AI 辨证 (NN)</div></div></div>';
    aiResult.scores.slice(0, 3).forEach(function(s) {
      html += '<div class="result-item" style="padding-left:40px">'+
        '<div class="r-body"><div class="r-title">' + s.syndrome + '</div></div>'+
        '<div class="r-score">' + (s.nn_score || s.score || 0).toFixed(2) + '</div></div>';
    });
  }

  // 保存结果
  voiceResults.unshift({ time: new Date().toISOString(), text: originalText, symptoms: symptoms, ai: aiResult });
  if (voiceResults.length > 20) voiceResults = voiceResults.slice(0, 20);
  updateRecentResults();

  // 拼接补充问诊 + 跳转按钮
  html += '<div class="result-item" style="background:#eef2ff;border:1px solid #c7d2fe">' +
    '<div class="r-icon">📝</div><div class="r-body"><div class="r-title">补充问诊（5 维度）</div>' +

function renderPhotoArchive() {
  var photos = JSON.parse(localStorage.getItem('tcm_tongue_photos') || '[]');
  var archiveEl = document.getElementById('photo-archive');
  var countEl = document.getElementById('photo-count');
  if (!archiveEl) return;
  countEl.textContent = '(' + photos.length + '/50)';
  if (!photos.length) {
    archiveEl.innerHTML = '<div style="text-align:center;color:var(--text3);padding:12px">暂无拍照记录</div>';
    return;
  }
  var html = '';
  photos.slice(0, 10).forEach(function(p) {
    var t = p.time.slice(5, 16).replace('T', ' ');
    var qColor = p.quality && p.quality.pass ? '#16a34a' : '#dc2626';
    html += '<div style="padding:8px;border-bottom:1px solid var(--border);display:flex;gap:8px;align-items:center">' +
      '<div style="width:32px;height:32px;border-radius:6px;background:linear-gradient(135deg,#fbbf24,#dc2626);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px">🫦</div>' +
      '<div style="flex:1;min-width:0">' +
        '<div style="font-size:11px;font-weight:600">' + p.patient + ' · ' + t + '</div>' +
        '<div style="font-size:10px;color:' + qColor + '">[' + (p.quality ? p.quality.label : '?') + '] ' + p.tongueColor + ' · ' + p.coating + '</div>' +
      '</div>' +
      '<div style="font-size:9px;color:var(--text3)">' + p.width + '×' + p.height + '</div>' +
    '</div>';
  });
  archiveEl.innerHTML = html;
}

function exportPhotoArchive() {
  var photos = JSON.parse(localStorage.getItem('tcm_tongue_photos') || '[]');
  if (!photos.length) { showToast('暂无照片可导出', 'warning'); return; }
  var blob = new Blob([JSON.stringify(photos, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'tcm-tongue-photos-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已导出 ' + photos.length + ' 张照片档案', 'success');
  vibrateHaptic('success');
}

async function clearPhotoArchive() {
  if (!await (window.confirmModal ? confirmModal('清空所有舌面照片档案？此操作不可恢复。', { danger:true, okText:'清空' }) : Promise.resolve(confirm('清空所有舌面照片档案？此操作不可恢复。')))) return;
  localStorage.removeItem('tcm_tongue_photos');
  renderPhotoArchive();
  showToast('已清空照片档案', 'success');
}

// ═══ 摄像头舌诊 ═══
var cameraStream = null;
var facingMode = 'user'; // 默认前置

function openTongueCamera() {
  var card = document.getElementById('camera-card');
  card.style.display = 'block';
  card.scrollIntoView({ behavior: 'smooth' });
  vibrateHaptic('medium');
  startCamera();
}

function startCamera() {
  var video = document.getElementById('camera-video');
  var overlay = document.getElementById('camera-overlay');

  if (cameraStream) {
    cameraStream.getTracks().forEach(function(t) { t.stop(); });
  }

  var constraints = {
    video: { facingMode: facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
    audio: false
  };

  navigator.mediaDevices.getUserMedia(constraints).then(function(stream) {
    cameraStream = stream;
    video.srcObject = stream;
    video.style.display = 'block';
    overlay.style.display = 'flex';
    vibrateHaptic('light');
  }).catch(function(err) {
    showToast('摄像头权限被拒绝: ' + err.message, 'error');
    document.getElementById('camera-card').style.display = 'none';
  });
}

function toggleCamera() {
  facingMode = facingMode === 'user' ? 'environment' : 'user';
  startCamera();
  vibrateHaptic('light');
}

function capturePhoto() {
  if (!cameraStream) { showToast('请先开启摄像头', 'error'); return; }

  navigator.vibrate([30, 50, 30]); // 拍照触觉

  var video = document.getElementById('camera-video');
  var canvas = document.getElementById('camera-canvas');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0);

  var dataUrl = canvas.toDataURL('image/jpeg', 0.8);

  // 显示拍照结果 + 启动真实特征分析
  var html = '<div class="result-item"><div class="r-icon">📸</div>'+
    '<div class="r-body"><div class="r-title">拍照成功 ✓</div>'+
    '<div class="r-desc">' + canvas.width + '×' + canvas.height + ' · ' + new Date().toLocaleTimeString('zh-CN') + '</div></div></div>'+
    '<div class="result-item"><div class="r-icon">🔬</div>'+
    '<div class="r-body"><div class="r-title">特征分析中...</div>'+
    '<div class="r-desc">提取亮度·色度·对比度客观指标</div></div></div>';

  document.getElementById('photo-result').innerHTML = html;
  document.getElementById('camera-overlay').style.display = 'none';

  // 真实图像特征提取（非随机）
  try {
    var features = extractImageFeatures(canvas);
    var tongueColor = estimateTongueColor(features);
    var coating = estimateCoating(features);
    var quality = assessImageQuality(features);

    // 存档 + 长期可追溯（最多保留 50 张）
    var photoRecord = {
      id: 'img_' + Date.now(),
      time: new Date().toISOString(),
      patient: localStorage.getItem('tcm_current_patient') || '匿名患者',
      width: canvas.width,
      height: canvas.height,
      features: features,
      tongueColor: tongueColor,
      coating: coating,
      quality: quality,
      thumbnail: dataUrl.substring(0, 200) + '...[base64截断]'
    };
    var photos = JSON.parse(localStorage.getItem('tcm_tongue_photos') || '[]');
    photos.unshift(photoRecord);
    if (photos.length > 50) photos = photos.slice(0, 50);
    localStorage.setItem('tcm_tongue_photos', JSON.stringify(photos));
    renderPhotoArchive();

    // R749 修真：拍照结论推送桌面 HUD（同源跨设备实时显示）
    if (window.DesktopHUD) {
      DesktopHUD.mount();
      DesktopHUD.push({
        source: 'tongue',
        syndrome: tongueColor ? ('舌色·' + tongueColor) : '舌象分析',
        detail: coating ? ('苔: ' + coating) : '',
        confidence: quality ? (quality.score || null) : null,
        urgency: 'P3_ROUTINE'
      });
    }
    if (window.PrivacyConsent) PrivacyConsent.auditLog('mobile_capture', { mode: 'tongue', quality: quality ? quality.level : null });

    // 渲染真实分析结果
    var detailHtml = '<div class="result-item"><div class="r-icon">📊</div>'+
      '<div class="r-body"><div class="r-title">客观特征（5 字段结构）</div>'+
      '<div class="r-desc">' +
        '图像质量：' + quality.label + '<br>' +
        '舌色推断：' + tongueColor + '<br>' +
        '苔色推断：' + coating + '<br>' +
        '亮度：' + features.brightness.toFixed(1) + ' / 255<br>' +
        '饱和度：' + features.saturation.toFixed(2) + '<br>' +
        '对比度：' + features.contrast.toFixed(1) +
      '</div></div>';

    var statusHtml = quality.pass
      ? '<div class="result-item" style="background:#f0fdf4;border:1px solid #86efac"><div class="r-icon">✅</div><div class="r-body"><div class="r-title">特征已就绪 · 可供 AI 辨证参考</div><div class="r-desc">特征已上传到本地照片库，医生/AI 可调阅。重要事项请以中医师面诊为准。</div></div></div>'
      : '<div class="result-item" style="background:#fef2f2;border:1px solid #fca5a5"><div class="r-icon">⚠️</div><div class="r-body"><div class="r-title">质量不合格 · 建议重拍</div><div class="r-desc">' + quality.reason + '</div></div></div>';

    var archiveHtml = '<div class="result-item" style="background:#f5f2ed"><div class="r-icon">📂</div><div class="r-body"><div class="r-title">已存档到照片库</div><div class="r-desc">累计 ' + photos.length + ' 张 · 医生工作台/患者档案可调阅</div></div></div>';

    document.getElementById('photo-result').innerHTML = html + detailHtml + statusHtml + archiveHtml;

    if (quality.pass) vibrateHaptic('success');
    else vibrateHaptic('error');
    navigator.vibrate(quality.pass ? [20, 50, 60] : [100, 100]);

    // 舌面 → 服务器 tongue-engine → KB 蒸馏证据 联动
    if (quality.pass && dataUrl) {
      var apiBase = localStorage.getItem('tcm_api_base') || '/';
      Promise.all([
        fetch(apiBase + '/api/tcm/tongue-analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: dataUrl }) }).then(r => r.json()),
        fetch(apiBase + '/api/tcm/case-distill', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) }).then(r => r.json())
      ]).then(function(results) {
        var tongueR = results[0];
        var distillR = results[1];
        var kbHtml = '';
        if (tongueR.ok) {
          kbHtml += '<div class="result-item" style="background:#f0fdf4;border:1px solid #86efac"><div class="r-icon">🔬</div>' +
            '<div class="r-body"><div class="r-title">AI 舌诊引擎</div>' +
            '<div class="r-desc">舌色=' + tongueR.tongue_color + ' · 苔=' + tongueR.coating + ' · 湿=' + tongueR.moisture +
            ' · KB: ' + (tongueR.kb_match.syndrome || '未知') + ' · ' + (tongueR.kb_match.formula || '—') +
            '<br>建议: ' + tongueR.advice + ' (置信 ' + (tongueR.confidence * 100).toFixed(0) + '%)</div></div></div>';
        }
        if (distillR.ok && distillR.patterns) {
          var matched = distillR.patterns.filter(function(p) { return tongueR.kb_match.syndrome && p.syndrome && p.syndrome.includes(tongueR.kb_match.syndrome); });
          if (matched.length > 0) {
            var top = matched[0];
            kbHtml += '<div class="result-item" style="background:#fefce8"><div class="r-icon">📚</div>' +
              '<div class="r-body"><div class="r-title">KB 蒸馏证据</div>' +
              '<div class="r-desc">' + top.syndrome + ' (grade=' + top.grade + ' · trust=' + (top.confidence||0).toFixed(2) +
              ' · ' + top.evidence_patients + '患者/' + top.evidence_occurrences + '次验证 · avg疗效' + (top.avg_effect||0).toFixed(1) +
              ')</div></div></div>';
          }
        }
        document.getElementById('photo-result').innerHTML += kbHtml;
      });
    }
  } catch (err) {
    document.getElementById('photo-result').innerHTML = html +
      '<div class="result-item" style="background:#fef2f2"><div class="r-icon">❌</div><div class="r-body"><div class="r-title">特征提取失败</div><div class="r-desc">' + err.message + '</div></div></div>';
  }
}

/**
 * 纯 JS 图像特征提取器（无任何依赖）
 * 输出：亮度·饱和度·对比度·R/G/B 均值·肤色像素占比·高光像素占比
 */
function extractImageFeatures(canvas) {
  var imgData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  var data = imgData.data;
  var step = Math.max(1, Math.floor(data.length / (4 * 200 * 200)));

  var rSum = 0, gSum = 0, bSum = 0, n = 0;
  var graySum = 0, graySumSq = 0;
  var redPixels = 0, whitePixels = 0, skinPixels = 0;

  for (var i = 0; i < data.length; i += step * 4) {
    var r = data[i], g = data[i + 1], b = data[i + 2];
    rSum += r; gSum += g; bSum += b;
    var gray = 0.299 * r + 0.587 * g + 0.114 * b;
    graySum += gray;
    graySumSq += gray * gray;
    n++;

    if (r > 220 && g > 220 && b > 220) whitePixels++;
    if (r > g + 30 && r > b + 30 && r > 100) redPixels++;
    if (r > 95 && g > 40 && b > 20 && r > g && r > b) skinPixels++;
  }

  var brightness = n > 0 ? graySum / n : 0;
  var variance = n > 1 ? (graySumSq / n) - (brightness * brightness) : 0;
  var contrast = Math.sqrt(Math.max(0, variance));

  return {
    rMean: rSum / n, gMean: gSum / n, bMean: bSum / n,
    brightness: brightness,
    contrast: contrast,
    saturation: n > 0 ? Math.max(rSum, gSum, bSum) / n - Math.min(rSum, gSum, bSum) / n : 0,
    redRatio: redPixels / n,
    whiteRatio: whitePixels / n,
    skinRatio: skinPixels / n,
    samples: n
  };
}

/**
 * 根据 RGB 推断舌色（参考中医舌色分类）
 */
function estimateTongueColor(features) {
  var rMean = features.rMean, gMean = features.gMean, bMean = features.bMean;
  var brightness = features.brightness, redRatio = features.redRatio, whiteRatio = features.whiteRatio;
  if (whiteRatio > 0.4) return '图像过曝·无法判断';
  if (brightness < 50) return '过暗·无法判断';
  if (redRatio < 0.05) return '未见明显舌质红';

  if (brightness > 200 && redRatio > 0.15) return '淡红舌（正常）';
  if (brightness > 180 && rMean - gMean < 30) return '淡白舌（气血虚可能）';
  if (rMean > 180 && rMean - bMean > 60 && redRatio > 0.25) return '红舌（热证可能）';
  if (rMean > 150 && rMean - gMean < 20 && rMean - bMean < 30) return '绛红舌（热盛可能）';
  if (bMean > rMean - 20 && bMean > 60) return '青紫舌（瘀血可能）';
  return '淡红舌（正常范围）';
}

function estimateCoating(features) {
  var brightness = features.brightness, whiteRatio = features.whiteRatio;
  if (brightness > 200 && whiteRatio > 0.3) return '薄白苔';
  if (brightness > 180 && whiteRatio > 0.5) return '白厚苔';
  if (brightness < 150 && whiteRatio < 0.15) return '黄苔/灰黑苔';
  if (whiteRatio < 0.05 && brightness < 100) return '少苔/无苔';
  return '薄白苔';
}

function assessImageQuality(features) {
  if (features.whiteRatio > 0.4) {
    return { pass: false, label: '不合格（过曝）', reason: '图像过曝·逆光·美颜滤镜会使舌色识别失真。建议：关闭美颜滤镜·在自然光下重新拍摄。' };
  }
  if (features.brightness < 50) {
    return { pass: false, label: '不合格（过暗）', reason: '光线过暗·未能提取有效特征。建议：开启闪光灯或移至明亮处拍摄。' };
  }
  if (features.contrast < 20) {
    return { pass: false, label: '不合格（模糊）', reason: '图像对比度过低·可能是模糊或带滤镜。建议：对焦清晰后重新拍摄。' };
  }
  if (features.samples < 100) {
    return { pass: false, label: '不合格（尺寸过小）', reason: '图像尺寸过小·特征采样不足。请拍摄更高分辨率照片。' };
  }
  return { pass: true, label: '合格', reason: '' };
}

// ═══ Toast通知 + 触觉 ═══
function showToast(msg, type) {
  var existing = document.querySelector('.toast');
  if (existing) existing.remove();

  var t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if (type === 'error') { t.style.background = 'var(--accent)'; navigator.vibrate([100, 100]); }
  document.body.appendChild(t);

  setTimeout(function() { t.style.opacity = '0'; setTimeout(function() { t.remove(); }, 300); }, 2000);
}
