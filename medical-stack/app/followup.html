<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--green:#16a34a;--blue:#2563eb;--accent:#c0392b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:16px;display:flex;justify-content:space-between}
.header h1{font-size:18px}
.container{max-width:1000px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat{background:var(--card);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat .v{font-size:24px;font-weight:700;color:var(--primary)}
.stat .l{font-size:10px;color:var(--text3)}
.card{background:var(--card);border-radius:10px;padding:16px;margin:12px 0;border:1px solid var(--border)}
.card h3{font-size:15px;color:var(--primary);margin-bottom:8px}
.followup-item{display:flex;align-items:center;gap:12px;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
.followup-item .info{flex:1}
.followup-item .badge{font-size:10px;padding:3px 8px;border-radius:10px}
.badge.today{background:#fef2f2;color:var(--accent)}
.badge.tomorrow{background:#fffbeb;color:#b8860b}
.badge.done{background:#f0fdf4;color:var(--green)}
.badge.overdue{background:#f5f0ff;color:#7c3aed}
.template-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.template-item{padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer;font-size:12px}
.template-item:hover{border-color:var(--primary)}
.btn{display:inline-block;padding:8px 16px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.small{padding:4px 10px;font-size:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
</style>

<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>

<div class="std-bar"><span class="std-tag">👥 使用对象 <b>医生</b></span><span class="std-tag">⚙️ 功能 <b>随访管理</b></span><span class="std-tag">💎 使用价值 <b>4类模板+逾期检测+消息发送</b></span></div>
<div class="header"><h1>📞 随访管理</h1><a href="admin.html" style="color:rgba(255,255,255,.6);font-size:11px;text-decoration:none">← 返回</a></div>
<div class="container">
  <div class="stats">
    <div class="stat"><div class="v" id="s-today">0</div><div class="l">今日待随访</div></div>
    <div class="stat"><div class="v" id="s-week">0</div><div class="l">本周待随访</div></div>
    <div class="stat"><div class="v" id="s-overdue">0</div><div class="l">逾期未访</div></div>
    <div class="stat"><div class="v" id="s-done">0</div><div class="l">本周已完成</div></div>
  </div>

  <div class="card">
    <h3>📋 随访模板</h3>
    <div class="template-grid">
      <div class="template-item" onclick="sendFollowup('initial')">
        <strong>🏥 初次就诊后随访</strong><br>
        <span style="font-size:10px;color:var(--text3)">就诊后3天 · 询问服药反应/症状变化</span>
      </div>
      <div class="template-item" onclick="sendFollowup('chronic')">
        <strong>🔄 慢性病随访</strong><br>
        <span style="font-size:10px;color:var(--text3)">每2周 · 评估疗效/调整方案</span>
      </div>
      <div class="template-item" onclick="sendFollowup('post_rx')">
        <strong>💊 用药后随访</strong><br>
        <span style="font-size:10px;color:var(--text3)">服药7天 · 询问效果/不良反应</span>
      </div>
      <div class="template-item" onclick="sendFollowup('health')">
        <strong>🩺 健康管理随访</strong><br>
        <span style="font-size:10px;color:var(--text3)">每月 · 体质评估/生活指导</span>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>📞 今日随访列表</h3>
    <div id="followup-list" style="margin-top:8px"></div>
  </div>

  <div class="card">
    <h3>✅ 最近完成的随访</h3>
    <div id="completed-list"></div>
  </div>

  <!-- R819: 运营商通道派发台账 -->
  <div class="card">
    <h3>📡 运营商通道 · 派发台账 <span style="font-size:10px;color:var(--text3);font-weight:normal">AI语音/短信/5G消息 · 回执自动回填随访</span></h3>
    <div id="dispatch-panel" style="font-size:12px">加载中...</div>
  </div>
</div>
<script>
const templates = {
  initial: { title: '初次就诊随访', msg: '您好，我是您的随访医生。上次就诊后服药情况如何？症状有改善吗？有没有不舒服的反应？方便的话请回复一下，我好帮您调整。' },
  chronic: { title: '慢性病随访', msg: '您好，定期随访时间到了。最近身体感觉怎么样？是否按时服药？饮食睡眠有没有变化？请简单说明一下，谢谢。' },
  post_rx: { title: '用药后随访', msg: '您好，您服用中药已有7天。请问感觉效果如何？有没有出现胃不舒服、腹泻、过敏等反应？有任何不适请随时告知。' },
  health: { title: '健康管理随访', msg: '您好，本月健康随访。最近睡眠胃口如何？精神状态怎么样？舌苔有什么变化？方便的话拍张舌苔照片给我看看。' }
};

// R812：随访改走真 API（/api/followup/list），假种子数组全部移除
var fuList = [];
var fuStats = { pending: 0, overdue: 0, completed: 0 };

function loadFollowups() {
  fetch('/api/followup/list?limit=200').then(function(r){ return r.json(); }).then(function(d) {
    fuList = d.list || [];
    fuStats = d.stats || fuStats;
    render();
  }).catch(function() {
    // 离线降级：读本地缓存
    fuList = JSON.parse(localStorage.getItem('tcm_followups_active') || '[]');
    render();
  });
}

function fuTypeLabel(t) {
  return { initial:'初次就诊', chronic:'慢性病', post_rx:'用药后', health:'健康管理', 'family-consult':'家庭问诊' }[t] || t || '随访';
}

function render() {
  var today = new Date().toISOString().slice(0,10);
  var now = Date.now();
  var weekLater = now + 7*86400000;
  var pending = fuList.filter(function(f){ return f.status==='pending'; });
  document.getElementById('s-today').textContent = pending.filter(function(f){ return f.due_at && f.due_at.slice(0,10)<=today; }).length;
  document.getElementById('s-week').textContent = pending.filter(function(f){ return f.due_at && new Date(f.due_at).getTime()<=weekLater; }).length;
  document.getElementById('s-overdue').textContent = fuStats.overdue != null ? fuStats.overdue : pending.filter(function(f){ return f.due_at && new Date(f.due_at).getTime()<now; }).length;
  document.getElementById('s-done').textContent = fuStats.completed != null ? fuStats.completed : fuList.filter(function(f){ return f.status==='completed'; }).length;

  var listEl = document.getElementById('followup-list');
  if (!pending.length) {
    listEl.innerHTML = '<div style="text-align:center;color:var(--text3);padding:16px">📞 暂无待随访 — 问诊签发后自动生成随访计划</div>';
  } else {
    listEl.innerHTML = pending.map(function(f){
      var overdue = f.due_at && new Date(f.due_at).getTime() < now;
      var dueDay = f.due_at ? f.due_at.slice(0,10) : '—';
      var pname = String(f.patient_name||'').replace(/'/g,'');
      var psyn = String(f.syndrome||'').replace(/'/g,'');
      var pfx = String(f.formula||'').replace(/'/g,'');
      return '<div class="followup-item">'+
        '<span style="font-size:20px">📞</span>'+
        '<div class="info"><strong>'+esc(f.patient_name||'—')+'</strong> · '+esc(f.syndrome||'')+(f.formula?' · '+esc(f.formula):'')+'<br>'+
        '<span style="font-size:10px;color:var(--text3)">'+fuTypeLabel(f.source||f.type)+' · 应访 '+dueDay+'</span></div>'+
        '<span class="badge '+(overdue?'overdue':'today')+'">'+(overdue?'⚠️逾期':dueDay===today?'📌今天':'待随访')+'</span>'+
        '<button class="btn green small" onclick="sendFollowup(\'post_rx\',\''+pname+'\',\''+psyn+'\',\''+pfx+'\',\''+f.id+'\')">随访</button>'+
        '<button class="btn small" style="background:var(--bg);border:1px solid var(--border)" onclick="completeFU(\''+f.id+'\')">✓</button>'+
      '</div>';
    }).join('');
  }

  var done = fuList.filter(function(f){ return f.status==='completed'; });
  document.getElementById('completed-list').innerHTML = done.length ? done.slice(0,20).map(function(c){
    return '<div class="followup-item">'+
      '<span style="font-size:20px">✅</span>'+
      '<div class="info"><strong>'+esc(c.patient_name||'—')+'</strong> · '+esc(c.formula||c.syndrome||'')+'<br><span style="font-size:10px;color:var(--text2)">'+esc(c.feedback||c.advice||'随访完成')+'</span></div>'+
      '<span class="badge done">'+(c.completed_at||'').slice(0,10)+'</span>'+
    '</div>';
  }).join('') : '<div style="text-align:center;color:var(--text3);padding:16px">暂无已完成随访</div>';
}

// R816：优先取服务端 AI 个性化话术（证型+方剂规则引擎），失败回退静态模板；发送前可编辑
// R819：选运营商通道派发（AI语音/短信/5G消息/站内），回执自动回填随访
function sendFollowup(type, patient, syndrome, formula, fuId) {
  var t = templates[type];
  var name = patient || '';
  var fallback = t ? '【'+t.title+'】'+(name?' '+name+'，':'')+t.msg : '您好，本次随访想了解您的恢复情况。请简单回复。';
  var done = function(msg) {
    var log = JSON.parse(localStorage.getItem('tcm_followup_log')||'[]');
    log.unshift({ time: new Date().toISOString(), type: type, patient: name, message: msg, status: 'sent' });
    localStorage.setItem('tcm_followup_log', JSON.stringify(log.slice(0,100)));
    toast('✅ 随访消息已记录（站内）');
  };
  if (!syndrome && !formula) { previewFU(fallback, done, null, null); return; }
  fetch('/api/followup/message', {method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({ type:type, patient_name:name, syndrome:syndrome||'', formula:formula||'' })})
    .then(function(r){ return r.json(); }).then(function(d) {
      previewFU(d.ok && d.message ? d.message : fallback, done, d.matched, fuId);
    }).catch(function(){ previewFU(fallback, done, null, fuId); });
}

function previewFU(msg, done, matched, fuId) {
  var tag = matched && (matched.formula_note || matched.syndrome_care)
    ? '<div style="font-size:10px;color:var(--green)">🤖 AI 话术 · 已按证型/方剂个性化</div>'
    : '<div style="font-size:10px;color:var(--text3)">📝 通用话术</div>';
  var channelRow = fuId
    ? '<select id="__fu_channel" style="padding:8px;border:1px solid #d1d5db;border-radius:6px">' +
      '<option value="voice">📞 AI 语音外呼（运营商通道）</option>' +
      '<option value="sms">💬 短信</option>' +
      '<option value="rcs5g">📡 5G 消息</option>' +
      '<option value="manual" selected>📋 站内记录</option></select>'
    : '';
  var overlay = openModal(
    '<div style="display:grid;gap:8px;min-width:300px">' + tag +
    '<textarea id="__fu_msg" rows="5" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;line-height:1.8">'+esc(msg)+'</textarea>' +
    channelRow +
    '<button class="btn primary" id="__fu_send" style="padding:10px;border:none;border-radius:6px;background:var(--primary,#6b3a1f);color:#fff;cursor:pointer">📤 确认发送</button></div>',
    '随访话术预览');
  overlay.querySelector('#__fu_send').addEventListener('click', function() {
    var m = overlay.querySelector('#__fu_msg').value.trim();
    if (!m) { toast('话术不能为空', 'warn'); return; }
    var chEl = overlay.querySelector('#__fu_channel');
    var channel = chEl ? chEl.value : 'manual';
    overlay.remove();
    if (!fuId) { done(m); return; }
    // R819：走运营商通道适配层派发，状态如实回报
    fetch('/api/followup/dispatch', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ id: fuId, channel: channel })})
      .then(function(r){ return r.json(); }).then(function(d) {
        if (!d.ok) { toast('派发失败：'+(d.error||''), 'warn'); return; }
        var ds = d.dispatch;
        if (ds.status === 'channel_unconfigured') toast('⚠️ ' + ds.note, 'warn');
        else if (ds.status === 'dispatched') toast('✅ 已通过 ' + channel + ' 通道外发，等待回执');
        else if (ds.status === 'logged') toast('✅ 已站内记录');
        else toast('⚠️ ' + (ds.note || ds.status), 'warn');
        loadDispatches();
      }).catch(function(){ toast('网络错误', 'warn'); });
  });
}

// R819：派发台账 + 通道配置状态
function loadDispatches() {
  fetch('/api/followup/dispatches').then(function(r){ return r.json(); }).then(function(d) {
    if (!d.ok) return;
    var el = document.getElementById('dispatch-panel');
    if (!el) return;
    var chMap = { sms: '短信', voice: 'AI语音', rcs5g: '5G消息', manual: '站内' };
    var chLine = d.channels.map(function(c) {
      return (c.configured ? '🟢' : '⚪') + chMap[c.channel] + (c.configured ? '' : '（未配置）');
    }).join(' · ');
    var html = '<div style="font-size:11px;color:var(--text3);margin-bottom:6px">运营商通道：' + chLine + ' · 已外发 ' + d.stats.dispatched + ' · 已接听 ' + d.stats.answered + '</div>';
    html += d.list.slice(0, 8).map(function(x) {
      var stMap = { dispatched: '✅已外发', answered: '✅已接听回填', logged: '📋站内记录', channel_unconfigured: '⚠️通道未配置', provider_error: '❌运营商错误', provider_unreachable: '❌通道不可达', failed: '❌未接通' };
      return '<div style="padding:4px 0;border-bottom:1px solid var(--border)">' +
        (chMap[x.channel]||x.channel) + ' → <strong>' + esc(x.patient_name||'—') + '</strong> · ' +
        (stMap[x.status]||x.status) + (x.transcript ? ' · <span style="color:var(--text3)">回执：' + esc(x.transcript.slice(0,40)) + '</span>' : '') +
        '<span style="float:right;color:var(--text3);font-size:10px">' + (x.created_at||'').slice(5,16).replace('T',' ') + '</span></div>';
    }).join('');
    el.innerHTML = html;
  }).catch(function(){});
}
loadDispatches();

// R812：完成随访走真 API（服务端新增 /api/followup/complete）
function completeFU(id) {
  fetch('/api/followup/complete', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:id})})
    .then(function(r){ return r.json(); }).then(function(d) {
      if (d.ok) { toast('✅ 随访完成'); loadFollowups(); }
      else toast('操作失败：'+(d.error||''), 'warn');
    }).catch(function(){ toast('网络错误', 'warn'); });
}

// R812：新增随访走真 API /api/followup/create（原仅写 localStorage 镜像）
function addFollowup() {
  var overlay = openModal(
    '<div style="display:grid;gap:8px;min-width:280px">' +
    '<input id="__fu_name" class="input" placeholder="患者姓名 *" style="padding:8px;border:1px solid #d1d5db;border-radius:6px">' +
    '<input id="__fu_diag" class="input" placeholder="中医诊断 *（如 心脾两虚）" style="padding:8px;border:1px solid #d1d5db;border-radius:6px">' +
    '<input id="__fu_formula" class="input" placeholder="方剂 *（如 归脾汤）" style="padding:8px;border:1px solid #d1d5db;border-radius:6px">' +
    '<select id="__fu_days" style="padding:8px;border:1px solid #d1d5db;border-radius:6px">' +
    '<option value="3">3 天后随访</option><option value="7" selected>7 天后随访</option>' +
    '<option value="14">14 天后随访</option><option value="30">30 天后随访</option></select>' +
    '<button class="btn primary" id="__fu_ok" style="padding:10px;border:none;border-radius:6px;background:var(--primary,#6b3a1f);color:#fff;cursor:pointer">✅ 确认新增</button></div>',
    '新增随访');
  overlay.querySelector('#__fu_ok').addEventListener('click', function() {
    var name = overlay.querySelector('#__fu_name').value.trim();
    var diagnosis = overlay.querySelector('#__fu_diag').value.trim();
    var formula = overlay.querySelector('#__fu_formula').value.trim();
    var days = parseInt(overlay.querySelector('#__fu_days').value, 10) || 7;
    if (!name || !diagnosis || !formula) { toast('姓名/诊断/方剂必填', 'warn'); return; }
    authFetch('/api/followup/create', {method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ patient_name:name, syndrome:diagnosis, formula:formula, days:days })})
      .then(function(r){ return r.json(); }).then(function(d) {
        if (d.ok) { overlay.remove(); toast('✅ 随访已新增'); loadFollowups(); }
        else toast('新增失败：'+(d.error||''), 'warn');
      }).catch(function(){ toast('网络错误', 'warn'); });
  });
}

// R812：搜索 = fuList 客户端过滤（原 searchFU 只搜假数组）
function searchFU(q) {
  if (!q) { render(); return; }
  var now = Date.now();
  var filtered = fuList.filter(function(f){
    return (f.patient_name||'').indexOf(q) >= 0 ||
           (f.syndrome||'').indexOf(q) >= 0 ||
           (f.formula||'').indexOf(q) >= 0;
  });
  document.getElementById('followup-list').innerHTML = filtered.length ? filtered.map(function(f){
    var overdue = f.status==='pending' && f.due_at && new Date(f.due_at).getTime() < now;
    return '<div class="followup-item">'+
      '<span style="font-size:20px">🔍</span>'+
      '<div class="info"><strong>'+esc(f.patient_name||'—')+'</strong> · '+esc(f.syndrome||'')+(f.formula?' · '+esc(f.formula):'')+'<br>'+
      '<span style="font-size:10px;color:var(--text3)">'+fuTypeLabel(f.source||f.type)+' · 应访 '+(f.due_at||'').slice(0,10)+'</span></div>'+
      '<span class="badge '+(f.status==='completed'?'done':overdue?'overdue':'today')+'">'+(f.status==='completed'?'已完成':overdue?'⚠️逾期':'待随访')+'</span>'+
    '</div>';
  }).join('') : '<div style="text-align:center;color:var(--text3);padding:16px">未找到匹配随访</div>';
}

// 初始化：真 API 加载，每分钟刷新
loadFollowups();
setInterval(loadFollowups, 60000);

// ═══ 工具栏 UI 注入 ═══
(function(){
  var card = document.querySelectorAll('.card')[1];
  if (!card) return;
  var bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:8px;margin:8px 0;flex-wrap:wrap';
  bar.innerHTML = '<input  type="text" id="fu-search" placeholder="🔍 搜索患者/诊断/方剂" style="flex:1;min-width:140px;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text)" aria-label="🔍 搜索患者/诊断/方剂" data-validate="required|min=2">'+
                  '<button class="btn primary" onclick="addFollowup()">➕ 新增</button>'+
                  '<button class="btn" onclick="searchFU(document.getElementById(\'fu-search\').value)">🔍 搜索</button>';
  card.insertBefore(bar, card.firstChild.nextSibling);
})();
