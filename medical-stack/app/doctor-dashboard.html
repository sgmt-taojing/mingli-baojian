<style>
:root{
  --bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;
  --accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;
  --text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;
  --red-bg:#fef2f2;--green-bg:#f0fdf4;--blue-bg:#eff6ff;--gold-bg:#fffbeb;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}

/* Top bar */
.topbar{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.topbar h1{font-size:16px;letter-spacing:2px}
.topbar .user-info{font-size:12px;opacity:.8}
.topbar .btn-exit{color:rgba(255,255,255,.6);cursor:pointer;font-size:12px;text-decoration:none;padding:4px 10px;border-radius:4px;border:1px solid rgba(255,255,255,.2)}

/* Layout */
.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 44px)}
@media(max-width:768px){.layout{grid-template-columns:1fr}}
.sidebar{background:var(--card);border-right:1px solid var(--border);padding:12px}
.sidebar .nav-item{display:block;padding:10px 12px;border-radius:6px;font-size:13px;color:var(--text2);text-decoration:none;margin-bottom:2px;cursor:pointer;border:none;background:none;width:100%;text-align:left}
.sidebar .nav-item:hover,.sidebar .nav-item.active{background:var(--primary);color:#fff}
.sidebar .nav-divider{border-top:1px solid var(--border);margin:8px 0}
.main{padding:12px;overflow-y:auto}

/* Cards */
.card{background:var(--card);border-radius:10px;padding:16px;margin-bottom:12px;border:1px solid var(--border);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h3{font-size:15px;color:var(--primary);margin-bottom:8px}
.card-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
@media(max-width:900px){.card-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.card-row{grid-template-columns:1fr}}

.stat-mini{background:var(--bg);border-radius:8px;padding:10px;text-align:center}
.stat-mini .val{font-size:22px;font-weight:700;color:var(--primary)}
.stat-mini .lbl{font-size:10px;color:var(--text3);margin-top:2px}

/* Patient queue */
.patient-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);cursor:pointer;transition:.1s}
.patient-item:hover{background:var(--bg)}
.patient-item.current{background:var(--blue-bg);border-left:3px solid var(--blue)}
.patient-item .queue-num{font-size:18px;font-weight:700;color:var(--primary);width:36px;text-align:center}
.patient-item .info{flex:1}
.patient-item .name{font-size:14px;font-weight:600}
.patient-item .meta{font-size:11px;color:var(--text3)}
.patient-item .status-badge{font-size:10px;padding:3px 8px;border-radius:10px}
.status-waiting{background:var(--blue-bg);color:var(--blue)}
.status-diagnosing{background:var(--gold-bg);color:var(--gold)}
.status-done{background:var(--green-bg);color:var(--green)}

/* Workflow steps */
.workflow{display:flex;gap:4px;margin:12px 0;flex-wrap:wrap}
.workflow .wf-step{flex:1;padding:10px;text-align:center;border-radius:6px;font-size:11px;cursor:pointer;border:1px solid var(--border);background:var(--bg);min-width:80px}
.workflow .wf-step.done{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.workflow .wf-step.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.workflow .wf-step.current{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);border-style:dashed}

/* Forms */
.input,select,textarea{width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
textarea{min-height:60px;resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
@media(max-width:480px){.form-row{grid-template-columns:1fr}}
.label{font-size:11px;color:var(--text3);margin-bottom:2px;display:block}

/* Buttons */
.btn{display:inline-block;padding:8px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.secondary{background:var(--bg);color:var(--primary);border:1px solid var(--border)}
.btn.green{background:var(--green);color:#fff}
.btn.accent{background:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* AI suggestion box */
.ai-box{background:linear-gradient(135deg,#eff6ff,#f0f9ff);border:1px solid #93c5fd;border-radius:8px;padding:12px}
.ai-box .ai-label{font-size:10px;color:var(--blue);font-weight:700;margin-bottom:4px}
.ai-box .ai-content{font-size:12px;color:var(--text);line-height:1.5}

/* Prescription herbs */
.herb-row{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.herb-row input{flex:1;min-width:0}
.herb-row input.herb-name{flex:2}
.herb-row input.herb-dose{flex:1;max-width:70px}

/* Wearable status */
.wearable-device{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:10px;font-size:10px;margin:2px}
.wearable-device.online{background:var(--green-bg);color:var(--green)}
.wearable-device.offline{background:var(--red-bg);color:var(--accent)}

/* Hidden panels */
.panel{display:none}
.panel.active{display:block}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:999;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:12px;max-width:700px;width:95%;max-height:85vh;overflow-y:auto;padding:20px}
.modal h3{font-size:16px;color:var(--primary);margin-bottom:12px}
.modal .close-btn{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3)}

/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

</style>

<!-- page-header-bar -->

<div class="std-bar"><span class="std-tag">👥 使用对象 <b>医生</b></span><span class="std-tag">⚙️ 功能 <b>医生工作台·6步诊疗</b></span><span class="std-tag">💎 使用价值 <b>候诊→望闻问切→AI辅助→处方全流程</b></span></div>

<div class="topbar">
  <h1>🩺 中医诊疗系统</h1>
  <div>
    <span class="user-info" id="user-info">未登录</span>
    <a class="btn-exit" href="login.html" onclick="logout()">退出</a>

<div class="layout">
  <!-- Sidebar -->
  <div class="sidebar">
    <div style="padding:8px;font-size:11px;color:var(--text3);text-transform:uppercase">导航</div>
    <button class="nav-item active" onclick="showPanel('queue')">👥 候诊队列</button>

<script>
// ═══ 全局状态 ═══
const state = {
  user: null,
  currentPatient: null,
  currentDiagnosis: null,
  queue: [],
  wearableDevices: []
};

// ═══ 初始化 ═══
document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('tcm_user');
  if (saved) {
    state.user = JSON.parse(saved);
    document.getElementById('user-info').textContent = 
      `👨‍⚕️ ${state.user.name}（${state.user.roleName}）· ${state.user.specialtyName||''}`;
  } else {
    window.location.href = 'login.html';
    return;
  }

  generateQueue();
  loadWearableDevices();
  showPanel('queue');
  if (window.loadFamilyConsults) loadFamilyConsults();   // R811：家庭问诊审核卡初始化
  setInterval(generateQueue, 30000);
});

// ═══ 候诊队列 ═══
function generateQueue() {
  // ═══ 真实数据优先：患者自助挂号的记录 ═══
  const registrations = JSON.parse(localStorage.getItem('tcm_registrations') || '[]');
  const liveRegs = registrations.filter(r => r.status !== 'done' && r.status !== 'cancelled');

  if (liveRegs.length > 0) {
    // 用真实挂号数据生成候诊队列
    state.queue = liveRegs.map((r, i) => ({
      id: r.id || 'P'+(2000+i),
      name: r.name,
      age: r.age || 30,
      gender: r.gender || '男',
      queue_num: r.queue_num || (i+1),
      chief_complaint: r.complaint || '',
      department: r.department_name || '',
      doctor: r.doctor || '',
      status: 'waiting',
      registered_at: r.time || new Date().toISOString()
    }));
  } else {
    // 无真实挂号时用演示数据
    const names = ['王小明','李建国','张三妹','赵四海','钱美丽','孙老者','周阿姨','吴大叔','郑女士','冯先生'];
    const complaints = [
      '失眠多梦，头晕乏力2周','咳嗽咳痰，胸闷1周','胃痛腹胀，食欲不振3天',
      '月经不调，痛经','关节疼痛，屈伸不利','反复感冒，免疫力下降',
      '腰膝酸软，畏寒','头痛如针刺，血压偏高','便秘，口苦口干','皮肤瘙痒'
    ];

    state.queue = names.map((n,i) => ({
      id: 'P'+(2000+i),
      name: n,
      age: 25 + ((i*7) % 55),
      gender: i%2 ? '女' : '男',
      queue_num: i+1,
      chief_complaint: complaints[i],
      status: 'waiting',
      registered_at: new Date(Date.now() - (i+1)*600000).toISOString()
    }));
  }

  // Stats
  document.getElementById('q-waiting').textContent = state.queue.filter(q => q.status==='waiting').length;
  document.getElementById('q-today').textContent = 3;
  document.getElementById('q-total').textContent = 47;

  // Render
  let html = '';
  for (const p of state.queue) {
    html += `<div class="patient-item ${p.id===state.currentPatient?.id?'current':''}" onclick="startDiagnosis('${p.id}')">
      <div class="queue-num">${p.queue_num}</div>
      <div class="info">
        <div class="name">${p.name} · ${p.age}岁 · ${p.gender}</div>
        <div class="meta">${p.chief_complaint}</div>
      </div>
      <span class="status-badge status-waiting">候诊</span>
    </div>`;
  }
  document.getElementById('queue-list').innerHTML = html || '暂无候诊患者';
}

// ═══ 开始诊断 ═══
function startDiagnosis(patientId) {
  const p = state.queue.find(q => q.id === patientId);
  if (!p) return;
  state.currentPatient = p;
  p.status = 'diagnosing';
  state.currentDiagnosis = createEmptyDiagnosis(p);
  
  // 同步更新挂号状态为诊断中
  const regs = JSON.parse(localStorage.getItem('tcm_registrations') || '[]');
  const reg = regs.find(r => r.id === patientId);
  if (reg) { reg.status = 'diagnosing'; localStorage.setItem('tcm_registrations', JSON.stringify(regs)); }
  
  showPanel('diagnosis');
  renderDiagnosisWorkflow(0);
  renderQueue();
}

function createEmptyDiagnosis(patient) {
  return {
    patient,
    complaint: patient.chief_complaint || '',
    inquiry: {},
    tongue: null,
    face: null,
    hand: null,
    wearable: null,
    ai_suggestions: null,
    diagnosis: '',
    syndrome: '',
    treatment: '',
    prescription: null,
    step: 0
  };
}

// ═══ 诊断工作流（6步） ═══
const WORKFLOW_STEPS = ['望诊', '闻诊', '问诊', '切诊', 'AI辅助', '处方'];

function renderDiagnosisWorkflow(currentStep) {
  let html = '';
  for (let i = 0; i < WORKFLOW_STEPS.length; i++) {
    let cls = '';
    if (i < currentStep) cls = 'done';
    else if (i === currentStep) cls = 'active';
    html += `<div class="wf-step ${cls}" onclick="navigateStep(${i})">${i+1}. ${WORKFLOW_STEPS[i]}</div>`;
  }
  document.getElementById('diagnosis-workflow').innerHTML = html;

  const d = state.currentDiagnosis;
  if (!d) return;

  const p = d.patient;
  let content = '';
  
  if (currentStep === 0) { // 望诊
    content = `
      <h3>👁️ 望诊 — ${p.name} · ${p.age}岁 · ${p.gender}</h3>
      <div class="card-row">
        <div class="stat-mini" onclick="openWearable('tongue')" style="cursor:pointer">
          <div style="font-size:28px">👅</div><div class="lbl">舌诊仪采集</div>
          <div style="font-size:10px;color:var(--green)">设备在线</div>
        </div>
        <div class="stat-mini" onclick="openWearable('face')" style="cursor:pointer">
          <div style="font-size:28px">👤</div><div class="lbl">面诊仪采集</div>
          <div style="font-size:10px;color:var(--green)">设备在线</div>
        </div>
        <div class="stat-mini" onclick="openClinicalPage()" style="cursor:pointer">
          <div style="font-size:28px">🖐️</div><div class="lbl">手动四诊采集</div>
          <div style="font-size:10px;color:var(--text3)">打开采集页</div>
        </div>
      </div>
      <div style="margin-top:8px;padding:8px;background:#faf8f5;border-radius:6px;font-size:11px;color:var(--text2)">
        📸 <strong>快速上传</strong>：
        <input  type="file" accept="image/*" capture="environment" onchange="quickUploadTongue(this)" style="display:none" id="tongue-upload" aria-label="tongue upload">
        <button class="btn small secondary" onclick="document.getElementById('tongue-upload').click()">👅 拍舌头</button>
        <input  type="file" accept="image/*" onchange="quickUploadFace(this)" style="display:none" id="face-upload" aria-label="face upload">
        <button class="btn small secondary" onclick="document.getElementById('face-upload').click()">👤 拍面部</button>
        <input  type="file" accept="image/*" onchange="quickUploadHand(this)" style="display:none" id="hand-upload" aria-label="hand upload">
        <button class="btn small secondary" onclick="document.getElementById('hand-upload').click()">🖐️ 拍手掌</button>
      </div>

function renderTags(options, field) {
  return options.map(o => 
    `<span class="feature-tag" data-val="${o}" data-field="${field}" onclick="toggleTag(this)" style="display:inline-block;padding:3px 9px;border-radius:10px;font-size:11px;background:var(--bg);border:1px solid var(--border);cursor:pointer;transition:.2s">${o}</span>`
  ).join('');
}

// 安全函数：标签点击切换选中状态（兼容直接 onclick 调用）
function toggleTag(el) {
  if (!el) return;
  el.classList.toggle('selected');
  el.style.background = el.classList.contains('selected') ? 'var(--primary)' : 'var(--bg)';
  el.style.color = el.classList.contains('selected') ? '#fff' : 'var(--text)';
  el.style.borderColor = el.classList.contains('selected') ? 'var(--primary)' : 'var(--border)';
  // 收集选中值到当前诊断
  if (state.currentDiagnosis && el.dataset.field) {
    var vals = Array.from(document.querySelectorAll('.feature-tag.selected[data-field="' + el.dataset.field + '"]')).map(t => t.dataset.val);
    state.currentDiagnosis[el.dataset.field] = vals;
  }
}
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('feature-tag')) {
    e.target.classList.toggle('selected');
    e.target.style.background = e.target.classList.contains('selected') ? 'var(--primary)' : 'var(--bg)';
    e.target.style.color = e.target.classList.contains('selected') ? '#fff' : 'var(--text)';
    e.target.style.borderColor = e.target.classList.contains('selected') ? 'var(--primary)' : 'var(--border)';
  }
});

function generateAISuggestions(d) {
  const complaint = d.complaint || '';
  const patterns = [
    { match: /失眠|多梦|睡不着/, diagnosis: '心脾两虚', treatment: '补益心脾，养血安神', formula: '归脾汤', contra: ['忌生冷油腻', '注意调节情绪'] },
    { match: /咳嗽|咳痰|胸闷/, diagnosis: '风寒束肺', treatment: '疏风散寒，宣肺止咳', formula: '止嗽散', contra: ['忌辛辣刺激', '注意保暖'] },
    { match: /胃痛|腹胀|食欲不振/, diagnosis: '脾胃虚弱', treatment: '健脾和胃，理气消胀', formula: '香砂六君子汤', contra: ['忌暴饮暴食', '少食多餐'] },
    { match: /月经|痛经/, diagnosis: '肝郁气滞', treatment: '疏肝解郁，调经止痛', formula: '逍遥散', contra: ['经期忌寒凉', '注意情绪管理'] },
    { match: /关节|疼痛|屈伸/, diagnosis: '风寒湿痹', treatment: '祛风散寒，除湿通络', formula: '独活寄生汤', contra: ['注意关节保暖', '避免潮湿环境'] },
    { match: /头痛|头晕/, diagnosis: '肝阳上亢', treatment: '平肝潜阳，清热安神', formula: '天麻钩藤饮', contra: ['忌烟酒', '控制血压'] },
    { match: /感冒|发热|怕冷/, diagnosis: '风寒表证', treatment: '辛温解表，宣肺散寒', formula: '桂枝汤', contra: ['服后覆被取微汗', '忌食生冷'] },
    { match: /乏力|疲劳|没精神/, diagnosis: '气血两虚', treatment: '益气养血，扶正固本', formula: '八珍汤', contra: ['注意休息', '适当运动'] },
  ];

  for (const p of patterns) {
    if (p.match.test(complaint)) {
      return {
        analysis: `<strong>主证：${p.diagnosis}</strong><br>从四诊合参分析：${complaint.replace(/。/,'，')}。结合舌脉表现，综合八纲辨证，属<strong>${p.diagnosis}</strong>范畴。<br><br>
<strong>多流派参考：</strong><br>
· 伤寒派：六经辨证中属相应经证<br>
· 温病派：需辨卫气营血层次<br>
· 扶阳派：注意阳气盛衰<br>
· 脾胃派：脾胃为后天之本，调护为先`,
        formula_suggestion: `推荐方剂：<strong>${p.formula}</strong><br>出自经典医籍，为${p.diagnosis}常用方。<br>建议由医师根据具体脉证加减调整。`,
        contraindications: p.contra || [],
        suggested_diagnosis: p.diagnosis,
        suggested_treatment: p.treatment
      };
    }
  }

  return {
    analysis: '<strong>需进一步四诊合参</strong><br>当前症状信息不足以明确证型，建议补充舌脉等信息后再行辨证。',
    formula_suggestion: '建议四诊合参后由执业医师辨证处方，不推荐盲目用药。',
    contraindications: ['信息不足，不宜仓促处方'],
    suggested_diagnosis: '',
    suggested_treatment: ''
  };
}

function applyTemplate(name) {
  const templates = {
    '桂枝汤': ['桂枝|9g','芍药|9g','甘草|6g','生姜|9g','大枣|12枚'],
    '小柴胡汤': ['柴胡|24g','黄芩|9g','人参|9g','半夏|9g','甘草|9g','生姜|9g','大枣|12枚'],
    '归脾汤': ['白术|9g','当归|9g','茯苓|9g','黄芪|12g','龙眼肉|9g','酸枣仁|12g','人参|6g','甘草|6g'],
    '逍遥散': ['柴胡|9g','当归|9g','白芍|9g','白术|9g','茯苓|9g','甘草|6g']
  };
  const herbs = templates[name] || [];
  const container = document.getElementById('herb-list');
  container.innerHTML = herbs.map(h => {
    const [name, dose] = h.split('|');
    return `<div class="herb-row"><input  class="input herb-name" value="${name}" aria-label="field"><input  class="input herb-dose" value="${dose}" aria-label="field"><button class="btn small accent" onclick="removeHerb(this)">✕</button></div>`;
  }).join('');
}

// ═══ 提交处方 ═══
function submitPrescription() {
  // R743 修真——提交前统一校验（uiStates.validateInputs）
  if (window.uiStates && uiStates.validateInputs && !window.__r743_injecting) {
    var _vr = uiStates.validateInputs(document);
    if (!_vr.ok) { uiStates.showValidationErrors(_vr); return; }
  }

  var herbs = [];
  document.querySelectorAll('.herb-row').forEach(function(row) {
    var inputs = row.querySelectorAll('input');
    if (inputs[0].value.trim()) herbs.push({ name: inputs[0].value.trim(), dosage: inputs[1].value.trim() || '9g' });
  });
  if (!herbs.length) return TCM.toast('请添加至少一味中药');

  var rx = TCM_RX.create({
    patient_name: state.currentPatient.name,
    patient_id: state.currentPatient.id,
    patient_age: state.currentPatient.age,
    patient_gender: state.currentPatient.gender,
    doctor_name: state.user.name,
    doctor_id: state.user.id,
    diagnosis: document.getElementById('final-diagnosis')?.value || '',
    treatment: document.getElementById('final-treatment')?.value || '',
    herbs: herbs,
    decoction_method: document.getElementById('decoction-method')?.value || 'self_decoct',
    delivery_method: document.getElementById('delivery-method')?.value || 'self_pickup',
    delivery_address: document.getElementById('delivery-address')?.value || '',
    notes: document.getElementById('prescription-notes')?.value || ''
  });

  // 自动更新患者记录
  TCM.store.push('patient_records', {
    patient_id: rx.patient_id, patient_name: rx.patient_name,
    doctor: rx.doctor_name, diagnosis: rx.diagnosis,
    herbs: rx.herbs, created_at: rx.created_at, prescription_id: rx.id
  });

  state.currentPatient.status = 'done';
  // 同步挂号状态为已完成
  const regs = JSON.parse(localStorage.getItem('tcm_registrations') || '[]');
  const reg = regs.find(r => r.id === state.currentPatient.id);
  if (reg) { reg.status = 'done'; localStorage.setItem('tcm_registrations', JSON.stringify(regs)); }
  TCM.toast('✅ 处方 ' + rx.id.slice(-6) + ' 已提交，待药师审核 · ¥' + rx.total_price.total);
  
  // 更新药房列表（如在同一浏览器）
  showPanel('prescription');
  loadPrescriptions();
  setTimeout(function() { renderQueue(); }, 500);
}

function updatePatientRecord(prescription) {
  const records = JSON.parse(localStorage.getItem('tcm_patient_records') || '[]');
  records.unshift({
    patient_id: prescription.patient?.id,
    patient_name: prescription.patient?.name,
    doctor: prescription.doctor?.name,
    diagnosis: prescription.diagnosis,
    herbs: prescription.herbs,
    created_at: prescription.created_at,
    status: 'pending_review'
  });
  localStorage.setItem('tcm_patient_records', JSON.stringify(records));
}

function renderPrescriptions() {
  const list = JSON.parse(localStorage.getItem('tcm_prescriptions') || '[]');
  const filter = document.getElementById('rx-filter')?.value || 'all';
  const filtered = filter === 'all' ? list : list.filter(p => p.status === filter);

  const statusLabels = { pending_review: '⏳待审核', verified: '✅已审核', dispensed: '💊已发药', completed: '✔️完成' };

  let html = '';
  if (!filtered.length) { html = '<div style="padding:20px;text-align:center;color:var(--text3)">暂无处方</div>'; }
  else {
    for (const p of filtered) {

function renderRecords() {

// ═══ 查看患者历史病例详情 ═══
function viewRecord(patientId) {
  if (!patientId) return TCM.toast('无患者记录');
  const records = JSON.parse(localStorage.getItem('tcm_patient_records') || '[]');
  const list = records.filter(r => r.patient_id === patientId || r.patient_name === patientId);
  if (!list.length) return TCM.toast('该患者暂无病历');

  const p = list[0];
  let html = '<div style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px">' +
    '<div style="background:#fff;border-radius:12px;padding:20px;max-width:480px;width:100%;max-height:80vh;overflow-y:auto">' +
    '<h3 style="margin-bottom:12px">📋 ' + p.patient_name + ' 病历</h3>';
  list.slice(0, 5).forEach(function(r, idx) {
    html += '<div style="padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">' +
      '<div style="font-size:10px;color:var(--text3)">#' + (idx+1) + ' · ' + new Date(r.created_at).toLocaleString('zh-CN') + '</div>' +
      '<div style="font-weight:600;margin:4px 0">诊断: ' + (r.diagnosis || '—') + '</div>' +
      '<div style="font-size:12px">💊 ' + (r.herbs || []).map(function(h){ return h.name + (h.dosage||''); }).join('、') + '</div>' +
      '<div style="font-size:11px;color:var(--text2);margin-top:4px">👨‍⚕️ ' + (r.doctor||'—') + '</div>' +
      '</div>';
  });
  html += '<div style="text-align:center;margin-top:10px"><button class="btn small primary" onclick="this.parentElement.parentElement.remove()">关闭</button></div>' +
    '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

// ═══ 家庭问诊审核（互联网医院模式）═══
async function loadFamilyConsults() {
  const box = document.getElementById('family-consult-list');
  if (!box) return;
  const filter = (document.getElementById('fc-filter') || {}).value || 'pending_review';
  box.innerHTML = '<div style="color:var(--text3);padding:12px">加载中…</div>';
  if (window.loadFollowupStats) loadFollowupStats();
  try {
    const qs = filter === 'all' ? 'limit=100' : 'status=' + filter + '&limit=100';
    const r = await fetch('/api/family/consults?' + qs);
    const d = await r.json().catch(() => null);
    const list = (d && d.ok && d.consults) ? d.consults : [];
    // 统计卡片
    const all = await fetch('/api/family/consults?limit=200').then(r => r.json()).catch(() => ({consults: []}));
    const allList = (all && all.consults) || [];
    const setNum = (id, n) => { const el = document.getElementById(id); if (el) el.textContent = n; };
    setNum('fc-pending', allList.filter(c => c.status === 'pending_review').length);
    setNum('fc-approved', allList.filter(c => c.status === 'approved' || c.status === 'revised').length);
    setNum('fc-total', allList.length);
    if (list.length === 0) {
      box.innerHTML = '<div style="color:var(--text3);padding:20px;text-align:center">暂无' + (filter === 'all' ? '' : '待审核') + '问诊记录</div>';
      return;
    }
    window.__consultMap = {};
    list.forEach(c => { window.__consultMap[c.consult_id] = c; });
    box.innerHTML = list.map(c => {
      const t = (c.created_at || '').replace('T', ' ').slice(5, 16);
      const pill = { pending_review: '<span style="color:#b8860b">待审核</span>', approved: '<span style="color:#2e8b57">已出方案</span>', revised: '<span style="color:#2980b9">已修订</span>', rejected: '<span style="color:#c0392b">已驳回</span>' }[c.status] || c.status;
      const ai = (c.ai_suggestion && c.ai_suggestion.syndrome) ? '<div style="font-size:12px;color:#2980b9;margin:4px 0">🤖 AI 初判：' + c.ai_suggestion.syndrome + (c.ai_suggestion.confidence ? '（' + Math.round(c.ai_suggestion.confidence * 100) + '%）' : '') + (c.ai_suggestion.formula ? ' · ' + c.ai_suggestion.formula : '') + '</div>' : '';
      const rx = (c.review) ? '<div style="font-size:12px;color:#2e8b57;margin:4px 0">🧑‍⚕️ ' + (c.review.syndrome || '—') + ' · ' + (c.review.formula || '—') + '（' + c.review.doctor_name + '）</div>' : '';
      const actions = (c.status === 'pending_review')
        ? '<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">' +
          '<button class="btn small primary" onclick="openReviewPanel(\'' + c.consult_id + '\',\'approve\',window.__consultMap[\'' + c.consult_id + '\'])">✅ 通过</button>' +
          '<button class="btn small secondary" onclick="openReviewPanel(\'' + c.consult_id + '\',\'revise\',window.__consultMap[\'' + c.consult_id + '\'])">✏️ 修订</button>' +
          '<button class="btn small danger" onclick="openReviewPanel(\'' + c.consult_id + '\',\'reject\',window.__consultMap[\'' + c.consult_id + '\'])">❌ 驳回</button>' +
          '</div>'
        : ((c.status === 'approved' || c.status === 'revised')
          ? '<div style="margin-top:8px"><button class="btn small secondary" onclick="exportFamilyReport(\'' + c.consult_id + '\')">🖨 导出方案</button></div>'
          : '');
      return '<div style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><b>' + (c.patient_name || c.patient_id) + '</b> ' + pill + '</div>' +
        '<div style="font-size:13px;color:var(--text2)">' + (c.complaint || (c.symptoms || []).join('、')) + '</div>' +
        ai + rx +
        '<div style="font-size:11px;color:var(--text3)">' + c.consult_id + ' · ' + t + '</div>' +
        actions + '</div>';
    }).join('');
  } catch (e) {
    box.innerHTML = '<div style="color:var(--text3);padding:12px">加载失败：' + (e.message || '网络异常') + '</div>';
  }
}

function fcAction(consult_id, action, extra) {
  const doctor = (state.user && (state.user.name || state.user.username)) || '医生';
  const body = Object.assign({ consult_id, action, doctor_name: doctor }, extra || {});
  return fetch('/api/family/consult/verify', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    if (d.ok) { toast('✅ ' + (d.flow_step || d.message || '已处理')); loadFamilyConsults(); }
    else toast('❌ ' + (d.error || '操作失败'));
  }).catch(() => toast('❌ 网络异常'));
}

// 十八反十九畏前端轻量提示（后端为最终防线）

    ['乌头', '贝母', '十八反：乌头反贝母'], ['甘草', '甘遂', '十八反：甘草反甘遂'], ['甘草', '海藻', '十八反：甘草反海藻'],
    ['甘草', '大戟', '十八反：甘草反大戟'], ['甘草', '芫花', '十八反：甘草反芫花'], ['藜芦', '人参', '十八反：藜芦反人参'],
    ['乌头', '白蔹', '十八反：乌头反白蔹'], ['硫黄', '朴硝', '十九畏：硫黄畏朴硝'], ['水银', '砒霜', '十九畏：水银畏砒霜'],
    ['狼毒', '密陀僧', '十九畏：狼毒畏密陀僧'], ['巴豆', '牵牛', '十九畏：巴豆畏牵牛'], ['丁香', '郁金', '十九畏：丁香畏郁金'],
    ['川乌', '犀角', '十九畏：川乌畏犀角'], ['牙硝', '三棱', '十九畏：牙硝畏三棱'], ['官桂', '石脂', '十九畏：官桂畏石脂'],
    ['人参', '五灵脂', '十九畏：人参畏五灵脂'],
  ];

window.__submitReview = async function() {
  // R802：alert→toast、confirm→confirmModal（内嵌环境原生对话框静默失败，审批流被无声阻断）
  const c = window.__consultCache;
  const get = function(id){ return (document.getElementById(id) || {}).value || ''; };
  if (c.mode === 'approve') {
    const formula = get('rp-formula').trim();
    if (!formula) { toast('处方不能为空', 'warn'); return; }
    if (!await confirmModal('确认通过该方案并下发？通过后家庭成员可查看。')) return;
    fcAction(c.id, 'approve', { syndrome: get('rp-syndrome').trim(), formula: formula, advice: get('rp-advice').trim() });
  } else if (c.mode === 'revise') {
    const formula = get('rp-formula').trim();
    if (!formula) { toast('修订处方不能为空', 'warn'); return; }
    if (!await confirmModal('确认修订并下发新方案？')) return;
    fcAction(c.id, 'revise', { syndrome: get('rp-syndrome').trim(), formula: formula, advice: get('rp-advice').trim() });
  } else {
    const notes = get('rp-notes').trim();
    if (!notes) { toast('请填写驳回原因', 'warn'); return; }
    if (!await confirmModal('确认驳回？驳回后将通知家庭成员。', { danger: true, okText: '驳回' })) return;
    fcAction(c.id, 'reject', { notes: notes });
  }
  document.getElementById('review-panel').remove();
};

// 随访效果看板（医生端）
window.loadFollowupStats = async function() {
  const box = document.getElementById('followup-stats');
  if (!box) return;
  try {
    const r = await fetch('/api/family/followups?limit=200');
    const d = await r.json().catch(() => null);
    const list = (d && d.ok && d.followups) || [];
    const completed = list.filter(f => f.status === 'completed');
    const improved = completed.filter(f => f.effect === 'improved').length;
    const stable = completed.filter(f => f.effect === 'stable').length;
    const worsened = completed.filter(f => f.effect === 'worsened').length;
    const needRevisit = list.filter(f => f.needs_revisit || (f.status === 'completed' && f.effect === 'worsened'));
    const rate = completed.length ? Math.round(improved / completed.length * 100) : 0;
    box.innerHTML =
      '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">' +
      '<div class="stat-mini"><div class="val" style="color:#2e8b57">' + improved + '</div><div class="lbl">改善</div></div>' +
      '<div class="stat-mini"><div class="val" style="color:#b8860b">' + stable + '</div><div class="lbl">平稳</div></div>' +
      '<div class="stat-mini"><div class="val" style="color:#c0392b">' + worsened + '</div><div class="lbl">加重</div></div>' +
      '<div class="stat-mini"><div class="val">' + rate + '%</div><div class="lbl">改善率</div></div>' +
      '</div>' +
      (needRevisit.length ? '<div style="background:#fdecea;border:1px solid #f5c6c0;border-radius:8px;padding:8px 12px;font-size:13px;color:#c0392b;margin-bottom:10px">⚠️ 需复诊 ' + needRevisit.length + ' 人：' +
        needRevisit.slice(0, 3).map(f => f.patient_name || f.patient_id).join('、') + (needRevisit.length > 3 ? ' 等' : '') + '（随访反馈症状加重/无效，建议尽快复诊调方）</div>' : '') +
      (completed.length === 0 ? '<div style="color:var(--text3);font-size:13px;padding:4px 0">暂无随访反馈数据</div>' : '');
  } catch (e) {
    box.innerHTML = '';
  }
};
window.pushOverdueFollowups = async function() {
  const banner = document.getElementById('overdue-banner');
  try {
    const r = await fetch('/api/family/followups/overdue');
    const d = await r.json().catch(() => null);
    const count = (d && d.ok && d.overdue) ? d.overdue.length : 0;
    if (count === 0) {
      if (banner) { banner.style.display = 'block'; banner.innerHTML = '✅ 无逾期随访，全部按时';
        setTimeout(() => { banner.style.display = 'none'; }, 3000); }
      return;
    }
    if (!await confirmModal('有 ' + count + ' 条逾期随访，确认推送提醒到家庭端？')) return;
    const pr = await fetch('/api/family/followups/push-overdue', { method: 'POST' });
    const pd = await pr.json().catch(() => null);
    toast((pd && pd.ok) ? ('📋 ' + (pd.message || '推送完成')) : '❌ 推送失败');
    if (banner) { banner.style.display = 'none'; }
  } catch (e) {
    toast('❌ 网络异常');
  }
};

// 医生端导出家庭问诊方案（打印友好窗口）
window.exportFamilyReport = function(consultId) {
  fetch('/api/family/consults?limit=200')
    .then(r => r.json().catch(() => null))
    .then(d => {
      const list = (d && d.ok && d.consults) || [];
      const c = list.find(x => x.consult_id === consultId);
      if (!c || !c.review) { toast('该记录无审核方案'); return; }
      const win = window.open('', '_blank', 'width=500,height=700');
      if (!win) { toast('浏览器拦截弹窗，请允许'); return; }
      const doc = win.document;
      doc.open('text/html');
      const herbsHtml = String(c.review.formula || '').split(/[+、,，;；\s]+/).filter(Boolean)
        .map(h => '<li>' + h + '</li>').join('');
      doc.write('<html><head><meta charset="utf-8"><title>中医问诊方案</title>' +
        '<style>body{font-family:serif;padding:24px;max-width:480px;margin:0 auto;color:#2c1810} ' +
        'h1{text-align:center;font-size:20px;border-bottom:2px solid #b8860b;padding-bottom:8px} ' +
        '.line{border-bottom:1px dashed #999;margin:10px 0} ' +
        'table{width:100%;border-collapse:collapse;font-size:14px} ' +
        'td{padding:6px 4px;vertical-align:top} td:first-child{width:80px;color:#6b5b4f} ' +
        '.stamp{text-align:right;color:#b8860b;font-size:13px;margin-top:16px} ' +
        '.footer{font-size:10px;color:#999;margin-top:20px;border-top:1px solid #e8dfc8;padding-top:8px;text-align:center}</style></head><body>' +
        '<h1>中医问诊方案单</h1>' +
        '<table>' +
        '<tr><td>问诊编号</td><td>' + c.consult_id + '</td></tr>' +
        '<tr><td>患者</td><td>' + (c.patient_name || c.patient_id) + '</td></tr>' +
        '<tr><td>主诉</td><td>' + (c.complaint || (c.symptoms || []).join('、')) + '</td></tr>' +
        '<tr><td>AI 初判</td><td>' + ((c.ai_suggestion && c.ai_suggestion.syndrome) || '—') + '</td></tr>' +
        '<tr><td>审核医生</td><td>' + c.review.doctor_name + '</td></tr>' +
        '<tr><td>审核时间</td><td>' + (c.review.reviewed_at || '').replace('T',' ').slice(0,16) + '</td></tr>' +
        '</table><div class="line"></div>' +
        '<p style="font-size:15px;font-weight:bold">辨证：' + (c.review.syndrome || '—') + '</p>' +
        '<p style="font-size:15px;font-weight:bold">处方：' + (c.review.formula || '—') + '</p>' +
        (herbsHtml ? '<ul>' + herbsHtml + '</ul>' : '') +
        '<p style="font-size:14px;white-space:pre-wrap">医嘱：' + (c.review.advice || '—') + '</p>' +
        '<div class="stamp">执业中医师：' + c.review.doctor_name + '</div>' +
        '<div class="footer">⚠️ 本方案由 命理宝鉴·医道 辅助生成，经执业中医师审核，仅供家庭健康参考，不构成诊疗依据。如症状加重请及时就医。</div>' +
        '</body></html>');
      doc.close();
      setTimeout(() => win.print(), 300);
    })
    .catch(() => toast('导出失败'));
};

function navigateStep(n) {
  state.currentDiagnosis.step = n;
  renderDiagnosisWorkflow(n);
}

function printPrescription() {
  const list = JSON.parse(localStorage.getItem('tcm_prescriptions') || '[]');
  if (!list.length) return toast('无处方可打印');
  const p = list[0];
  const win = window.open('', '_blank', 'width=400,height=600');
  var d = win.document;
  d.open('text/html');
  var html = '<html><head><meta charset=utf-8><title>处方</title><style>body{font-size:16px;padding:20px;font-family:serif} .line{border-bottom:1px dashed #000;margin:8px 0} .stamp{text-align:right;color:red;font-size:14px}</style>' +
    '<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-medical/doctor-dashboard.html">' +
    '<link rel="stylesheet" href="css/mobile.css"></head><body>' +
    '<h2 style="text-align:center">中医处方笺</h2><div class="line"></div>' +
    '<p>患者：' + (p.patient_name || '') + '</p>' +
    '<p>诊断：' + (p.diagnosis || '') + '</p><div class="line"></div>' +
    '<p>处方：' + (p.herbs || []).map(function(h){return h.name+' '+h.dosage;}).join('、') + '</p>' +
    '<p>医嘱：' + (p.notes || '') + '</p><div class="line"></div>' +
    '<p>医师：' + (p.doctor_name || '') + ' · ' + new Date(p.created_at).toLocaleString('zh-CN') + '</p>' +
    '<div class="stamp">药师审核签章区域</div>' +
    '<div style="font-size:10px;color:var(--text3);margin-top:12px;text-align:center;border-top:1px solid var(--border);padding-top:8px">⚠️ 免责声明：本系统提供</div>' +
    '的中医诊疗建议仅供执业医师参考,不构成独立诊断或处方依据。所有用药决策须由具备资质的执业中医师审核确认。患者请遵医嘱服用。</div>' +
    '</body></html>';
  d.documentElement.innerHTML = html;
  d.close();
  win.print();
}

function logout() {
  localStorage.removeItem('tcm_user');
  localStorage.removeItem('tcm_token');
  window.location.href = 'login.html';
}
