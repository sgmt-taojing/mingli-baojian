<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-medical/pharmacy.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌿</text></svg>">
<meta name="robots" content="noindex">
<title>药房管理 · 命理宝鉴·医道</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px}
.header a{color:rgba(255,255,255,.6);font-size:12px;text-decoration:none}
.container{max-width:1000px;margin:0 auto;padding:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.stat-card{background:var(--card);border-radius:8px;padding:12px;text-align:center;border:1px solid var(--border)}
.stat-card .val{font-size:24px;font-weight:700;color:var(--primary)}
.stat-card .lbl{font-size:10px;color:var(--text3)}
.card{background:var(--card);border-radius:10px;padding:16px;margin:12px 0;border:1px solid var(--border)}
.card h3{font-size:15px;color:var(--primary);margin-bottom:8px}
.order-item{display:flex;align-items:center;gap:10px;padding:10px;border-bottom:1px solid var(--border);font-size:13px}
.order-item .id{font-family:monospace;font-size:11px;color:var(--text3);min-width:80px}
.order-item .info{flex:1}
.order-item .badge{font-size:10px;padding:3px 8px;border-radius:10px}
.badge.preparing{background:#eff6ff;color:#2563eb}
.badge.ready{background:#f0fdf4;color:#16a34a}
.badge.completed{background:#f5f2ed;color:#9b8b7f}
.btn{display:inline-block;padding:7px 14px;border-radius:5px;font-size:11px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.small{padding:4px 10px;font-size:10px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
/* R849 条目卡片（复用问诊台 R846 契约）——药师审方即点即查 */
.entry-link{color:var(--primary);cursor:pointer;border-bottom:1px dashed var(--primary);font-weight:600}
.entry-link:hover{background:var(--primary);color:#fff;border-radius:3px}
</style>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/standard.css">
<script src="js/nav.js"></script>
<script src="js/global-search.js"></script>
<script src="js/ai-voice-assistant.js"></script>
<script src="js/seed-loader.js"></script>

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>

<script src="js/ai-assistant.js"></script>

<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">药房管理</span>
</div>

<div class="std-bar"><span class="std-tag">👥 使用对象 <b>药师</b></span><span class="std-tag">⚙️ 功能 <b>药房管理</b></span><span class="std-tag">💎 使用价值 <b>处方审核→调配→代煎/自煎→取药全流程</b></span></div>
<div class="header">
  <h1>💊 药房管理系统</h1>
  <div>
    <span id="user-info">药师</span>
    <a href="login.html" onclick="localStorage.removeItem('tcm_user')">退出</a>
  </div>
</div>
<div class="container">
  <div class="stats">
    <div class="stat-card"><div class="val" id="s-pending">0</div><div class="lbl">待审核</div></div>
    <div class="stat-card"><div class="val" id="s-preparing">0</div><div class="lbl">调配中</div></div>
    <div class="stat-card"><div class="val" id="s-ready">0</div><div class="lbl">待取药</div></div>
    <div class="stat-card"><div class="val" id="s-completed">0</div><div class="lbl">已完成</div></div>
  </div>

  <div class="card">
    <h3>📦 全部处方</h3>
    <div id="search-bar" style="display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap">
      <input  id="ph-search" type="text" placeholder="🔍 搜索药材/处方/患者..." style="flex:1;min-width:150px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px" aria-label="🔍 搜索药材/处方/患者..." data-validate="required|min=2">
      <select id="ph-status" style="padding:6px 8px;border:1px solid var(--border);border-radius:6px;font-size:11px" onchange="onPhFilter()"><option value="">全部状态</option><option value="pending">待审核</option><option value="verified">已审核</option><option value="dispensed">已调配</option><option value="completed">已完成</option></select>
      <span id="ph-count" style="font-size:11px;color:var(--text3);white-space:nowrap">0 条</span>
    </div>
    <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="text-align:left;color:var(--text3);font-size:11px"><th>编号</th><th>患者</th><th>药材</th><th>状态</th><th>医生</th><th>日期</th><th></th></tr></thead>
      <tbody id="ph-body"></tbody>
    </table></div>
  </div>

  <div class="card">
    <h3>⚗️ 调配发药台</h3>
    <div id="flow-list" style="font-size:12px;color:var(--text3)">加载中…</div>
  </div>

  <div class="card">
    <h3>📋 待审核处方</h3>
    <div id="pending-list">暂无待审核处方</div>
  </div>
</div>
<script>
/* ── R849 条目卡片（复用问诊台 R846 契约）——药名即点即查性味归经/主治/出处 ── */
var _phEntryCache = {};
async function showPhEntryByName(name, x, y) {
  var card = document.getElementById('entry-card');
  if (!card) {
    card = document.createElement('div');
    card.id = 'entry-card';
    card.style.cssText = 'position:fixed;z-index:9999;max-width:360px;background:var(--card,#fff);border:1px solid var(--border,#ddd);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:14px;font-size:12px;line-height:1.7;text-align:left';
    document.body.appendChild(card);
    document.addEventListener('click', function(ev) {
      var c = document.getElementById('entry-card');
      if (c && !c.contains(ev.target) && !ev.target.classList.contains('entry-link')) c.remove();
    });
  }
  card.style.left = Math.min(x, window.innerWidth - 380) + 'px';
  card.style.top = Math.min(y, window.innerHeight - 260) + 'px';
  card.innerHTML = '<b>' + name + '</b> <span style="opacity:.6">查询中…</span>';
  if (!_phEntryCache[name]) {
    try {
      var resp = await fetch('/api/tcm/entry/info?name=' + encodeURIComponent(name));
      _phEntryCache[name] = await resp.json();
    } catch (e) { _phEntryCache[name] = { ok: false, error: e.message }; }
  }
  var d = _phEntryCache[name];
  if (!d || !d.ok) {
    card.innerHTML = '<b>' + name + '</b><div style="opacity:.6;margin-top:6px">知识库暂无该条目</div>';
    return;
  }
  var modName = { 'tcm-herb': '药材', 'tcm-acupuncture': '腧穴', 'tcm-formula': '方剂', 'tcm-syndrome': '证型' }[d.module] || d.module;
  var lines = String(d.content || '').split('\n').filter(Boolean)
    .map(function(l){ return '<div style="margin-top:4px">' + l.replace(/^(性味归经|功效|主治|出处|归经|定位|操作|禁忌|证机概要|临床表现|代表方剂|辨证要点|主症|舌象|脉象|加减法|证候表现|证机分析)(：)/, '<b style="color:var(--primary)">$1</b>$2') + '</div>'; }).join('');
  // R856 鉴别诊断栏：同脏腑近证，点名可点跳转
  var diffs = (d.differentials || []).map(function(x){
    return '<div style="margin-top:3px">· <span class="entry-link" data-entry="' + x.name + '" title="点开鉴别">' + x.name + '</span> <span style="opacity:.7">' + _phEsc(x.gist) + '</span></div>'; }).join('');
  card.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center">' +
    '<b style="font-size:14px">' + d.title + '</b>' +
    '<span style="font-size:10px;opacity:.55;border:1px solid var(--border);border-radius:8px;padding:1px 8px">' + modName + '</span></div>' +
    lines +
    (diffs ? '<div style="margin-top:8px;border-top:1px dashed var(--border);padding-top:6px"><b style="color:var(--primary)">鉴别诊断</b>' + diffs + '</div>' : '') +
    '<div style="margin-top:8px;font-size:10px;opacity:.45">R849 条目卡片 · 审方辅助，临证裁定</div>';
}
var _phEntryNames = null;
function loadPhEntryNames() {
  if (_phEntryNames) return Promise.resolve(_phEntryNames);
  return fetch('/api/tcm/entry/names').then(function(r){ return r.json(); }).then(function(d){
    _phEntryNames = d.ok ? d.names : [];
    _phEntryNames.sort(function(a, b){ return b.length - a.length; });  // 长名优先
    return _phEntryNames;
  }).catch(function(){ _phEntryNames = []; return _phEntryNames; });
}
function _phEsc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function phLink(plain) {  // 纯文本 → 转义 → 条目名 linkify
  var html = _phEsc(plain);
  if (!_phEntryNames || !_phEntryNames.length) return html;
  var re = new RegExp(_phEntryNames.map(function(n){ return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }).join('|'), 'g');
  return html.replace(re, function(n){ return '<span class="entry-link" data-entry="' + n + '" title="点击查看条目卡片">' + n + '</span>'; });
}
document.addEventListener('click', function(ev) {
  var el = ev.target.closest && ev.target.closest('.entry-link');
  if (el) { ev.stopPropagation(); showPhEntryByName(el.dataset.entry, ev.clientX, ev.clientY + 8); }
});
// 预取正名表；就绪后重渲染一次让首屏药名带上链接
loadPhEntryNames().then(function(){ if (_phEntryNames.length && typeof loadAll === 'function') loadAll(); });

const user = JSON.parse(localStorage.getItem('tcm_user')||'{}');
document.getElementById('user-info').textContent = '👨‍⚕️ ' + (user.name||'药师');

// R812：单一数据源——API 记录存 phRecords，操作台与全部处方表双视图同源渲染
var phRecords = [];

function loadAll() {
  fetch('/api/prescription/review-queue?status=all').then(function(r){return r.json();}).then(function(data) {
    var records = data.queue || data.records || [];
    phRecords = records;
    var pending = records.filter(function(r){ return r.status==='pending'; });
    // GAP-P1：统计卡接真实状态机
    document.getElementById('s-pending').textContent = pending.length;
    document.getElementById('s-preparing').textContent = records.filter(function(r){ return r.status==='dispensed'; }).length;
    document.getElementById('s-ready').textContent = records.filter(function(r){ return r.status==='ready'; }).length;
    document.getElementById('s-completed').textContent = records.filter(function(r){ return r.status==='completed'; }).length;
    renderFlowList(records);
    var html = '';
    if (!pending.length) html = '<div style="padding:20px;text-align:center;color:var(--text3)">暂无待审核处方</div>';
    else pending.forEach(function(p) {
      var herbs = phLink((p.herbs||[]).map(function(h){ return (h.name||h)+(h.dose?' '+h.dose+'g':''); }).join('、'));
      html += '<div class="order-item"><div class="id">'+(p.rx_id||'').substring(0,16)+'</div><div class="info"><strong>'+(p.patient_id||'')+'</strong> · '+((p.diagnosis||{}).syndrome||'')+'</div><div>'+herbs+'</div><button class="btn green small" onclick="approveAPI(\''+(p.rx_id||'')+'\')">✅ 审核通过</button><button class="btn small" style="background:var(--accent);color:#fff" onclick="rejectAPI(\''+(p.rx_id||'')+'\')">❌ 退回</button></div>';
    });
    document.getElementById('pending-list').innerHTML = html;
    renderRxTable();
  }).catch(function() {
    document.getElementById('flow-list').innerHTML = '<div style="padding:12px;text-align:center">📡 服务离线，调配发药暂不可用</div>';
    // localStorage fallback（离线模式）
    var rx = JSON.parse(localStorage.getItem('tcm_prescriptions')||'[]');
    var orders = JSON.parse(localStorage.getItem('tcm_pharmacy_orders')||'[]');
    phRecords = rx;
    document.getElementById('s-pending').textContent = rx.filter(function(r){return r.status==='pending_review';}).length;
    document.getElementById('s-preparing').textContent = orders.filter(function(o){return o.status==='preparing';}).length;
    document.getElementById('s-ready').textContent = orders.filter(function(o){return o.status==='ready';}).length;
    document.getElementById('s-completed').textContent = orders.filter(function(o){return o.status==='completed'||o.status==='picked_up';}).length;
    var pending = rx.filter(function(r){return r.status==='pending_review';});
    var html = '';
    if (!pending.length) html = '<div style="padding:20px;text-align:center;color:var(--text3)">暂无待审核处方</div>';
    else pending.forEach(function(p) {
      html += '<div class="order-item"><div class="id">'+p.id+'</div><div class="info"><strong>'+(p.patient?p.patient.name:'')+'</strong> · '+(p.diagnosis||'')+'</div><div>'+(p.herbs?phLink(p.herbs.map(function(h){return h.name+h.dosage;}).join('、')):'')+'</div><button class="btn green small" onclick="approve(\''+p.id+'\')">✅ 审核通过</button><button class="btn small" style="background:var(--accent);color:#fff" onclick="reject(\''+p.id+'\')">❌ 退回</button></div>';
    });
    document.getElementById('pending-list').innerHTML = html;
    renderRxTable();
  });
}

async function approveAPI(rxId) {
  try {
    var res = await authFetch('/api/prescription/verify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rx_id:rxId,action:'approve',reviewer:user.name||'药师'})}).then(function(r){return r.json();});
    if (res.ok) { toast('✅ 审核通过'); loadAll(); } else { toast('操作失败'+(res.error?('：'+res.error):'')); }
  } catch(e) { toast('网络错误'); }
}

async function rejectAPI(rxId) {
  try {
    var res = await authFetch('/api/prescription/verify', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rx_id:rxId,action:'reject',reviewer:user.name||'药师'})}).then(function(r){return r.json();});
    if (res.ok) { toast('❌ 已退回'); loadAll(); } else { toast('操作失败'+(res.error?('：'+res.error):'')); }
  } catch(e) { toast('网络错误'); }
}

function approve(rxId) {
  var rx = JSON.parse(localStorage.getItem('tcm_prescriptions')||'[]');
  var idx = rx.findIndex(function(r){return r.id===rxId;});
  if (idx===-1) return;
  rx[idx].status='verified'; rx[idx].reviewed_at=new Date().toISOString();
  localStorage.setItem('tcm_prescriptions',JSON.stringify(rx));
  var orders = JSON.parse(localStorage.getItem('tcm_pharmacy_orders')||'[]');
  orders.unshift({id:'PH'+Date.now().toString(36).toUpperCase(),prescription_id:rxId,patient_name:rx[idx].patient?rx[idx].patient.name:'',herbs:rx[idx].herbs,delivery_method:rx[idx].delivery_method||'self_pickup',status:'preparing',created_at:new Date().toISOString(),price:{total:(rx[idx].herbs?rx[idx].herbs.length:1)*25+10}});
  localStorage.setItem('tcm_pharmacy_orders',JSON.stringify(orders));
  toast('✅ 审核通过，已进入调配');
  loadAll();
}

function reject(rxId) {
  var rx=JSON.parse(localStorage.getItem('tcm_prescriptions')||'[]');
  var idx=rx.findIndex(function(r){return r.id===rxId;});
  if(idx===-1)return;
  rx[idx].status='rejected'; rx[idx].reviewed_at=new Date().toISOString();
  localStorage.setItem('tcm_prescriptions',JSON.stringify(rx));
  toast('❌ 处方已退回');
  loadAll();
}

// GAP-P1：调配发药台——全部走服务端真实状态机（dispense 服务端联动扣库存，未结算/缺药硬拦截）
var FLOW_STEP = {
  reviewed:  { action: 'dispense', label: '📦 开始调配', needPaid: true },
  dispensed: { action: 'ready',    label: '✔️ 调配完成' },
  ready:     { action: 'complete', label: '🏁 发药完成' }
};

function renderFlowList(records) {
  var rows = records.filter(function(r){ return FLOW_STEP[r.status]; });
  var box = document.getElementById('flow-list');
  if (!rows.length) { box.innerHTML = '<div style="padding:12px;text-align:center">暂无待调配/待发药处方</div>'; return; }
  box.innerHTML = rows.map(function(r) {
    var step = FLOW_STEP[r.status];
    var herbs = (r.herbs || []).map(function(h){ return (h.name || h) + (h.dose ? ' ' + h.dose + 'g' : ''); }).join('、');
    var paid = r.payment_status === 'paid';
    var price = (r.price && r.price.total != null) ? ' · ¥' + r.price.total : '';
    var payTag = r.status === 'reviewed'
      ? (paid ? '<span style="color:#16a34a">已结算</span>' : '<span style="color:#dc2626">未结算·须先收费</span>')
      : '';
    return '<div class="order-item">' +
      '<div class="id">' + (r.rx_id || '').substring(0, 16) + '</div>' +
      '<div class="info"><strong>' + _phEsc(r.patient_id || '') + '</strong> · ' + _phEsc((r.diagnosis || {}).syndrome || '') + price + ' ' + payTag + '</div>' +
      '<div>' + phLink(herbs) + '</div>' +
      '<button class="btn green small" onclick="flowAPI(\'' + (r.rx_id || '') + '\',\'' + step.action + '\')">' + step.label + '</button>' +
      '</div>';
  }).join('');
}

async function flowAPI(rxId, action) {
  try {
    var res = await authFetch('/api/prescription/verify', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rx_id: rxId, action: action, reviewer: user.name || '药师' })
    }).then(function(r){ return r.json(); });
    if (res.ok) {
      toast({ dispense: '📦 已开始调配（库存已扣减）', ready: '✔️ 调配完成，等待取药', complete: '🏁 发药完成' }[action] || '✅ 已流转');
      loadAll();
    } else if (res.error === 'unpaid_required') {
      toast('💰 处方未结算（¥' + (res.amount_due != null ? res.amount_due : '—') + '），请先到收费台收费', 'warn');
    } else if (res.error === 'stock_insufficient') {
      toast('🚫 ' + (res.message || '库存不足'), 'warn');
    } else {
      toast('操作失败' + (res.error ? ('：' + res.error) : ''), 'warn');
    }
  } catch (e) { toast('网络错误'); }
}

loadAll();
setInterval(loadAll, 15000);
</script>

<script>
// R812：全部处方表 = phRecords 同源客户端视图（搜索/状态过滤），不再经 Paginator/localStorage
var PH_STATUS_LABEL = {"pending":"⏳待审","pending_review":"⏳待审","reviewed":"✅已审","verified":"✅已审","rejected":"❌已退","paid":"💰已付","dispensed":"📦调配中","ready":"✔️可取","completed":"🏁完成"};

function phFiltered() {
  var si = document.getElementById("ph-search");
  var ss = document.getElementById("ph-status");
  var q = si ? si.value : "";
  var st = ss ? ss.value : "";
  var list = phRecords.slice();
  if (st) list = list.filter(function(r){ var s = r.status||""; return s===st || (st==="pending"&&s==="pending_review") || (st==="verified"&&(s==="verified"||s==="reviewed")); });
  if (q) {
    var ql = q.toLowerCase();
    list = list.filter(function(r){
      var herbs = (r.herbs||(r.prescription||{}).herbs||[]).map(function(h){ return typeof h==="string"?h:(h.name||""); }).join(" ");
      var text = [r.rx_id, r.id, r.patient_id, r.patient_name, (r.patient&&r.patient.name), r.doctor, (r.diagnosis||{}).syndrome, r.diagnosis, herbs].join(" ").toLowerCase();
      return text.indexOf(ql) >= 0;
    });
  }
  return list;
}

function renderRxTable() {
  var rows = phFiltered();
  renderPhRows(rows);
  var el = document.getElementById("ph-count");
  if (el) el.textContent = rows.length + " 条";
}

function onPhSearch() { renderRxTable(); }
function onPhFilter() { renderRxTable(); }

var _phDebounce;
function onPhDebounce() {
  clearTimeout(_phDebounce);
  _phDebounce = setTimeout(onPhSearch, 300);
}

function renderPhRows(rows) {
  var el = document.getElementById("ph-body");
  if (!el) return;
  if (!rows.length) {
    el.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text3);padding:20px">📦 暂无记录 — 创建新处方后此处显示</td></tr>';
    return;
  }
  var html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var herbs = (r.herbs||(r.prescription||{}).herbs||[]);
    var herbNames = Array.isArray(herbs) ? phLink(herbs.map(function(h){ return typeof h==="string"?h:(h.name||"")+(h.dose?" "+h.dose+"g":(h.dosage||"")); }).join(", ").slice(0,40)) : "";
    var statusLabel = PH_STATUS_LABEL[r.status]||r.status||"—";
    var rid = r.rx_id||r.id||"";
    var patient = r.patient_id||r.patient_name||(r.patient&&r.patient.name)||"—";
    html += "<tr>"+
      "<td>"+rid.slice(-6)+"</td>"+
      "<td>"+patient+"</td>"+
      "<td style='font-size:11px'>"+herbNames+"</td>"+
      "<td>"+statusLabel+"</td>"+
      "<td>"+(r.doctor||"—")+"</td>"+
      "<td style='font-size:10px;color:var(--text3)'>"+(r.created_at||"").slice(0,10)+"</td>"+
      "<td><a href='javascript:void(0)' data-rxid='"+rid+"' onclick='viewRx(this.dataset.rxid)' style='font-size:11px'>详情</a></td>"+
    "</tr>";
  }
  el.innerHTML = html;
}

// viewRx 此前未定义（点详情静默报错）——R812 补真实现
function viewRx(rxid) {
  var r = null;
  for (var i = 0; i < phRecords.length; i++) { if ((phRecords[i].rx_id||phRecords[i].id)===rxid) { r = phRecords[i]; break; } }
  if (!r) { toast('未找到该处方'); return; }
  var herbs = phLink((r.herbs||(r.prescription||{}).herbs||[]).map(function(h){ return typeof h==="string"?h:(h.name||"")+(h.dose?" "+h.dose+"g":(h.dosage||"")); }).join("、") || "—");
  var body = '<div style="font-size:13px;line-height:1.9">'+
    '<b>编号：</b>'+rxid+'<br><b>患者：</b>'+(r.patient_id||r.patient_name||(r.patient&&r.patient.name)||"—")+
    '<br><b>诊断：</b>'+((r.diagnosis||{}).syndrome||r.diagnosis||"—")+
    '<br><b>状态：</b>'+(PH_STATUS_LABEL[r.status]||r.status||"—")+
    '<br><b>医生：</b>'+(r.doctor||"—")+
    '<br><b>药材：</b>'+herbs+'</div>';
  if (typeof openModal === "function") { openModal(body, '处方详情'); } else { toast(herbs); }
}

// 绑定搜索（loadAll 完成后表格自动渲染）
window.addEventListener("DOMContentLoaded", function() {
  var si = document.getElementById("ph-search");
  if (si) si.addEventListener("input", onPhDebounce);
});
</script>

  <div class="card" style="margin:10px 0"><h3>📦 库存预警</h3><div id="inv-alert"></div></div>
  <script>
  (function(){
    var api='';var stock={};
    var herbs=['甘草','人参','当归','黄芪','白术','茯苓','白芍','熟地','川芎','丹参','麦冬','五味子'];
    herbs.forEach(function(h,i){stock[h]=Math.max(2,20-Math.floor(i*1.7));});
    function renderStock(){
      var html='';
      for(var n in stock){var s=stock[n];var c=s<5?'#ef4444':s<10?'#f59e0b':'#22c55e';
        html+='<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #eee"><span>'+n+'</span><span style="color:'+c+';font-weight:600">'+s+'g</span></div>';}
      var el=document.getElementById('inv-alert');if(el)el.innerHTML=html||'库存加载中...';
    }
    renderStock();
    fetch(api+'/api/home/med-detail?patient_id=P001').then(function(r){return r.json()}).then(function(d){
      if(d.meds){d.meds.forEach(function(m){var n=m.drug;stock[n]=(stock[n]||0)+(m.dosage?parseInt(m.dosage)||9:9);});renderStock();}
    }).catch(function(){var el=document.getElementById('inv-alert');if(el&&!el.innerHTML)el.innerHTML='API离线 · 显示本地库存';});
    window.updateStock=function(name,amt){
      if(stock[name]!==undefined)stock[name]=Math.max(0,(stock[name]||0)+(amt||0));
      renderStock();
    };
    window.addEventListener('DOMContentLoaded',renderStock);
  })();
  </script>
