<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--red-bg:#fef2f2;--green-bg:#f0fdf4;--blue-bg:#eff6ff;--gold-bg:#fffbeb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.header{background:linear-gradient(135deg,#2e7d32,#1b5e20);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px}
.container{max-width:600px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:16px;margin:12px 0;border:1px solid var(--border);box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card h3{font-size:15px;color:var(--primary);margin-bottom:8px}
.input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:var(--bg);color:var(--text);font-family:inherit;margin-bottom:8px}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-block;padding:10px 24px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.block{width:100%}
.result-box{background:linear-gradient(135deg,var(--green-bg),#f0fff4);border:1px solid #86efac;border-radius:8px;padding:12px;margin-top:8px;display:none}
.steps{display:flex;gap:4px;margin:12px 0}
.step{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:11px;background:var(--bg);border:1px solid var(--border)}
.step.active{background:var(--green);color:#fff;border-color:var(--green)}
.qr-box{text-align:center;padding:16px;background:var(--card);border-radius:12px;margin:12px 0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;animation:toastIn .3s}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>

<script>
// R814：医生数据全真——从 /api/doctors 拉在册医生（档案+真实统计），假 departments 表移除
var DOCTORS = [];
var selectedDoctor = '';

function loadDoctors() {
  fetch('/api/doctors').then(function(r){ return r.json(); }).then(function(d) {
    DOCTORS = d.doctors || [];
    renderDoctorPicker();
    renderDoctors();
    // URL 预选（医生团队页「立即挂号」入口带 ?doctor=）
    var m = location.search.match(/[?&]doctor=([A-Za-z0-9]+)/);
    if (m) selectDoctor(m[1].toUpperCase());
  }).catch(function() {
    var dp = document.getElementById('doctor-picker');
    if (dp) dp.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:6px">📡 服务离线，暂不能挂号</div>';
    var dl = document.getElementById('doctor-list');
    if (dl) dl.textContent = '服务离线';
  });
}

function selectDoctor(id) {
  selectedDoctor = id;
  renderDoctorPicker();
}

function renderDoctorPicker() {
  var el = document.getElementById('doctor-picker');
  if (!el) return;
  if (!DOCTORS.length) { el.innerHTML = '<div style="color:var(--text3);font-size:12px;padding:6px">加载医生中…</div>'; return; }
  el.innerHTML = DOCTORS.map(function(p) {
    var sel = selectedDoctor === p.doctor_id;
    var st = p.stats || {};
    return '<div onclick="selectDoctor(\''+p.doctor_id+'\')" style="display:flex;align-items:center;gap:10px;padding:10px;border:2px solid '+(sel?'var(--primary)':'var(--border)')+';border-radius:8px;cursor:pointer;background:'+(sel?'var(--gold-bg)':'var(--card)')+'">' +
      '<span style="font-size:24px">'+(p.avatar||'👨‍⚕️')+'</span>' +
      '<div style="flex:1"><b>'+p.name+'</b> <span style="font-size:11px;color:var(--text3)">'+p.title+' · '+p.specialty_name+'</span><br>' +
      '<span style="font-size:10px;color:var(--text2)">擅长：'+(p.good_at||[]).slice(0,4).join('、')+'</span></div>' +
      '<div style="text-align:right;font-size:11px;color:var(--text2)">¥'+p.fee+'<br>' +
      (st.rating_avg!=null ? '<span style="color:var(--gold)">★'+st.rating_avg+'</span>' : '<span style="color:var(--text3)">暂无评价</span>') +
      (p.today_waiting ? '<br><span style="color:var(--accent)">候诊 '+p.today_waiting+'</span>' : '<br><span style="color:var(--green)">可挂</span>') +
      '</div></div>';
  }).join('');
}

// 今日出诊（按医生档案 schedule + 星期几，真实排班）
function renderDoctors() {
  var el = document.getElementById('doctor-list');
  if (!el) return;
  if (!DOCTORS.length) { el.textContent = '加载中...'; return; }
  var wd = String(new Date().getDay());
  var SLOT = { am: '上午 08:30-12:00', pm: '下午 14:00-17:30' };
  var html = '';
  DOCTORS.forEach(function(p) {
    var slots = (p.schedule && p.schedule[wd]) || [];
    if (!slots.length) {
      html += '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;color:var(--text3)"><span>'+(p.avatar||'👨‍⚕️')+' '+p.name+' · '+p.specialty_name+'</span><span>今日休息</span></div>';
    } else {
      html += '<div style="padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between"><span>'+(p.avatar||'👨‍⚕️')+' '+p.name+' · '+p.specialty_name+'</span><span>'+slots.map(function(s){return SLOT[s];}).join(' / ')+' · ¥'+p.fee+'</span></div>';
    }
  });
  el.innerHTML = html;
}

// 评价医生（R814：就诊后五星+标签+评论 → /api/review/create）
function openReview(doctorId, patientName) {
  if (!doctorId) { toast('该记录未关联医生', 'warn'); return; }
  var tagPool = ['问诊细致','疗效好','态度温和','解释清楚','用药精准','等待短'];
  var overlay = openModal(
    '<div style="display:grid;gap:8px;min-width:280px">' +
    '<div id="__rv_stars" style="font-size:26px;letter-spacing:4px;cursor:pointer;color:var(--gold,#b8860b);user-select:none">☆☆☆☆☆</div>' +
    '<div id="__rv_tags" style="display:flex;flex-wrap:wrap;gap:6px">' + tagPool.map(function(t){ return '<span data-tag="'+t+'" style="font-size:11px;padding:3px 10px;border:1px solid #d1d5db;border-radius:12px;cursor:pointer">'+t+'</span>'; }).join('') + '</div>' +
    '<textarea id="__rv_comment" placeholder="补充说明（可选）" style="padding:8px;border:1px solid #d1d5db;border-radius:6px;min-height:60px"></textarea>' +
    '<button id="__rv_ok" style="padding:10px;border:none;border-radius:6px;background:var(--primary,#6b3a1f);color:#fff;cursor:pointer">✅ 提交评价</button></div>',
    '评价医生');
  var rating = 0;
  var starEl = overlay.querySelector('#__rv_stars');
  starEl.addEventListener('click', function(e) {
    var rect = starEl.getBoundingClientRect();
    rating = Math.min(5, Math.max(1, Math.ceil((e.clientX - rect.left) / rect.width * 5)));
    var s = '';
    for (var i = 1; i <= 5; i++) s += i <= rating ? '★' : '☆';
    starEl.textContent = s;
  });
  var chosen = [];
  overlay.querySelectorAll('#__rv_tags [data-tag]').forEach(function(el) {
    el.addEventListener('click', function() {
      var t = el.getAttribute('data-tag');
      var i = chosen.indexOf(t);
      if (i >= 0) { chosen.splice(i,1); el.style.background=''; el.style.color=''; }
      else { chosen.push(t); el.style.background='#fffbeb'; el.style.color='#6b3a1f'; }
    });
  });
  overlay.querySelector('#__rv_ok').addEventListener('click', function() {
    if (!rating) { toast('请点星级', 'warn'); return; }
    fetch('/api/review/create', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ doctor_id: doctorId, patient_name: patientName, rating: rating, tags: chosen, comment: overlay.querySelector('#__rv_comment').value.trim() }) })
      .then(function(r){ return r.json(); }).then(function(d) {
        if (d.ok) { overlay.remove(); toast('✅ 感谢评价'); }
        else toast('评价失败：'+(d.error||''), 'warn');
      }).catch(function(){ toast('网络错误', 'warn'); });
  });
}

// R758 AI 化：AI 预分诊——主诉症状 → 辨证引擎 → 推荐科室
async function aiTriage() {
  const complaint = document.getElementById('complaint').value.trim();
  const box = document.getElementById('triage-result');
  if (!complaint) { toast('请先填写主诉', 'warn'); return; }
  box.style.display = 'block';
  box.innerHTML = '🤖 分析中…';
  try {
    const r = await fetch('/api/tcm/inhouse-diagnose', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ symptoms: complaint.split(/[，,。;；]/).filter(x => x.trim().length >= 2).slice(0, 6) })
    });
    const j = await r.json();
    const diag = (j && j.diagnosis) || {};
    const syn = diag.syndrome || '';
    // R814：证型 → 医生专业映射（按医生挂号，无科室维度）
    const specMap = [
      { kw: ['心','神','失眠','心悸','胃','脾','腹','食','肠','咳','喘','肺','鼻','气','虚','血'], spec: 'internal' },
      { kw: ['痛','伤','骨','腰','关节','瘫','麻','晕'], spec: 'acupuncture' },
      { kw: ['月','带','孕','妇','产'], spec: 'gynecology' }
    ];
    let recDoc = null;
    for (const m of specMap) { if (m.kw.some(k => syn.includes(k) || complaint.includes(k))) { recDoc = DOCTORS.find(p => p.specialty === m.spec) || null; break; } }
    if (recDoc) selectDoctor(recDoc.doctor_id);
    box.innerHTML = '<div style="font-size:13px;line-height:1.7">🤖 <b>AI 预分诊</b><br>' +
      '识别证型：<b>' + (syn || '待完善') + '</b>' + (diag.formula ? ' · ' + diag.formula : '') +
      (diag.confidence ? ' · 置信度 ' + Math.round(diag.confidence * 100) + '%' : '') +
      (recDoc ? '<br>✅ 已为你选中医生：<b>' + recDoc.name + '</b>（' + recDoc.specialty_name + '）' : '<br>⚠ 未匹配到医生，请手动选择') +
      (diag.advice ? '<br>💡 ' + diag.advice : '') + '</div>';
  } catch (e) {
    box.innerHTML = '<div style="font-size:13px;color:var(--red)">AI 预分诊暂不可用，请手动选择医生</div>';
  }
}

function register() {
  const name = document.getElementById('patient-name').value.trim();
  const age = document.getElementById('patient-age').value;
  const gender = document.getElementById('patient-gender').value;
  const phone = document.getElementById('patient-phone').value.trim();
  const complaint = document.getElementById('complaint').value.trim();
  if (!name) return toast('请填写姓名');
  if (!selectedDoctor) return toast('请选择医生');

  const doc = DOCTORS.find(function(p){ return p.doctor_id === selectedDoctor; });
  // R814：真挂号——入服务端叫号队列（联动建档问诊会话 + 患者主索引）
  fetch('/api/clinic/queue/checkin', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ patient_name: name, complaint: complaint, gender: gender, doctor_id: selectedDoctor })
  }).then(function(r){ return r.json(); }).then(function(j) {
    if (!j.ok) { toast('挂号失败：' + (j.error || ''), 'warn'); return; }
    const entry = j.entry;
    const reg = {
      id: entry.id,
      name, age, gender, phone,
      doctor: doc ? doc.name : '', doctor_id: selectedDoctor,
      department_name: doc ? doc.specialty_name : '',
      complaint, fee: doc ? doc.fee : 30,
      queue_num: entry.queue_no,
      time: entry.created_at,
      status: 'registered'
    };

    let list = JSON.parse(localStorage.getItem('tcm_registrations')||'[]');
    list.unshift(reg);
    localStorage.setItem('tcm_registrations',JSON.stringify(list));

    document.getElementById('reg-result').style.display='block';
    document.getElementById('reg-result').innerHTML = `
      <strong>✅ 挂号成功（已入叫号队列）</strong><br>
      排队号: <strong style="font-size:20px;color:var(--primary)">${reg.queue_num}</strong><br>
      医生: ${reg.doctor}（${reg.department_name}）· 挂号费: ¥${reg.fee}<br>
      <span style="font-size:11px;color:var(--text3)">请留意叫号 · 就诊完成后可在下方记录中评价医生</span>
    `;
    renderMyRegistrations();
    toast('挂号成功！');
  }).catch(function() { toast('网络错误，请稍后再试', 'warn'); });
}

function renderMyRegistrations() {
  const list = JSON.parse(localStorage.getItem('tcm_registrations')||'[]').slice(0, 10);
  if (!list.length) {
    document.getElementById('my-registrations').innerHTML = '暂无挂号记录';
    return;
  }
  let html = '';
  for (const r of list) {
    const statusLabels = { registered: '🟢 已挂号', diagnosing: '🟡 就诊中', done: '✅ 已完成', cancelled: '❌ 已取消' };
    html += `<div style="padding:8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center">
      <div><strong>${r.id.slice(-6)}</strong> · ${r.department_name||''} · ${r.doctor}<br><span style="font-size:11px;color:var(--text3)">${r.name} · 排队${r.queue_num}号</span></div>
      <span style="display:flex;align-items:center;gap:6px"><span>${statusLabels[r.status]}</span><button class="btn small" style="padding:3px 8px;font-size:11px;border:1px solid var(--border);background:var(--bg);border-radius:6px;cursor:pointer" onclick="openReview('${r.doctor_id||''}','${r.name}')">⭐ 评价</button></span>
    </div>`;
  }
  document.getElementById('my-registrations').innerHTML = html;
}

loadDoctors();
renderMyRegistrations();
</script>

<script>
var ptPage = null;

function initPtPage() {
  if (typeof Paginator === "undefined") return;
  try {
    var dp = createPage("tcm_patient_records", { pageSize: 12, sortBy: "created_at" });
    ptPage = new Paginator("my-records", dp, renderPtRows, { pageSize: 12 });
    ptPage.render();
  } catch(e) {}
}

function renderPtRows(rows, info) {
  var el = document.getElementById("my-records");
  if (!rows.length) {
    el.innerHTML = '<div style="text-align:center;color:var(--text3);padding:20px">📋 暂无记录 — 完成就诊后自动显示</div>';
    return;
  }
  var html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    html += '<div class="card" style="margin:6px 0;padding:10px">'+
      '<div style="display:flex;justify-content:space-between">'+
        '<b>'+(r.patient_name||"—")+'</b>'+
        '<span style="font-size:10px;color:var(--text3)">'+(r.created_at||"").slice(0,10)+'</span>'+
      '</div>'+
      '<div style="font-size:11px;color:var(--text2)">'+(r.diagnosis||"—")+'</div>'+
      '<div style="font-size:10px;color:var(--text3)">'+(r.doctor||"—")+' · #'+(r.id||"").slice(-6)+'</div>'+
    '</div>';
  }
  el.innerHTML = html;
}

function searchPt(q) {
  if (!ptPage) return;
  if (!q) { ptPage.go(1); return; }
  var result = ptPage.dp.search(q, ["patient_name","diagnosis","patient_id","doctor"]);
  renderPtRows(result.items, { total: result.total });
}

setTimeout(initPtPage, 200);
setInterval(initPtPage, 30000);
</script>

<!-- ═══ CRUD 演示面板: 就诊记录增删改查 ═══ -->
<div style="margin:12px 0;padding:12px;background:var(--card);border-radius:8px;border:1px solid var(--border)">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <h4 style="font-size:13px;color:var(--tcm)">📝 我的就诊记录（CRUD 活管理）</h4>
    <div style="display:flex;gap:4px">
      <button onclick="crudAddNew()" style="padding:4px 10px;border-radius:6px;background:var(--tcm);color:#fff;border:none;font-size:11px">➕ 新增</button>
      <button onclick="crudExport()" style="padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);font-size:11px">导出</button>
      <button onclick="crudImport()" style="padding:4px 10px;border-radius:6px;background:var(--card);border:1px solid var(--border);font-size:11px">导入</button>
    </div>
  </div>
  <input  type="text" id="crud-search" placeholder="搜索" oninput="crudSearch(this.value)" style="width:100%;border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px;margin-bottom:6px" aria-label="搜索">
  <div id="crud-form-area"></div>
  <div id="crud-table"></div>
</div>

<script>
// CRUD 引擎初始化（患者就诊记录）
var __ptCrudReady = false;
function initPtCrud() {
  if (__ptCrudReady || !window.TCM || !window.TCM.crud) return;
  __ptCrudReady = true;
  window.TCM.crud.init('visit', {
    columns: [
      { key: 'date', label: '就诊日期', type: 'date', width: '110px' },
      { key: 'symptom', label: '主诉', width: '2fr', default: '' },
      { key: 'syndrome', label: '证型', type: 'select', options: ['','气虚质','阳虚质','阴虚质','痰湿质','湿热质','血瘀质','气郁质','特禀质','平和质'], width: '90px' },
      { key: 'formula', label: '方剂', width: '2fr' },
      { key: 'effect', label: '效果', type: 'select', options: ['','显效','有效','一般','无效'], width: '70px' }
    ],
    storageKey: 'tcm_crud_visit',
    tableContainer: 'crud-table',
    formContainer: 'crud-form-area'
  });
  // 预填 3 条 demo
  if (!localStorage.getItem('tcm_crud_visit_data')) {
    var seeded = [
      { id: '1', date: '2026-07-15', symptom: '失眠多梦', syndrome: '气郁质', formula: '逍遥散', effect: '有效', created_at: new Date().toISOString(), updated_at: new Date().toISOString() },
      { id: '2', date: '2026-07-22', symptom: '头晕乏力', syndrome: '气虚质', formula: '补中益气汤', effect: '显效', created_at: new Date().toISOString(), updated_at: new Date().toISOString() },
      { id: '3', date: '2026-08-01', symptom: '食欲不振', syndrome: '痰湿质', formula: '香砂六君子', effect: '有效', created_at: new Date().toISOString(), updated_at: new Date().toISOString() }
    ];
    localStorage.setItem('tcm_crud_visit_data', JSON.stringify(seeded));
  }
  window.TCM.crud.loadData && window.TCM.crud.loadData('visit');
  crudRenderTable();
}

function crudRenderTable() {
  if (!window.TCM || !window.TCM.crud) return;
  var cfg = window.TCM.crud.init.toString ? window.TCM.crud : null;
  var columns = [
    { key: 'date', label: '日期', width: '90px' },
    { key: 'symptom', label: '主诉', width: '2fr' },
    { key: 'syndrome', label: '证型', width: '80px' },
    { key: 'formula', label: '方剂', width: '2fr' },
    { key: 'effect', label: '效果', width: '60px' }
  ];
  window.TCM.crud.renderTable('visit', 'crud-table', columns);
}

function crudAddNew() {
  // R743 修真——提交前统一校验（uiStates.validateInputs）
  if (window.uiStates && uiStates.validateInputs && !window.__r743_injecting) {
    var _vr = uiStates.validateInputs(document);
    if (!_vr.ok) { uiStates.showValidationErrors(_vr); return; }
  }

  if (!window.TCM || !window.TCM.crud) return;
  window.TCM.crud.edit('visit', 'new');
}

function crudSearch(q) {
  if (!window.TCM || !window.TCM.crud) return;
  var inst = window.TCM.crud.init('visit', { columns: [] });
  inst.searchQuery = q;
  crudRenderTable();
}

function crudExport() {
  if (!window.TCM || !window.TCM.crud) return;
  var data = window.TCM.crud.export('visit');
  var blob = new Blob([data], { type: 'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'visit-records-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  if (window.TCM.toast) window.TCM.toast('📦 已导出');
}

function crudImport() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function() {
      var res = window.TCM.crud.import('visit', r.result);
      if (res.ok) {
        if (window.TCM.toast) window.TCM.toast('✅ 导入 ' + res.count + ' 条');
        crudRenderTable();
      } else {
        if (window.TCM.toast) window.TCM.toast('❌ ' + res.error);
      }
    };
    r.readAsText(file);
  };
  input.click();
}

setTimeout(initPtCrud, 300);
</script>
