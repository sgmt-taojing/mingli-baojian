<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医生诊断工作台</title><style>
:root{font-family:system-ui,sans-serif;color:#173d38;background:#f4f7f4}body{max-width:1180px;margin:auto;padding:28px}h1{font-size:28px}p{line-height:1.7}header{display:flex;justify-content:space-between;align-items:center}.panel{background:white;border:1px solid #d8e4de;border-radius:14px;padding:24px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;margin:10px 0;font-size:14px}input,textarea,select{display:block;box-sizing:border-box;width:100%;border:1px solid #aebfb7;border-radius:7px;padding:10px;margin-top:6px;font:inherit}textarea{min-height:80px}button{background:#176856;color:white;border:0;border-radius:7px;padding:11px 16px;margin:6px 8px 6px 0;cursor:pointer}button:disabled{opacity:.4;cursor:default}.secondary{background:#e5eee8;color:#23473c}input[type=checkbox]{display:inline;width:auto}#message{white-space:pre-wrap;color:#9b381e;min-height:26px}#evidence article{border-top:1px solid #ddd;padding:12px 0}small{color:#5a7167}.status{padding:6px 10px;background:#eaf2df;border-radius:20px}#records button{text-align:left}.hidden{display:none!important}@media(max-width:720px){.grid{grid-template-columns:1fr}body{padding:14px}}
</style></head><body><header><div><small>中医 · 医生辅助决策</small><h1>诊断工作台</h1></div><span id="status" class="status">尚未登录</span></header><p>先记录患者事实，再核对知识依据。最终结论由医生独立填写；影像观察和检索结果不能替代诊断。</p><div id="message" role="status" aria-live="polite"></div>
<section id="loginPanel" class="panel"><h2>医生登录</h2><form id="loginForm"><div class="grid"><label>账号<input name="username" autocomplete="username" required maxlength="120"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label></div><button>登录</button></form></section>
<p><a href="knowledge-review.html">医学知识独立审核</a></p><main id="workspace" class="hidden"><section class="panel"><button id="newRecord">新建诊疗记录</button><button id="refresh" class="secondary">刷新列表</button><button id="logout" class="secondary">退出</button><div id="records"></div></section>
<section class="panel"><h2>患者信息与四诊记录</h2><form id="intakeForm"><label>患者编号<input name="patient_ref" required maxlength="120"></label><div class="grid"><label>主诉<textarea name="chief_complaint" required maxlength="2000"></textarea></label><label>症状（逗号分隔）<textarea name="symptoms" maxlength="2000"></textarea></label><label>持续时间<input name="duration" maxlength="2000"></label><label>既往史<input name="history" placeholder="请填写已确认的情况，无则填写无" maxlength="2000"></label><label>当前用药<input name="medications" maxlength="2000"></label><label>过敏史<input name="allergies" maxlength="2000"></label><label>舌象（医生核验后）<textarea name="tongue" maxlength="2000"></textarea></label><label>脉象与其他观察<textarea name="pulse" maxlength="2000"></textarea></label></div><label><input type="checkbox" name="consent"> 已确认本次诊疗信息采集授权</label><button id="saveButton">保存记录</button><button type="button" data-action="assess">检索依据与检查缺项</button><button type="button" data-action="submit">提交医生审核</button></form></section>
<section class="panel"><h2>辅助评估与来源</h2><p id="assessment">尚未评估</p><div id="evidence"></div></section>
<section class="panel"><h2>医生审核</h2><label>独立诊断结论<textarea id="conclusion" maxlength="2000"></textarea></label><label>支持、矛盾证据与判断依据<textarea id="rationale" maxlength="2000"></textarea></label><label>后续安排<textarea id="plan" maxlength="2000"></textarea></label><label><input id="independent" type="checkbox"> 已独立核对患者事实与依据</label><button data-action="sign">确认并签发记录</button><label>退回、修订或作废原因<textarea id="reason" maxlength="1000"></textarea></label><button data-action="return" class="secondary">退回补充</button><button data-action="amend" class="secondary">发起修订</button><button data-action="void" class="secondary">作废记录</button></section>
<section class="panel"><h2>报告授权</h2><p>请先核验患者授权与接收人身份。接收账户编号由对方登录授权报告页后提供。</p><label>接收账户编号<input id="recipient" maxlength="120"></label><label>授权期限（天，最长30天）<input id="shareDays" type="number" min="1" max="30" value="7"></label><label>授权依据或撤回原因<textarea id="shareReason" maxlength="1000"></textarea></label><label><input id="shareConsent" type="checkbox"> 已确认患者的本次共享授权</label><label><input id="shareFollowup" type="checkbox"> 允许接收人回传随访</label><button type="button" id="grantShare">授权查看</button><button type="button" id="revokeShare" class="secondary">撤回授权</button><a href="shared-reports.html">患者与家属授权报告入口</a></section><section class="panel"><h2>随访与版本</h2><label>随访记录<textarea id="outcome" maxlength="2000"></textarea></label><button data-action="followup">保存随访</button><div id="history"></div></section></main><script src="js/clinical-workflow.js"></script></body></html>
