<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="canonical" href="https://sgmt-taojing.github.io/mingli-medical/telemedicine.html">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📹</text></svg>">
<title>远程会诊 · 命理宝鉴·医道</title>
<style>
:root{--bg:#f5f2ed;--card:#fff;--border:#ddd6c8;--primary:#6b3a1f;--accent:#c0392b;--green:#16a34a;--blue:#2563eb;--gold:#b8860b;--text:#1a1008;--text2:#6b5b4f;--text3:#9b8b7f;--red-bg:#fef2f2;--green-bg:#f0fdf4;--blue-bg:#eff6ff;--gold-bg:#fffbeb}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.container{max-width:1000px;margin:0 auto;padding:12px}
.header{background:linear-gradient(135deg,#1a1008,#4a2810);color:#fff;padding:16px;border-radius:0 0 12px 12px;margin-bottom:12px}
.header h1{font-size:18px}.header .sub{font-size:11px;opacity:.6}
.card{background:var(--card);border-radius:10px;padding:14px;margin:10px 0;border:1px solid var(--border)}
.card h3{font-size:14px;color:var(--primary);margin-bottom:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:768px){.grid2{grid-template-columns:1fr}}
.video-area{background:#1a1008;border-radius:10px;min-height:240px;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.4);font-size:13px;position:relative;overflow:hidden}
.video-area .cam-hint{text-align:center}
.video-area .cam-hint .icon{font-size:44px}
.video-area.on{background:linear-gradient(135deg,#0f2027,#203a43)}
.video-area .rec-dot{position:absolute;top:10px;left:12px;color:#f87171;font-size:11px;display:none}
.video-area.on .rec-dot{display:block}
.label{font-size:11px;color:var(--text3);margin:6px 0 2px;display:block}
.input,select,textarea{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);font-family:inherit}
.btn{display:inline-block;padding:9px 18px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none}
.btn.primary{background:var(--primary);color:#fff}.btn.green{background:var(--green);color:#fff}.btn.blue{background:var(--blue);color:#fff}.btn.red{background:var(--accent);color:#fff}
.btn.small{padding:4px 10px;font-size:11px;border:1px solid var(--border);background:var(--bg)}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg-item{padding:8px;border-bottom:1px solid var(--border);font-size:12px}
.msg-item .who{font-weight:600}
.msg-doctor{color:var(--blue)}.msg-patient{color:var(--green)}
.case-chip{display:inline-block;padding:2px 8px;border-radius:8px;font-size:10px;background:var(--blue-bg);color:var(--blue);margin:2px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 24px;border-radius:20px;font-size:13px;z-index:999}
</style>
<link rel="stylesheet" href="css/mobile.css">
<link rel="stylesheet" href="css/standard.css">
<script src="js/nav.js"></script>
<script src="js/global-search.js"></script>
<script src="js/ai-voice-assistant.js"></script>
<script src="js/seed-loader.js"></script>
<script src="js/crud-engine.js"></script>
<script src="js/realtime-engine.js"></script>
<script src="js/config-engine.js"></script>

<style>
.page-header-bar { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--bg-card, #fff); border-bottom: 1px solid var(--border, #e8dfc8); position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 4px rgba(139,69,19,0.06); }
.page-header-bar[data-theme="tcm"] { border-bottom-color: #b8860b; }
.page-header-bar[data-theme="home"] { border-bottom-color: #2e8b57; }
.page-header-bar[data-theme="admin"] { border-bottom-color: #475569; }
.page-header-bar[data-theme="kb"] { border-bottom-color: #7c3aed; }
.page-header-bar[data-theme="wellness"] { border-bottom-color: #f59e0b; }
.phb-back { font-size: 22px; color: var(--text2, #6b5b4f); text-decoration: none; padding: 0 8px; }
.phb-back:hover { color: var(--primary, #b8860b); }
.phb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary, #b8860b); flex-shrink: 0; }
.page-header-bar[data-theme="tcm"] .phb-dot { background: #b8860b; }
.page-header-bar[data-theme="home"] .phb-dot { background: #2e8b57; }
.page-header-bar[data-theme="admin"] .phb-dot { background: #475569; }
.page-header-bar[data-theme="kb"] .phb-dot { background: #7c3aed; }
.page-header-bar[data-theme="wellness"] .phb-dot { background: #f59e0b; }
.phb-title { font-size: 15px; font-weight: 600; color: var(--text, #2c1810); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<script src="js/smart-search.js"></script>
<script src="js/ai-assistant.js"></script>
<body>

<!-- page-header-bar -->
<div class="page-header-bar" data-theme="tcm">
  <a href="javascript:history.back()" class="phb-back" aria-label="返回">‹</a>
  <span class="phb-dot" aria-hidden="true"></span>
  <span class="phb-title">远程会诊</span>
</div>

<div class="container">
  <div class="std-bar">
    <span class="std-tag">👥 使用对象 <b>医生/患者</b></span>
    <span class="std-tag">⚙️ 功能 <b>远程会诊</b></span>
    <span class="std-tag">💎 使用价值 <b>视频问诊+病历共享+在线处方，异地就医零距离</b></span>
  </div>
  <div class="header">
    <h1>📹 远程会诊</h1>
    <div class="sub">视频问诊 · 病历共享 · 在线开方 — 让优质中医资源触达每位患者</div>
  </div>

  <div class="grid2">
    <!-- 视频区 -->
    <div class="card">
      <h3>🎥 视频诊室</h3>
      <div class="video-area" id="video-area">
        <div class="cam-hint">
          <div class="icon">📹</div>
          <div>点击下方「开始视频」开启摄像头</div>
        </div>
        <div class="rec-dot">● REC 会诊中</div>
      </div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn blue" id="btn-video" onclick="toggleVideo()">▶️ 开始视频</button>
        <button class="btn small" onclick="shareScreen()">🖥 共享病历</button>
        <button class="btn small" onclick="toggleMute()">🎙 静音</button>
      </div>
      <div style="font-size:10px;color:var(--text3);margin-top:6px;text-align:center">演示环境：真实部署时接入 WebRTC 视频网关</div>
    </div>

    <!-- 会诊信息 -->
    <div class="card">
      <h3>👨‍⚕️ 会诊信息</h3>
      <div class="grid2">
        <div><label class="label">患者</label><input  class="input" id="tc-patient" placeholder="患者姓名" aria-label="患者姓名" data-validate="required|min=2"></div>
        <div><label class="label">接诊医生</label><select class="input" id="tc-doctor"><option value="">加载医师中…</option></select></div>
      </div>
      <div><label class="label">主诉</label><textarea class="input" id="tc-complaint" placeholder="请描述症状..."></textarea></div>
      <div><label class="label">共享病历（点击添加）</label><div id="tc-cases"></div></div>
      <div class="btn-row">
        <button class="btn green" onclick="startConsult()">📞 发起会诊</button>
        <button class="btn primary" onclick="saveConsultNote()">📝 记录会诊结论</button>
      </div>
    </div>
  </div>

  <!-- 聊天 -->
  <div class="card">
    <h3>💬 会诊对话</h3>
    <div id="tc-chat" style="max-height:200px;overflow-y:auto;margin-bottom:8px"></div>
    <div style="display:flex;gap:6px">
      <input  class="input" id="tc-msg" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()" aria-label="输入消息...">
      <button class="btn primary" onclick="sendMsg()">发送</button>
    </div>
  </div>

  <!-- 会诊记录 -->
  <div class="card">
    <h3>📋 会诊历史</h3>
    <div id="tc-history"></div>
  </div>
</div>

<script>
var consultActive = false;
var videoOn = false;
var stream = null;

function toggleVideo() {
  var area = document.getElementById('video-area');
  if (!videoOn) {
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(s) {
          stream = s;
          videoOn = true;
          area.classList.add('on');
          area.innerHTML = '<video id="local-video" autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video><div class="rec-dot">● REC 会诊中</div>';
          document.getElementById('local-video').srcObject = s;
          document.getElementById('btn-video').textContent = '⏹ 结束视频';
          toast('🎥 摄像头已开启');
        })
        .catch(function() {
          // 无摄像头 → 远程会诊模式
          videoOn = true;
          area.classList.add('on');
          area.innerHTML = '<div style="text-align:center;color:#fff"><div style="font-size:40px">🎥</div><div style="font-size:12px">远程视频诊室</div><div class="rec-dot" style="position:static;margin-top:8px">● REC 会诊中</div></div>';
          document.getElementById('btn-video').textContent = '⏹ 结束视频';
          toast('⚠️ 未检测到摄像头，进入远程模式');
        });
    } else {
      videoOn = true;
      area.classList.add('on');
      area.innerHTML = '<div style="text-align:center;color:#fff"><div style="font-size:40px">🎥</div><div style="font-size:12px">远程视频诊室</div><div class="rec-dot" style="position:static;margin-top:8px">● REC</div></div>';
      document.getElementById('btn-video').textContent = '⏹ 结束视频';
    }
  } else {
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    stream = null;
    videoOn = false;
    area.classList.remove('on');
    area.innerHTML = '<div class="cam-hint"><div class="icon">📹</div><div>点击「开始视频」开启摄像头</div></div>';
    document.getElementById('btn-video').textContent = '▶️ 开始视频';
  }
}

function shareScreen() {
  var cases = getCases();
  if (!cases.length) return toast('暂无病历可共享');
  addMsg('系统', '🖥 已共享病历: ' + cases.slice(0,3).map(function(c){ return c.patient_name; }).join('、'), 'doctor');
  toast('🖥 病历已共享给对方');
}

function toggleMute() {
// 静音状态由按钮自身跟踪（非随机）
  var micMuted = false;
  micMuted = !micMuted;
  toast('🎙 ' + (micMuted ? '已静音' : '已取消静音'));
}

// GAP-P2：病历共享接真实患者档案（/api/patients/list），不再读 localStorage 假数据
var _tcPatients = [];
function getCases() { return _tcPatients; }

function renderCases() {
  fetch('/api/patients/list').then(function(r){ return r.json(); }).then(function(d) {
    _tcPatients = d.patients || d.list || [];
    var html = '';
    for (var i = 0; i < Math.min(_tcPatients.length, 6); i++) {
      var p = _tcPatients[i];
      html += '<span class="case-chip" onclick="loadCase(' + i + ')">' + (p.name || p.patient_name || p.patient_id) + '</span>';
    }
    document.getElementById('tc-cases').innerHTML = html || '<span style="font-size:11px;color:var(--text3)">暂无建档患者</span>';
  }).catch(function() {
    document.getElementById('tc-cases').innerHTML = '<span style="font-size:11px;color:var(--text3)">📡 服务离线</span>';
  });
}

function loadCase(i) {
  var c = getCases()[i];
  if (!c) return;
  var name = c.name || c.patient_name || c.patient_id;
  document.getElementById('tc-patient').value = name;
  addMsg('系统', '已载入患者档案: ' + name + (c.last_syndrome ? '（上次辨证：' + c.last_syndrome + '）' : ''), 'doctor');
  toast('📋 患者档案已载入');
}

// GAP-P2：接诊医生接真实医师名录
function loadTeleDoctors() {
  fetch('/api/doctors').then(function(r){ return r.json(); }).then(function(d) {
    var sel = document.getElementById('tc-doctor');
    if (!d.ok || !d.doctors || !d.doctors.length) { sel.innerHTML = '<option value="">未配置医师</option>'; return; }
    sel.innerHTML = d.doctors.map(function(doc){ return '<option value="' + doc.name + '">' + doc.name + '（' + (doc.specialty_name || '医师') + '）</option>'; }).join('');
  }).catch(function(){ document.getElementById('tc-doctor').innerHTML = '<option value="">📡 离线</option>'; });
}

function startConsult() {
  var patient = document.getElementById('tc-patient').value.trim();
  if (!patient) return toast('请填写患者姓名');
  if (consultActive) return toast('会诊已在进行中');
  consultActive = true;
  addMsg('系统', '📞 会诊开始 — ' + patient + ' × ' + document.getElementById('tc-doctor').value, 'doctor');
  document.getElementById('tc-complaint').value = '';
  toast('📞 会诊已发起');
}

function saveConsultNote() {
  // R743 修真——提交前统一校验（uiStates.validateInputs）
  if (window.uiStates && uiStates.validateInputs && !window.__r743_injecting) {
    var _vr = uiStates.validateInputs(document);
    if (!_vr.ok) { uiStates.showValidationErrors(_vr); return; }
  }

  var patient = document.getElementById('tc-patient').value.trim();
  var complaint = document.getElementById('tc-complaint').value.trim();
  if (!patient) return toast('请填写患者姓名');
  var note = {
    patient: patient,
    doctor: document.getElementById('tc-doctor').value,
    complaint: complaint || '在线问诊',
    note: document.getElementById('tc-msg').value.trim() || '远程会诊完成'
  };
  // GAP-P2：会诊结论真持久化到服务端
  fetch('/api/tele/consults', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(note)
  }).then(function(r){ return r.json(); }).then(function(d) {
    if (!d.ok) { toast(d.error || '保存失败', 'warn'); return; }
    renderHistory();
    addMsg('系统', '📝 会诊结论已记录并归档', 'doctor');
    toast('📝 会诊记录已保存');
  }).catch(function(){ toast('📡 服务离线，记录未保存', 'warn'); });
}

function addMsg(who, text, cls) {
  var chat = document.getElementById('tc-chat');
  var div = document.createElement('div');
  div.className = 'msg-item';
  div.innerHTML = '<span class="who ' + cls + '">' + who + '</span>: ' + text + ' <span style="color:var(--text3);font-size:10px">' + new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}) + '</span>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function sendMsg() {
  var text = document.getElementById('tc-msg').value.trim();
  if (!text) return;
  addMsg((TCM.user && TCM.user.name) || '我', text, 'doctor');
  document.getElementById('tc-msg').value = '';
}

function renderHistory() {
  fetch('/api/tele/consults').then(function(r){ return r.json(); }).then(function(d) {
    var list = d.ok ? d.consults : [];
    var html = '';
    for (var i = 0; i < Math.min(list.length, 10); i++) {
      var c = list[i];
      html += '<div class="msg-item"><strong>' + c.patient + '</strong> × ' + c.doctor +
        ' <span style="color:var(--text3);font-size:10px">' + new Date(c.time).toLocaleString('zh-CN') + '</span>' +
        '<div style="font-size:11px;color:var(--text2)">📝 ' + c.note + '</div></div>';
    }
    document.getElementById('tc-history').innerHTML = html || '<div style="padding:12px;color:var(--text3);font-size:12px">暂无会诊记录</div>';
  }).catch(function() {
    document.getElementById('tc-history').innerHTML = '<div style="padding:12px;color:var(--text3);font-size:12px">📡 服务离线</div>';
  });
}

loadTeleDoctors();
renderCases();
renderHistory();
</script>
<div style="font-size:10px;color:var(--text3);margin-top:8px">⚠️ 本系统内容内容供学习参考，用药请遵医嘱。</div>
<div id="video-status" style="text-align:center;padding:8px;font-size:12px"></div>

<script>
// ═══ 远程会诊 WebRTC 就绪标记 ═══
(function(){var el=document.getElementById('video-status');if(el)el.innerHTML='<span style="color:#22c55e">🟢 会诊通道就绪</span> (WebRTC需对端信令服务)';})();
</script>

</body>
