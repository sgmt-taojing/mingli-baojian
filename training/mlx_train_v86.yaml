# v8.6 SFT 训练配置 — BaziQA 推理链修真版
# 修真根因：v8.5 completion 只输出字母（36.2% 无提升）——模型死记答案没学会推理
# 修真：completion = 答案字母 + 答案文本 + 命理依据（categories 专家验证事实）
#
# 训练链路：Qwen2.5-3B base → v8.5 fused → v8.6 LoRA（BaziQA 推理链）

model: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-models/mingli-sft-v8.5-7b"
train: true
test: false

train_file: "train.baziqa-r.jsonl"
valid_file: "valid.baziqa-r.jsonl"
data: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-r105-data-v86"

fine_tune_type: "lora"
num_layers: 20
lora_parameters:
  rank: 4
  dropout: 0.05
  scale: 4.0

iters: 200
batch_size: 1
grad_accumulation_steps: 4
learning_rate: 5e-6
optimizer: "adamw"
optimizer_config:
  adamw:
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0.01

max_seq_length: 1024
mask_prompt: true
grad_checkpoint: true

save_every: 50
steps_per_eval: 50
steps_per_report: 10
val_batches: 20
seed: 42

adapter_path: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-checkpoints/mingli-sft-v86-7b"
