# v8.7 SFT 训练配置 — 混合训练（BaziQA 推理链 + 自由问答）
# 策略：v8.6 纯 BaziQA 选择题训练（44.5% 全量），v8.7 混合防自由问答退化
#
# 数据：BaziQA 推理链 390 + v8.3 自由问答抽样 400 + R733 增量 19 = 678 条（去重后 610 训练）
# 修真：v8.5 的 fp 去重 bug（前 64 字同构）→ 用题目行指纹；v8.7 沿用
#
# 训练链路：Qwen2.5-3B base → v8.6 fused → v8.7 LoRA（混合）

model: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-models/mingli-sft-v8.6-7b"
train: true
test: false

train_file: "train.v87.jsonl"
valid_file: "valid.v87.jsonl"
data: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-r105-data-v87"

fine_tune_type: "lora"
num_layers: 20
lora_parameters:
  rank: 4
  dropout: 0.05
  scale: 4.0

iters: 200
batch_size: 1
grad_accumulation_steps: 4
learning_rate: 5e-6
optimizer: "adamw"
optimizer_config:
  adamw:
    betas: [0.9, 0.999]
    eps: 1e-8
    weight_decay: 0.01

max_seq_length: 1024
mask_prompt: true
grad_checkpoint: true

save_every: 50
steps_per_eval: 50
steps_per_report: 10
val_batches: 20
seed: 42

adapter_path: "/Users/tom/.openclaw-autoclaw/workspace/projects/mingli-baojian/training/mlx-checkpoints/mingli-sft-v87-7b"
