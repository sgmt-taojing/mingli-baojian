<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>命理宝鉴 · 你想做什么？</title>
<style>
:root{--bg:#080808;--paper:#f0e8d8;--paper2:#d4c9b0;--gold:#c9a84c;--gold2:#e8cc7a;--gold3:#a08030;--jade:#27ae60;--card:rgba(255,255,255,.04);--border:rgba(201,168,76,.18)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;padding:24px 16px}
.wrap{max-width:780px;margin:0 auto}
.head{text-align:center;margin-bottom:28px}
.head h1{font-size:24px;color:var(--gold);letter-spacing:6px;margin-bottom:6px;font-weight:600}
.head p{color:var(--paper2);font-size:13px;opacity:.7;letter-spacing:1px}
.head .sub{margin-top:8px;font-size:11px;color:var(--gold3);opacity:.6}

.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:28px}
.role{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:18px 16px;cursor:pointer;text-align:left;transition:all .25s;position:relative;overflow:hidden}
.role:hover{border-color:var(--gold);background:rgba(201,168,76,.08);transform:translateY(-2px)}
.role[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,168,76,.12)}
.role[aria-pressed="true"]::after{content:'✓';position:absolute;top:10px;right:12px;color:var(--gold);font-weight:700;font-size:16px}
.role .icon{font-size:28px;margin-bottom:8px;display:block}
.role .name{font-size:15px;color:var(--gold2);font-weight:600;margin-bottom:4px}
.role .desc{font-size:12px;color:var(--paper2);opacity:.75;line-height:1.5}

.scenes{display:none;margin-bottom:28px}
.scenes.on{display:block;animation:slide .35s ease}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.scenes h3{font-size:14px;color:var(--gold);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.scenes h3 .who{font-size:11px;color:var(--paper2);opacity:.6;font-weight:400;margin-left:auto}
.scene{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--paper);transition:all .2s}
.scene:hover{border-color:var(--gold);background:rgba(201,168,76,.08);transform:translateX(4px)}
.scene .e{font-size:22px;flex-shrink:0}
.scene .t{font-size:14px;font-weight:500;margin-bottom:2px}
.scene .d{font-size:11px;color:var(--paper2);opacity:.7;line-height:1.4}

.tip{background:rgba(201,168,76,.06);border-left:3px solid var(--gold);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12px;color:var(--paper2);margin-bottom:20px;line-height:1.7}
.tip b{color:var(--gold2)}

.all-link{text-align:center;margin:24px 0 12px;font-size:12px;color:var(--paper2);opacity:.5}
.all-link a{color:var(--gold2);text-decoration:none;border-bottom:1px dashed var(--gold3);padding-bottom:1px}
.all-link a:hover{opacity:.8}

.footer{text-align:center;color:var(--paper2);opacity:.35;font-size:11px;margin-top:32px;letter-spacing:2px}

.ai-shortcut{margin-top:18px;text-align:center}
.ai-shortcut a{display:inline-block;padding:8px 22px;background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--bg);text-decoration:none;border-radius:20px;font-size:13px;font-weight:600;transition:all .2s}
.ai-shortcut a:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(201,168,76,.25)}
.ai-shortcut .hint{display:block;font-size:10px;color:var(--paper2);opacity:.5;margin-top:6px}

@media(max-width:520px){.head h1{font-size:20px;letter-spacing:3px}.roles{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<div class="head">
  <h1>命理宝鉴</h1>
  <p>你想做什么？</p>
  <div class="sub">先选你的角色，我们给你最合适的入口</div>
</div>

<div class="tip">
  <b>初次使用？</b>先选下方"我是求测者 / 患者"进入；医生、运营请登录后切换角色。<br>
  <b>不确定？</b>选"全部"查看完整功能导航。
</div>

<div class="roles" id="roles" role="radiogroup" aria-label="选择你的角色"></div>

<div class="scenes" id="scenes"></div>

<div class="ai-shortcut">
  <a href="app/ai-assistant.html">🤖 直接和 AI 助手对话</a>
  <span class="hint">不挑场景、问啥都行</span>
</div>

<div class="all-link">
  <a href="app/site-nav.html">🧭 全部功能导航 · 按角色分组</a>
</div>

<div class="footer">命理宝鉴 · 仅供学习参考</div>

</div>

<script>
// 6 个角色，每个角色一组场景入口
const ROLES = {
  "求测者": {
    icon:"🔮",
    name:"我想算命/看运势",
    desc:"八字/紫微/运势报告/起名/合婚",
    scenes:[
      {e:"📅", t:"八字排盘", d:"四柱命盘 · 五行强弱 · 用神喜神", url:"app/bazi.html"},
      {e:"🌟", t:"今年运势", d:"事业/财运/感情/健康 · AI 解读", url:"app/lifeflow-report.html"},
      {e:"💝", t:"感情/合婚", d:"桃花星 · 正缘 · 配对分析", url:"app/ai-assistant.html"},
      {e:"✏️", t:"起名/改名", d:"五行 · 三才五格 · 生肖喜忌", url:"app/naming-portal.html"},
      {e:"📜", t:"黄历择日", d:"今日宜忌 · 节气 · 吉时方位", url:"app/huangli-daily.html"},
      {e:"💎", t:"更多命理服务", d:"紫微/六壬/奇门/梅花 · 完整页", url:"app/site-nav.html"},
    ]
  },
  "患者": {
    icon:"🌿",
    name:"我想看中医",
    desc:"症状咨询 / 看舌苔 / AI 初诊",
    scenes:[
      {e:"💬", t:"症状咨询", d:"AI 问诊 · 多轮追问 · 初步判断", url:"app/tcm-symptom.html"},
      {e:"🩺", t:"综合问诊台", d:"选方式开始 · 不踩坑", url:"app/integrated-clinic.html"},
      {e:"🎥", t:"AI 实时诊疗", d:"摄像头+语音+KB+EMR 一体化", url:"app/unified-consultation.html"},
      {e:"📸", t:"拍照看舌象", d:"上传舌/面照片 · AI 视觉分析", url:"app/camera-capture.html"},
      {e:"📄", t:"上传体检报告", d:"OCR 识别 · AI 健康解读", url:"app/report-ocr.html"},
      {e:"👨‍⚕️", t:"找医生问诊", d:"名医工作站 · 复核 · 处方", url:"app/tcm-portal.html"},
      {e:"🏥", t:"中医诊所", d:"挂号 · 远程问诊 · 历史档案", url:"app/tcm-clinic.html"},
      {e:"🩺", t:"健康管理", d:"体质辨识 · 养生追踪 · 穿戴设备", url:"app/wearable-hub.html"},
    ]
  },
  "医生/名医": {
    icon:"🩺",
    name:"我是医生/名医",
    desc:"登录后进入工作台（需医生账号）",
    scenes:[
      {e:"💻", t:"临床工作台", d:"问诊录入 · 四诊合参 · 处方", url:"app/doctor-panel.html"},
      {e:"📋", t:"名医复核", d:"AI 初诊结果复核 · 名师指导", url:"app/master-workstation.html"},
      {e:"👁️", t:"望诊视觉", d:"舌/面/眼图谱 · 古籍对照", url:"app/wangzhen-center.html"},
      {e:"📚", t:"倪师知识库", d:"伤寒金匮 · 针灸本草 · 八字断病", url:"app/nihaisha-knowledge.html"},
      {e:"🎯", t:"舒晗奇门", d:"命理秘笈 · 实战心法", url:"app/shuhan-knowledge.html"},
      {e:"🔐", t:"登录/切换身份", d:"会员中心 · 诊疗记录", url:"app/login.html"},
    ]
  },
  "运营管理": {
    icon:"⚙️",
    name:"我是平台管理员",
    desc:"登录后进入后台（需管理员账号）",
    scenes:[
      {e:"📊", t:"管理后台", d:"仪表板 · 用户 · 订单 · 推送", url:"app/admin.html"},
      {e:"📚", t:"KB 知识库运营", d:"9173 条 · 41 模块 · 批量管理", url:"app/admin-kb-panel.html"},
      {e:"🎧", t:"工单系统", d:"用户反馈 · 投诉处理", url:"app/admin-tickets.html"},
      {e:"📱", t:"元助推送", d:"每日推送 · 微信矩阵 · 玻璃眼镜", url:"app/admin/yuanzhu-dashboard.html"},
      {e:"🏪", t:"商城/商户", d:"商品管理 · 商户申请 · 订单", url:"app/admin-shop.html"},
      {e:"🔐", t:"登录", d:"管理员登录入口", url:"app/login.html"},
    ]
  },
  "技术运维": {
    icon:"📡",
    name:"我是开发/运维",
    desc:"监控 · KB 质量 · 训练评估",
    scenes:[
      {e:"🛰️", t:"监控总览", d:"跨项目 · 端口 · 服务状态", url:"app/monitor-hub.html"},
      {e:"📖", t:"KB 深度审计", d:"质量 · 覆盖 · 热度 · 模块健康", url:"app/kb-audit.html"},
      {e:"🧪", t:"评估看板", d:"BaziQA · 模型对比 · 训练记录", url:"app/eval-dashboard.html"},
      {e:"📥", t:"训练素材采集", d:"蒸馏 · KB 收集 · SFT 构建", url:"app/training-collect.html"},
      {e:"🔧", t:"设备运维", d:"摄像头 · 穿戴 · 设备诊断", url:"app/device-management.html"},
      {e:"🔐", t:"登录", d:"技术后台登录", url:"app/login.html"},
    ]
  },
  "学习研究": {
    icon:"📚",
    name:"我想学命理/中医",
    desc:"倪师课程 / 易学知识 / 修行参学",
    scenes:[
      {e:"🪷", t:"倪师知识库", d:"伤寒·金匮·针灸·本草·天纪", url:"app/nihaisha-knowledge.html"},
      {e:"🔬", t:"倪师工具", d:"症状检索 · 方证对应", url:"app/nihaisha-tool.html"},
      {e:"🎯", t:"舒晗奇门", d:"奇门遁甲 · 实战心法", url:"app/shuhan-knowledge.html"},
      {e:"🧠", t:"思维导图", d:"命理知识结构化", url:"app/mindmap.html"},
      {e:"🪯", t:"修行参学", d:"佛道修行 · 参学师承", url:"app/practice-portal.html"},
      {e:"📖", t:"口诀库", d:"命理口诀 · 实战速查", url:"app/koujue-gallery.html"},
    ]
  },
};

const ROLE_ORDER = ["求测者","患者","医生/名医","运营管理","技术运维","学习研究"];

// 渲染角色按钮
const rolesEl = document.getElementById("roles");
rolesEl.innerHTML = ROLE_ORDER.map(r => {
  const x = ROLES[r];
  return `<button class="role" data-role="${r}" aria-pressed="false"><span class="icon">${x.icon}</span><div class="name">${x.name}</div><div class="desc">${x.desc}</div></button>`;
}).join("");

const scenesEl = document.getElementById("scenes");
let active = localStorage.getItem("home-role") || "";

function renderScenes(role) {
  if (!role) { scenesEl.classList.remove("on"); scenesEl.innerHTML=""; return; }
  const x = ROLES[role];
  scenesEl.innerHTML = `<h3>${x.icon} ${role} · 常用入口<span class="who">点击直达 · 不迷路</span></h3>` +
    x.scenes.map(s => `<a class="scene" href="${s.url}"><div class="e">${s.e}</div><div><div class="t">${s.t}</div><div class="d">${s.d}</div></div></a>`).join("");
  scenesEl.classList.add("on");
}

rolesEl.querySelectorAll(".role").forEach(b => {
  b.onclick = () => {
    const r = b.dataset.role;
    active = (active === r) ? "" : r;
    localStorage.setItem("home-role", active);
    rolesEl.querySelectorAll(".role").forEach(x => x.setAttribute("aria-pressed", x.dataset.role === active ? "true" : "false"));
    renderScenes(active);
    if (active) scenesEl.scrollIntoView({behavior:"smooth", block:"start"});
  };
});

if (active) {
  rolesEl.querySelector(`.role[data-role="${active}"]`)?.setAttribute("aria-pressed","true");
  renderScenes(active);
}
</script>
</body>
</html>
